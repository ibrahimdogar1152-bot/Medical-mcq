 23, "q": "Steeple sign:", "o": ["Croup", "Pneumonia", "Asthma", "Epiglottitis"], "a": 0, "e": "", "t": "", "src": "E"}, {"id": 1116, "sec": 23, "q": "Double-duct sign:", "o": ["Choledocholithiasis", "Cholangitis", "Pancreatic head / periampullary tumour", "PSC"], "a": 2, "e": "", "t": "", "src": "E"}, {"id": 1117, "sec": 23, "q": "Bird-beak sign:", "o": ["Carcinoma", "Diverticulosis", "Achalasia (barium swallow), volvulus", "Crohn's"], "a": 2, "e": "", "t": "", "src": "E"}, {"id": 1118, "sec": 23, "q": "Fat-pad sign (elbow):", "o": ["Occult elbow fracture", "Tumour", "Dislocation", "Infection"], "a": 0, "e": "", "t": "", "src": "E"}, {"id": 1119, "sec": 23, "q": "Lipohaemarthrosis:", "o": ["Intra-articular fracture", "Gout", "Infection", "Tumour"], "a": 0, "e": "", "t": "", "src": "E"}, {"id": 1120, "sec": 23, "q": "Dural tail:", "o": ["Metastasis", "Glioma", "Schwannoma", "Meningioma"], "a": 3, "e": "", "t": "", "src": "E"}, {"id": 1121, "sec": 23, "q": "Butterfly glioma:", "o": ["Meningioma", "Lymphoma", "Glioblastoma", "Ependymoma"], "a": 2, "e": "", "t": "", "src": "E"}, {"id": 1122, "sec": 23, "q": "Light bulb sign:", "o": ["Posterior shoulder dislocation", "Fracture", "Anterior dislocation", "Rotator cuff tear"], "a": 0, "e": "", "t": "", "src": "E"}, {"id": 1123, "sec": 23, "q": "Double bubble:", "o": ["Duodenal atresia", "Jejunal atresia", "Pyloric stenosis", "Malrotation"], "a": 0, "e": "", "t": "", "src": "E"}, {"id": 1124, "sec": 23, "q": "Target / pseudokidney:", "o": ["Pyloric stenosis", "Intussusception", "Volvulus", "Appendicitis"], "a": 1, "e": "", "t": "", "src": "E"}, {"id": 1125, "sec": 23, "q": "Whirlpool / corkscrew duodenum:", "o": ["Midgut volvulus", "Duodenal atresia", "Intussusception", "Pyloric stenosis"], "a": 0, "e": "", "t": "", "src": "E"}, {"id": 1126, "sec": 23, "q": "Snowstorm appearance:", "o": ["Complete hydatidiform mole", "Twins", "Ectopic", "Fibroid"], "a": 0, "e": "", "t": "", "src": "E"}, {"id": 1127, "sec": 23, "q": "Linguine sign:", "o": ["Cancer", "Breast implant rupture", "Cyst", "Abscess"], "a": 1, "e": "", "t": "", "src": "E"}, {"id": 1128, "sec": 23, "q": "Superscan:", "o": ["Normal scan", "Osteoporosis", "Diffuse bone metastases", "Paget"], "a": 2, "e": "", "t": "", "src": "E"}, {"id": 1129, "sec": 23, "q": "Thumbprinting:", "o": ["Diverticulitis", "Crohn's", "Ischaemic colitis", "UC"], "a": 2, "e": "", "t": "", "src": "E"}, {"id": 1130, "sec": 23, "q": "Lead-pipe colon:", "o": ["Ulcerative colitis", "Volvulus", "Crohn's", "Ischaemia"], "a": 0, "e": "", "t": "", "src": "E"}, {"id": 1131, "sec": 23, "q": "Rugger-jersey spine:", "o": ["Renal osteodystrophy", "Osteoporosis", "Paget", "Metastases"], "a": 0, "e": "", "t": "", "src": "E"}]};
const OL={"secs":["Basic principles, physics and modalities","Radiation safety and contrast media","Chest radiology","Abdominal, GI and genitourinary radiology","Neuroimaging and spine","Musculoskeletal imaging","Obstetric, gynaecological and breast imaging","Cardiac, paediatric and classic signs"],"pts":[{"n":1,"sec":0,"t":"X-rays are ionizing electromagnetic radiation, discovered by Roentgen (1895)."},{"n":2,"sec":0,"t":"X-rays are produced when fast electrons from the cathode (filament) strike the tungsten anode (target); >99% of energy is lost as heat, <1% as X-rays."},{"n":3,"sec":0,"t":"kVp controls beam penetration and contrast (higher kVp = lower contrast); mAs controls the quantity of X-rays / film blackening."},{"n":4,"sec":0,"t":"Five basic radiographic densities (low to high): air, fat, soft tissue/fluid, bone, metal. Bone/metal = radiopaque (white); air = radiolucent (black)."},{"n":5,"sec":0,"t":"Photoelectric effect (low kVp, depends on Z³) gives image contrast; Compton scatter (higher kVp) is the main source of scatter and staff dose."},{"n":6,"sec":0,"t":"A grid reduces scatter and improves contrast but increases patient dose."},{"n":7,"sec":0,"t":"Inverse square law: radiation intensity falls with the square of distance; distance is the best protection after time and shielding."},{"n":8,"sec":0,"t":"Units: absorbed dose Gray (Gy); effective/equivalent dose Sievert (Sv); activity Becquerel (Bq)."},{"n":9,"sec":0,"t":"Fluoroscopy gives real-time X-ray imaging (barium studies, interventional procedures)."},{"n":10,"sec":0,"t":"CT uses X-rays to produce cross-sectional images; attenuation is measured in Hounsfield units (HU)."},{"n":11,"sec":0,"t":"HU values: water = 0, air = -1000, fat about -50 to -100, acute blood about 50-80, CSF about 0-15, cortical bone high positive (several hundred to 1000+)."},{"n":12,"sec":0,"t":"Window width and level are adjusted to display different tissues on CT (brain, lung, bone windows)."},{"n":13,"sec":0,"t":"HRCT (thin sections) is the best test for interstitial lung disease and bronchiectasis."},{"n":14,"sec":0,"t":"MRI uses a strong magnetic field (unit Tesla) and radiofrequency pulses on hydrogen protons; it uses no ionizing radiation."},{"n":15,"sec":0,"t":"T1: good anatomy; fat bright, fluid dark. T2: fluid (CSF, oedema) bright, good for pathology."},{"n":16,"sec":0,"t":"FLAIR suppresses CSF signal: best for periventricular lesions (MS) and cortical lesions. STIR / fat-sat suppresses fat."},{"n":17,"sec":0,"t":"Diffusion-weighted MRI (DWI) is the most sensitive for early acute ischaemic stroke (within minutes); also shows abscess (restricted diffusion)."},{"n":18,"sec":0,"t":"SWI / gradient echo is sensitive for blood products and calcification. Subacute blood (methaemoglobin) is bright on T1."},{"n":19,"sec":0,"t":"Signal void (black on all sequences): cortical bone, air, calcification, fast-flowing blood."},{"n":20,"sec":0,"t":"Gadolinium shortens T1: enhancing tissue is bright on T1-weighted images."},{"n":21,"sec":0,"t":"Ultrasound uses high-frequency sound (>20 kHz; diagnostic 2-15 MHz) via piezoelectric crystals; no radiation."},{"n":22,"sec":0,"t":"Higher frequency = better resolution, less penetration (linear probe 7-12 MHz superficial structures; curvilinear 3.5-5 MHz abdomen)."},{"n":23,"sec":0,"t":"Ultrasound cannot image through air or bone; gel removes the air gap."},{"n":24,"sec":0,"t":"Posterior acoustic shadowing: stones, calcification, bone. Posterior acoustic enhancement: cysts and fluid-filled structures."},{"n":25,"sec":0,"t":"Echo terms: anechoic = black (fluid); hypoechoic = darker than surroundings; hyperechoic = brighter (fat, stones, fibrosis)."},{"n":26,"sec":0,"t":"Doppler ultrasound assesses blood flow (direction, velocity, resistance)."},{"n":27,"sec":0,"t":"Ultrasound is ideal for gallstones, hydronephrosis, pelvic and obstetric imaging, thyroid, scrotum, and guiding biopsies."},{"n":28,"sec":0,"t":"PET uses positron emitters, commonly 18F-FDG (glucose analogue) to show metabolic activity; annihilation produces two 511 keV photons. Half-life of F-18 about 110 min."},{"n":29,"sec":0,"t":"Tc-99m is the commonest nuclear medicine isotope (half-life 6 h, 140 keV gamma), obtained from a Mo-99 generator; imaged with a gamma camera / SPECT."},{"n":30,"sec":0,"t":"Bone scan = Tc-99m MDP; DMSA = renal scarring; DTPA / MAG3 = renal function and obstruction; HIDA = biliary (non-filling gallbladder in acute cholecystitis); MIBG = phaeochromocytoma / neuroblastoma; sestamibi = parathyroid adenoma; Meckel scan = Tc-99m pertechnetate; V/Q scan = pulmonary embolism."},{"n":31,"sec":0,"t":"Thyroid scan: hot nodule is almost always benign; cold nodule carries a risk of malignancy (needs US + FNAC)."},{"n":32,"sec":0,"t":"DEXA: osteoporosis = T-score -2.5 or below; osteopenia -1 to -2.5."},{"n":33,"sec":1,"t":"ALARA: keep exposure as low as reasonably achievable using time, distance and shielding; lead shielding and collimation reduce unnecessary exposure."},{"n":34,"sec":1,"t":"Typical effective doses: chest X-ray about 0.02-0.1 mSv; CT head about 2 mSv; CT chest about 7 mSv; CT abdomen-pelvis about 10 mSv. CT gives far more dose than a plain film."},{"n":35,"sec":1,"t":"Dose limits: radiation workers 20 mSv/year (averaged over 5 years); general public 1 mSv/year."},{"n":36,"sec":1,"t":"Deterministic effects have a threshold (cataract, skin erythema, epilation); stochastic effects have no threshold (cancer, hereditary effects)."},{"n":37,"sec":1,"t":"Most radiosensitive: lymphocytes, bone marrow, gonads, dividing undifferentiated cells (Bergonie and Tribondeau). Least sensitive: nerve and muscle."},{"n":38,"sec":1,"t":"Children and the fetus are more sensitive; fetal risk is highest during organogenesis (CNS sensitive at 8-15 weeks). Prefer US or MRI in pregnancy; avoid CT abdomen/pelvis unless essential."},{"n":39,"sec":1,"t":"Iodinated contrast is used in CT; gadolinium in MRI; microbubbles in contrast ultrasound; barium sulfate for GI studies."},{"n":40,"sec":1,"t":"Low-osmolar non-ionic contrast is safer than high-osmolar ionic contrast (fewer reactions)."},{"n":41,"sec":1,"t":"Iodinated contrast can cause hypersensitivity (anaphylactoid) reactions and contrast-induced nephropathy (risk: renal impairment, diabetes, dehydration). Prevent with IV hydration (normal saline)."},{"n":42,"sec":1,"t":"Severe contrast reaction / anaphylaxis: IM adrenaline first, airway, oxygen, IV fluids. Prior reaction: steroid + antihistamine premedication."},{"n":43,"sec":1,"t":"Caution with iodinated contrast in thyrotoxicosis (iodine load) and with metformin in renal impairment (lactic acidosis)."},{"n":44,"sec":1,"t":"Nephrogenic systemic fibrosis: gadolinium in severe renal impairment (eGFR <30). Avoid gadolinium in pregnancy."},{"n":45,"sec":1,"t":"Barium must be avoided if GI perforation is suspected (peritonitis, mediastinitis); use water-soluble iodinated contrast. Water-soluble contrast is also used when aspiration is feared."},{"n":46,"sec":1,"t":"MRI safety: contraindicated with cochlear implants, older pacemakers, ferromagnetic aneurysm clips, metallic intra-ocular foreign bodies. Ferromagnetic objects become dangerous projectiles."},{"n":47,"sec":1,"t":"Hysterosalpingography (HSG): done in the proliferative phase (about day 6-12), after menses stops and before ovulation, to avoid irradiating an early pregnancy."},{"n":48,"sec":2,"t":"Standard chest X-ray: PA and lateral. A good inspiration shows 5-6 anterior or 9-10 posterior ribs above the diaphragm; scapulae should be outside the lungs."},{"n":49,"sec":2,"t":"Cardiothoracic ratio normally <50% on a PA film. An AP film (supine/portable) can falsely suggest cardiomegaly."},{"n":50,"sec":2,"t":"Pleural effusion: blunting of the costophrenic angle (needs about 200-300 mL on erect film); meniscus sign; lateral decubitus view detects as little as about 50 mL. Subpulmonic effusion mimics a raised hemidiaphragm."},{"n":51,"sec":2,"t":"Massive effusion pushes the mediastinum away from the side; collapse pulls it towards the side. Tension pneumothorax shifts the mediastinum away."},{"n":52,"sec":2,"t":"Pneumothorax: visceral pleural line with absent peripheral lung markings; supine film shows the deep sulcus sign. Hydropneumothorax has a horizontal air-fluid level."},{"n":53,"sec":2,"t":"Pulmonary oedema: bilateral perihilar bat-wing opacities, cardiomegaly, upper-lobe diversion (cephalization), pleural effusions."},{"n":54,"sec":2,"t":"Kerley B lines: short horizontal lines at the lung periphery = interstitial oedema (septal thickening). Kerley A: long, upper zones; Kerley C: reticular."},{"n":55,"sec":2,"t":"ARDS: bilateral diffuse airspace opacities with a normal-sized heart."},{"n":56,"sec":2,"t":"Air bronchogram: air-filled bronchi seen against opacified lung (alveolar consolidation). Lobar pneumonia = homogeneous consolidation."},{"n":57,"sec":2,"t":"Silhouette sign: loss of a normal border localizes pathology. Right middle lobe/lingula obscures the right/left heart border; lower lobe obscures the hemidiaphragm."},{"n":58,"sec":2,"t":"Miliary pattern: numerous 1-3 mm nodules (miliary TB, haematogenous spread). Cavitary lesions: TB, lung abscess, squamous cell carcinoma, Wegener's."},{"n":59,"sec":2,"t":"Primary TB: hilar/paratracheal lymphadenopathy (Ghon focus + nodes = Ghon complex; calcified = Ranke complex). Post-primary TB: upper lobe/apical fibrocavitary disease."},{"n":60,"sec":2,"t":"Aspergilloma: mobile mass in a pre-existing cavity with air-crescent (Monod) sign. CT halo sign: invasive aspergillosis."},{"n":61,"sec":2,"t":"Sarcoidosis: bilateral hilar lymphadenopathy (potato nodes); Garland's 1-2-3 sign = right paratracheal + bilateral hilar nodes."},{"n":62,"sec":2,"t":"Pancoast tumour: apical lung mass with rib destruction, Horner syndrome. Cannonball metastases: renal cell carcinoma, choriocarcinoma, sarcomas."},{"n":63,"sec":2,"t":"Golden S sign: right upper lobe collapse due to a central mass. Luftsichel sign: left upper lobe collapse."},{"n":64,"sec":2,"t":"Pulmonary embolism: CXR often normal; Westermark sign (focal oligaemia), Hampton hump (wedge-shaped pleural-based opacity), Fleischner sign (enlarged central pulmonary artery). Investigation of choice: CT pulmonary angiography."},{"n":65,"sec":2,"t":"Pneumomediastinum: air outlining mediastinal structures, continuous diaphragm sign; consider oesophageal rupture (water-soluble contrast study)."},{"n":66,"sec":2,"t":"Widened mediastinum after trauma = aortic injury until proved otherwise (usually at the isthmus); confirm with CT angiography."},{"n":67,"sec":2,"t":"Solitary pulmonary nodule (coin lesion): benign features = central, laminated, diffuse or popcorn calcification (hamartoma), stable over 2 years; malignant = spiculated, growing."},{"n":68,"sec":2,"t":"Asbestos: calcified pleural plaques (diaphragmatic), pleural thickening, mesothelioma. Silicosis: upper zone nodules + egg-shell calcification of hilar nodes."},{"n":69,"sec":2,"t":"HRCT patterns: ground-glass (partial airspace filling); honeycombing (end-stage fibrosis, UIP/IPF, basal subpleural); tree-in-bud (endobronchial infection e.g. TB); crazy paving (alveolar proteinosis); signet-ring sign (bronchiectasis)."},{"n":70,"sec":2,"t":"COPD: hyperinflation, flat diaphragms, barrel chest, >6 anterior ribs visible, narrow heart."},{"n":71,"sec":2,"t":"Left atrial enlargement (mitral stenosis): double right heart border, splaying of the carina, straight left heart border. Water-bottle heart: pericardial effusion."},{"n":72,"sec":2,"t":"Rib notching (3rd-8th ribs) and figure-of-3 sign: coarctation of aorta."},{"n":73,"sec":2,"t":"Diaphragmatic hernia: bowel loops in the chest (left Bochdalek commonest in neonates). Hiatus hernia: retrocardiac air-fluid level."},{"n":74,"sec":2,"t":"Foreign body: commoner in the right main bronchus; ball-valve air trapping shows on expiratory / decubitus films."},{"n":75,"sec":3,"t":"Erect chest X-ray is the best plain film for free air under the diaphragm; abdominal films show obstruction and free air."},{"n":76,"sec":3,"t":"Pneumoperitoneum signs: Rigler sign (both sides of bowel wall visible), falciform ligament sign, football sign (massive, supine), cupola sign. CT is the most sensitive test."},{"n":77,"sec":3,"t":"Small bowel obstruction: central dilated loops with valvulae conniventes (complete folds); normal small bowel <3 cm."},{"n":78,"sec":3,"t":"Large bowel obstruction: peripheral dilatation with haustra (incomplete folds); normal colon <6 cm, caecum <9 cm (risk of perforation if exceeded)."},{"n":79,"sec":3,"t":"Sigmoid volvulus: coffee-bean sign (omega loop, apex towards the right upper quadrant); caecal volvulus: comma-shaped loop in the left upper abdomen. Barium enema shows bird-beak."},{"n":80,"sec":3,"t":"Pneumatosis intestinalis: gas in the bowel wall. Portal venous gas: bowel ischaemia, NEC. Both are serious signs."},{"n":81,"sec":3,"t":"Gallstone ileus: Rigler triad = SBO + pneumobilia + ectopic gallstone."},{"n":82,"sec":3,"t":"Sentinel loop and colon cut-off sign: acute pancreatitis. Toxic megacolon: transverse colon >6 cm in colitis."},{"n":83,"sec":3,"t":"Barium swallow: achalasia = bird-beak / rat-tail with dilated oesophagus; oesophageal carcinoma = apple-core / shouldering; varices = serpiginous filling defects; corkscrew oesophagus = diffuse spasm."},{"n":84,"sec":3,"t":"Barium meal: malignant gastric ulcer = Carman meniscus sign; linitis plastica = leather-bottle stomach (diffuse infiltrating carcinoma); pyloric stenosis = string sign, shoulder sign."},{"n":85,"sec":3,"t":"Crohn's disease: terminal ileum, skip lesions, cobblestone mucosa, rose-thorn ulcers, string sign of Kantor. Ulcerative colitis: continuous from rectum, lead-pipe colon (loss of haustra). Ischaemic colitis: thumbprinting."},{"n":86,"sec":3,"t":"Colorectal carcinoma: apple-core lesion on barium enema. Hirschsprung disease: narrow aganglionic segment with a transition zone; rectosigmoid ratio reversed."},{"n":87,"sec":3,"t":"Duodenal atresia: double-bubble sign (associated with Down syndrome). Malrotation with volvulus: whirlpool sign on US/CT, corkscrew duodenum on UGI contrast study (investigation of choice)."},{"n":88,"sec":3,"t":"Intussusception: target (doughnut) sign on US; coil-spring on barium; treated by air/contrast enema reduction. Hypertrophic pyloric stenosis: US muscle thickness >3 mm, channel length >15 mm."},{"n":89,"sec":3,"t":"NEC (premature neonate): pneumatosis intestinalis, portal venous gas."},{"n":90,"sec":3,"t":"Appendicitis: US first line in children/pregnancy (non-compressible blind-ending tube >6 mm); CT in adults (appendicolith, fat stranding)."},{"n":91,"sec":3,"t":"Gallstones: ultrasound first line; posterior acoustic shadowing; WES sign (wall-echo-shadow) when the gallbladder is full of stones."},{"n":92,"sec":3,"t":"Acute cholecystitis: wall thickening >3 mm, pericholecystic fluid, sonographic Murphy sign. Porcelain gallbladder: wall calcification (carcinoma risk)."},{"n":93,"sec":3,"t":"MRCP = non-invasive biliary/pancreatic duct imaging; ERCP = diagnostic and therapeutic (stone extraction, stenting)."},{"n":94,"sec":3,"t":"Normal sizes on US: CBD up to 6 mm, portal vein up to 13 mm, spleen up to 12 cm, kidney 9-12 cm; aorta <3 cm (AAA = 3 cm or more)."},{"n":95,"sec":3,"t":"Double-duct sign: dilated CBD + pancreatic duct = carcinoma of the pancreatic head / periampullary tumour. Pancreatic carcinoma is hypodense on CT."},{"n":96,"sec":3,"t":"Acute pancreatitis: contrast CT (best at 72 h; Balthazar score) for complications such as necrosis, pseudocyst."},{"n":97,"sec":3,"t":"Liver: haemangioma = hyperechoic, bright on T2, peripheral nodular enhancement with centripetal fill-in; HCC = arterial enhancement with washout, raised AFP; metastases = multiple, bull's-eye / target."},{"n":98,"sec":3,"t":"Hydatid cyst: daughter cysts, wheel-spoke, water-lily sign (detached membrane). Amoebic abscess: solitary, right lobe, peripheral near the capsule. Pyogenic abscess: cluster sign, gas."},{"n":99,"sec":3,"t":"Cirrhosis: nodular contour, caudate lobe hypertrophy, ascites, splenomegaly, portal hypertension. Fatty liver: bright (hyperechoic) liver on US."},{"n":100,"sec":3,"t":"Renal colic / ureteric stone: investigation of choice is non-contrast CT KUB. About 90% of stones are radio-opaque; uric acid (and indinavir) stones are radiolucent; cystine stones are faintly opaque; struvite forms staghorn calculi."},{"n":101,"sec":3,"t":"Hydronephrosis: US first line (dilated calyces, thinned cortex). IVU shows clubbing of calyces."},{"n":102,"sec":3,"t":"Renal cell carcinoma: enhancing solid mass, may invade the renal vein/IVC. Angiomyolipoma: contains fat (negative HU); associated with tuberous sclerosis. Wilms tumour: intrarenal mass, claw sign, rarely calcifies. Neuroblastoma: calcified suprarenal mass, crosses midline, encases vessels."},{"n":103,"sec":3,"t":"Polycystic kidney: bilateral enlarged cystic kidneys; IVU shows spider-leg calyces. Renal TB: moth-eaten calyces, putty kidney, pipe-stem ureter."},{"n":104,"sec":3,"t":"MCU (micturating cystourethrogram) = investigation of choice for vesicoureteric reflux and posterior urethral valves (dilated posterior urethra, keyhole sign on US). DMSA for scarring. Retrograde urethrogram for urethral stricture/injury."},{"n":105,"sec":3,"t":"Scrotal ultrasound with Doppler: testicular torsion = absent/reduced flow (whirlpool sign of the cord); epididymo-orchitis = increased flow."},{"n":106,"sec":4,"t":"Non-contrast CT brain is the first test in acute stroke, head trauma and suspected SAH (to exclude haemorrhage; widely available, fast)."},{"n":107,"sec":4,"t":"On CT: acute blood = hyperdense, subacute = isodense, chronic = hypodense. Early infarct may be subtle: loss of grey-white differentiation, insular ribbon sign, hyperdense MCA sign (thrombus); later a hypodense wedge."},{"n":108,"sec":4,"t":"MRI DWI detects acute ischaemia early; CT/MR angiography shows vessel occlusion; perfusion imaging identifies salvageable penumbra."},{"n":109,"sec":4,"t":"Epidural haematoma: biconvex (lens-shaped), does not cross sutures, middle meningeal artery (pterion), lucid interval."},{"n":110,"sec":4,"t":"Subdural haematoma: crescent-shaped, crosses sutures but not the falx, torn bridging veins; elderly, alcoholics."},{"n":111,"sec":4,"t":"Subarachnoid haemorrhage: hyperdense blood in the basal cisterns/sulci (star-shaped); if CT negative and suspicion is high, LP for xanthochromia. DSA is the gold standard for aneurysms (CTA first)."},{"n":112,"sec":4,"t":"Hypertensive intracerebral haemorrhage: basal ganglia/thalamus, pons, cerebellum."},{"n":113,"sec":4,"t":"Ring-enhancing lesion: abscess, metastasis, glioblastoma, tuberculoma, toxoplasmosis, neurocysticercosis. Abscess: thin smooth wall, central restricted diffusion on DWI."},{"n":114,"sec":4,"t":"Neurocysticercosis: cystic lesion with scolex ('dot-in-a-hole'); calcified lesions = 'starry-sky'. Toxoplasmosis: basal ganglia, HIV. TB meningitis: basal meningeal enhancement + hydrocephalus; herpes encephalitis: temporal lobes (MRI)."},{"n":115,"sec":4,"t":"Glioblastoma: irregular ring-enhancing mass with necrosis, crosses corpus callosum (butterfly glioma). Metastases: multiple at the grey-white junction with oedema."},{"n":116,"sec":4,"t":"Meningioma: extra-axial, homogeneously enhancing, dural tail, calcification, hyperostosis. Acoustic neuroma: cerebellopontine angle, 'ice-cream cone', widened internal acoustic meatus; bilateral in NF2."},{"n":117,"sec":4,"t":"Paediatric posterior fossa tumours: medulloblastoma (hyperdense, vermis, 4th ventricle), pilocytic astrocytoma (cyst with mural nodule), ependymoma (4th ventricle). Craniopharyngioma: suprasellar, calcified, cystic."},{"n":118,"sec":4,"t":"Pituitary adenoma: macroadenoma >10 mm ('snowman / figure-of-8' sella); MRI is best. Colloid cyst: third ventricle at foramen of Monro causing hydrocephalus."},{"n":119,"sec":4,"t":"Multiple sclerosis: MRI is the investigation of choice; periventricular ovoid plaques perpendicular to ventricles (Dawson's fingers) best on FLAIR."},{"n":120,"sec":4,"t":"Hydrocephalus: dilated ventricles (Evans index >0.3). Communicating: impaired CSF absorption without obstruction; obstructive/non-communicating: block within the ventricular system (e.g. aqueduct stenosis)."},{"n":121,"sec":4,"t":"Chiari I: tonsils descend >5 mm through the foramen magnum. Chiari II: with myelomeningocele. Dandy-Walker: cystic posterior fossa, hypoplastic vermis, high tentorium."},{"n":122,"sec":4,"t":"AVM: bag of worms. Moyamoya: puff-of-smoke on angiography. Sturge-Weber: railroad-track (tram-track) cortical calcification."},{"n":123,"sec":4,"t":"Skull X-ray signs: hair-on-end (thalassaemia, sickle cell), salt-and-pepper (hyperparathyroidism), punched-out / raindrop (myeloma), cotton-wool (Paget), J-shaped sella (optic glioma, NF1), beaten-copper (raised ICP in children)."},{"n":124,"sec":4,"t":"MRI is the investigation of choice for the spinal cord, disc prolapse, cord compression and cauda equina; CT best for bony detail and acute trauma."},{"n":125,"sec":4,"t":"Pott's spine: vertebral body and disc destruction, paradiscal, gibbus, cold/psoas abscess. Metastasis: pedicle destruction ('winking owl' sign), disc preserved."},{"n":126,"sec":4,"t":"Ankylosing spondylitis: sacroiliitis (earliest), bamboo spine, squaring of vertebrae, shiny-corner sign. Spondylolisthesis: pars defect ('Scotty dog with a collar' on oblique view)."},{"n":127,"sec":4,"t":"Cervical spine injuries: Jefferson = C1 burst; hangman's = C2 pars; Chance = lumbar flexion-distraction. Ivory vertebra: Paget, lymphoma, sclerotic metastasis (prostate). Rugger-jersey spine: renal osteodystrophy/hyperparathyroidism."},{"n":128,"sec":5,"t":"Fracture = break in bone continuity; describe site, pattern (transverse/oblique/spiral/comminuted), displacement and angulation. Greenstick (incomplete, children); torus/buckle (compression of immature bone)."},{"n":129,"sec":5,"t":"Colles: distal radius, dorsal displacement (dinner-fork). Smith: volar displacement. Barton: intra-articular distal radius. Monteggia: proximal ulna + radial head dislocation. Galeazzi: radius shaft + DRUJ."},{"n":130,"sec":5,"t":"Scaphoid: may be occult on initial films; repeat at 10-14 days or MRI; proximal pole at risk of avascular necrosis. Bennett: 1st metacarpal base; boxer's: 5th metacarpal neck."},{"n":131,"sec":5,"t":"Elbow fat-pad sign (anterior sail + posterior pad) = occult fracture (supracondylar in children). Lipohaemarthrosis (fat-fluid level, cross-table lateral) = intra-articular fracture."},{"n":132,"sec":5,"t":"Lunate dislocation: spilled-teacup (lateral), piece-of-pie (AP). Scapholunate gap >3 mm: Terry Thomas sign. Posterior shoulder dislocation: light-bulb sign; anterior: Hill-Sachs and Bankart lesions."},{"n":133,"sec":5,"t":"Hip: broken Shenton's line in neck of femur fracture/dislocation. Jones fracture: base of 5th metatarsal; march fracture: metatarsal shaft; calcaneum: reduced Bohler angle; Segond fracture: ACL tear."},{"n":134,"sec":5,"t":"Stress fracture: initial X-ray normal; MRI / bone scan sensitive. Fracture callus visible at about 2-3 weeks."},{"n":135,"sec":5,"t":"Osteosarcoma: metaphysis (knee), sunburst and Codman triangle. Ewing: diaphysis, onion-skin, children, t(11;22). Chondrosarcoma: popcorn calcification."},{"n":136,"sec":5,"t":"Giant cell tumour: eccentric lytic epiphyseal lesion after physeal closure, soap-bubble. Osteochondroma: commonest benign tumour, bone-continuous cartilage cap. Enchondroma: ring-and-arc calcification, hands."},{"n":137,"sec":5,"t":"Osteoid osteoma: nidus <1.5 cm with sclerosis, night pain relieved by NSAIDs. ABC: expansile with fluid-fluid levels. Simple bone cyst: fallen-fragment sign. Fibrous dysplasia: ground-glass, shepherd's crook."},{"n":138,"sec":5,"t":"Bone metastases are the commonest bone malignancy: lytic (lung, kidney, thyroid), sclerotic (prostate), mixed (breast). Bone scan most sensitive; myeloma lesions are often cold on bone scan (use skeletal survey / MRI)."},{"n":139,"sec":5,"t":"Osteomyelitis: X-ray changes lag 10-14 days (soft-tissue swelling, periosteal reaction, lysis); MRI most sensitive early. Chronic: sequestrum, involucrum, cloaca; Brodie abscess."},{"n":140,"sec":5,"t":"RA: periarticular osteopenia, marginal erosions, symmetrical joint space loss (MCP, PIP, wrist). OA: LOSS (loss of joint space, osteophytes, subchondral sclerosis and cysts); DIP, first CMC, knee."},{"n":141,"sec":5,"t":"Gout: punched-out erosions with overhanging edges (rat-bite, Martel sign), joint space preserved. Psoriatic: pencil-in-cup, DIP, periostitis. CPPD: chondrocalcinosis. Charcot joint: 6 D's (distension, dislocation, debris, disorganization, density, destruction)."},{"n":142,"sec":5,"t":"Rickets: cupping, fraying, splaying of metaphyses, widened physis. Scurvy: Wimberger ring, Frankel line. Hyperparathyroidism: subperiosteal resorption (radial side of middle phalanges), brown tumours."},{"n":143,"sec":5,"t":"Paget disease: cotton-wool skull, ivory/picture-frame vertebra, bowing, flame-shaped lysis. Osteopetrosis: marble bone, bone-within-bone, Erlenmeyer-flask deformity. Achondroplasia: trident hand."},{"n":144,"sec":5,"t":"MRI is the investigation of choice for menisci, ligaments (ACL), marrow and soft tissue. AVN: crescent sign on X-ray; double-line sign on MRI (earliest detection by MRI)."},{"n":145,"sec":5,"t":"SCFE: adolescents, Klein's line, 'ice-cream slipping off the cone'. Perthes: AVN femoral head in children, crescent sign, flattened head. DDH: US before 4-6 months; X-ray after (Hilgenreiner and Perkin lines; acetabular index)."},{"n":146,"sec":5,"t":"Non-accidental injury: metaphyseal corner / bucket-handle fractures, posterior rib fractures, multiple fractures in different healing stages: perform a skeletal survey."},{"n":147,"sec":6,"t":"Transvaginal ultrasound (TVS) is the best early pregnancy test. Gestational sac at about 4.5-5 weeks (hCG about 1500-2000 = discriminatory zone); yolk sac about 5.5 weeks (confirms intrauterine pregnancy); cardiac activity about 6 weeks."},{"n":148,"sec":6,"t":"Crown-rump length (CRL) is the most accurate dating parameter in the first trimester; later use BPD, head circumference, femur length."},{"n":149,"sec":6,"t":"Nuchal translucency: scanned at 11-13+6 weeks; increased NT (about 3 mm or more) suggests Down syndrome/cardiac anomalies. Anomaly scan at 18-22 weeks."},{"n":150,"sec":6,"t":"Ectopic pregnancy: no intrauterine sac with positive hCG, adnexal mass ('ring of fire'), free fluid in the pouch of Douglas / Morison's pouch."},{"n":151,"sec":6,"t":"Complete hydatidiform mole: snowstorm / bunch-of-grapes, no fetal parts, theca lutein cysts, very high hCG."},{"n":152,"sec":6,"t":"Amniotic fluid: oligohydramnios AFI <5 cm (or deepest pocket <2 cm); polyhydramnios AFI >24-25 cm."},{"n":153,"sec":6,"t":"Doppler: absent/reversed end-diastolic flow in the umbilical artery = severe IUGR; MCA peak systolic velocity rises in fetal anaemia (Rh isoimmunization). Placenta previa: transabdominal then TVS is safe."},{"n":154,"sec":6,"t":"MRI without gadolinium may be used in selected pregnant patients (placenta accreta, fetal anomalies). Avoid gadolinium and unnecessary CT."},{"n":155,"sec":6,"t":"Pelvic masses in young women: ultrasound first. Dermoid (mature teratoma): tip-of-the-iceberg, Rokitansky nodule, fat-fluid level. Endometrioma: ground-glass echoes ('chocolate cyst'). Haemorrhagic cyst: lace/fishnet pattern."},{"n":156,"sec":6,"t":"PCOS: peripheral follicles ('string of pearls'), enlarged ovary (>10 mL); follicle count criterion ≥12 per ovary (older) / ≥20 (newer guidance). Ovarian torsion: enlarged ovary, reduced/absent Doppler flow."},{"n":157,"sec":6,"t":"Fibroid: whorled hypoechoic mass. Adenomyosis: globular uterus, heterogeneous myometrium. Postmenopausal endometrial thickness >4-5 mm needs evaluation. Hydrosalpinx: cogwheel sign; TOA in PID."},{"n":158,"sec":6,"t":"Mammography is the main screening tool for breast cancer (women above about 40-50 years); ultrasound for young/dense breasts and cyst vs solid; MRI for high-risk (BRCA), implants and extent of disease."},{"n":159,"sec":6,"t":"Malignant signs: spiculated mass, clustered pleomorphic microcalcifications, architectural distortion. Benign: popcorn calcification (fibroadenoma), rod-like/large calcifications (duct ectasia), eggshell (cyst, fat necrosis)."},{"n":160,"sec":6,"t":"BI-RADS: 0 = incomplete; 1 = negative; 2 = benign; 3 = probably benign (<2%, 6-month follow-up); 4 = suspicious (biopsy); 5 = highly suggestive of malignancy (≥95%); 6 = known biopsy-proven malignancy."},{"n":161,"sec":7,"t":"Pulmonary plethora (L to R shunts: ASD, VSD, PDA); pulmonary oligaemia (Tetralogy of Fallot, Ebstein)."},{"n":162,"sec":7,"t":"Boot-shaped heart (coeur en sabot): Tetralogy of Fallot (upturned apex, concave pulmonary bay, right aortic arch in 25%)."},{"n":163,"sec":7,"t":"Egg-on-a-string: transposition of the great arteries (narrow pedicle, cardiomegaly). Snowman / figure-of-8: supracardiac TAPVR. Scimitar sign: partial anomalous pulmonary venous drainage of the right lung."},{"n":164,"sec":7,"t":"Box-shaped heart: Ebstein anomaly. Figure-of-3 + rib notching: coarctation. Globular / water-bottle: pericardial effusion."},{"n":165,"sec":7,"t":"Neonatal RDS (hyaline membrane disease): ground-glass lungs, air bronchograms, low volumes. Transient tachypnoea: fluid in fissures, rapid resolution. Meconium aspiration: patchy opacities with hyperinflation."},{"n":166,"sec":7,"t":"Croup: steeple sign (AP neck). Epiglottitis: thumb sign (lateral neck). Retropharyngeal abscess: widened prevertebral soft tissue."},{"n":167,"sec":7,"t":"Thymic sail sign: normal infant thymus. Coin in the oesophagus: seen en face on AP film; a tracheal coin is seen edge-on."},{"n":168,"sec":7,"t":"Bone age: left wrist X-ray (Greulich-Pyle atlas). Osteogenesis imperfecta: wormian bones, multiple fractures."}],"tabs":{"sign":[["Biconvex / lens-shaped","Epidural haematoma"],["Crescent-shaped","Subdural haematoma"],["Dural tail","Meningioma"],["Dawson's fingers","Multiple sclerosis"],["Coffee-bean sign","Sigmoid volvulus"],["Rigler sign / football sign","Pneumoperitoneum"],["Double-bubble","Duodenal atresia"],["Target / doughnut sign","Intussusception"],["Whirlpool sign","Malrotation with volvulus"],["Apple-core lesion","Colorectal / oesophageal carcinoma"],["Lead-pipe colon","Ulcerative colitis"],["String sign of Kantor / cobblestone","Crohn's disease"],["Thumbprinting","Ischaemic colitis"],["Bird-beak / rat-tail","Achalasia (oesophagus); volvulus (colon)"],["Double-duct sign","Pancreatic head / periampullary carcinoma"],["Kerley B lines","Interstitial pulmonary oedema"],["Bat-wing","Pulmonary oedema"],["Air bronchogram","Alveolar consolidation"],["Silhouette sign","Localizes lung lesion"],["Golden S sign","RUL collapse with central mass"],["Westermark / Hampton hump","Pulmonary embolism"],["Air-crescent (Monod) sign","Aspergilloma"],["Egg-shell calcification","Silicosis"],["Sunburst + Codman triangle","Osteosarcoma"],["Onion-skin","Ewing sarcoma"],["Soap-bubble","Giant cell tumour"],["Fallen-fragment sign","Simple bone cyst"],["Fat-pad sign","Occult elbow fracture"],["Lipohaemarthrosis","Intra-articular fracture"],["Pencil-in-cup","Psoriatic arthritis"],["Rugger-jersey spine","Renal osteodystrophy"],["Hair-on-end skull","Thalassaemia / sickle cell"],["Boot-shaped heart","Tetralogy of Fallot"],["Egg-on-a-string","Transposition of great arteries"],["Snowman sign","Supracardiac TAPVR"],["Scimitar sign","Partial anomalous pulmonary venous return"],["Steeple sign","Croup"],["Thumb sign","Epiglottitis"],["Snowstorm (uterus)","Complete molar pregnancy"],["Tip-of-the-iceberg","Ovarian dermoid"]],"ioc":[["Acute stroke / head trauma / SAH","Non-contrast CT brain"],["Early ischaemic stroke","MRI DWI"],["Spinal cord, MS, pituitary, posterior fossa","MRI"],["Cerebral aneurysm","DSA (gold standard); CTA first"],["Pulmonary embolism","CT pulmonary angiography"],["Aortic dissection / traumatic aortic injury","CT angiography"],["Interstitial lung disease, bronchiectasis","HRCT"],["Pneumothorax","Erect chest X-ray (CT most sensitive)"],["Free intraperitoneal air","Erect chest X-ray (CT most sensitive)"],["Gallstones, hydronephrosis, early pregnancy","Ultrasound (TVS in early pregnancy)"],["Acute appendicitis","CT adults; US children and pregnancy"],["Renal colic / ureteric stone","Non-contrast CT KUB"],["Acute pancreatitis complications","Contrast CT (after 72 h)"],["Obstructive jaundice","US first; MRCP / CT; ERCP for therapy"],["Suspected GI perforation","Water-soluble contrast / CT"],["Dysphagia, achalasia","Barium swallow"],["Malrotation","Upper GI contrast study"],["VUR, posterior urethral valves","MCU"],["Renal scarring","DMSA scan"],["Bone metastases","Bone scan (Tc-99m MDP)"],["Early osteomyelitis; AVN; ligament/meniscus","MRI"],["Occult scaphoid fracture","MRI or repeat X-ray at 10-14 days"],["DDH below 4-6 months","Ultrasound"],["Breast: young / dense vs above 40","Ultrasound / mammography"],["Cervical cancer local staging","MRI"],["Phaeochromocytoma / neuroblastoma","MIBG scan"],["Parathyroid adenoma","Sestamibi scan"],["Meckel diverticulum","Tc-99m pertechnetate scan"],["Acute cholecystitis (equivocal US)","HIDA scan"],["Tubal patency","HSG (days 6-12)"],["Coronary artery disease","Coronary angiography (gold standard)"]]}};
const Q=D.qs,S=D.sections,KEY='radqbank.v1';
let st;try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){}
st=st||{ans:{},flag:{},theme:'auto'};st.ol=st.ol||{star:{},done:{}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const $=s=>document.querySelector(s),A=$('#app');
let sess=null,view='home';
function theme(){if(st.theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=st.theme}
theme();
function stats(){let n=0,c=0;for(const k in st.ans){n++;if(st.ans[k].ok)c++}return{n,c}}
function home(){view='home';const t=stats(),acc=t.n?Math.round(100*t.c/t.n):0;
 const wrong=Q.filter(q=>st.ans[q.id]&&!st.ans[q.id].ok).length,fl=Object.keys(st.flag).filter(k=>st.flag[k]).length,unseen=Q.filter(q=>!st.ans[q.id]).length;
 A.innerHTML=`<div class="top"><div><h1>Radiology Master QBank</h1><div class="mut">${Q.length} questions · ${S.length} topics</div></div><button class="ib" onclick="tgl()">◐ Theme</button></div>
 <div class="card"><div class="grid"><div class="stat"><b>${t.n}</b><span class="mut">answered</span></div><div class="stat"><b>${acc}%</b><span class="mut">correct</span></div></div>
 <div class="bar" style="margin-top:12px"><i style="width:${100*t.n/Q.length}%"></i></div></div>
 <button class="btn" onclick="olOpen()">📖 One-liners revision (${OL.pts.length} points)</button>
 <h2>Start a block</h2><div class="card">
 <select id="sec"><option value="all">All topics</option>${S.map((s,i)=>`<option value="${i}">${i+1}. ${s}</option>`).join('')}</select>
 <select id="mode" style="margin-top:8px"><option value="unseen">Unused (${unseen})</option><option value="all">All questions</option><option value="wrong">Incorrect (${wrong})</option><option value="flag">Flagged (${fl})</option></select>
 <div class="row" style="margin-top:8px"><select id="cnt"><option>10</option><option selected>20</option><option>40</option><option value="999">All</option></select>
 <label class="ck" style="flex:2"><input type="checkbox" id="shuf" checked> Shuffle</label></div>
 <label class="ck"><input type="checkbox" id="tut" checked> Tutor mode (explanation after each question)</label>
 <button class="btn" onclick="start()">Start</button></div>
 <h2>Performance by topic</h2><div class="card">${S.map((s,i)=>{const qs=Q.filter(q=>q.sec===i),a=qs.filter(q=>st.ans[q.id]),c=a.filter(q=>st.ans[q.id].ok);
 const p=a.length?Math.round(100*c.length/a.length):null;return`<div class="sec-row"><span>${i+1}. ${s}</span><span class="mut">${c.length}/${a.length} of ${qs.length}${p!==null?` · <b style="color:var(--${p>=70?'ok':'bad'})">${p}%</b>`:''}</span></div>`}).join('')}</div>
 <button class="btn sec" onclick="if(confirm('Reset all progress?')){st.ans={};st.flag={};st.ol={star:{},done:{}};save();home()}">Reset progress</button>`}
function tgl(){st.theme=st.theme==='auto'?'dark':st.theme==='dark'?'light':'auto';save();theme();alert('Theme: '+st.theme)}
function start(){const sc=$('#sec').value,m=$('#mode').value;let l=Q.filter(q=>(sc==='all'||q.sec==+sc)&&(m==='all'||(m==='unseen'&&!st.ans[q.id])||(m==='wrong'&&st.ans[q.id]&&!st.ans[q.id].ok)||(m==='flag'&&st.flag[q.id])));
 if(!l.length){alert('No questions match. Try a different filter.');return}
 if($('#shuf').checked)l.sort(()=>Math.random()-.5);l=l.slice(0,+$('#cnt').value);
 sess={l,i:0,pick:null,done:false,tut:$('#tut').checked,res:[]};show()}
function show(){view='q';const q=sess.l[sess.i],d=sess.done,p=sess.pick;
 A.innerHTML=`<div class="top"><button class="ib" onclick="if(confirm('End block?'))results()">✕ End</button><span class="mut">${sess.i+1} / ${sess.l.length}</span><button class="ib" onclick="flag(${q.id})">${st.flag[q.id]?'★ Flagged':'☆ Flag'}</button></div>
 <div class="bar"><i style="width:${100*sess.i/sess.l.length}%"></i></div>
 <div class="card"><span class="tag">${S[q.sec]} · Q${q.id}${q.src?' · Entry Test':''}</span><div class="q">${q.q}</div>
 ${q.o.map((o,i)=>{let c='opt';if(d&&sess.tut){c+=i===q.a?' ok':i===p?' no':' dim'}else if(i===p)c+=' sel';return`<button class="${c}" onclick="pick(${i})"><b>${'ABCD'[i]}</b><span>${o}</span></button>`}).join('')}
 ${d&&sess.tut?`<div class="exp ${p===q.a?'g':'r'}"><h3>${p===q.a?'✓ Correct':'✗ Incorrect'} — correct answer ${'ABCD'[q.a]}</h3>${q.e||`<b>${'ABCD'[q.a]}.</b> ${q.o[q.a]}`}</div>
 ${q.t?`<div class="exp w"><h3>Exam trap / key point</h3>${q.t}</div>`:''}
 ${q.e?`<div class="exp" style="background:var(--bg)"><h3>Why not the others?</h3>${q.o.map((o,i)=>i===q.a?'':`<div><b>${'ABCD'[i]}.</b> ${o}</div>`).join('')}<div class="mut" style="margin-top:6px">Look-alike distractors — see the trap above for how they differ.</div></div>`:''}`:''}
 </div><div class="foot"><div class="in">${d?`<button class="btn" onclick="next()">${sess.i+1<sess.l.length?'Next ›':'Finish'}</button>`:`<button class="btn" ${p===null?'disabled style="opacity:.5"':''} onclick="submit()">Submit</button>`}</div></div>`;window.scrollTo(0,0)}
function pick(i){if(sess.done)return;sess.pick=i;show()}
function submit(){const q=sess.l[sess.i],ok=sess.pick===q.a;st.ans[q.id]={ok,p:sess.pick};save();sess.res.push(ok);sess.done=true;
 if(!sess.tut)next();else show()}
function next(){if(sess.i+1>=sess.l.length)return results();sess.i++;sess.pick=null;sess.done=false;show()}
function flag(id){st.flag[id]=!st.flag[id];save();show()}
function results(){const n=sess.res.length,c=sess.res.filter(Boolean).length;view='r';
 A.innerHTML=`<h1>Block complete</h1><div class="card stat"><b>${n?Math.round(100*c/n):0}%</b><span class="mut">${c} of ${n} correct</span></div>
 <button class="btn" onclick="home()">Back to home</button>
 <h2>Review</h2>${sess.l.slice(0,n).map((q,i)=>`<div class="card"><span class="pill" style="background:var(--${sess.res[i]?'okL':'badL'});color:var(--${sess.res[i]?'ok':'bad'})">${sess.res[i]?'Correct':'Incorrect'}</span> <b>Q${q.id}</b> ${q.q}<div class="mut" style="margin-top:6px">Answer: ${q.e||q.o[q.a]}</div></div>`).join('')}`;window.scrollTo(0,0)}
const ol={tab:'pts',sec:'all',q:'',mode:'all'};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function olOpen(){view='ol';olShell()}
function olShell(){const c=OL.pts.length,d=Object.keys(st.ol.done).filter(k=>st.ol.done[k]).length;
 A.innerHTML=`<div class="top"><button class="ib" onclick="home()">‹ Home</button><span class="mut">${d} / ${c} learned</span></div>
 <h1>One-liners revision</h1><div class="mut">PG entry high-yield points · verify against your textbook</div>
 <div class="ol-tabs"><button id="t-pts" onclick="olTab('pts')">Points</button><button id="t-sign" onclick="olTab('sign')">Sign → Dx</button><button id="t-ioc" onclick="olTab('ioc')">Best test</button></div>
 <div id="olc"></div>`;olTab(ol.tab)}
function olTab(t){ol.tab=t;['pts','sign','ioc'].forEach(x=>{const b=$('#t-'+x);if(b)b.classList.toggle('on',x===t)});const c=$('#olc');
 if(t==='pts'){c.innerHTML=`<input class="ol-s" id="olq" placeholder="Search points…" value="${esc(ol.q)}" oninput="ol.q=this.value;olList()">
  <select id="ols" style="margin-top:8px" onchange="ol.sec=this.value;olList()"><option value="all">All sections</option>${OL.secs.map((s,i)=>`<option value="${i}" ${ol.sec==i?'selected':''}>${i+1}. ${esc(s)}</option>`).join('')}</select>
  <select id="olm" style="margin-top:8px" onchange="ol.mode=this.value;olList()"><option value="all">All points</option><option value="todo" ${ol.mode==='todo'?'selected':''}>Not yet learned</option><option value="star" ${ol.mode==='star'?'selected':''}>Starred</option><option value="done" ${ol.mode==='done'?'selected':''}>Learned</option></select>
  <div class="card" id="oll"></div>`;olList()}
 else{const rows=OL.tabs[t],h=t==='sign'?['Radiological sign','Diagnosis']:['Clinical situation','Best test'];
  c.innerHTML=`<input class="ol-s" id="olq2" placeholder="Search…" oninput="olTbl('${t}',this.value)"><div class="card" id="oll"></div>`;olTbl(t,'')}}
function olTbl(t,q){q=q.toLowerCase();const h=t==='sign'?['Radiological sign','Diagnosis']:['Clinical situation','Best test'];
 $('#oll').innerHTML=`<div class="ol-r mut"><b>${h[0]}</b><span>${h[1]}</span></div>`+OL.tabs[t].filter(r=>!q||(r[0]+' '+r[1]).toLowerCase().includes(q)).map(r=>`<div class="ol-r"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join('')}
function olList(){const q=ol.q.toLowerCase(),I=st.ol;
 const l=OL.pts.filter(p=>(ol.sec==='all'||p.sec==+ol.sec)&&(!q||p.t.toLowerCase().includes(q))&&(ol.mode==='all'||(ol.mode==='todo'&&!I.done[p.n])||(ol.mode==='star'&&I.star[p.n])||(ol.mode==='done'&&I.done[p.n])));
 let last=-1,h='';for(const p of l){if(ol.sec==='all'&&p.sec!==last){last=p.sec;h+=`<h2 style="color:var(--pri)">${p.sec+1}. ${esc(OL.secs[p.sec])}</h2>`}
  h+=`<div class="ol-i ${I.done[p.n]?'dn':''}"><span class="ol-n">${p.n}.</span><span class="ol-t" style="flex:1">${esc(p.t)}</span><button class="ol-b ${I.star[p.n]?'on':''}" onclick="olSt(${p.n},'star')">${I.star[p.n]?'★':'☆'}</button><button class="ol-b ${I.done[p.n]?'on':''}" onclick="olSt(${p.n},'done')">${I.done[p.n]?'✔':'○'}</button></div>`}
 $('#oll').innerHTML=h||'<div class="mut">No points match.</div>'}
function olSt(n,k){st.ol[k][n]=!st.ol[k][n];save();const y=window.scrollY;olList();const d=Object.keys(st.ol.done).filter(x=>st.ol.done[x]).length;document.querySelector('.top .mut').textContent=d+' / '+OL.pts.length+' learned';window.scrollTo(0,y)}

home();
</script></body></html>
