<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Radiology Master QBank</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mut:#667085;--line:#e3e6ea;--pri:#0f766e;--priL:#d9f2ef;--ok:#15803d;--okL:#dcfce7;--bad:#b91c1c;--badL:#fee2e2;--warn:#92400e;--warnL:#fef3c7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1116;--card:#171b22;--ink:#e8ebf0;--mut:#98a2b3;--line:#2a303a;--pri:#2dd4bf;--priL:#12332f;--ok:#4ade80;--okL:#12301d;--bad:#f87171;--badL:#3a1717;--warn:#fbbf24;--warnL:#33270d}}
:root[data-theme=dark]{--bg:#0e1116;--card:#171b22;--ink:#e8ebf0;--mut:#98a2b3;--line:#2a303a;--pri:#2dd4bf;--priL:#12332f;--ok:#4ade80;--okL:#12301d;--bad:#f87171;--badL:#3a1717;--warn:#fbbf24;--warnL:#33270d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:12px 14px 90px}
h1{font-size:22px;margin:8px 0 2px}h2{font-size:16px;margin:18px 0 8px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font:600 16px inherit;background:var(--pri);color:#fff;margin:8px 0}
:root:not([data-theme=light]) .btn{color:#06201d}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.ib{background:none;border:0;color:var(--ink);font-size:14px;padding:8px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.tag{display:inline-block;font-size:12px;background:var(--priL);color:var(--pri);padding:2px 9px;border-radius:20px;margin-bottom:6px}
.q{font-size:18px;font-weight:600;margin:6px 0 12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;font:16px inherit}
.opt b{min-width:24px;height:24px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px}
.opt.sel{border-color:var(--pri);background:var(--priL)}
.opt.ok{border-color:var(--ok);background:var(--okL)}.opt.no{border-color:var(--bad);background:var(--badL)}
.opt.dim{opacity:.55}
.exp{border-radius:12px;padding:12px;margin:10px 0;font-size:15px}
.exp.g{background:var(--okL)}.exp.r{background:var(--badL)}.exp.w{background:var(--warnL);color:var(--warn)}
.exp h3{margin:0 0 4px;font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.foot .in{max-width:640px;margin:auto;display:flex;gap:8px}.foot .btn{margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{text-align:center}.stat b{font-size:24px;display:block}
.sec-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.sec-row:last-child{border:0}
label.ck{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:15px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--pri)}
select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px inherit}
.ol-i{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}.ol-i:last-child{border:0}.ol-n{min-width:30px;color:var(--mut);font-size:13px;padding-top:2px}.ol-i.dn .ol-t{opacity:.5}.ol-b{background:none;border:0;font-size:20px;padding:0 4px;color:var(--mut)}.ol-b.on{color:var(--pri)}.ol-tabs{display:flex;gap:6px;margin:8px 0}.ol-tabs button{flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 13px inherit}.ol-tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}:root:not([data-theme=light]) .ol-tabs button.on{color:#06201d}input.ol-s{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:16px inherit}.ol-r{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}.ol-r:last-child{border:0}.ol-r b{flex:1}.ol-r span{flex:1.2}
.pill{font-size:13px;padding:2px 8px;border-radius:12px}
</style></head><body><div id="app"></div>
<script>
const D={"sections": ["Radiation Physics and Safety", "Radiographic Positioning and Views", "Contrast Agents", "Ultrasound Physics", "Computed Tomography", "MRI", "Nuclear Medicine", "Chest and Cardiovascular", "Gastrointestinal", "Hepatobiliary and Pancreas", "Genitourinary", "Female Pelvis and Obstetrics", "Breast Imaging", "Neuro, Head and Neck", "Musculoskeletal", "Pediatric Radiology", "Interventional Radiology", "Radiotherapy Basics", "PG Entry SBA: Basic principles, physics and modalities", "PG Entry SBA: Radiation safety and contrast media", "PG Entry SBA: Chest radiology", "PG Entry SBA: Abdominal, GI and genitourinary radiology", "PG Entry SBA: Neuroimaging and spine", "Rapid Revision: Classic Sign to Diagnosis"], "qs": [{"id": 1, "sec": 0, "q": "The SI unit of absorbed dose is:", "o": ["Gray (Gy)", "Sievert (Sv)", "Becquerel (Bq)", "Roentgen (R)"], "a": 0, "e": "Gray (Gy).", "t": "Sievert is the unit of EFFECTIVE dose, not absorbed dose. 1 Gy = 1 J/kg."}, {"id": 2, "sec": 0, "q": "The SI unit of effective dose is:", "o": ["Gray (Gy)", "Sievert (Sv)", "Becquerel (Bq)", "Coulomb/kg"], "a": 1, "e": "Sievert (Sv).", "t": "Effective dose (risk weighted) = Sv; absorbed dose = Gy."}, {"id": 3, "sec": 0, "q": "If the distance from an X-ray source is doubled, the intensity becomes:", "o": ["One half", "One eighth", "One quarter", "Double"], "a": 2, "e": "One quarter.", "t": "Inverse SQUARE law, so half is the trap answer."}, {"id": 4, "sec": 0, "q": "The occupational dose limit for radiation workers is:", "o": ["1 mSv per year", "50 mSv per year averaged over 5 years", "5 mSv per month", "20 mSv per year averaged over 5 years"], "a": 3, "e": "20 mSv per year averaged over 5 years.", "t": "1 mSv per year is the PUBLIC limit."}, {"id": 5, "sec": 0, "q": "A pregnant radiation worker should keep the fetal dose for the remainder of pregnancy below:", "o": ["1 mSv", "5 mSv", "10 mSv", "20 mSv"], "a": 0, "e": "1 mSv.", "t": "20 mSv is the ordinary occupational limit, not the fetal limit."}, {"id": 6, "sec": 0, "q": "The fetus is most sensitive to radiation at:", "o": ["Third trimester", "8-15 weeks of gestation", "16-25 weeks", "After birth only"], "a": 1, "e": "8-15 weeks of gestation.", "t": "Preferred imaging in pregnancy: ultrasound and MRI."}, {"id": 7, "sec": 0, "q": "A personal dosimeter (TLD or film badge) is normally worn:", "o": ["At the waist, under the apron only", "On the wrist", "At the collar, outside the apron", "In the trouser pocket"], "a": 2, "e": "At the collar, outside the apron.", "t": "In pregnancy a SECOND badge is worn under the apron."}, {"id": 8, "sec": 0, "q": "Which is the most radiosensitive tissue listed?", "o": ["Muscle", "Cortical bone", "Peripheral nerve", "Bone marrow"], "a": 3, "e": "Bone marrow.", "t": "Gonads, lens of the eye and bone marrow are the classic radiosensitive tissues."}, {"id": 9, "sec": 0, "q": "Typical lead apron thickness is:", "o": ["0.25-0.5 mm lead equivalent", "2-3 mm", "5 mm", "0.01 mm"], "a": 0, "e": "0.25-0.5 mm lead equivalent.", "t": "Numeric recall; wrong options are exaggerated thicknesses."}, {"id": 10, "sec": 0, "q": "The target (anode) material of a general diagnostic X-ray tube is:", "o": ["Molybdenum", "Tungsten", "Copper", "Lead"], "a": 1, "e": "Tungsten.", "t": "Molybdenum or rhodium targets belong to MAMMOGRAPHY."}, {"id": 11, "sec": 0, "q": "What percentage of electron energy at the anode is converted to heat?", "o": ["About 50%", "About 80%", "More than 99%", "About 10%"], "a": 2, "e": "More than 99%.", "t": "Under 1% becomes X-rays."}, {"id": 12, "sec": 0, "q": "Most diagnostic X-rays are produced by:", "o": ["Characteristic radiation", "Photoelectric effect", "Compton scatter", "Bremsstrahlung (braking) radiation"], "a": 3, "e": "Bremsstrahlung (braking) radiation.", "t": "Photoelectric and Compton are INTERACTIONS with matter, not production mechanisms."}, {"id": 13, "sec": 0, "q": "The anode heel effect causes X-ray intensity to be greater on the:", "o": ["Cathode side", "Anode side", "Centre only", "It is equal across the beam"], "a": 0, "e": "Cathode side.", "t": "A smaller anode angle gives a sharper image but INCREASES the heel effect."}, {"id": 14, "sec": 0, "q": "Reducing the anode angle (line focus principle) results in:", "o": ["Larger effective focal spot", "Smaller effective focal spot and increased heel effect", "Reduced heel effect", "Greater penumbra"], "a": 1, "e": "Smaller effective focal spot and increased heel effect.", "t": "Sharper image comes with a cost: heel effect."}, {"id": 15, "sec": 0, "q": "Increasing kVp results in:", "o": ["Higher contrast and lower patient dose", "Lower contrast and higher patient dose", "Lower contrast and lower patient dose", "Higher blackening only with no change in contrast"], "a": 2, "e": "Lower contrast and lower patient dose.", "t": "kVp = quality (penetration, contrast); mAs = quantity (blackening)."}, {"id": 16, "sec": 0, "q": "Which controls the degree of film blackening (quantity of X-rays)?", "o": ["kVp", "Filtration", "Focal spot size", "mAs"], "a": 3, "e": "mAs.", "t": "kVp is the beam quality control."}, {"id": 17, "sec": 0, "q": "The purpose of aluminium filtration is to:", "o": ["Remove low-energy photons that only add to skin dose", "Increase beam contrast", "Increase heat in the anode", "Produce characteristic radiation"], "a": 0, "e": "Remove low-energy photons that only add to skin dose.", "t": "Collimation (not filtration) limits field size and scatter."}, {"id": 18, "sec": 0, "q": "The photoelectric effect is proportional to:", "o": ["Z", "Z cubed", "Z squared", "It is independent of Z"], "a": 1, "e": "Z cubed.", "t": "Compton scatter is the one that is independent of atomic number."}, {"id": 19, "sec": 0, "q": "Which interaction dominates in soft tissue at diagnostic energies and is the main source of scatter fog?", "o": ["Photoelectric effect", "Coherent scatter", "Compton scatter", "Pair production"], "a": 2, "e": "Compton scatter.", "t": "Photoelectric gives contrast; Compton gives scatter and staff exposure."}, {"id": 20, "sec": 0, "q": "Use of an anti-scatter grid:", "o": ["Improves contrast and reduces patient dose", "Reduces contrast and dose", "Reduces magnification", "Improves contrast but increases patient dose"], "a": 3, "e": "Improves contrast but increases patient dose.", "t": "A grid is used for parts thicker than about 10 cm. Air gap is the grid-free alternative."}, {"id": 21, "sec": 0, "q": "Geometric unsharpness is reduced by:", "o": ["Small focal spot and short object-detector distance", "Large focal spot", "Long object-detector distance", "Short focus-detector distance"], "a": 0, "e": "Small focal spot and short object-detector distance.", "t": "Longer focus-detector distance also reduces it; longer object-detector distance INCREASES it."}, {"id": 22, "sec": 0, "q": "The commonest cause of blurring on a radiograph is:", "o": ["Large focal spot", "Patient motion", "Grid cut-off", "Beam hardening"], "a": 1, "e": "Patient motion.", "t": "Cure: shorter exposure time."}, {"id": 23, "sec": 0, "q": "Computed radiography (CR) uses:", "o": ["A flat-panel detector with direct capture", "Image intensifier tubes", "Photostimulable phosphor plates read by a laser", "Silver halide film"], "a": 2, "e": "Photostimulable phosphor plates read by a laser.", "t": "Flat panel with direct digital capture and faster workflow = DR."}, {"id": 24, "sec": 0, "q": "'Dose creep' is a problem mainly of:", "o": ["Screen-film systems", "Mammography with compression", "Ultrasound", "Digital systems with a wide dynamic range"], "a": 3, "e": "Digital systems with a wide dynamic range.", "t": "Overexposure goes unnoticed; the exposure index flags it."}, {"id": 25, "sec": 0, "q": "To lower operator scatter exposure in fluoroscopy:", "o": ["Keep the tube under the table and stand on the detector side", "Keep the tube over the table", "Stand on the X-ray tube side", "Increase magnification mode"], "a": 0, "e": "Keep the tube under the table and stand on the detector side.", "t": "Scatter is highest at the tube (entrance) side."}, {"id": 26, "sec": 0, "q": "Dose area product (DAP) is used to monitor:", "o": ["Staff dose", "Patient dose in fluoroscopy and interventional procedures", "Image noise", "Detector sensitivity"], "a": 1, "e": "Patient dose in fluoroscopy and interventional procedures.", "t": "Skin dose is highest at the beam ENTRANCE site."}, {"id": 27, "sec": 0, "q": "Mammography typically uses which target/filter and kVp?", "o": ["Tungsten at 80-100 kVp", "Copper at 120 kVp", "Molybdenum or rhodium at about 25-32 kVp", "Lead at 60 kVp"], "a": 2, "e": "Molybdenum or rhodium at about 25-32 kVp.", "t": "Low kVp for soft tissue contrast."}, {"id": 28, "sec": 0, "q": "The standard file format for storing and transmitting medical images is:", "o": ["PACS", "JPEG", "HL7", "DICOM"], "a": 3, "e": "DICOM.", "t": "PACS is the SYSTEM that stores/distributes; DICOM is the FORMAT."}, {"id": 29, "sec": 1, "q": "A lateral cervical spine X-ray does not show C7-T1. The next step is:", "o": ["Swimmer's view", "Open-mouth view", "Towne's view", "Lordotic view"], "a": 0, "e": "Swimmer's view.", "t": "Open-mouth (peg) view is for odontoid and C1-C2."}, {"id": 30, "sec": 1, "q": "The best plain view for the odontoid peg and C1-C2 is:", "o": ["Swimmer's view", "Open-mouth view", "Waters' view", "Stenvers' view"], "a": 1, "e": "Open-mouth view.", "t": "Swimmer's is for C7-T1."}, {"id": 31, "sec": 1, "q": "Towne's view best shows the:", "o": ["Maxillary sinuses", "Petrous temporal bone", "Occipital bone and posterior fossa", "Frontal sinuses"], "a": 2, "e": "Occipital bone and posterior fossa.", "t": "Classic mix-up with Waters (maxillary) and Stenvers (petrous)."}, {"id": 32, "sec": 1, "q": "Waters' (occipitomental) view is used for:", "o": ["Frontal sinuses", "Occipital bone", "Skull base", "Maxillary sinuses"], "a": 3, "e": "Maxillary sinuses.", "t": "Caldwell = frontal and ethmoid sinuses."}, {"id": 33, "sec": 1, "q": "Stenvers' view is used to demonstrate the:", "o": ["Petrous temporal bone", "Mandible", "Sphenoid sinus", "Orbit floor"], "a": 0, "e": "Petrous temporal bone.", "t": "Submentovertex = skull base and sphenoid."}, {"id": 34, "sec": 1, "q": "The skyline (Merchant) view demonstrates:", "o": ["Acetabulum", "Patellofemoral joint", "Tibial plateau", "Hip in children"], "a": 1, "e": "Patellofemoral joint.", "t": "Judet views are for acetabulum."}, {"id": 35, "sec": 1, "q": "Judet views are used for:", "o": ["Patellar fractures", "Scaphoid fractures", "Acetabular fractures", "Calcaneal fractures"], "a": 2, "e": "Acetabular fractures.", "t": "Frog-leg lateral is the child hip view."}, {"id": 36, "sec": 1, "q": "Scaphoid views are taken with the wrist in:", "o": ["Radial deviation", "Full flexion", "Neutral with fist clenched only", "Ulnar deviation"], "a": 3, "e": "Ulnar deviation.", "t": "Ulnar deviation stretches the scaphoid out."}, {"id": 37, "sec": 1, "q": "A PA chest X-ray is taken at a distance of:", "o": ["180 cm", "100 cm", "60 cm", "250 cm"], "a": 0, "e": "180 cm.", "t": "Long distance reduces cardiac magnification; AP supine films magnify the heart."}, {"id": 38, "sec": 1, "q": "The minimum pleural effusion volume visible on a PA chest film is about:", "o": ["50 mL", "200 mL", "20 mL", "500 mL"], "a": 1, "e": "200 mL.", "t": "Lateral view shows about 50 mL; lateral decubitus detects even smaller effusions."}, {"id": 39, "sec": 1, "q": "Best view for detecting pneumoperitoneum in a patient who cannot stand:", "o": ["Supine AP abdomen", "Lordotic view", "Left lateral decubitus", "Swimmer's view"], "a": 2, "e": "Left lateral decubitus.", "t": "Erect chest film (after 5-10 min upright) is best when the patient can stand."}, {"id": 40, "sec": 1, "q": "The lordotic view is used for:", "o": ["Lung bases", "Hila", "Sternum", "Lung apices"], "a": 3, "e": "Lung apices.", "t": "Do not confuse with lateral decubitus."}, {"id": 41, "sec": 1, "q": "Which X-ray is used to assess bone age?", "o": ["Left hand and wrist", "Right knee", "Lateral skull", "Pelvis"], "a": 0, "e": "Left hand and wrist.", "t": "Left (non-dominant) hand and wrist."}, {"id": 42, "sec": 1, "q": "Lateral soft tissue neck X-ray is used mainly for:", "o": ["Cervical disc prolapse", "Epiglottitis and retropharyngeal abscess", "Thyroid nodule", "Foreign body in bronchus"], "a": 1, "e": "Epiglottitis and retropharyngeal abscess.", "t": "Thumb sign = epiglottitis; steeple sign = croup (AP view)."}, {"id": 43, "sec": 2, "q": "Reactions to iodinated contrast are best described as:", "o": ["True IgE-mediated allergy always", "Type IV hypersensitivity only", "Anaphylactoid", "Toxic overdose"], "a": 2, "e": "Anaphylactoid.", "t": "Not a true allergy, so no skin test predicts them."}, {"id": 44, "sec": 2, "q": "First-line drug for a severe contrast reaction:", "o": ["IV hydrocortisone", "IV chlorpheniramine", "Oral prednisolone", "Intramuscular adrenaline"], "a": 3, "e": "Intramuscular adrenaline.", "t": "Steroids and antihistamines are adjuncts, never first."}, {"id": 45, "sec": 2, "q": "Which measure best reduces contrast-induced nephropathy?", "o": ["Hydration", "Diuretics", "Dopamine", "Mannitol"], "a": 0, "e": "Hydration.", "t": "Metformin is held 48 hours after contrast in renal impairment."}, {"id": 46, "sec": 2, "q": "Barium sulfate is used for GI studies because it is:", "o": ["Absorbed and excreted by kidneys", "Inert and not absorbed", "Water soluble and hyperosmolar", "Radioactive"], "a": 1, "e": "Inert and not absorbed.", "t": "Water-soluble iodinated agent is used when perforation is suspected."}, {"id": 47, "sec": 3, "q": "Diagnostic ultrasound frequency range is:", "o": ["20-20,000 Hz", "100-500 MHz", "2-15 MHz", "0.1-1 MHz"], "a": 2, "e": "2-15 MHz.", "t": "Ultrasound is above 20,000 Hz; the diagnostic range is MHz."}, {"id": 48, "sec": 3, "q": "Sound is produced in the transducer by the:", "o": ["Photoelectric effect", "Doppler effect", "Thermionic emission", "Piezoelectric effect"], "a": 3, "e": "Piezoelectric effect.", "t": "Thermionic emission belongs to the X-ray tube."}, {"id": 49, "sec": 3, "q": "Increasing ultrasound frequency gives:", "o": ["Better resolution but less penetration", "Better resolution and better penetration", "Worse resolution and better penetration", "No change in resolution"], "a": 0, "e": "Better resolution but less penetration.", "t": "Classic trade-off."}, {"id": 50, "sec": 3, "q": "Which probe is best for thyroid, breast and testis?", "o": ["Low frequency (2-5 MHz)", "High frequency (7-15 MHz)", "Endocavitary 1 MHz", "Doppler only"], "a": 1, "e": "High frequency (7-15 MHz).", "t": "Low frequency 2-5 MHz is for the abdomen (deep)."}, {"id": 51, "sec": 3, "q": "Posterior acoustic enhancement is seen behind:", "o": ["Gallstones", "Bone", "Fluid-filled structures such as cysts", "Gas"], "a": 2, "e": "Fluid-filled structures such as cysts.", "t": "Shadowing is behind stones and bone."}, {"id": 52, "sec": 3, "q": "Reverberation artifact is typically seen at:", "o": ["Cyst walls", "Fluid collections", "Solid liver", "Air or gas interfaces"], "a": 3, "e": "Air or gas interfaces.", "t": "Not to be confused with enhancement."}, {"id": 53, "sec": 3, "q": "On ultrasound, fluid appears:", "o": ["Anechoic (black)", "Hyperechoic", "Isoechoic", "Hypoechoic only"], "a": 0, "e": "Anechoic (black).", "t": "Anechoic = no echoes; bone is hyperechoic."}, {"id": 54, "sec": 4, "q": "Hounsfield units of water and air respectively:", "o": ["-1000 and 0", "0 and -1000", "+100 and -100", "0 and +1000"], "a": 1, "e": "0 and -1000.", "t": "Fat is about -100; dense bone above +1000."}, {"id": 55, "sec": 4, "q": "Acute blood on non-contrast CT has an attenuation of about:", "o": ["0-10 HU", "-100 HU", "60-80 HU", "200-300 HU"], "a": 2, "e": "60-80 HU.", "t": "Chronic blood becomes hypodense."}, {"id": 56, "sec": 4, "q": "Investigation of choice for acute head injury:", "o": ["MRI brain", "Skull X-ray", "Cerebral angiography", "Non-contrast CT head"], "a": 3, "e": "Non-contrast CT head.", "t": "MRI is better for posterior fossa and cord, not acute trauma."}, {"id": 57, "sec": 4, "q": "Investigation of choice for renal colic:", "o": ["Non-contrast CT KUB", "Ultrasound KUB", "IVU", "Plain KUB X-ray"], "a": 0, "e": "Non-contrast CT KUB.", "t": "Ultrasound is first for hydronephrosis, not for stone detection."}, {"id": 58, "sec": 4, "q": "Investigation of choice for pulmonary embolism:", "o": ["V/Q scan", "CT pulmonary angiography", "Chest X-ray", "D-dimer"], "a": 1, "e": "CT pulmonary angiography.", "t": "V/Q is used when CTPA is contraindicated."}, {"id": 59, "sec": 4, "q": "Best test for interstitial lung disease and bronchiectasis:", "o": ["Chest X-ray", "MRI chest", "HRCT", "Contrast CT thorax"], "a": 2, "e": "HRCT.", "t": "HRCT uses thin slices."}, {"id": 60, "sec": 4, "q": "Common CT artifacts include:", "o": ["Heel effect and grid cut-off", "Reverberation and mirror image", "Susceptibility and chemical shift", "Beam hardening and motion"], "a": 3, "e": "Beam hardening and motion.", "t": "Susceptibility is MRI; reverberation is ultrasound."}, {"id": 61, "sec": 4, "q": "Imaging for cervical spine injury in major trauma:", "o": ["CT", "Plain lateral film only", "MRI first", "Flexion-extension films"], "a": 0, "e": "CT.", "t": "CT is the modality of choice in major trauma."}, {"id": 62, "sec": 5, "q": "On MRI, T1-weighted images best show:", "o": ["Pathology", "Anatomy", "CSF suppression", "Haemorrhage only"], "a": 1, "e": "Anatomy.", "t": "T2 shows pathology; most lesions are bright."}, {"id": 63, "sec": 5, "q": "Sequence best for periventricular lesions of multiple sclerosis:", "o": ["T1", "STIR", "FLAIR", "GRE"], "a": 2, "e": "FLAIR.", "t": "FLAIR suppresses CSF."}, {"id": 64, "sec": 5, "q": "Earliest sequence to show acute infarction (within minutes):", "o": ["T2", "FLAIR", "T1 post contrast", "DWI"], "a": 3, "e": "DWI.", "t": "CT is normal early; FLAIR turns positive later."}, {"id": 65, "sec": 5, "q": "Sequence best for haemorrhage and calcification:", "o": ["Gradient echo (GRE/SWI)", "STIR", "FLAIR", "T1"], "a": 0, "e": "Gradient echo (GRE/SWI).", "t": "Blooming artifact."}, {"id": 66, "sec": 5, "q": "STIR sequence suppresses:", "o": ["CSF", "Fat", "Water", "Blood"], "a": 1, "e": "Fat.", "t": "FLAIR suppresses CSF."}, {"id": 67, "sec": 5, "q": "Which appears black on BOTH T1 and T2 images?", "o": ["Fat", "Simple cyst", "Cortical bone", "Acute infarct"], "a": 2, "e": "Cortical bone.", "t": "Also air and rapidly flowing blood."}, {"id": 68, "sec": 5, "q": "MRCP is:", "o": ["An invasive therapeutic procedure", "A nuclear scan of bile flow", "A CT contrast study", "A non-invasive study of biliary and pancreatic ducts"], "a": 3, "e": "A non-invasive study of biliary and pancreatic ducts.", "t": "ERCP is invasive and therapeutic."}, {"id": 69, "sec": 5, "q": "MRI is the best investigation for all EXCEPT:", "o": ["Acute head injury", "Acoustic neuroma", "Meniscal injury", "Posterior fossa lesion"], "a": 0, "e": "Acute head injury.", "t": "CT is first in acute head injury."}, {"id": 70, "sec": 5, "q": "Unit of magnetic field strength is:", "o": ["Gauss per metre", "Tesla", "Gray", "Hounsfield"], "a": 1, "e": "Tesla.", "t": "Hounsfield is CT density."}, {"id": 71, "sec": 6, "q": "The commonest radioisotope in nuclear medicine is:", "o": ["Iodine-131 (half-life 8 days)", "Gallium-67", "Technetium-99m (half-life 6 hours)", "Thallium-201"], "a": 2, "e": "Technetium-99m (half-life 6 hours).", "t": "Half-life value is frequently tested."}, {"id": 72, "sec": 6, "q": "The commonest PET tracer is:", "o": ["Tc-99m MDP", "I-131", "Ga-67", "F-18 FDG"], "a": 3, "e": "F-18 FDG.", "t": "FDG is a glucose analogue."}, {"id": 73, "sec": 6, "q": "A bone scan uses:", "o": ["Tc-99m MDP", "Tc-99m DMSA", "Tc-99m MAG3", "I-123 MIBG"], "a": 0, "e": "Tc-99m MDP.", "t": "DMSA is for renal scarring."}, {"id": 74, "sec": 6, "q": "'Superscan' appearance is:", "o": ["Intense kidney uptake only", "Intense bone uptake with absent kidney activity", "Cold bone lesions only", "Absent uptake in the skeleton"], "a": 1, "e": "Intense bone uptake with absent kidney activity.", "t": "Seen in diffuse metastatic disease or metabolic bone disease."}, {"id": 75, "sec": 6, "q": "Best isotope for renal scarring:", "o": ["DTPA", "MAG3", "DMSA", "MDP"], "a": 2, "e": "DMSA.", "t": "DTPA and MAG3 assess function and drainage."}, {"id": 76, "sec": 6, "q": "Meckel scan uses:", "o": ["Tc-99m sulfur colloid", "Tc-99m DMSA", "Gallium-67", "Tc-99m pertechnetate"], "a": 3, "e": "Tc-99m pertechnetate.", "t": "Detects ectopic gastric mucosa."}, {"id": 77, "sec": 6, "q": "Radioisotope used for therapy of thyrotoxicosis and thyroid cancer:", "o": ["I-131", "Tc-99m", "F-18", "Ga-67"], "a": 0, "e": "I-131.", "t": "Tc-99m pertechnetate is for thyroid IMAGING."}, {"id": 78, "sec": 6, "q": "MIBG scintigraphy is used for:", "o": ["Thyroid cancer", "Phaeochromocytoma and neuroblastoma", "Myocardial perfusion", "Cholecystitis"], "a": 1, "e": "Phaeochromocytoma and neuroblastoma.", "t": "Also remember it can be therapeutic."}, {"id": 79, "sec": 6, "q": "HIDA scan is used for:", "o": ["Renal scarring", "Pulmonary embolism", "Acute cholecystitis and bile leaks", "Ectopic gastric mucosa"], "a": 2, "e": "Acute cholecystitis and bile leaks.", "t": "Non-filling gallbladder suggests cholecystitis."}, {"id": 80, "sec": 6, "q": "Gallium-67 localizes in:", "o": ["Bone metastases", "Myocardium", "Parathyroid", "Infection and lymphoma"], "a": 3, "e": "Infection and lymphoma.", "t": "Thallium-201 and sestamibi are for myocardium."}, {"id": 81, "sec": 6, "q": "A V/Q scan is mainly used for pulmonary embolism when:", "o": ["CT pulmonary angiography is contraindicated", "CTPA is always unavailable", "The chest X-ray is abnormal", "D-dimer is negative"], "a": 0, "e": "CT pulmonary angiography is contraindicated.", "t": "CTPA remains first choice."}, {"id": 82, "sec": 7, "q": "Loss of the right heart border on chest X-ray indicates disease in the:", "o": ["Right lower lobe", "Right middle lobe (silhouette sign)", "Right upper lobe", "Lingula"], "a": 1, "e": "Right middle lobe (silhouette sign).", "t": "Silhouette sign: loss of a normal border means adjacent airspace disease. Lower lobe disease preserves the heart border."}, {"id": 83, "sec": 7, "q": "Air bronchogram indicates:", "o": ["Pleural effusion", "Pneumothorax", "Alveolar consolidation", "Pulmonary fibrosis"], "a": 2, "e": "Alveolar consolidation.", "t": "Not seen in simple effusion."}, {"id": 84, "sec": 7, "q": "Golden S sign indicates:", "o": ["Right lower lobe collapse", "Left upper lobe collapse", "Right middle lobe pneumonia", "Right upper lobe collapse caused by a central mass"], "a": 3, "e": "Right upper lobe collapse caused by a central mass.", "t": "Suspect bronchial carcinoma."}, {"id": 85, "sec": 7, "q": "Eggshell calcification of hilar nodes is characteristic of:", "o": ["Silicosis", "Asbestosis", "Sarcoidosis only", "Tuberculosis only"], "a": 0, "e": "Silicosis.", "t": "Asbestosis gives pleural plaques."}, {"id": 86, "sec": 7, "q": "Honeycombing on HRCT indicates:", "o": ["Early alveolitis", "End-stage pulmonary fibrosis", "Bronchiectasis", "Emphysema"], "a": 1, "e": "End-stage pulmonary fibrosis.", "t": "Ground-glass opacity is the EARLY sign."}, {"id": 87, "sec": 7, "q": "Tram-track sign on chest imaging suggests:", "o": ["Pulmonary oedema", "Sarcoidosis", "Bronchiectasis", "Pneumothorax"], "a": 2, "e": "Bronchiectasis.", "t": "Tram-track calcification of the cortex is Sturge-Weber (brain)."}, {"id": 88, "sec": 7, "q": "Air crescent sign suggests:", "o": ["Lung abscess", "Hydatid cyst only", "Empyema", "Aspergilloma"], "a": 3, "e": "Aspergilloma.", "t": "Fungus ball in a pre-existing cavity."}, {"id": 89, "sec": 7, "q": "Westermark sign and Hampton hump indicate:", "o": ["Pulmonary embolism", "Pneumothorax", "Pulmonary hypertension", "Pneumonia"], "a": 0, "e": "Pulmonary embolism.", "t": "Westermark = oligaemia; Hampton hump = pulmonary infarct."}, {"id": 90, "sec": 7, "q": "'Bat-wing' perihilar opacities indicate:", "o": ["Pneumocystis only", "Pulmonary oedema", "Sarcoidosis", "Miliary TB"], "a": 1, "e": "Pulmonary oedema.", "t": "Early sign of failure: cephalization (upper lobe diversion)."}, {"id": 91, "sec": 7, "q": "Steeple sign on AP neck X-ray indicates:", "o": ["Epiglottitis", "Retropharyngeal abscess", "Croup", "Foreign body"], "a": 2, "e": "Croup.", "t": "Thumb sign = epiglottitis."}, {"id": 92, "sec": 7, "q": "A 'sail sign' in an infant's chest X-ray is:", "o": ["Pneumomediastinum", "Lobar collapse", "Lymphoma", "Normal thymus"], "a": 3, "e": "Normal thymus.", "t": "A normal variant; do not label as a mass."}, {"id": 93, "sec": 7, "q": "'Egg-on-string' heart indicates:", "o": ["Transposition of the great arteries", "Tetralogy of Fallot", "TAPVR", "Coarctation"], "a": 0, "e": "Transposition of the great arteries.", "t": "Boot-shaped heart = Fallot; snowman = TAPVR."}, {"id": 94, "sec": 7, "q": "Boot-shaped heart is seen in:", "o": ["Transposition", "Tetralogy of Fallot", "TAPVR", "Ebstein anomaly"], "a": 1, "e": "Tetralogy of Fallot.", "t": "Egg-on-string = transposition."}, {"id": 95, "sec": 7, "q": "Rib notching is characteristic of:", "o": ["Tetralogy of Fallot", "Marfan syndrome", "Coarctation of the aorta", "Neurofibromatosis only"], "a": 2, "e": "Coarctation of the aorta.", "t": "Classically inferior surface of ribs 3-8."}, {"id": 96, "sec": 7, "q": "Cardiothoracic ratio indicating cardiomegaly on a PA film:", "o": ["Above 40%", "Above 60%", "Above 70%", "Above 50%"], "a": 3, "e": "Above 50%.", "t": "Not valid on AP supine films, which magnify the heart."}, {"id": 97, "sec": 7, "q": "'Water bottle' heart on chest X-ray suggests:", "o": ["Pericardial effusion", "Dilated cardiomyopathy", "Mitral stenosis", "Aortic aneurysm"], "a": 0, "e": "Pericardial effusion.", "t": "Echo is the best confirmatory test."}, {"id": 98, "sec": 7, "q": "First-line imaging for valvular heart disease:", "o": ["Cardiac MRI", "Echocardiography", "Coronary angiography", "Chest X-ray"], "a": 1, "e": "Echocardiography.", "t": "Cardiac MRI is gold standard for viability and cardiomyopathy."}, {"id": 99, "sec": 7, "q": "Gold standard for myocardial viability:", "o": ["Echocardiography", "CT coronary angiography", "Cardiac MRI", "Chest X-ray"], "a": 2, "e": "Cardiac MRI.", "t": "Coronary angiography is gold standard for coronary artery disease."}, {"id": 100, "sec": 7, "q": "Aortic dissection in a stable patient: test of choice:", "o": ["Transesophageal echo", "Chest X-ray", "MR venography", "CT angiography"], "a": 3, "e": "CT angiography.", "t": "TOE is used in UNSTABLE patients."}, {"id": 101, "sec": 7, "q": "Abdominal aortic aneurysm is defined as a diameter above:", "o": ["3 cm", "2 cm", "5 cm", "4 cm"], "a": 0, "e": "3 cm.", "t": "5.5 cm is a typical surgical threshold; the screening test is ultrasound."}, {"id": 102, "sec": 7, "q": "First-line investigation for deep vein thrombosis:", "o": ["CT venography", "Doppler ultrasound", "MRI", "Plain X-ray"], "a": 1, "e": "Doppler ultrasound.", "t": "Imaging, not D-dimer, confirms DVT."}, {"id": 103, "sec": 8, "q": "Under the rule of 3-6-9, the upper normal limits of small bowel, colon and caecum are:", "o": ["6 cm, 3 cm and 9 cm", "3 cm, 9 cm and 6 cm", "3 cm, 6 cm and 9 cm", "2 cm, 5 cm and 8 cm"], "a": 2, "e": "3 cm, 6 cm and 9 cm.", "t": "Order matters: small bowel, colon, caecum."}, {"id": 104, "sec": 8, "q": "Dilated central loops with valvulae conniventes indicate:", "o": ["Large bowel obstruction", "Paralytic ileus only", "Volvulus", "Small bowel obstruction"], "a": 3, "e": "Small bowel obstruction.", "t": "Large bowel shows peripheral loops with haustra."}, {"id": 105, "sec": 8, "q": "Rigler sign on plain abdominal film indicates:", "o": ["Pneumoperitoneum", "Pneumobilia", "Portal venous gas", "Pneumatosis"], "a": 0, "e": "Pneumoperitoneum.", "t": "Both sides of bowel wall visible."}, {"id": 106, "sec": 8, "q": "Gas under the right hemidiaphragm that looks like free air but changes with posture is:", "o": ["Rigler sign", "Chilaiditi sign", "Football sign", "Cupola sign"], "a": 1, "e": "Chilaiditi sign.", "t": "Bowel interposed between liver and diaphragm; haustra are visible."}, {"id": 107, "sec": 8, "q": "Rigler triad of gallstone ileus consists of:", "o": ["Pneumoperitoneum, ascites and gallstone", "Portal venous gas, ileus and calcification", "Pneumobilia, small bowel obstruction and ectopic gallstone", "Pneumobilia, dilated CBD and stone in gallbladder"], "a": 2, "e": "Pneumobilia, small bowel obstruction and ectopic gallstone.", "t": "Rigler SIGN and Rigler TRIAD are different."}, {"id": 108, "sec": 8, "q": "Coffee bean sign indicates:", "o": ["Caecal volvulus", "Midgut volvulus", "Toxic megacolon", "Sigmoid volvulus"], "a": 3, "e": "Sigmoid volvulus.", "t": "Whirlpool sign = midgut volvulus."}, {"id": 109, "sec": 8, "q": "Bird's beak sign on barium swallow indicates:", "o": ["Achalasia", "Oesophageal carcinoma", "Diffuse oesophageal spasm", "Peptic stricture"], "a": 0, "e": "Achalasia.", "t": "Corkscrew oesophagus = diffuse spasm."}, {"id": 110, "sec": 8, "q": "Corkscrew oesophagus is seen in:", "o": ["Achalasia", "Diffuse oesophageal spasm", "Scleroderma", "Varices"], "a": 1, "e": "Diffuse oesophageal spasm.", "t": "Achalasia = bird's beak."}, {"id": 111, "sec": 8, "q": "Serpiginous filling defects on barium swallow indicate:", "o": ["Oesophageal carcinoma", "Candidiasis", "Oesophageal varices", "Hiatus hernia"], "a": 2, "e": "Oesophageal varices.", "t": "Cobblestone or shaggy outline suggests candidiasis."}, {"id": 112, "sec": 8, "q": "A posterior pharyngeal pouch on barium swallow is:", "o": ["Killian-Jamieson", "Epiphrenic diverticulum", "Pharyngeal web", "Zenker diverticulum"], "a": 3, "e": "Zenker diverticulum.", "t": "Typically posterior, midline."}, {"id": 113, "sec": 8, "q": "Leather-bottle stomach is:", "o": ["Linitis plastica (diffuse gastric carcinoma)", "Chronic gastritis", "Achlorhydria", "Gastric lymphoma"], "a": 0, "e": "Linitis plastica (diffuse gastric carcinoma).", "t": "Look for diffuse infiltration with loss of rugae."}, {"id": 114, "sec": 8, "q": "Carman meniscus sign indicates:", "o": ["Benign gastric ulcer", "Malignant gastric ulcer", "Duodenal ulcer", "Gastric polyp"], "a": 1, "e": "Malignant gastric ulcer.", "t": "Benign ulcers project beyond the lumen (Hampton line)."}, {"id": 115, "sec": 8, "q": "Apple core lesion on barium enema indicates:", "o": ["Crohn disease", "Diverticulitis", "Colorectal carcinoma", "Ischaemic colitis"], "a": 2, "e": "Colorectal carcinoma.", "t": "Annular constricting lesion."}, {"id": 116, "sec": 8, "q": "Thumbprinting on abdominal X-ray is typical of:", "o": ["Ulcerative colitis", "Crohn disease", "Pseudomembranous colitis only", "Ischaemic colitis"], "a": 3, "e": "Ischaemic colitis.", "t": "Submucosal oedema or haemorrhage."}, {"id": 117, "sec": 8, "q": "Skip lesions with terminal ileum involvement, cobblestoning and string sign of Kantor indicate:", "o": ["Crohn disease", "Ulcerative colitis", "Ischaemic colitis", "Tuberculous colitis only"], "a": 0, "e": "Crohn disease.", "t": "UC is continuous from the rectum."}, {"id": 118, "sec": 8, "q": "Continuous colonic disease starting in the rectum with lead-pipe colon is:", "o": ["Crohn disease", "Ulcerative colitis", "Diverticulosis", "Radiation colitis"], "a": 1, "e": "Ulcerative colitis.", "t": "Loss of haustra = lead pipe."}, {"id": 119, "sec": 8, "q": "Toxic megacolon is defined by a transverse colon diameter above:", "o": ["3 cm", "9 cm", "6 cm", "12 cm"], "a": 2, "e": "6 cm.", "t": "9 cm is the caecal limit."}, {"id": 120, "sec": 8, "q": "First imaging test for suspected appendicitis in children and pregnancy:", "o": ["CT abdomen", "Plain X-ray", "MRI first", "Ultrasound"], "a": 3, "e": "Ultrasound.", "t": "Appendix: non-compressible, blind-ended, over 6 mm."}, {"id": 121, "sec": 8, "q": "Double bubble sign indicates:", "o": ["Duodenal atresia", "Jejunal atresia", "Pyloric stenosis", "Malrotation"], "a": 0, "e": "Duodenal atresia.", "t": "Associated with Down syndrome. Triple bubble = jejunal atresia."}, {"id": 122, "sec": 8, "q": "Whirlpool sign indicates:", "o": ["Sigmoid volvulus", "Midgut volvulus", "Intussusception", "Hirschsprung disease"], "a": 1, "e": "Midgut volvulus.", "t": "Coffee bean = sigmoid volvulus."}, {"id": 123, "sec": 8, "q": "Diagnostic test for malrotation with volvulus:", "o": ["Barium enema", "Plain X-ray alone", "Upper GI contrast study", "CT abdomen"], "a": 2, "e": "Upper GI contrast study.", "t": "Look for abnormal duodenojejunal flexure and corkscrew duodenum."}, {"id": 124, "sec": 8, "q": "Target (doughnut) sign on ultrasound in an infant:", "o": ["Pyloric stenosis, treated by pyloromyotomy", "Appendicitis", "Midgut volvulus", "Intussusception, treated by air enema"], "a": 3, "e": "Intussusception, treated by air enema.", "t": "Air enema is both diagnostic and therapeutic."}, {"id": 125, "sec": 8, "q": "Hypertrophic pyloric stenosis on ultrasound shows muscle thickness of:", "o": ["3 mm or more", "1 mm", "6 mm", "10 mm"], "a": 0, "e": "3 mm or more.", "t": "Appendix cut-off is 6 mm; do not mix the two."}, {"id": 126, "sec": 8, "q": "Transition zone with delayed evacuation on barium enema indicates:", "o": ["Anal atresia", "Hirschsprung disease", "Meconium ileus", "Intussusception"], "a": 1, "e": "Hirschsprung disease.", "t": "Contrast enema is done unprepared."}, {"id": 127, "sec": 8, "q": "Pneumatosis intestinalis with portal venous gas in a premature neonate:", "o": ["Malrotation", "Meconium plug", "Necrotising enterocolitis", "Hirschsprung disease"], "a": 2, "e": "Necrotising enterocolitis.", "t": "Do not confuse with adult pneumobilia."}, {"id": 128, "sec": 8, "q": "NG tube coiled in the upper pouch indicates:", "o": ["Duodenal atresia", "Hiatus hernia", "Diaphragmatic hernia", "Oesop 16, "q": "IVC filter is indicated for DVT when:", "o": ["Anticoagulation is working", "PE is absent", "Anticoagulation is contraindicated", "Patient is on warfarin"], "a": 2, "e": "Anticoagulation is contraindicated.", "t": "Not routine."}, {"id": 248, "sec": 16, "q": "Percutaneous nephrostomy is indicated for:", "o": ["Simple renal cyst", "Renal cell carcinoma", "Nephrotic syndrome", "Obstructed infected kidney (pyonephrosis)"], "a": 3, "e": "Obstructed infected kidney (pyonephrosis).", "t": "Emergency drainage."}, {"id": 249, "sec": 16, "q": "Percutaneous transhepatic cholangiography is used when:", "o": ["ERCP fails or is not possible", "MRCP is normal", "As first line for gallstones", "For pancreatic necrosis"], "a": 0, "e": "ERCP fails or is not possible.", "t": "Alternative biliary access."}, {"id": 250, "sec": 16, "q": "Small hepatocellular carcinoma (usually under 3 cm) can be treated by:", "o": ["TACE alone", "Radiofrequency ablation", "TIPS", "Vertebroplasty"], "a": 1, "e": "Radiofrequency ablation.", "t": "TACE is for intermediate-stage HCC."}, {"id": 251, "sec": 16, "q": "Intermediate-stage hepatocellular carcinoma is treated by:", "o": ["Radiofrequency ablation", "Liver transplant always", "TACE (chemoembolisation)", "Sorafenib alone"], "a": 2, "e": "TACE (chemoembolisation).", "t": "RFA is for small tumours."}, {"id": 252, "sec": 16, "q": "Vertebroplasty is used for:", "o": ["Spinal stenosis", "Disc herniation", "Scoliosis", "Painful vertebral compression fractures"], "a": 3, "e": "Painful vertebral compression fractures.", "t": "Cement injection."}, {"id": 253, "sec": 16, "q": "Before any image-guided biopsy you should check:", "o": ["INR and platelet count", "Serum amylase", "Blood glucose only", "Serum calcium"], "a": 0, "e": "INR and platelet count.", "t": "Coagulation status."}, {"id": 254, "sec": 16, "q": "Uterine artery embolisation is an alternative to surgery for:", "o": ["Endometriosis", "Symptomatic fibroids", "Ovarian cysts", "Cervical cancer"], "a": 1, "e": "Symptomatic fibroids.", "t": "Also used for postpartum haemorrhage."}, {"id": 255, "sec": 17, "q": "Which are the 4 Rs of radiobiology?", "o": ["Repair, radiosensitivity, repopulation, resistance", "Repair, recovery, redistribution, response", "Repair, repopulation, redistribution, reoxygenation", "Reoxygenation, resistance, repair, regeneration"], "a": 2, "e": "Repair, repopulation, redistribution, reoxygenation.", "t": "Radiosensitivity is the 5th R in some lists, not part of the classic 4."}, {"id": 256, "sec": 17, "q": "The most radiosensitive phase of the cell cycle:", "o": ["Late S", "G1", "G0", "G2/M"], "a": 3, "e": "G2/M.", "t": "Late S is the most resistant."}, {"id": 257, "sec": 17, "q": "Hypoxic tumours are:", "o": ["Radioresistant", "Radiosensitive", "Unaffected by oxygen", "Treated best by brachytherapy only"], "a": 0, "e": "Radioresistant.", "t": "Oxygen increases radiosensitivity."}, {"id": 258, "sec": 17, "q": "Fractionation works mainly because normal tissue has:", "o": ["Poorer repair capacity", "Better repair capacity than tumour", "Greater hypoxia", "Faster repopulation than tumour"], "a": 1, "e": "Better repair capacity than tumour.", "t": "Fractionation spares normal tissue."}, {"id": 259, "sec": 17, "q": "Typical late radiation effects are:", "o": ["Mucositis and skin erythema", "Diarrhoea", "Fibrosis and myelopathy", "Alopecia"], "a": 2, "e": "Fibrosis and myelopathy.", "t": "Early effects occur in rapidly dividing tissue."}, {"id": 260, "sec": 17, "q": "Highly radiosensitive tumours include:", "o": ["Melanoma, sarcoma and RCC", "Glioblastoma and melanoma", "Pancreatic and renal", "Seminoma, lymphoma and medulloblastoma"], "a": 3, "e": "Seminoma, lymphoma and medulloblastoma.", "t": "Melanoma, sarcoma and RCC are relatively radioresistant."}, {"id": 261, "sec": 17, "q": "Cobalt-60 emits gamma rays of:", "o": ["1.17 and 1.33 MeV", "6 and 15 MV", "0.66 MeV", "140 keV"], "a": 0, "e": "1.17 and 1.33 MeV.", "t": "Linear accelerator produces megavoltage X-rays."}, {"id": 262, "sec": 17, "q": "A commonly used brachytherapy source:", "o": ["Technetium-99m", "Iridium-192", "Cobalt-57", "Iodine-123"], "a": 1, "e": "Iridium-192.", "t": "Source is placed inside or next to the tumour."}, {"id": 263, "sec": 17, "q": "Standard palliative regimen for painful bone metastases:", "o": ["Single 2 Gy fraction", "30 Gy in 3 fractions", "Single 8 Gy fraction", "70 Gy in 35 fractions"], "a": 2, "e": "Single 8 Gy fraction.", "t": "Quick and effective."}, {"id": 264, "sec": 17, "q": "Suspected malignant spinal cord compression needs:", "o": ["Bone scan first", "Plain spine X-rays only", "Elective MRI next week", "Urgent whole-spine MRI and steroids"], "a": 3, "e": "Urgent whole-spine MRI and steroids.", "t": "Time-critical emergency."}, {"id": 265, "sec": 17, "q": "Stereotactic radiosurgery (Gamma Knife) is used for:", "o": ["Small brain lesions such as metastases and acoustic neuroma", "Large glioblastoma", "Lung cancer", "Prostate cancer"], "a": 0, "e": "Small brain lesions such as metastases and acoustic neuroma.", "t": "Single high-dose precise treatment."}, {"id": 266, "sec": 18, "q": "X-rays were discovered in 1895 by:", "o": ["Becquerel", "Hounsfield", "Roentgen", "Curie"], "a": 2, "e": "Roentgen.", "t": "Roentgen discovered X-rays in 1895."}, {"id": 267, "sec": 18, "q": "In an X-ray tube, approximately what proportion of the electron energy is converted to X-rays?", "o": ["Less than 1%", "About 10%", "About 50%", "More than 90%"], "a": 0, "e": "Less than 1%.", "t": "More than 99% is lost as heat; under 1% becomes X-rays."}, {"id": 268, "sec": 18, "q": "Which exposure factor mainly controls beam penetration and image contrast?", "o": ["mAs", "kVp", "Exposure time", "Focal spot size"], "a": 1, "e": "kVp.", "t": "kVp controls penetration and contrast (higher kVp, lower contrast); mAs controls quantity of X-rays."}, {"id": 269, "sec": 18, "q": "Which tissue appears most radiopaque (whitest) on a plain radiograph?", "o": ["Bone", "Fat", "Metal", "Soft tissue"], "a": 2, "e": "Metal.", "t": "Order of density: air, fat, soft tissue/fluid, bone, metal."}, {"id": 270, "sec": 18, "q": "The interaction that produces image contrast at low kVp and depends on Z³ is:", "o": ["Compton scatter", "Coherent scatter", "Pair production", "Photoelectric effect"], "a": 3, "e": "Photoelectric effect.", "t": "Photoelectric effect depends on Z³ (and 1/E³), giving bone–soft tissue contrast at low kVp. Compton scatter is the main source of scatter and staff dose."}, {"id": 271, "sec": 18, "q": "An anti-scatter grid has which effect?", "o": ["Improves contrast and increases patient dose", "Improves contrast and decreases patient dose", "Reduces contrast and increases dose", "Reduces contrast and decreases dose"], "a": 0, "e": "Improves contrast and increases patient dose.", "t": "Grids reduce scatter and improve contrast but need a higher dose."}, {"id": 272, "sec": 18, "q": "After time and shielding, the most effective way to reduce staff radiation exposure is:", "o": ["Increasing distance from the source", "Increasing kVp", "Using a grid", "Wearing a film badge"], "a": 0, "e": "Increasing distance from the source.", "t": "Inverse square law: intensity falls with the square of distance."}, {"id": 273, "sec": 18, "q": "The SI unit of effective (equivalent) dose is:", "o": ["Gray", "Becquerel", "Sievert", "Roentgen"], "a": 2, "e": "Sievert.", "t": "Gray = absorbed dose; Becquerel = activity."}, {"id": 274, "sec": 18, "q": "Which Hounsfield unit value is correct?", "o": ["Water = +100", "Air = -1000", "Fat = +50", "Acute blood = 0"], "a": 1, "e": "Air = -1000.", "t": "Water 0, air -1000, fat about -50 to -100, acute blood about 50-80."}, {"id": 275, "sec": 18, "q": "The best investigation for interstitial lung disease and bronchiectasis is:", "o": ["Chest X-ray", "Contrast CT chest", "HRCT", "MRI chest"], "a": 2, "e": "HRCT.", "t": "Thin-section HRCT is the test of choice."}, {"id": 276, "sec" "sec": 18, "q": "Which PET tracer is most commonly used, and what photon energy results from annihilation?", "o": ["Tc-99m, 140 keV", "I-131, 364 keV", "F-18 FDG, 511 keV", "Ga-67, 93 keV"], "a": 2, "e": "F-18 FDG, 511 keV.", "t": "F-18 half-life is about 110 minutes."}, {"id": 285, "sec": 18, "q": "The most commonly used nuclear medicine isotope is Tc-99m. Its half-life and gamma energy are:", "o": ["6 h, 140 keV", "110 min, 511 keV", "8 days, 364 keV", "3 days, 93 keV"], "a": 0, "e": "6 h, 140 keV.", "t": "Obtained from a Mo-99 generator."}, {"id": 286, "sec": 18, "q": "The scan of choice for renal cortical scarring is:", "o": ["DTPA", "MAG3", "DMSA", "HIDA"], "a": 2, "e": "DMSA.", "t": "DTPA/MAG3 assess function and obstruction."}, {"id": 287, "sec": 18, "q": "A non-filling gallbladder on a HIDA scan suggests:", "o": ["Chronic cholecystitis", "Acute cholecystitis", "Gallbladder carcinoma", "Biliary dyskinesia"], "a": 1, "e": "Acute cholecystitis.", "t": ""}, {"id": 288, "sec": 18, "q": "A child has painless rectal bleeding. Which scan localises the suspected Meckel diverticulum?", "o": ["Tc-99m pertechnetate", "Tc-99m MDP", "MIBG", "Tc-99m sestamibi"], "a": 0, "e": "Tc-99m pertechnetate.", "t": ""}, {"id": 289, "sec": 18, "q": "MIBG scan is used for:", "o": ["Parathyroid adenoma", "Pulmonary embolism", "Renal scarring", "Phaeochromocytoma and neuroblastoma"], "a": 3, "e": "Phaeochromocytoma and neuroblastoma.", "t": "Sestamibi is for parathyroid adenoma; V/Q for pulmonary embolism."}, {"id": 290, "sec": 18, "q": "On thyroid scintigraphy, which finding carries a risk of malignancy and requires US plus FNAC?", "o": ["Hot nodule", "Diffuse uptake", "Cold nodule", "Warm nodule in Graves disease"], "a": 2, "e": "Cold nodule.", "t": "A hot nodule is almost always benign."}, {"id": 291, "sec": 18, "q": "DEXA diagnosis of osteoporosis requires a T-score of:", "o": ["-1.0 or below", "-2.5 or below", "-1.0 to -2.5", "-3.5 or below"], "a": 1, "e": "-2.5 or below.", "t": "Osteopenia is -1 to -2.5."}, {"id": 292, "sec": 19, "q": "The annual dose limit for radiation workers (averaged over 5 years) is:", "o": ["1 mSv", "5 mSv", "50 mSv", "20 mSv"], "a": 3, "e": "20 mSv.", "t": "The general public limit is 1 mSv/year."}, {"id": 293, "sec": 19, "q": "Which investigation delivers the highest typical effective dose?", "o": ["Chest X-ray", "CT head", "CT chest", "CT abdomen-pelvis"], "a": 3, "e": "CT abdomen-pelvis.", "t": "About 10 mSv, versus about 7 for CT chest, 2 for CT head, 0.02-0.1 for chest X- ray."}, {"id": 294, "sec": 19, "q": "Which of the following is a stochastic effect of radiation?", "o": ["Cataract", "Skin erythema", "Epilation", "Radiation-induced cancer"], "a": 3, "e": "Radiation-induced cancer.", "t": "Stochastic effects have no threshold; deterministic effects do."}, {"id": 295, "sec": 19, "q": "Which cells are the most radiosensitive?", "o": ["Neurons", "Lymphocytes", "Muscle cells", "Hepatocytes"], "a": 1, "e": "Lymphocytes.", "t": "Bergonie and Tribondeau: dividing, undifferentiated cells are most sensitive."}, {"id": 296, "sec": 19, "q": "The fetal CNS is most radiosensitive at which gestational age?", "o": ["0-2 weeks", "8-15 weeks", "25-30 weeks", "Term"], "a": 1, "e": "8-15 weeks.", "t": "Risk is highest during organogenesis; prefer US or MRI in pregnancy."}, {"id": 297, "sec": 19, "q": "Which contrast agent is safest for intravenous use in routine CT?", "o": ["High-osmolar ionic", "Barium sulfate", "Low-osmolar non-ionic", "Gadolinium"], "a": 2, "e": "Low-osmolar non-ionic.", "t": ""}, {"id": 298, "sec": 19, "q": "The best measure to prevent contrast-induced nephropathy is:", "o": ["Oral furosemide", "IV hydration with normal saline", "Oral steroids", "Dialysis"], "a": 1, "e": "IV hydration with normal saline.", "t": "Risk factors: renal impairment, diabetes, dehydration."}, {"id": 299, "sec": 19, "q": "The first drug in a severe anaphylactic contrast reaction is:", "o": ["IV hydrocortisone", "IV chlorpheniramine", "IM adrenaline", "Nebulised salbutamol"], "a": 2, "e": "IM adrenaline.", "t": ""}, {"id": 300, "sec": 19, "q": "Nephrogenic systemic fibrosis is associated with:", "o": ["Iodinated contrast in diabetics", "Barium in renal failure", "Microbubble contrast", "Gadolinium in severe renal impairment (eGFR below 30)"], "a": 3, "e": "Gadolinium in severe renal impairment (eGFR below 30).", "t": ""}, {"id": 301, "sec": 19, "q": "If gastrointestinal perforation is suspected, the contrast of choice is:", "o": ["Barium sulfate", "Water-soluble iodinated contrast", "Gadolinium", "Air"], "a": 1, "e": "Water-soluble iodinated contrast.", "t": "Barium causes peritonitis or mediastinitis if it leaks."}, {"id": 302, "sec": 19, "q": "Which is an absolute contraindication to MRI?", "o": ["Dental amalgam", "Titanium hip prosthesis", "Cochlear implant", "Surgical sutures"], "a": 2, "e": "Cochlear implant.", "t": "Also older pacemakers, ferromagnetic aneurysm clips, metallic intra-ocular foreign bodies."}, {"id": 303, "sec": 19, "q": "Hysterosalpingography is ideally performed:", "o": ["During menstruation", "Days 6-12 of the cycle", "At ovulation", "In the luteal phase"], "a": 1, "e": "Days 6-12 of the cycle.", "t": "After menses stop and before ovulation, to avoid irradiating an early pregnancy."}, {"id": 304, "sec": 20, "q": "On a good inspiratory PA chest film, how many posterior ribs are visible above the diaphragm?", "o": ["6-7", "7-8", "11-12", "9-10"], "a": 3, "e": "9-10.", "t": "Or 5-6 anterior ribs."}, {"id": 305, "sec": 20, "q": "The normal cardiothoracic ratio on a PA film is:", "o": ["Less than 50%", "Less than 60%", "Less than 70%", "Less than 40%"], "a": 0, "e": "Less than 50%.", "t": "An AP film can falsely suggest cardiomegaly."}, {"id": 306, "sec": 20, "q": "The minimum pleural effusion detectable on a lateral decubitus film is about:", "o": ["5 mL", "50 mL", "300 mL", "500 mL"], "a": 1, "e": "50 mL.", "t": "An erect film needs about 200-300 mL."}, {"id": 307, "sec": 20, "q": "A massive pleural effusion causes the mediastinum to:", "o": ["Shift away from the effusion", "Remain central", "Shift towards the effusion", "Widen bilaterally"], "a": 0, "e": "Shift away from the effusion.", "t": "Collapse pulls the mediastinum towards the lesion; tension pneumothorax pushes away."}, {"id": 308, "sec": 20, "q": "The deep sulcus sign on a supine film indicates:", "o": ["Pleural effusion", "Pneumothorax", "Lobar collapse", "Pneumomediastinum"], "a": 1, "e": "Pneumothorax.", "t": ""}, {"id": 309, "sec": 20, "q": "Bilateral perihilar bat-wing opacities with cephalisation are seen in:", "o": ["Pulmonary oedema", "Miliary TB", "Sarcoidosis", "Silicosis"], "a": 0, "e": "Pulmonary oedema.", "t": ""}, {"id": 310, "sec": 20, "q": "Kerley B lines represent:", "o": ["Lymphatic obstruction in the upper zones", "Reticular pattern of fibrosis", "Bronchial wall thickening", "Interlobular septal thickening at the lung periphery"], "a": 3, "e": "Interlobular septal thickening at the lung periphery.", "t": "Seen in interstitial oedema; Kerley A are long upper-zone lines."}, {"id": 311, "sec": 20, "q": "Bilateral diffuse airspace opacities with a normal-sized heart are typical of:", "o": ["Cardiogenic pulmonary oedema", "ARDS", "COPD", "Pulmonary fibrosis"], "a": 1, "e": "ARDS.", "t": ""}, {"id": 312, "sec": 20, "q": "Air bronchogram is a feature of:", "o": ["Pleural effusion", "Pneumothorax", "Alveolar consolidation", "Emphysema"], "a": 2, "e": "Alveolar consolidation.", "t": ""}, {"id": 313, "sec": 20, "q": "Loss of the right heart border indicates disease in the:", "o": ["Right upper lobe", "Right middle lobe", "Right lower lobe", "Lingula"], "a": 1, "e": "Right middle lobe.", "t": "Silhouette sign: lingula obscures the left heart border; lower lobe obscures the hemidiaphragm."}, {"id": 314, "sec": 20, "q": "Numerous 1-3 mm nodules throughout both lungs suggest:", "o": ["Bronchiectasis", "Lung abscess", "Pulmonary embolism", "Miliary TB"], "a": 3, "e": "Miliary TB.", "t": "Haematogenous spread."}, {"id": 315, "sec": 20, "q": "A calcified Ghon focus with calcified hilar node is called:", "o": ["Ranke complex", "Simon focus", "Assmann focus", "Rasmussen complex"], "a": 0, "e": "Ranke complex.", "t": "Ghon focus plus nodes = Ghon complex; when calcified = Ranke complex."}, {"id": 316, "sec": 20, "q": "An air-crescent (Monod) sign with a mobile mass in a cavity is seen in:", "o": ["Hydatid cyst", "Aspergilloma", "Lung abscess", "Pulmonary TB"], "a": 1, "e": "Aspergilloma.", "t": "The CT halo sign suggests invasive aspergillosis."}, {"id": 317, "sec": 20, "q": "Garland's 1-2-3 sign is seen in:", "o": ["Tuberculosis", "Lymphoma", "Sarcoidosis", "Silicosis"], "a": 2, "e": "Sarcoidosis.", "t": "Right paratracheal plus bilateral hilar nodes."}, {"id": 318, "sec": 20, "q": "An apical lung mass with rib destruction and Horner syndrome is a:", "o": ["Pancoast tumour", "Thymoma", "Neurogenic tumour", "Aspergilloma"], "a": 0, "e": "Pancoast tumour.", "t": ""}, {"id": 319, "sec": 20, "q": "Cannonball metastases are classically associated with:", "o": ["Gastric carcinoma", "Renal cell carcinoma", "Carcinoma prostate", "Hepatocellular carcinoma"], "a": 1, "e": "Renal cell carcinoma.", "t": "Also choriocarcinoma and sarcomas."}, {"id": 320, "sec": 20, "q": "The Golden S sign indicates:", "o": ["Left lower lobe collapse", "Right middle lobe pneumonia", "Right upper lobe collapse from a central mass", "Left upper lobe collapse"], "a": 2, "e": "Right upper lobe collapse from a central mass.", "t": "The Luftsichel sign is seen in left upper lobe collapse."}, {"id": 321, "sec": 20, "q": "A wedge-shaped pleural-based opacity in pulmonary embolism is called:", "o": ["Westermark sign", "Fleischner sign", "Hampton hump", "Palla sign"], "a": 2, "e": "Hampton hump.", "t": "Westermark is focal oligaemia; Fleischner is an enlarged central pulmonary artery."}, {"id": 322, "sec": 20, "q": "The investigation of choice for pulmonary embolism is:", "o": ["CT pulmonary angiography", "Chest X-ray", "Echocardiography", "D-dimer"], "a": 0, "e": "CT pulmonary angiography.", "t": ""}, {"id": 323, "sec": 20, "q": "A widened mediastinum after blunt chest trauma should be assumed to be:", "o": ["Thymic enlargement", "Aortic injury at the isthmus until proved otherwise", "Pericardial effusion", "Lymphoma"], "a": 1, "e": "Aortic injury at the isthmus until proved otherwise.", "t": "Confirm with CT angiography."}, {"id": 324, "sec": 20, "q": "Which feature of a solitary pulmonary nodule suggests benignity?", "o": ["Spiculation", "Growth over 6 months", "Eccentric cavitation", "Popcorn calcification"], "a": 3, "e": "Popcorn calcification.", "t": "Hamartoma; stability over 2 years also suggests benignity."}, {"id": 325, "sec": 20, "q": "Calcified diaphragmatic pleural plaques indicate exposure to:", "o": ["Silica", "Coal dust", "Asbestos", "Beryllium"], "a": 2, "e": "Asbestos.", "t": "Silicosis gives upper-zone nodules and egg-shell calcification of hilar nodes."}, {"id": 326, "sec": 20, "q": "Basal subpleural honeycombing on HRCT is characteristic of:", "o": ["Sarcoidosis", "UIP / IPF", "Alveolar proteinosis", "Hypersensitivity pneumonitis"], "a": 1, "e": "UIP / IPF.", "t": ""}, {"id": 327, "sec": 20, "q": "Tree-in-bud pattern on HRCT indicates:", "o": ["Endobronchial infection such as TB", "Pulmonary oedema", "Pulmonary fibrosis", "Pulmonary haemorrhage"], "a": 0, "e": "Endobronchial infection such as TB.", "t": ""}, {"id": 328, "sec": 20, "q": "Crazy-paving pattern on HRCT is classically seen in:", "o": ["Sarcoidosis", "Asbestosis", "Pulmonary alveolar proteinosis", "Lymphangioleiomyomatosis"], "a": 2, "e": "Pulmonary alveolar proteinosis.", "t": ""}, {"id": 329, "sec": 20, "q": "Hyperinflation with flat diaphragms and more than 6 anterior ribs visible suggests:", "o": ["Pneumothorax", "COPD", "Pulmonary oedema", "Pleural effusion"], "a": 1, "e": "COPD.", "t": ""}, {"id": 330, "sec": 20, "q": "Double right heart border, splaying of the carina and a straight left heart border indicate:", "o": ["Left ventricular hypertrophy", "Pericardial effusion", "Right atrial enlargement", "Left atrial enlargement (mitral stenosis)"], "a": 3, "e": "Left atrial enlargement (mitral stenosis).", "t": ""}, {"id": 331, "sec": 20, "q": "Rib notching of the 3rd-8th ribs with a figure-of-3 sign is seen in:", "o": ["Coarctation of the aorta", "Tetralogy of Fallot", "Neurofibromatosis", "Pulmonary stenosis"], "a": 0, "e": "Coarctation of the aorta.", "t": ""}, {"id": 332, "sec": 20, "q": "The commonest congenital diaphragmatic hernia in neonates is:", "o": ["Morgagni", "Left Bochdalek", "Hiatus hernia", "Right Bochdalek"], "a": 1, "e": "Left Bochdalek.", "t": ""}, {"id": 333, "sec": 20, "q": "An inhaled foreign body most commonly lodges in the:", "o": ["Left main bronchus", "Trachea", "Right main bronchus", "Right upper lobe bronchus"], "a": 2, "e": "Right main bronchus.", "t": "Ball-valve air trapping is seen on expiratory or decubitus films."}, {"id": 334, "sec": 21, "q": "The best plain film for detecting free air under the diaphragm is:", "o": ["Supine abdominal film", "Erect chest X-ray", "Lateral decubitus abdomen", "Lateral chest film"], "a": 1, "e": "Erect chest X-ray.", "t": "CT is the most sensitive test."}, {"id": 335, "sec": 21, "q": "Visualisation of both sides of the bowel wall on a plain film is called:", "o": ["Football sign", "Cupola sign", "Falciform ligament sign", "Rigler sign"], "a": 3, "e": "Rigler sign.", "t": "A sign of pneumoperitoneum."}, {"id": 336, "sec": 21, "q": "Central dilated loops with complete valvulae conniventes and diameter above 3 cm suggest:", "o": ["Large bowel obstruction", "Small bowel obstruction", "Toxic megacolon", "Sigmoid volvulus"], "a": 1, "e": "Small bowel obstruction.", "t": "Large bowel has haustra (incomplete folds)."}, {"id": 337, "sec": 21, "q": "The caecal diameter above which perforation risk rises in large bowel obstruction is:", "o": ["3 cm", "6 cm", "9 cm", "12 cm"], "a": 2, "e": "9 cm.", "t": "Normal colon is under 6 cm."}, {"id": 338, "sec": 21, "q": "The coffee-bean sign, with the apex of the loop pointing towards the right upper quadrant, is seen in:", "o": ["Caecal volvulus", "Sigmoid volvulus", "Intussusception", "Toxic megacolon"], "a": 1, "e": "Sigmoid volvulus.", "t": "Barium enema shows a bird-beak; caecal volvulus gives a comma-shaped loop in the left upper abdomen."}, {"id": 339, "sec": 21, "q": "Gas in the bowel wall together with portal venous gas in a premature neonate indicates:", "o": ["Hirschsprung disease", "Meconium ileus", "Malrotation", "Necrotising enterocolitis"], "a": 3, "e": "Necrotising enterocolitis.", "t": "Both signs suggest ischaemia."}, {"id": 340, "sec": 21, "q": "Small bowel obstruction plus pneumobilia plus an ectopic gallstone (Rigler triad) is diagnostic of:", "o": ["Gallstone ileus", "Acute cholecystitis", "Mirizzi syndrome", "Emphysematous cholecystitis"], "a": 0, "e": "Gallstone ileus.", "t": ""}, {"id": 341, "sec": 21, "q": "A sentinel loop and colon cut-off sign are associated with:", "o": ["Acute appendicitis", "Acute pancreatitis", "Acute cholecystitis", "Crohn disease"], "a": 1, "e": "Acute pancreatitis.", "t": ""}, {"id": 342, "sec": 21, "q": "A bird-beak or rat-tail narrowing with a dilated oesophagus on barium swallow is seen in:", "o": ["Oesophageal carcinoma", "Diffuse oesophageal spasm", "Achalasia cardia", "Oesophageal varices"], "a": 2, "e": "Achalasia cardia.", "t": "Carcinoma gives apple-core or shouldering; spasm gives corkscrew oesophagus."}, {"id": 343, "sec": 21, "q": "The Carman meniscus sign on barium meal indicates:", "o": ["Benign gastric ulcer", "Gastric lymphoma", "Linitis plastica", "Malignant gastric ulcer"], "a": 3, "e": "Malignant gastric ulcer.", "t": ""}, {"id": 344, "sec": 21, "q": "A leather-bottle stomach on barium meal is characteristic of:", "o": ["Linitis plastica", "Pyloric stenosis", "Gastric volvulus", "Menetrier disease"], "a": 0, "e": "Linitis plastica.", "t": "Diffuse infiltrating carcinoma."}, {"id": 345, "sec": 21, "q": "String sign of Kantor and rose-thorn ulcers involving the terminal ileum suggest:", "o": ["Ulcerative colitis", "Intestinal TB", "Crohn disease", "Ischaemic colitis"], "a": 2, "e": "Crohn disease.", "t": "Skip lesions and cobblestone mucosa are also typical."}, {"id": 346, "sec": 21, "q": "Lead-pipe colon with loss of haustra, continuous from the rectum, is seen in:", "o": ["Crohn disease", "Ulcerative colitis", "Colorectal carcinoma", "Diverticulitis"], "a": 1, "e": "Ulcerative colitis.", "t": ""}, {"id": 347, "sec": 21, "q": "Thumbprinting of the colonic wall indicates:", "o": ["Ulcerative colitis", "Lymphoma", "Ischaemic colitis", "Hirschsprung disease"], "a": 2, "e": "Ischaemic colitis.", "t": ""}, {"id": 348, "sec": 21, "q": "A narrow aganglionic segment with a transition zone and reversed rectosigmoid ratio is seen in:", "o": ["Hirschsprung disease", "Anorectal malformation", "Meconium plug syndrome", "Ileal atresia"], "a": 0, "e": "Hirschsprung disease.", "t": ""}, {"id": 349, "sec": 21, "q": "A double-bubble sign in a neonate, associated with Down syndrome, indicates:", "o": ["Jejunal atresia", "Hypertrophic pyloric stenosis", "Duodenal atresia", "Malrotation"], "a": 2, "e": "Duodenal atresia.", "t": ""}, {"id": 350, "sec": 21, "q": "The investigation of choice for malrotation with midgut volvulus is:", "o": ["Abdominal X-ray", "Barium enema", "CT abdomen", "Upper GI contrast study"], "a": 3, "e": "Upper GI contrast study.", "t": "Corkscrew duodenum; whirlpool sign on US or CT."}, {"id": 351, "sec": 21, "q": "A target (doughnut) sign on ultrasound of a child with colicky pain and redcurrant stools is:", "o": ["Appendicitis", "Intussusception", "Pyloric stenosis", "Mesenteric adenitis"], "a": 1, "e": "Intussusception.", "t": "Treated by air or contrast enema reduction."}, {"id": 352, "sec": 21, "q": "Ultrasound criteria for hypertrophic pyloric stenosis are muscle thickness and channel length of:", "o": ["Above 3 mm and above 15 mm", "Above 1 mm and above 5 mm", "Above 6 mm and above 30 mm", "Above 10 mm and above 25 mm"], "a": 0, "e": "Above 3 mm and above 15 mm.", "t": ""}, {"id": 353, "sec": 21, "q": "The first-line imaging for suspected appendicitis in children and pregnant women is:", "o": ["CT abdomen", "Barium enema", "Ultrasound", "Plain X-ray"], "a": 2, "e": "Ultrasound.", "t": "Non-compressible blind-ending tube above 6 mm. CT is preferred in adults."}, {"id": 354, "sec": 21, "q": "Which ultrasound finding supports acute cholecystitis?", "o": ["Wall thickness under 2 mm", "Collapsed gallbladder", "Wall calcification", "Wall thickening above 3 mm with sonographic Murphy sign"], "a": 3, "e": "Wall thickening above 3 mm with sonographic Murphy sign.", "t": "Wall calcification is porcelain gallbladder (carcinoma risk)."}, {"id": 355, "sec": 21, "q": "The normal upper limit of the common bile duct on ultrasound is:", "o": ["2 mm", "6 mm", "10 mm", "13 mm"], "a": 1, "e": "6 mm.", "t": "Portal vein up to 13 mm; spleen up to 12 cm."}, {"id": 356, "sec": 21, "q": "An abdominal aortic diameter of what size defines an aneurysm?", "o": ["2 cm or more", "2.5 cm or more", "3 cm or more", "5 cm or more"], "a": 2, "e": "3 cm or more.", "t": ""}, {"id": 357, "sec": 21, "q": "A dilated common bile duct plus dilated pancreatic duct (double-duct sign) suggests:", "o": ["Choledocholithiasis", "Primary sclerosing cholangitis", "Chronic pancreatitis", "Carcinoma of the pancreatic head or periampullary tumour"], "a": 3, "e": "Carcinoma of the pancreatic head or periampullary tumour.", "t": ""}, {"id": 358, "sec": 21, "q": "Contrast CT is best for assessing complications of acute pancreatitis (necrosis, pseudocyst) at about:", "o": ["6 hours", "24 hours", "72 hours", "2 weeks"], "a": 2, "e": "72 hours.", "t": "Balthazar score."}, {"id": 359, "sec": 21, "q": "Peripheral nodular enhancement with centripetal fill-in on a liver scan suggests:"
