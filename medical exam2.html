"sourceNo":2334,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"Unilateral serous otitis media in an adult may be a presentation of:","options":{"A":"Juvenile nasopharyngeal angiofibroma","B":"Antrochoanal polyp","C":"Allergic rhinitis","D":"Nasopharyngeal carcinoma"},"answer":"D","answerText":"Nasopharyngeal carcinoma","explanation":"2334. Nasopharyngeal carcinoma: May present with unilateral serous otitis media due to Eustachian tube obstruction."},{"id":68,"sourceNo":2335,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"A recurrent epistaxis in an adolescent male suggests:","options":{"A":"Juvenile nasopharyngeal angiofibroma","B":"Antrochoanal polyp","C":"Nasopharyngeal carcinoma","D":"Allergic rhinitis"},"answer":"A","answerText":"Juvenile nasopharyngeal angiofibroma","explanation":"2335. Juvenile nasopharyngeal angiofibroma: Typically affects adolescent males and causes recurrent epistaxis."},{"id":69,"sourceNo":2336,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"Biopsy of a suspected juvenile nasopharyngeal angiofibroma should be avoided because of:","options":{"A":"Risk of CSF leak","B":"Risk of severe hemorrhage","C":"Risk of facial nerve injury","D":"Risk of seeding malignancy"},"answer":"B","answerText":"Risk of severe hemorrhage","explanation":"2336. Biopsy of suspected juvenile nasopharyngeal angiofibroma: Should be avoided because of the risk of severe hemorrhage."},{"id":70,"sourceNo":2337,"subject":"Ear, Nose and Throat (ENT)","topic":"Oral Cavity, Pharynx and Tonsils","question":"Acute tonsillitis is commonly caused by:","options":{"A":"Staphylococcus epidermidis","B":"Klebsiella pneumoniae","C":"Group A beta-hemolytic Streptococcus","D":"Pseudomonas aeruginosa"},"answer":"C","answerText":"Group A beta-hemolytic Streptococcus","explanation":"2337. Acute tonsillitis: Commonly caused by group A beta-hemolytic Streptococcus."},{"id":71,"sourceNo":2338,"subject":"Ear, Nose and Throat (ENT)","topic":"Oral Cavity, Pharynx and Tonsils","question":"Another name for peritonsillar abscess is:","options":{"A":"Vincent angina","B":"Ludwig angina","C":"Quinsy","D":"Retropharyngeal abscess"},"answer":"C","answerText":"Quinsy","explanation":"2338. Peritonsillar abscess: Also called quinsy."},{"id":72,"sourceNo":2339,"subject":"Ear, Nose and Throat (ENT)","topic":"Oral Cavity, Pharynx and Tonsils","question":"Unilateral sore throat, trismus, muffled voice and uvular deviation away from the affected side suggest:","options":{"A":"Quinsy","B":"Acute epiglottitis","C":"Ludwig angina","D":"Retropharyngeal abscess"},"answer":"A","answerText":"Quinsy","explanation":"2339. Quinsy: Presents with unilateral sore throat, trismus, muffled voice and uvular deviation away from the affected side."},{"id":73,"sourceNo":2340,"subject":"Ear, Nose and Throat (ENT)","topic":"Oral Cavity, Pharynx and Tonsils","question":"Retropharyngeal abscess is more common in:","options":{"A":"Adult smokers","B":"Young children","C":"Adolescents","D":"Elderly"},"answer":"B","answerText":"Young children","explanation":"2340. Retropharyngeal abscess: More common in young children."},{"id":74,"sourceNo":2341,"subject":"Ear, Nose and Throat (ENT)","topic":"Oral Cavity, Pharynx and Tonsils","question":"Fever, dysphagia, neck stiffness and airway obstruction in a young child suggest:","options":{"A":"Acute tonsillitis","B":"Ludwig angina","C":"Retropharyngeal abscess","D":"Quinsy"},"answer":"C","answerText":"Retropharyngeal abscess","explanation":"2341. Retropharyngeal abscess: Can cause fever, dysphagia, neck stiffness and airway obstruction."},{"id":75,"sourceNo":2342,"subject":"Ear, Nose and Throat (ENT)","topic":"Oral Cavity, Pharynx and Tonsils","question":"A rapidly spreading cellulitis of the submandibular and sublingual spaces is:","options":{"A":"Vincent angina","B":"Retropharyngeal abscess","C":"Quinsy","D":"Ludwig angina"},"answer":"D","answerText":"Ludwig angina","explanation":"2342. Ludwig angina: A rapidly spreading cellulitis of the submandibular and sublingual spaces."},{"id":76,"sourceNo":2343,"subject":"Ear, Nose and Throat (ENT)","topic":"Oral Cavity, Pharynx and Tonsils","question":"Ludwig angina commonly originates from:","options":{"A":"Parotitis","B":"Acute tonsillitis","C":"An infected mandibular molar","D":"A maxillary premolar"},"answer":"C","answerText":"An infected mandibular molar","explanation":"2343. Ludwig angina: Commonly originates from an infected mandibular molar."},{"id":77,"sourceNo":2344,"subject":"Ear, Nose and Throat (ENT)","topic":"Oral Cavity, Pharynx and Tonsils","question":"A potentially malignant white oral mucosal lesion is:","options":{"A":"Candidiasis that wipes off","B":"Geographic tongue","C":"Aphthous ulcer","D":"Leukoplakia"},"answer":"D","answerText":"Leukoplakia","explanation":"2344. Oral leukoplakia: A potentially malignant white oral mucosal lesion."},{"id":78,"sourceNo":2345,"subject":"Ear, Nose and Throat (ENT)","topic":"Oral Cavity, Pharynx and Tonsils","question":"Compared with leukoplakia, erythroplakia has:","options":{"A":"A lower risk of malignancy","B":"No malignant potential","C":"A higher risk of dysplasia or malignancy","D":"Identical risk"},"answer":"C","answerText":"A higher risk of dysplasia or malignancy","explanation":"2345. Erythroplakia: Higher risk of dysplasia or malignancy than leukoplakia."},{"id":79,"sourceNo":2346,"subject":"Ear, Nose and Throat (ENT)","topic":"Oral Cavity, Pharynx and Tonsils","question":"The most common malignancy of the oral cavity is:","options":{"A":"Basal cell carcinoma","B":"Mucoepidermoid carcinoma","C":"Squamous cell carcinoma","D":"Adenocarcinoma"},"answer":"C","answerText":"Squamous cell carcinoma","explanation":"2346. Squamous cell carcinoma: The most common malignancy of the oral cavity."},{"id":80,"sourceNo":2347,"subject":"Ear, Nose and Throat (ENT)","topic":"Oral Cavity, Pharynx and Tonsils","question":"Which virus type is associated with oropharyngeal squamous cell carcinoma?","options":{"A":"HPV-6","B":"HPV-16","C":"HSV-2","D":"EBV"},"answer":"B","answerText":"HPV-16","explanation":"2347. Human papillomavirus, particularly HPV-16: Associated with oropharyngeal squamous cell carcinoma."},{"id":81,"sourceNo":2348,"subject":"Ear, Nose and Throat (ENT)","topic":"Larynx and Airway Disorders","question":"The larynx is supplied by the superior and recurrent laryngeal nerves, which are branches of the:","options":{"A":"Accessory nerve","B":"Vagus nerve","C":"Glossopharyngeal nerve","D":"Hypoglossal nerve"},"answer":"B","answerText":"Vagus nerve","explanation":"2348. The larynx: Supplied by the superior and recurrent laryngeal nerves, branches of the vagus nerve."},{"id":82,"sourceNo":2349,"subject":"Ear, Nose and Throat (ENT)","topic":"Larynx and Airway Disorders","question":"The recurrent laryngeal nerve supplies all intrinsic laryngeal muscles except the:","options":{"A":"Posterior cricoarytenoid","B":"Cricothyroid","C":"Thyroarytenoid","D":"Lateral cricoarytenoid"},"answer":"B","answerText":"Cricothyroid","explanation":"2349. The recurrent laryngeal nerve: Supplies all intrinsic muscles of the larynx except the cricothyroid."},{"id":83,"sourceNo":2350,"subject":"Ear, Nose and Throat (ENT)","topic":"Larynx and Airway Disorders","question":"The cricothyroid muscle is supplied by the:","options":{"A":"Glossopharyngeal nerve","B":"Internal branch of the superior laryngeal nerve","C":"Recurrent laryngeal nerve","D":"External branch of the superior laryngeal nerve"},"answer":"D","answerText":"External branch of the superior laryngeal nerve","explanation":"2350. The external branch of the superior laryngeal nerve: Supplies the cricothyroid muscle."},{"id":84,"sourceNo":2351,"subject":"Ear, Nose and Throat (ENT)","topic":"Larynx and Airway Disorders","question":"Unilateral recurrent laryngeal nerve injury commonly causes:","options":{"A":"Aphonia with aspiration only","B":"Severe stridor","C":"Dysphagia without voice change","D":"Hoarseness"},"answer":"D","answerText":"Hoarseness","explanation":"2351. Unilateral recurrent laryngeal nerve injury: Commonly causes hoarseness."},{"id":85,"sourceNo":2352,"subject":"Ear, Nose and Throat (ENT)","topic":"Larynx and Airway Disorders","question":"Bilateral recurrent laryngeal nerve injury may cause:","options":{"A":"Mild hoarseness only","B":"Isolated loss of high-pitched voice","C":"Severe airway obstruction","D":"Normal voice"},"answer":"C","answerText":"Severe airway obstruction","explanation":"2352. Bilateral recurrent laryngeal nerve injury: May cause severe airway obstruction."},{"id":86,"sourceNo":2353,"subject":"Ear, Nose and Throat (ENT)","topic":"Larynx and Airway Disorders","question":"Vocal cord nodules are commonly associated with:","options":{"A":"Vocal abuse and are usually bilateral","B":"HPV and are multiple","C":"Smoking and are always unilateral","D":"Reflux and are always unilateral"},"answer":"A","answerText":"Vocal abuse and are usually bilateral","explanation":"2353. Vocal cord nodules: Commonly associated with vocal abuse and are usually bilateral."},{"id":87,"sourceNo":2354,"subject":"Ear, Nose and Throat (ENT)","topic":"Larynx and Airway Disorders","question":"Vocal cord polyps are commonly associated with:","options":{"A":"Smoking and vocal abuse","B":"Hypothyroidism only","C":"Congenital anomalies","D":"Viral infection only"},"answer":"A","answerText":"Smoking and vocal abuse","explanation":"2354. Vocal cord polyps: Commonly associated with smoking and vocal abuse."},{"id":88,"sourceNo":2355,"subject":"Ear, Nose and Throat (ENT)","topic":"Larynx and Airway Disorders","question":"Chronic throat clearing, cough and hoarseness may be caused by:","options":{"A":"Quinsy","B":"Vocal cord paralysis","C":"Laryngopharyngeal reflux","D":"Acute epiglottitis"},"answer":"C","answerText":"Laryngopharyngeal reflux","explanation":"2355. Laryngopharyngeal reflux: Can cause chronic throat clearing, cough and hoarseness."},{"id":89,"sourceNo":2356,"subject":"Ear, Nose and Throat (ENT)","topic":"Larynx and Airway Disorders","question":"Laryngeal carcinoma, especially glottic, commonly presents with:","options":{"A":"Unilateral otitis media","B":"Throat pain only","C":"Persistent hoarseness","D":"Acute stridor in childhood"},"answer":"C","answerText":"Persistent hoarseness","explanation":"2356. Laryngeal carcinoma: Commonly presents with persistent hoarseness, especially when involving the glottis."},{"id":90,"sourceNo":2357,"subject":"Ear, Nose and Throat (ENT)","topic":"Larynx and Airway Disorders","question":"Major risk factors for laryngeal squamous cell carcinoma are:","options":{"A":"Smoking and alcohol","B":"Asthma and allergy","C":"Reflux only","D":"Vocal abuse only"},"answer":"A","answerText":"Smoking and alcohol","explanation":"2357. Smoking and alcohol: Major risk factors for laryngeal squamous cell carcinoma."},{"id":91,"sourceNo":2358,"subject":"Ear, Nose and Throat (ENT)","topic":"Larynx and Airway Disorders","question":"Stridor indicates:","options":{"A":"Pleural effusion","B":"Upper airway obstruction","C":"Small airway obstruction","D":"Pulmonary edema"},"answer":"B","answerText":"Upper airway obstruction","explanation":"2358. Stridor: Indicates upper airway obstruction and requires urgent assessment."},{"id":92,"sourceNo":2359,"subject":"Ear, Nose and Throat (ENT)","topic":"Larynx and Airway Disorders","question":"Drooling, dysphagia, fever and inspiratory stridor suggest:","options":{"A":"Vocal cord nodules","B":"Laryngomalacia","C":"Acute epiglottitis","D":"Quinsy"},"answer":"C","answerText":"Acute epiglottitis","explanation":"2359. Acute epiglottitis: Can present with drooling, dysphagia, fever and inspiratory stridor."},{"id":93,"sourceNo":2360,"subject":"Ear, Nose and Throat (ENT)","topic":"Larynx and Airway Disorders","question":"Tracheostomy may be required in:","options":{"A":"Uncomplicated tonsillitis","B":"Allergic rhinitis","C":"All patients with hoarseness","D":"Selected patients with severe upper airway obstruction"},"answer":"D","answerText":"Selected patients with severe upper airway obstruction","explanation":"2360. Tracheostomy: May be required in selected patients with severe upper airway obstruction."},{"id":94,"sourceNo":2361,"subject":"Ear, Nose and Throat (ENT)","topic":"Head and Neck Tumors and ENT Emergencies","question":"The most common site of salivary gland tumors is the:","options":{"A":"Sublingual gland","B":"Minor salivary glands","C":"Parotid gland","D":"Submandibular gland"},"answer":"C","answerText":"Parotid gland","explanation":"2361. Parotid gland: The most common site of salivary gland tumors."},{"id":95,"sourceNo":2362,"subject":"Ear, Nose and Throat (ENT)","topic":"Head and Neck Tumors and ENT Emergencies","question":"The most common benign salivary gland tumor is:","options":{"A":"Basal cell adenoma","B":"Oncocytoma","C":"Warthin tumor","D":"Pleomorphic adenoma"},"answer":"D","answerText":"Pleomorphic adenoma","explanation":"2362. Pleomorphic adenoma: The most common benign salivary gland tumor."},{"id":96,"sourceNo":2363,"subject":"Ear, Nose and Throat (ENT)","topic":"Head and Neck Tumors and ENT Emergencies","question":"Which parotid tumor is associated with smoking?","options":{"A":"Acinic cell carcinoma","B":"Pleomorphic adenoma","C":"Adenoid cystic carcinoma","D":"Warthin tumor"},"answer":"D","answerText":"Warthin tumor","explanation":"2363. Warthin tumor: Associated with smoking and commonly affects the parotid gland."},{"id":97,"sourceNo":2364,"subject":"Ear, Nose and Throat (ENT)","topic":"Head and Neck Tumors and ENT Emergencies","question":"An important complication of parotid surgery is injury to the:","options":{"A":"Hypoglossal nerve","B":"Glossopharyngeal nerve","C":"Facial nerve","D":"Vagus nerve"},"answer":"C","answerText":"Facial nerve","explanation":"2364. Facial nerve injury: An important complication of parotid surgery."},{"id":98,"sourceNo":2365,"subject":"Ear, Nose and Throat (ENT)","topic":"Head and Neck Tumors and ENT Emergencies","question":"A midline neck swelling that moves with swallowing and tongue protrusion is a:","options":{"A":"Dermoid cyst","B":"Branchial cyst","C":"Thyroglossal duct cyst","D":"Cystic hygroma"},"answer":"C","answerText":"Thyroglossal duct cyst","explanation":"2365. Thyroglossal duct cyst: Typically presents as a midline neck swelling that moves with swallowing and tongue protrusion."},{"id":99,"sourceNo":2366,"subject":"Ear, Nose and Throat (ENT)","topic":"Head and Neck Tumors and ENT Emergencies","question":"A lateral neck swelling along the anterior border of the sternocleidomastoid is typically a:","options":{"A":"Thyroglossal duct cyst","B":"Ranula","C":"Branchial cyst","D":"Dermoid cyst"},"answer":"C","answerText":"Branchial cyst","explanation":"2366. Branchial cyst: Commonly presents as a lateral neck swelling along the anterior border of the sternocleidomastoid muscle."},{"id":100,"sourceNo":2367,"subject":"Ear, Nose and Throat (ENT)","topic":"Head and Neck Tumors and ENT Emergencies","question":"A persistent adult neck mass, especially with risk factors, must be evaluated for:","options":{"A":"Muscle spasm","B":"Allergy","C":"Malignancy","D":"Vitamin deficiency"},"answer":"C","answerText":"Malignancy","explanation":"2367. A neck mass in an adult, particularly if persistent or associated with risk factors: Must be evaluated for malignancy."},{"id":101,"sourceNo":2368,"subject":"Emergency Medicine and Critical Care","topic":"Initial Assessment and Resuscitation","question":"ABCDE in primary survey stands for:","options":{"A":"Assessment, Breathing, Consciousness, Disability, ECG","B":"Airway, Bleeding, Cardiac, Disability, Extremities","C":"Airway, Blood pressure, Circulation, Drugs, Examination","D":"Airway, Breathing, Circulation, Disability, Exposure"},"answer":"D","answerText":"Airway, Breathing, Circulation, Disability, Exposure","explanation":"2368. ABCDE: Stands for Airway, Breathing, Circulation, Disability and Exposure."},{"id":102,"sourceNo":2369,"subject":"Emergency Medicine and Critical Care","topic":"Initial Assessment and Resuscitation","question":"The first priority in an unstable patient is:","options":{"A":"Circulation","B":"Exposure","C":"Disability","D":"Airway assessment"},"answer":"D","answerText":"Airway assessment","explanation":"2369. First priority in an unstable patient: Airway assessment."},{"id":103,"sourceNo":2370,"subject":"Emergency Medicine and Critical Care","topic":"Initial Assessment and Resuscitation","question":"In suspected traumatic spinal injury, which must be ensured during airway care?","options":{"A":"Removal of all immobilisation","B":"Neck hyperextension","C":"Cervical spine protection","D":"Head-tilt chin-lift"},"answer":"C","answerText":"Cervical spine protection","explanation":"2370. Suspected traumatic spinal injury: Cervical spine protection is essential."},{"id":104,"sourceNo":2371,"subject":"Emergency Medicine and Critical Care","topic":"Initial Assessment and Resuscitation","question":"The Glasgow Coma Scale assesses:","options":{"A":"Eye, pupil and verbal response","B":"Pupils, reflexes and motor response","C":"Eye, verbal and motor responses","D":"Verbal, motor and brainstem reflexes"},"answer":"C","answerText":"Eye, verbal and motor responses","explanation":"2371. Glasgow Coma Scale: Assesses eye, verbal and motor responses."},{"id":105,"sourceNo":2372,"subject":"Emergency Medicine and Critical Care","topic":"Initial Assessment and Resuscitation","question":"The maximum GCS score is:","options":{"A":"15","B":"14","C":"12","D":"10"},"answer":"A","answerText":"15","explanation":"2372. Maximum GCS score: 15."},{"id":106,"sourceNo":2373,"subject":"Emergency Medicine and Critical Care","topic":"Initial Assessment and Resuscitation","question":"A GCS of 8 or less generally indicates:","options":{"A":"Mild injury needing observation only","B":"Brain death","C":"Severe brain injury and need for urgent airway assessment","D":"Moderate injury needing no intervention"},"answer":"C","answerText":"Severe brain injury and need for urgent airway assessment","explanation":"2373. GCS score of 8 or less: Generally indicates severe brain injury and need for urgent airway assessment."},{"id":107,"sourceNo":2374,"subject":"Emergency Medicine and Critical Care","topic":"Initial Assessment and Resuscitation","question":"Major preventable causes of secondary brain injury are:","options":{"A":"Hypoglycemia and hypertension","B":"Hypoxia and hypotension","C":"Hypernatremia and hypothermia","D":"Hypertension and hyperoxia"},"answer":"B","answerText":"Hypoxia and hypotension","explanation":"2374. Major preventable causes of secondary brain injury: Hypoxia and hypotension."},{"id":108,"sourceNo":2375,"subject":"Emergency Medicine and Critical Care","topic":"Initial Assessment and Resuscitation","question":"Pulse oximetry measures:","options":{"A":"Arterial carbon dioxide","B":"Peripheral oxygen saturation, not ventilation","C":"Adequacy of ventilation","D":"PaO2 directly"},"answer":"B","answerText":"Peripheral oxygen saturation, not ventilation","explanation":"2375. Pulse oximetry: Measures peripheral oxygen saturation, not ventilation."},{"id":109,"sourceNo":2376,"subject":"Emergency Medicine and Critical Care","topic":"Initial Assessment and Resuscitation","question":"Normal end-tidal CO2 is approximately:","options":{"A":"35–45 mmHg","B":"50–60 mmHg","C":"20–25 mmHg","D":"60–70 mmHg"},"answer":"A","answerText":"35–45 mmHg","explanation":"2376. Normal end-tidal CO₂: Approximately 35–45 mmHg."},{"id":110,"sourceNo":2377,"subject":"Emergency Medicine and Critical Care","topic":"Initial Assessment and Resuscitation","question":"In major trauma, vascular access is commonly established with:","options":{"A":"Oral fluids","B":"Two large-bore IV cannulas","C":"A central line only","D":"A single 22G cannula"},"answer":"B","answerText":"Two large-bore IV cannulas","explanation":"2377. Major trauma: Two large-bore IV cannulas are commonly used."},{"id":111,"sourceNo":2378,"subject":"Emergency Medicine and Critical Care","topic":"Initial Assessment and Resuscitation","question":"In altered consciousness, which bedside test should be done early?","options":{"A":"CSF analysis","B":"Thyroid function","C":"Blood glucose","D":"Serum ammonia"},"answer":"C","answerText":"Blood glucose","explanation":"2378. Altered consciousness: Bedside blood glucose should be checked early."},{"id":112,"sourceNo":2379,"subject":"Emergency Medicine and Critical Care","topic":"Initial Assessment and Resuscitation","question":"Which is a rapidly reversible cause of altered mental status?","options":{"A":"Cerebral infarct","B":"Glioblastoma","C":"Diffuse axonal injury","D":"Hypoglycemia"},"answer":"D","answerText":"Hypoglycemia","explanation":"2379. Hypoglycemia: A reversible cause of altered mental status."},{"id":113,"sourceNo":2380,"subject":"Emergency Medicine and Critical Care","topic":"Initial Assessment and Resuscitation","question":"Defibrillation is indicated for:","options":{"A":"Ventricular fibrillation and pulseless VT","B":"Sinus bradycardia","C":"Stable SVT","D":"Asystole and PEA"},"answer":"A","answerText":"Ventricular fibrillation and pulseless VT","explanation":"2380. Defibrillation: Indicated for ventricular fibrillation and pulseless ventricular tachycardia."},{"id":114,"sourceNo":2381,"subject":"Emergency Medicine and Critical Care","topic":"Initial Assessment and Resuscitation","question":"Synchronized cardioversion is used for:","options":{"A":"Selected unstable tachyarrhythmias with a pulse","B":"Ventricular fibrillation","C":"Pulseless electrical activity","D":"Asystole"},"answer":"A","answerText":"Selected unstable tachyarrhythmias with a pulse","explanation":"2381. Synchronized cardioversion: Used for selected unstable tachyarrhythmias with a pulse."},{"id":115,"sourceNo":2382,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Shock is best defined as:","options":{"A":"Loss of consciousness","B":"Tachycardia with fever","C":"Systolic BP below 90 mmHg only","D":"Inadequate tissue perfusion and oxygen delivery"},"answer":"D","answerText":"Inadequate tissue perfusion and oxygen delivery","explanation":"2382. Shock: A state of inadequate tissue perfusion and oxygen delivery."},{"id":116,"sourceNo":2383,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"The four major types of shock are:","options":{"A":"Hemorrhagic, septic, anaphylactic and metabolic","B":"Hypovolemic, cardiogenic, neurogenic and anaphylactic","C":"Septic, cardiogenic, neurogenic and obstructive","D":"Hypovolemic, cardiogenic, distributive and obstructive"},"answer":"D","answerText":"Hypovolemic, cardiogenic, distributive and obstructive","explanation":"2383. Four major types of shock: Hypovolemic, cardiogenic, distributive and obstructive."},{"id":117,"sourceNo":2384,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"A common cause of hypovolemic shock is:","options":{"A":"Pulmonary embolism","B":"Hemorrhage","C":"Sepsis","D":"Myocardial infarction"},"answer":"B","answerText":"Hemorrhage","explanation":"2384. Hemorrhage: A common cause of hypovolemic shock."},{"id":118,"sourceNo":2385,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"A common cause of cardiogenic shock is:","options":{"A":"Tension pneumothorax","B":"Hemorrhage","C":"Sepsis","D":"Myocardial infarction"},"answer":"D","answerText":"Myocardial infarction","explanation":"2385. Myocardial infarction: A common cause of cardiogenic shock."},{"id":119,"sourceNo":2386,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"A common cause of distributive shock is:","options":{"A":"Myocardial infarction","B":"Cardiac tamponade","C":"Sepsis","D":"Hemorrhage"},"answer":"C","answerText":"Sepsis","explanation":"2386. Sepsis: A common cause of distributive shock."},{"id":120,"sourceNo":2387,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Cardiac tamponade causes which type of shock?","options":{"A":"Hypovolemic","B":"Cardiogenic","C":"Obstructive","D":"Distributive"},"answer":"C","answerText":"Obstructive","explanation":"2387. Cardiac tamponade: A cause of obstructive shock."},{"id":121,"sourceNo":2388,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Massive pulmonary embolism can cause which type of shock?","options":{"A":"Obstructive","B":"Hypovolemic","C":"Distributive","D":"Neurogenic"},"answer":"A","answerText":"Obstructive","explanation":"2388. Pulmonary embolism: Can cause obstructive shock."},{"id":122,"sourceNo":2389,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Early septic shock may present with:","options":{"A":"Warm extremities and bounding pulses","B":"Cold clammy skin and thready pulse","C":"Pallor with narrow pulse pressure only","D":"Raised JVP and muffled heart sounds"},"answer":"A","answerText":"Warm extremities and bounding pulses","explanation":"2389. Early septic shock: May present with warm extremities and bounding pulses."},{"id":123,"sourceNo":2390,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Elevated lactate in shock can indicate:","options":{"A":"Renal tubular acidosis","B":"Tissue hypoperfusion","C":"Hepatic synthetic function","D":"Hyperglycemia"},"answer":"B","answerText":"Tissue hypoperfusion","explanation":"2390. Lactate elevation: Can indicate tissue hypoperfusion."},{"id":124,"sourceNo":2391,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Persistent hypotension in septic shock requires:","options":{"A":"Diuretics","B":"Oral antibiotics","C":"Antipyretics alone","D":"Urgent fluid assessment and vasopressor support"},"answer":"D","answerText":"Urgent fluid assessment and vasopressor support","explanation":"2391. Persistent hypotension in septic shock: Requires urgent fluid assessment and vasopressor support."},{"id":125,"sourceNo":2392,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"The first-line vasopressor in septic shock is:","options":{"A":"Dopamine","B":"Dobutamine","C":"Phenylephrine","D":"Noradrenaline"},"answer":"D","answerText":"Noradrenaline","explanation":"2392. First-line vasopressor in septic shock: Noradrenaline."},{"id":126,"sourceNo":2393,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Initial crystalloid resuscitation in sepsis should be:","options":{"A":"Individualized and reassessed frequently","B":"A fixed 5-litre bolus for all","C":"Withheld in all patients","D":"Colloid only"},"answer":"A","answerText":"Individualized and reassessed frequently","explanation":"2393. Initial crystalloid resuscitation in sepsis: Should be individualized and reassessed frequently."},{"id":127,"sourceNo":2394,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Mean arterial pressure is approximately:","options":{"A":"SBP + DBP","B":"DBP + one-half pulse pressure","C":"DBP + one-third pulse pressure","D":"SBP − one-third pulse pressure"},"answer":"C","answerText":"DBP + one-third pulse pressure","explanation":"2394. Mean arterial pressure: Approximately estimated as DBP + one-third pulse pressure."},{"id":128,"sourceNo":2395,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"The commonly used initial MAP target in septic shock is:","options":{"A":"50 mmHg","B":"80 mmHg","C":"90 mmHg","D":"65 mmHg"},"answer":"D","answerText":"65 mmHg","explanation":"2395. Commonly used initial MAP target in septic shock: 65 mmHg."},{"id":129,"sourceNo":2396,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Massive hemorrhage requires:","options":{"A":"Crystalloid alone","B":"Large-volume colloid","C":"Hemorrhage control and balanced blood component resuscitation","D":"Vasopressors alone"},"answer":"C","answerText":"Hemorrhage control and balanced blood component resuscitation","explanation":"2396. Massive hemorrhage: Requires hemorrhage control and balanced blood component resuscitation."},{"id":130,"sourceNo":2397,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Tranexamic acid in major trauma is most beneficial when given:","options":{"A":"Early","B":"Only after massive transfusion is complete","C":"After definitive surgery","D":"After 24 hours"},"answer":"A","answerText":"Early","explanation":"2397. Tranexamic acid: Most beneficial when administered early in selected major trauma patients."},{"id":131,"sourceNo":2398,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"The lethal triad of trauma is:","options":{"A":"Hypothermia, acidosis and coagulopathy","B":"Hypotension, hypothermia and hypoglycemia","C":"Hypothermia, hypocalcemia and hypoxia","D":"Acidosis, hypoxia and hypotension"},"answer":"A","answerText":"Hypothermia, acidosis and coagulopathy","explanation":"2398. Lethal triad of trauma: Hypothermia, acidosis and coagulopathy."},{"id":132,"sourceNo":2399,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Permissive hypotension may be considered in:","options":{"A":"Septic shock","B":"Traumatic brain injury","C":"Cardiogenic shock","D":"Selected bleeding trauma patients without traumatic brain injury"},"answer":"D","answerText":"Selected bleeding trauma patients without traumatic brain injury","explanation":"2399. Permissive hypotension: May be considered in selected bleeding trauma patients without traumatic brain injury."},{"id":133,"sourceNo":2400,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Cardiogenic shock may require:","options":{"A":"Diuretics only","B":"Large fluid boluses","C":"Universal thrombolysis","D":"Inotropes, vasopressors or mechanical circulatory support"},"answer":"D","answerText":"Inotropes, vasopressors or mechanical circulatory support","explanation":"2400. Cardiogenic shock: May require inotropes, vasopressors or mechanical circulatory support."},{"id":134,"sourceNo":2401,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Beck's triad consists of:","options":{"A":"Hypotension, tracheal deviation and hyper-resonance","B":"Hypotension, bradycardia and warm peripheries","C":"Hypotension, raised JVP and muffled heart sounds","D":"Hypertension, bradycardia and irregular respiration"},"answer":"C","answerText":"Hypotension, raised JVP and muffled heart sounds","explanation":"2401. Beck’s triad: Hypotension, raised JVP and muffled heart sounds."},{"id":135,"sourceNo":2402,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Sepsis-associated organ dysfunction requires:","options":{"A":"Prompt recognition, antimicrobials, source control and hemodynamic support","B":"Antipyretics alone","C":"Steroids alone","D":"Watchful waiting"},"answer":"A","answerText":"Prompt recognition, antimicrobials, source control and hemodynamic support","explanation":"2402. Sepsis-associated organ dysfunction: Requires prompt recognition, antimicrobial treatment, source control and hemodynamic support."},{"id":136,"sourceNo":2403,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Hypovolemic shock results from:","options":{"A":"Outflow obstruction","B":"Failure of cardiac pump","C":"Widespread vasodilation","D":"Loss of circulating blood or fluid volume"},"answer":"D","answerText":"Loss of circulating blood or fluid volume","explanation":"2403. Hypovolemic shock: Results from loss of circulating blood or fluid volume."},{"id":137,"sourceNo":2404,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Hemorrhagic shock is a form of:","options":{"A":"Obstructive shock","B":"Cardiogenic shock","C":"Distributive shock","D":"Hypovolemic shock"},"answer":"D","answerText":"Hypovolemic shock","explanation":"2404. Hemorrhagic shock: A form of hypovolemic shock."},{"id":138,"sourceNo":2405,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Septic shock results from:","options":{"A":"Mechanical obstruction","B":"Hemorrhage","C":"Dysregulated host response to infection","D":"Pump failure"},"answer":"C","answerText":"Dysregulated host response to infection","explanation":"2405. Septic shock: Results from dysregulated host response to infection."},{"id":139,"sourceNo":2406,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Cardiogenic shock results from:","options":{"A":"Vasodilation","B":"Failure of cardiac pump function","C":"Fluid loss","D":"Mechanical outflow obstruction"},"answer":"B","answerText":"Failure of cardiac pump function","explanation":"2406. Cardiogenic shock: Results from failure of cardiac pump function."},{"id":140,"sourceNo":2407,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Obstructive shock can occur in:","options":{"A":"Cardiac tamponade, tension pneumothorax and massive PE","B":"Hemorrhage, burns and diarrhea","C":"MI, arrhythmia and valve failure","D":"Sepsis, anaphylaxis and neurogenic shock"},"answer":"A","answerText":"Cardiac tamponade, tension pneumothorax and massive PE","explanation":"2407. Obstructive shock: Can occur in cardiac tamponade, tension pneumothorax and massive pulmonary embolism."},{"id":141,"sourceNo":2408,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Early hypovolemic shock commonly causes:","options":{"A":"Hypertension and warm skin","B":"Bradycardia and vasodilation","C":"Bounding pulses","D":"Tachycardia and peripheral vasoconstriction"},"answer":"D","answerText":"Tachycardia and peripheral vasoconstriction","explanation":"2408. Early hypovolemic shock: Commonly causes tachycardia and peripheral vasoconstriction."},{"id":142,"sourceNo":2409,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Hypotension in shock is often a:","options":{"A":"Early sign","B":"Reliable early marker","C":"First sign always","D":"Late sign"},"answer":"D","answerText":"Late sign","explanation":"2409. Hypotension: Often a late sign of shock."},{"id":143,"sourceNo":2410,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Serum lactate helps assess:","options":{"A":"Renal function","B":"Hepatic synthesis","C":"Tissue hypoperfusion","D":"Pancreatic injury"},"answer":"C","answerText":"Tissue hypoperfusion","explanation":"2410. Serum lactate: Can help assess tissue hypoperfusion."},{"id":144,"sourceNo":2411,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Base deficit helps assess the severity of:","options":{"A":"Neurogenic shock","B":"Hemorrhagic shock","C":"Respiratory alkalosis","D":"Hepatic failure"},"answer":"B","answerText":"Hemorrhagic shock","explanation":"2411. Base deficit: Can help assess the severity of hemorrhagic shock."},{"id":145,"sourceNo":2412,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Permissive hypotension should generally be avoided in:","options":{"A":"Pelvic hemorrhage","B":"Traumatic brain injury","C":"Penetrating torso injury","D":"Ruptured abdominal aortic aneurysm"},"answer":"B","answerText":"Traumatic brain injury","explanation":"2412. Permissive hypotension: May be used in selected patients with uncontrolled hemorrhage before definitive control, excluding important exceptions such as traumatic brain injury."},{"id":146,"sourceNo":2413,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Massive transfusion protocols commonly use:","options":{"A":"Colloids alone","B":"Packed red cells alone","C":"Balanced blood component resuscitation","D":"Crystalloid-only resuscitation"},"answer":"C","answerText":"Balanced blood component resuscitation","explanation":"2413. Massive transfusion protocols: Commonly use balanced blood component resuscitation."},{"id":147,"sourceNo":2414,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Traditional massive transfusion is defined as replacement of:","options":{"A":"One unit in 6 hours","B":"One-tenth of blood volume in 24 hours","C":"About one blood volume within 24 hours","D":"Two units of red cells within 1 hour"},"answer":"C","answerText":"About one blood volume within 24 hours","explanation":"2414. Traditional massive transfusion definition: Replacement of approximately one blood volume within 24 hours."},{"id":148,"sourceNo":2415,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Tranexamic acid is most useful in:","options":{"A":"Stable patients without bleeding","B":"Chronic anemia","C":"Minor trauma","D":"Trauma with significant bleeding, given early"},"answer":"D","answerText":"Trauma with significant bleeding, given early","explanation":"2415. Tranexamic acid: Most beneficial when administered early in appropriate trauma patients with significant bleeding."},{"id":149,"sourceNo":2416,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"The lethal diamond of trauma adds which element to the lethal triad?","options":{"A":"Hyperkalemia","B":"Hypoxia","C":"Hypocalcemia","D":"Hypoglycemia"},"answer":"C","answerText":"Hypocalcemia","explanation":"2416. Lethal diamond of trauma: Additionally includes hypocalcemia."},{"id":150,"sourceNo":2417,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Damage-control resuscitation prioritizes:","options":{"A":"Rapid normalization of BP with crystalloid","B":"Hemorrhage control and prevention of worsening coagulopathy","C":"Large-volume saline","D":"Delay of surgery"},"answer":"B","answerText":"Hemorrhage control and prevention of worsening coagulopathy","explanation":"2417. Damage-control resuscitation: Prioritizes hemorrhage control and prevention of worsening coagulopathy."},{"id":151,"sourceNo":2418,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Crystalloid over-resuscitation can cause:","options":{"A":"Tissue edema and dilutional coagulopathy","B":"Increased hemoglobin","C":"Improved clotting","D":"Correction of acidosis"},"answer":"A","answerText":"Tissue edema and dilutional coagulopathy","explanation":"2418. Crystalloid over-resuscitation: Can worsen tissue edema and dilutional coagulopathy."},{"id":152,"sourceNo":2419,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Vasopressors are used in septic shock when:","options":{"A":"Hypotension persists despite appropriate fluid resuscitation","B":"In all sepsis cases","C":"Before any fluids","D":"Only after cardiac arrest"},"answer":"A","answerText":"Hypotension persists despite appropriate fluid resuscitation","explanation":"2419. Vasopressors: Used in septic shock when hypotension persists despite appropriate fluid resuscitation."},{"id":153,"sourceNo":2420,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"The first-line vasopressor for most adults with septic shock is:","options":{"A":"Phenylephrine","B":"Dopamine","C":"Norepinephrine","D":"Vasopressin"},"answer":"C","answerText":"Norepinephrine","explanation":"2420. First-line vasopressor for most adults with septic shock: Norepinephrine."},{"id":154,"sourceNo":2421,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Shock results in:","options":{"A":"Reduced temperature only","B":"Isolated hypotension only","C":"Cellular oxygen supply-demand mismatch","D":"Isolated hypoxemia"},"answer":"C","answerText":"Cellular oxygen supply-demand mismatch","explanation":"2421. Shock: Inadequate tissue perfusion resulting in cellular oxygen supply-demand mismatch"},{"id":155,"sourceNo":2422,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Which is NOT a major category of shock?","options":{"A":"Hypovolemic","B":"Obstructive","C":"Distributive","D":"Metabolic"},"answer":"D","answerText":"Metabolic","explanation":"2422. Four major categories of shock: Hypovolemic, cardiogenic, distributive and obstructive"},{"id":156,"sourceNo":2423,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"The major cause of hypovolemic shock in trauma is:","options":{"A":"Cardiac tamponade","B":"Neurogenic shock","C":"Tension pneumothorax","D":"Hemorrhage"},"answer":"D","answerText":"Hemorrhage","explanation":"2423. Major cause of hypovolemic shock in trauma patients: Hemorrhage"},{"id":157,"sourceNo":2424,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Cardiogenic shock commonly results from:","options":{"A":"Hemorrhage","B":"Acute MI with severe LV dysfunction","C":"Massive PE","D":"Anaphylaxis"},"answer":"B","answerText":"Acute MI with severe LV dysfunction","explanation":"2424. Cardiogenic shock: Commonly results from acute myocardial infarction with severe left ventricular dysfunction"},{"id":158,"sourceNo":2425,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Septic shock is a form of:","options":{"A":"Cardiogenic shock","B":"Obstructive shock","C":"Distributive shock","D":"Hypovolemic shock"},"answer":"C","answerText":"Distributive shock","explanation":"2425. Septic shock: A form of distributive shock"},{"id":159,"sourceNo":2426,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Anaphylaxis causes shock of which type?","options":{"A":"Cardiogenic","B":"Hypovolemic","C":"Obstructive","D":"Distributive"},"answer":"D","answerText":"Distributive","explanation":"2426. Anaphylaxis: Causes distributive shock through systemic mediator release"},{"id":160,"sourceNo":2427,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Obstructive shock is caused by:","options":{"A":"Cardiac tamponade and massive pulmonary embolism","B":"Hemorrhage and burns","C":"MI and arrhythmia","D":"Sepsis and anaphylaxis"},"answer":"A","answerText":"Cardiac tamponade and massive pulmonary embolism","explanation":"2427. Obstructive shock causes: Cardiac tamponade and massive pulmonary embolism"},{"id":161,"sourceNo":2428,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Early hypovolemic shock features:","options":{"A":"Hypertension, flushing","B":"Bradycardia, warm skin, flash refill","C":"Tachycardia, cool extremities, delayed capillary refill","D":"Bounding pulses, warm skin"},"answer":"C","answerText":"Tachycardia, cool extremities, delayed capillary refill","explanation":"2428. Early hypovolemic shock: Tachycardia, cool extremities and delayed capillary refill"},{"id":162,"sourceNo":2429,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Hypotension in shock is best regarded as a:","options":{"A":"Normal response","B":"Reliable early sign","C":"Late sign of compensated shock","D":"First sign"},"answer":"C","answerText":"Late sign of compensated shock","explanation":"2429. Hypotension in shock: Often a late sign of compensated shock"},{"id":163,"sourceNo":2430,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Elevated lactate in shock is most useful as an indicator of:","options":{"A":"Tissue hypoperfusion and severity of shock","B":"Hepatic encephalopathy","C":"Hemolysis","D":"Hyperglycemia"},"answer":"A","answerText":"Tissue hypoperfusion and severity of shock","explanation":"2430. Lactate elevation: Can indicate tissue hypoperfusion and is useful for assessing shock severity"},{"id":164,"sourceNo":2431,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Which fluid is commonly used for initial resuscitation in many critically ill patients?","options":{"A":"3% saline","B":"Balanced crystalloid","C":"Hydroxyethyl starch routinely","D":"5% dextrose"},"answer":"B","answerText":"Balanced crystalloid","explanation":"2431. Initial fluid resuscitation: Balanced crystalloids are commonly used in many critically ill patients"},{"id":165,"sourceNo":2432,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"First-line vasopressor in septic shock is:","options":{"A":"Dopamine","B":"Norepinephrine","C":"Phenylephrine","D":"Isoprenaline"},"answer":"B","answerText":"Norepinephrine","explanation":"2432. First-line vasopressor in septic shock: Norepinephrine"},{"id":166,"sourceNo":2433,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"The initial MAP target in septic shock is generally:","options":{"A":"45 mmHg","B":"100 mmHg","C":"85 mmHg","D":"65 mmHg"},"answer":"D","answerText":"65 mmHg","explanation":"2433. Initial mean arterial pressure target in septic shock: Generally 65 mmHg"},{"id":167,"sourceNo":2434,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Dobutamine in septic shock is used in:","options":{"A":"All patients first-line","B":"Selected patients with persistent cardiac dysfunction despite adequate volume and pressure","C":"Hypovolemia","D":"Replacement of norepinephrine"},"answer":"B","answerText":"Selected patients with persistent cardiac dysfunction despite adequate volume and pressure","explanation":"2434. Dobutamine in septic shock: May be used in selected patients with persistent cardiac dysfunction despite adequate volume and arterial pressure"},{"id":168,"sourceNo":2435,"subject":"Emergency Medicine and Critical Care","topic":"Shock, Sepsis and Fluid Resuscitation","question":"Massive transfusion protocols are used for:","options":{"A":"Mild anemia","B":"Chronic hemolysis","C":"Iron deficiency","D":"Life-threatening hemorrhage"},"answer":"D","answerText":"Life-threatening hemorrhage","explanation":"2435. Massive transfusion protocols: Used for life-threatening hemorrhage and commonly employ balanced blood component replacement"},{"id":169,"sourceNo":2436,"subject":"Emergency Medicine and Critical Care","topic":"Cardiac Arrest and Cardiopulmonary Resuscitation","question":"Which is a shockable cardiac arrest rhythm?","options":{"A":"Pulseless electrical activity","B":"Sinus bradycardia","C":"Asystole","D":"Ventricular fibrillation"},"answer":"D","answerText":"Ventricular fibrillation","explanation":"2436. Ventricular fibrillation: A shockable cardiac arrest rhythm."},{"id":170,"sourceNo":2437,"subject":"Emergency Medicine and Critical Care","topic":"Cardiac Arrest and Cardiopulmonary Resuscitation","question":"Which is a non-shockable cardiac arrest rhythm?","options":{"A":"Ventricular fibrillation","B":"Pulseless electrical activity","C":"Pulseless VT","D":"Torsades with pulse"},"answer":"B","answerText":"Pulseless electrical activity","explanation":"2437. Pulseless electrical activity: A non-shockable cardiac arrest rhythm."},{"id":171,"sourceNo":2438,"subject":"Emergency Medicine and Critical Care","topic":"Cardiac Arrest and Cardiopulmonary Resuscitation","question":"Asystole is:","options":{"A":"A shockable rhythm","B":"Treated by synchronized cardioversion","C":"A non-shockable rhythm","D":"Treated by pacing first"},"answer":"C","answerText":"A non-shockable rhythm","explanation":"2438. Asystole: A non-shockable cardiac arrest rhythm."},{"id":172,"sourceNo":2439,"subject":"Emergency Medicine and Critical Care","topic":"Cardiac Arrest and Cardiopulmonary Resuscitation","question":"The high-quality CPR compression rate in adults is:","options":{"A":"80–100 per minute","B":"100–120 per minute","C":"140–160 per minute","D":"60–80 per minute"},"answer":"B","answerText":"100–120 per minute","explanation":"2439. High-quality CPR compression rate in adults: 100–120 per minute."},{"id":173,"sourceNo":2440,"subject":"Emergency Medicine and Critical Care","topic":"Cardiac Arrest and Cardiopulmonary Resuscitation","question":"The adult chest compression depth is approximately:","options":{"A":"5–6 cm","B":"3–4 cm","C":"7–8 cm","D":"2–3 cm"},"answer":"A","answerText":"5–6 cm","explanation":"2440. Adult chest compression depth: Approximately 5–6 cm."},{"id":174,"sourceNo":2441,"subject":"Emergency Medicine and Critical Care","topic":"Cardiac Arrest and Cardiopulmonary Resuscitation","question":"The adult CPR compression-to-ventilation ratio without an advanced airway is:","options":{"A":"10:1","B":"5:1","C":"15:2","D":"30:2"},"answer":"D","answerText":"30:2","explanation":"2441. Compression-to-ventilation ratio in adult CPR without an advanced airway: 30:2."},{"id":175,"sourceNo":2442,"subject":"Emergency Medicine and Critical Care","topic":"Cardiac Arrest and Cardiopulmonary Resuscitation","question":"Which drug is given in cardiac arrest according to the algorithm?","options":{"A":"Atropine","B":"Dobutamine","C":"Epinephrine","D":"Adenosine"},"answer":"C","answerText":"Epinephrine","explanation":"2442. Epinephrine: Administered during cardiac arrest according to the resuscitation algorithm."},{"id":176,"sourceNo":2443,"subject":"Emergency Medicine and Critical Care","topic":"Cardiac Arrest and Cardiopulmonary Resuscitation","question":"Amiodarone may be used for:","options":{"A":"Sinus bradycardia","B":"Asystole","C":"PEA","D":"Refractory VF or pulseless VT"},"answer":"D","answerText":"Refractory VF or pulseless VT","explanation":"2443. Amiodarone: May be used for refractory ventricular fibrillation or pulseless ventricular tachycardia."},{"id":177,"sourceNo":2444,"subject":"Emergency Medicine and Critical Care","topic":"Cardiac Arrest and Cardiopulmonary Resuscitation","question":"The compression rate in adult CPR is:","options":{"A":"100–120 per minute","B":"130–150 per minute","C":"80–90 per minute","D":"40–60 per minute"},"answer":"A","answerText":"100–120 per minute","explanation":"2444. Adult CPR compression rate: 100-120 per minute"},{"id":178,"sourceNo":2445,"subject":"Emergency Medicine and Critical Care","topic":"Cardiac Arrest and Cardiopulmonary Resuscitation","question":"Chest compressions are applied over the:","options":{"A":"Upper half of the sternum","B":"Left fifth intercostal space","C":"Xiphoid process","D":"Lower half of the sternum"},"answer":"D","answerText":"Lower half of the sternum","explanation":"2445. Chest compression site: Lower half of the sternum"},{"id":179,"sourceNo":2446,"subject":"Emergency Medicine and Critical Care","topic":"Cardiac Arrest and Cardiopulmonary Resuscitation","question":"Interruptions in chest compressions should be:","options":{"A":"Done every minute","B":"Prolonged for pulse checks","C":"Minimized","D":"Prolonged for intubation"},"answer":"C","answerText":"Minimized","explanation":"2446. Interruptions in chest compressions: Should be minimized"},{"id":180,"sourceNo":2447,"subject":"Emergency Medicine and Critical Care","topic":"Cardiac Arrest and Cardiopulmonary Resuscitation","question":"Shockable cardiac arrest rhythms are:","options":{"A":"Asystole and VT","B":"Asystole and PEA","C":"VF and pulseless VT","D":"PEA and VF"},"answer":"C","answerText":"VF and pulseless VT","explanation":"2447. Shockable cardiac arrest rhythms: Ventricular fibrillation and pulseless ventricular tachycardia"},{"id":181,"sourceNo":2448,"subject":"Emergency Medicine and Critical Care","topic":"Cardiac Arrest and Cardiopulmonary Resuscitation","question":"Non-shockable cardiac arrest rhythms are:","options":{"A":"VF and PEA","B":"VF and pulseless VT","C":"Pulseless VT and asystole","D":"Asystole and PEA"},"answer":"D","answerText":"Asystole and PEA","explanation":"2448. Non-shockable cardiac arrest rhythms: Asystole and pulseless electrical activity"},{"id":182,"sourceNo":2449,"subject":"Emergency Medicine and Critical Care","topic":"Cardiac Arrest and Cardiopulmonary Resuscitation","question":"Defibrillation is:","options":{"A":"A synchronized shock for asystole","B":"An unsynchronized shock for VF and pulseless VT","C":"A drug therapy","D":"Indicated for PEA"},"answer":"B","answerText":"An unsynchronized shock for VF and pulseless VT","explanation":"2449. Defibrillation: Unsynchronized shock indicated for ventricular fibrillation and pulseless ventricular tachycardia"},{"id":183,"sourceNo":2450,"subject":"Emergency Medicine and Critical Care","topic":"Cardiac Arrest and Cardiopulmonary Resuscitation","question":"Epinephrine dose in adult cardiac arrest is:","options":{"A":"1 mg IV/IO every 3–5 minutes","B":"0.1 mg every 1–2 minutes","C":"1 mg every 15 minutes","D":"10 mg every 3–5 minutes"},"answer":"A","answerText":"1 mg IV/IO every 3–5 minutes","explanation":"2450. Epinephrine in adult cardiac arrest: 1 mg IV/IO every 3-5 minutes"},{"id":184,"sourceNo":2451,"subject":"Emergency Medicine and Critical Care","topic":"Cardiac Arrest and Cardiopulmonary Resuscitation","question":"In refractory VF or pulseless VT, which drug may be given?","options":{"A":"Adenosine","B":"Atropine","C":"Amiodarone","D":"Calcium chloride routinely"},"answer":"C","answerText":"Amiodarone","explanation":"2451. Refractory ventricular fibrillation or pulseless ventricular tachycardia: Amiodarone may be administered"},{"id":185,"sourceNo":2452,"subject":"Emergency Medicine and Critical Care","topic":"Cardiac Arrest and Cardiopulmonary Resuscitation","question":"Symptomatic bradycardia is treated with:","options":{"A":"Atropine","B":"Lidocaine","C":"Amiodarone","D":"Adenosine"},"answer":"A","answerText":"Atropine","explanation":"2452. Symptomatic bradycardia: Atropine is used in appropriate clinical circumstances"},{"id":186,"sourceNo":2453,"subject":"Emergency Medicine and Critical Care","topic":"Cardiac Arrest and Cardiopulmonary Resuscitation","question":"Unstable tachyarrhythmias with a pulse are treated by:","options":{"A":"Adenosine only","B":"Atropine","C":"Unsynchronized defibrillation","D":"Synchronized cardioversion"},"answer":"D","answerText":"Synchronized cardioversion","explanation":"2453. Unstable tachyarrhythmias with a pulse: Synchronized cardioversion"},{"id":187,"sourceNo":2454,"subject":"Emergency Medicine and Critical Care","topic":"Airway Management and Altered Consciousness","question":"A GCS of 8 or less prompts:","options":{"A":"Urgent airway assessment","B":"Routine observation","C":"Discharge","D":"Oral fluids"},"answer":"A","answerText":"Urgent airway assessment","explanation":"2454. GCS score of 8 or less: Generally indicates severe impairment and prompts urgent airway assessment"},{"id":188,"sourceNo":2455,"subject":"Emergency Medicine and Critical Care","topic":"Airway Management and Altered Consciousness","question":"When cervical spine injury is suspected, airway opening is done by:","options":{"A":"Jaw-thrust maneuver","B":"Neck rotation","C":"Head-tilt chin-lift","D":"Neck flexion"},"answer":"A","answerText":"Jaw-thrust maneuver","explanation":"2455. Airway opening when cervical spine injury is suspected: Jaw-thrust maneuver is preferred"},{"id":189,"sourceNo":2456,"subject":"Emergency Medicine and Critical Care","topic":"Airway Management and Altered Consciousness","question":"An oropharyngeal airway is generally used in:","options":{"A":"Suspected basilar skull fracture only","B":"Unconscious patients without an intact gag reflex","C":"Conscious patients with a gag reflex","D":"Patients with intact gag reflex"},"answer":"B","answerText":"Unconscious patients without an intact gag reflex","explanation":"2456. Oropharyngeal airway: Generally used in unconscious patients without an intact gag reflex"},{"id":190,"sourceNo":2457,"subject":"Emergency Medicine and Critical Care","topic":"Airway Management and Altered Consciousness","question":"A nasopharyngeal airway should be avoided in:","options":{"A":"Semiconscious patients with a gag reflex","B":"Suspected severe basilar skull fracture","C":"Upper airway obstruction by the tongue","D":"Patients needing airway adjunct"},"answer":"B","answerText":"Suspected severe basilar skull fracture","explanation":"2457. Nasopharyngeal airway: Should be avoided in suspected severe basilar skull fracture"},{"id":191,"sourceNo":2458,"subject":"Emergency Medicine and Critical Care","topic":"Anaphylaxis","question":"The drug of choice for anaphylaxis is:","options":{"A":"Oral antihistamine","B":"IV hydrocortisone","C":"Intramuscular adrenaline","D":"Nebulized salbutamol"},"answer":"C","answerText":"Intramuscular adrenaline","explanation":"2458. Anaphylaxis: Intramuscular adrenaline is indicated."},{"id":192,"sourceNo":2459,"subject":"Emergency Medicine and Critical Care","topic":"Environmental Emergencies","question":"Heat stroke is:","options":{"A":"Severe hyperthermia with CNS dysfunction","B":"Mild temperature rise","C":"Dehydration and weakness only","D":"Fever from infection"},"answer":"A","answerText":"Severe hyperthermia with CNS dysfunction","explanation":"2459. Heat stroke: Severe hyperthermia with central nervous system dysfunction"},{"id":193,"sourceNo":2460,"subject":"Emergency Medicine and Critical Care","topic":"Environmental Emergencies","question":"The cornerstone of heat stroke management is:","options":{"A":"Rapid cooling","B":"Dantrolene","C":"Antipyretics","D":"IV fluids alone"},"answer":"A","answerText":"Rapid cooling","explanation":"2460. Heat stroke management: Rapid cooling is the cornerstone"},{"id":194,"sourceNo":2461,"subject":"Emergency Medicine and Critical Care","topic":"Environmental Emergencies","question":"Heat exhaustion is:","options":{"A":"Malignant hyperthermia","B":"Severe hyperthermia with coma","C":"Dehydration and weakness without severe CNS dysfunction","D":"Seizures with fever"},"answer":"C","answerText":"Dehydration and weakness without severe CNS dysfunction","explanation":"2461. Heat exhaustion: Dehydration and weakness without the severe CNS dysfunction of heat stroke"},{"id":195,"sourceNo":2462,"subject":"Emergency Medicine and Critical Care","topic":"Environmental Emergencies","question":"Hypothermia is defined as core temperature below:","options":{"A":"33 °C","B":"36 °C","C":"32 °C","D":"35 °C"},"answer":"D","answerText":"35 °C","explanation":"2462. Hypothermia: Core body temperature below 35 C"},{"id":196,"sourceNo":2463,"subject":"Emergency Medicine and Critical Care","topic":"Environmental Emergencies","question":"Severe hypothermia can cause:","options":{"A":"Fever","B":"Tachycardia and hyperventilation","C":"Bradycardia, ventricular arrhythmias and altered consciousness","D":"Shivering and hypertension"},"answer":"C","answerText":"Bradycardia, ventricular arrhythmias and altered consciousness","explanation":"2463. Severe hypothermia: Can cause bradycardia, ventricular arrhythmias and altered consciousness"},{"id":197,"sourceNo":2464,"subject":"Emergency Medicine and Critical Care","topic":"Environmental Emergencies","question":"Frostbite is treated with:","options":{"A":"Repeated freeze-thaw","B":"Dry heat from a fire","C":"Controlled rewarming when appropriate","D":"Rubbing with snow"},"answer":"C","answerText":"Controlled rewarming when appropriate","explanation":"2464. Frostbite: Freezing injury to tissues requiring controlled rewarming when appropriate"},{"id":198,"sourceNo":2465,"subject":"Emergency Medicine and Critical Care","topic":"Environmental Emergencies","question":"Drowning management prioritizes:","options":{"A":"Rescue, ventilation and resuscitation","B":"Abdominal thrusts to remove water","C":"Prophylactic steroids","D":"Heimlich maneuver"},"answer":"A","answerText":"Rescue, ventilation and resuscitation","explanation":"2465. Drowning management: Prioritizes rescue, ventilation and resuscitation rather than attempts to remove water from the lungs"},{"id":199,"sourceNo":2466,"subject":"Anesthesia","topic":"General Anesthesia: Basics","question":"General anesthesia produces:","options":{"A":"Irreversible loss of consciousness","B":"Reversible unconsciousness, amnesia, analgesia and immobility","C":"Sedation without amnesia","D":"Regional sensory loss with awareness"},"answer":"B","answerText":"Reversible unconsciousness, amnesia, analgesia and immobility","explanation":"2466. General anesthesia: Produces reversible unconsciousness, amnesia, analgesia and immobility."},{"id":200,"sourceNo":2467,"subject":"Anesthesia","topic":"General Anesthesia: Basics","question":"The four traditional components of balanced anesthesia are:","options":{"A":"Hypnosis, analgesia, muscle relaxation and autonomic stability","B":"Hypnosis, hypotension, hypothermia and amnesia","C":"Analgesia, bradycardia, relaxation and sedation","D":"Sedation, hypoxia, relaxation and stability"},"answer":"A","answerText":"Hypnosis, analgesia, muscle relaxation and autonomic stability","explanation":"2467. The four traditional components of balanced anesthesia: Hypnosis, analgesia, muscle relaxation and autonomic stability."},{"id":201,"sourceNo":2468,"subject":"Anesthesia","topic":"General Anesthesia: Basics","question":"Minimum alveolar concentration (MAC) measures:","options":{"A":"Potency of inhalational agents","B":"Cardiotoxicity","C":"Blood solubility","D":"Speed of onset"},"answer":"A","answerText":"Potency of inhalational agents","explanation":"2468. Minimum alveolar concentration (MAC): Measures the potency of inhalational anesthetic agents."},{"id":202,"sourceNo":2469,"subject":"Anesthesia","topic":"General Anesthesia: Basics","question":"A lower MAC indicates:","options":{"A":"Higher blood solubility","B":"Greater anesthetic potency","C":"Faster onset","D":"Lower potency"},"answer":"B","answerText":"Greater anesthetic potency","explanation":"2469. Lower MAC: Indicates greater anesthetic potency."},{"id":203,"sourceNo":2470,"subject":"Anesthesia","topic":"General Anesthesia: Basics","question":"MAC is reduced by:","options":{"A":"Increasing age, pregnancy and hypothermia","B":"Chronic alcohol use and hyperthermia","C":"Hypernatremia","D":"Young age and hyperthermia"},"answer":"A","answerText":"Increasing age, pregnancy and hypothermia","explanation":"2470. MAC: Reduced by increasing age, pregnancy and hypothermia."},{"id":204,"sourceNo":2471,"subject":"Anesthesia","topic":"General Anesthesia: Basics","question":"MAC is increased by:","options":{"A":"Chronic alcohol use and hyperthermia","B":"Pregnancy and old age","C":"Hypothermia and opioids","D":"Hyponatremia"},"answer":"A","answerText":"Chronic alcohol use and hyperthermia","explanation":"2471. MAC: Increased by chronic alcohol use and hyperthermia."},{"id":205,"sourceNo":2472,"subject":"Anesthesia","topic":"General Anesthesia: Basics","question":"Nitrous oxide has:","options":{"A":"A low MAC and high potency","B":"High blood solubility","C":"A high MAC and low potency","D":"Strong hypnotic effect"},"answer":"C","answerText":"A high MAC and low potency","explanation":"2472. Nitrous oxide: Has a high MAC and relatively low anesthetic potency."},{"id":206,"sourceNo":2473,"subject":"Anesthesia","topic":"General Anesthesia: Basics","question":"Nitrous oxide provides:","options":{"A":"Muscle relaxation","B":"Profound hypnosis","C":"Strong anesthesia without analgesia","D":"Analgesia but is a weak anesthetic"},"answer":"D","answerText":"Analgesia but is a weak anesthetic","explanation":"2473. Nitrous oxide: Provides analgesia but is a weak anesthetic."},{"id":207,"sourceNo":2474,"subject":"Anesthesia","topic":"General Anesthesia: Basics","question":"Nitrous oxide should be avoided in:","options":{"A":"Anemia","B":"Pneumothorax and closed gas spaces","C":"Hypothyroidism","D":"Diabetes"},"answer":"B","answerText":"Pneumothorax and closed gas spaces","explanation":"2474. Nitrous oxide: Should be avoided in pneumothorax and other closed gas spaces."},{"id":208,"sourceNo":2475,"subject":"Anesthesia","topic":"General Anesthesia: Basics","question":"Nitrous oxide expands air-filled cavities because:","options":{"A":"It binds nitrogen","B":"It is oxidized in the cavity","C":"It has a high MAC","D":"It enters them faster than nitrogen leaves"},"answer":"D","answerText":"It enters them faster than nitrogen leaves","explanation":"2475. Nitrous oxide: Can expand air-filled cavities because it enters them faster than nitrogen leaves."},{"id":209,"sourceNo":2476,"subject":"Anesthesia","topic":"Intravenous Anesthetic Drugs","question":"Propofol is a commonly used:","options":{"A":"Inhalational agent","B":"Intravenous induction agent","C":"Opioid","D":"Neuromuscular blocker"},"answer":"B","answerText":"Intravenous induction agent","explanation":"2476. Propofol: A commonly used intravenous induction agent."},{"id":210,"sourceNo":2477,"subject":"Anesthesia","topic":"Intravenous Anesthetic Drugs","question":"Propofol commonly causes:","options":{"A":"Hypertension and tachycardia","B":"Adrenal suppression","C":"Bronchodilation only","D":"Hypotension and respiratory depression"},"answer":"D","answerText":"Hypotension and respiratory depression","explanation":"2477. Propofol: Causes hypotension and respiratory depression."},{"id":211,"sourceNo":2478,"subject":"Anesthesia","topic":"Intravenous Anesthetic Drugs","question":"Propofol has which property?","options":{"A":"Pro-convulsant","B":"Emetogenic","C":"Antiemetic","D":"Analgesic"},"answer":"C","answerText":"Antiemetic","explanation":"2478. Propofol: Has antiemetic properties."},{"id":212,"sourceNo":2479,"subject":"Anesthesia","topic":"Intravenous Anesthetic Drugs","question":"Propofol infusion syndrome follows:","options":{"A":"A single bolus","B":"Epidural use","C":"Inhalation","D":"Prolonged high-dose infusion"},"answer":"D","answerText":"Prolonged high-dose infusion","explanation":"2479. Propofol infusion syndrome: A rare but potentially fatal complication of prolonged high-dose infusion."},{"id":213,"sourceNo":2480,"subject":"Anesthesia","topic":"Intravenous Anesthetic Drugs","question":"Which agent produces dissociative anesthesia?","options":{"A":"Ketamine","B":"Thiopentone","C":"Propofol","D":"Etomidate"},"answer":"A","answerText":"Ketamine","explanation":"2480. Ketamine: Produces dissociative anesthesia."},{"id":214,"sourceNo":2481,"subject":"Anesthesia","topic":"Intravenous Anesthetic Drugs","question":"Ketamine causes:","options":{"A":"Vasodilation","B":"Hypotension and bradycardia","C":"Adrenal suppression","D":"Sympathetic stimulation with increased HR and BP"},"answer":"D","answerText":"Sympathetic stimulation with increased HR and BP","explanation":"2481. Ketamine: Causes sympathetic stimulation and commonly increases heart rate and blood pressure."},{"id":215,"sourceNo":2482,"subject":"Anesthesia","topic":"Intravenous Anesthetic Drugs","question":"Ketamine is particularly useful in selected patients with:","options":{"A":"Uncontrolled hypertension","B":"Pheochromocytoma","C":"Hemodynamic instability","D":"Severe ischemic heart disease with hypertension"},"answer":"C","answerText":"Hemodynamic instability","explanation":"2482. Ketamine: Particularly useful in selected patients with hemodynamic instability."},{"id":216,"sourceNo":2483,"subject":"Anesthesia","topic":"Intravenous Anesthetic Drugs","question":"Ketamine may cause:","options":{"A":"Malignant hyperthermia only","B":"Emergence reactions, hallucinations and nightmares","C":"Propofol infusion syndrome","D":"Adrenal suppression"},"answer":"B","answerText":"Emergence reactions, hallucinations and nightmares","explanation":"2483. Ketamine: May cause emergence reactions, hallucinations and nightmares."},{"id":217,"sourceNo":2484,"subject":"Anesthesia","topic":"Intravenous Anesthetic Drugs","question":"Regarding ketamine and the airway:","options":{"A":"It causes profound respiratory depression always","B":"It abolishes airway reflexes","C":"It guarantees full aspiration protection","D":"It preserves respiration and reflexes better but does not guarantee airway protection"},"answer":"D","answerText":"It preserves respiration and reflexes better but does not guarantee airway protection","explanation":"2484. Ketamine: Tends to preserve spontaneous respiration and airway reflexes better than many other induction agents, but does not guarantee airway protection."},{"id":218,"sourceNo":2485,"subject":"Anesthesia","topic":"Intravenous Anesthetic Drugs","question":"Etomidate causes:","options":{"A":"Relatively little cardiovascular depression","B":"Tachycardia and hypertension","C":"Marked hypotension","D":"Histamine release"},"answer":"A","answerText":"Relatively little cardiovascular depression","explanation":"2485. Etomidate: Causes relatively little cardiovascular depression."},{"id":219,"sourceNo":2486,"subject":"Anesthesia","topic":"Intravenous Anesthetic Drugs","question":"Etomidate can suppress:","options":{"A":"ADH release","B":"Thyroid hormone synthesis","C":"Insulin secretion","D":"Adrenal steroid synthesis"},"answer":"D","answerText":"Adrenal steroid synthesis","explanation":"2486. Etomidate: Can suppress adrenal steroid synthesis."},{"id":220,"sourceNo":2487,"subject":"Anesthesia","topic":"Intravenous Anesthetic Drugs","question":"Thiopentone is:","options":{"A":"An ultrashort-acting barbiturate","B":"A phencyclidine derivative","C":"A benzodiazepine","D":"An alkylphenol"},"answer":"A","answerText":"An ultrashort-acting barbiturate","explanation":"2487. Thiopentone: An ultrashort-acting barbiturate."},{"id":221,"sourceNo":2488,"subject":"Anesthesia","topic":"Intravenous Anesthetic Drugs","question":"Thiopentone:","options":{"A":"Increases ICP","B":"Increases CMRO2","C":"Decreases cerebral metabolic rate and ICP","D":"Has no cerebral effect"},"answer":"C","answerText":"Decreases cerebral metabolic rate and ICP","explanation":"2488. Thiopentone: Decreases cerebral metabolic rate and intracranial pressure."},{"id":222,"sourceNo":2489,"subject":"Anesthesia","topic":"Intravenous Anesthetic Drugs","question":"Thiopentone can cause:","options":{"A":"Hypertension","B":"Bronchodilation","C":"Severe hypotension and respiratory depression","D":"Hyperkalemia"},"answer":"C","answerText":"Severe hypotension and respiratory depression","explanation":"2489. Thiopentone: Can cause severe hypotension and respiratory depression."},{"id":223,"sourceNo":2490,"subject":"Anesthesia","topic":"Intravenous Anesthetic Drugs","question":"Midazolam is used for:","options":{"A":"Neuromuscular blockade","B":"Sedation and anxiolysis","C":"Local anesthesia","D":"Analgesia"},"answer":"B","answerText":"Sedation and anxiolysis","explanation":"2490. Midazolam: A benzodiazepine used for sedation and anxiolysis."},{"id":224,"sourceNo":2491,"subject":"Anesthesia","topic":"Intravenous Anesthetic Drugs","question":"Flumazenil reverses:","options":{"A":"Benzodiazepines","B":"Neuromuscular blockers","C":"Opioids","D":"Heparin"},"answer":"A","answerText":"Benzodiazepines","explanation":"2491. Flumazenil: Reverses the effects of benzodiazepines."},{"id":225,"sourceNo":2492,"subject":"Anesthesia","topic":"Intravenous Anesthetic Drugs","question":"Opioids are used during anesthesia to provide:","options":{"A":"Hypnosis","B":"Amnesia only","C":"Muscle relaxation","D":"Analgesia"},"answer":"D","answerText":"Analgesia","explanation":"2492. Opioids: Used to provide analgesia during anesthesia."},{"id":226,"sourceNo":2493,"subject":"Anesthesia","topic":"Intravenous Anesthetic Drugs","question":"Fentanyl is:","options":{"A":"A neuromuscular blocker","B":"A local anesthetic","C":"A benzodiazepine","D":"A potent synthetic opioid"},"answer":"D","answerText":"A potent synthetic opioid","explanation":"2493. Fentanyl: A potent synthetic opioid."},{"id":227,"sourceNo":2494,"subject":"Anesthesia","topic":"Intravenous Anesthetic Drugs","question":"Remifentanil is metabolized by:","options":{"A":"Nonspecific plasma and tissue esterases","B":"Plasma pseudocholinesterase only","C":"Hepatic CYP3A4","D":"Renal excretion unchanged"},"answer":"A","answerText":"Nonspecific plasma and tissue esterases","explanation":"2494. Remifentanil: Metabolized rapidly by nonspecific plasma and tissue esterases."},{"id":228,"sourceNo":2495,"subject":"Anesthesia","topic":"Inhalational Anesthetics","question":"Which agent is commonly used for inhalational induction, especially in children?","options":{"A":"Sevoflurane","B":"Isoflurane","C":"Halothane","D":"Desflurane"},"answer":"A","answerText":"Sevoflurane","explanation":"2495. Sevoflurane: Commonly used for inhalational induction, especially in children."},{"id":229,"sourceNo":2496,"subject":"Anesthesia","topic":"Inhalational Anesthetics","question":"Rapid onset and recovery is seen with:","options":{"A":"Methoxyflurane","B":"Halothane","C":"Isoflurane","D":"Desflurane"},"answer":"D","answerText":"Desflurane","explanation":"2496. Desflurane: Has a low blood-gas partition coefficient and rapid onset and recovery."},{"id":230,"sourceNo":2497,"subject":"Anesthesia","topic":"Inhalational Anesthetics","question":"Isoflurane causes:","options":{"A":"Hypertension","B":"Bradycardia","C":"Peripheral vasodilation and hypotension","D":"Bronchoconstriction"},"answer":"C","answerText":"Peripheral vasodilation and hypotension","explanation":"2497. Isoflurane: Causes peripheral vasodilation and hypotension."},{"id":231,"sourceNo":2498,"subject":"Anesthesia","topic":"Inhalational Anesthetics","question":"Halothane hepatitis is associated with:","options":{"A":"Sevoflurane","B":"Halothane","C":"Nitrous oxide","D":"Desflurane"},"answer":"B","answerText":"Halothane","explanation":"2498. Halothane: Associated with halothane hepatitis."},{"id":232,"sourceNo":2499,"subject":"Anesthesia","topic":"Inhalational Anesthetics","question":"Halothane can cause:","options":{"A":"Hypertension","B":"Renal failure","C":"Myocardial depression and arrhythmias","D":"Tachycardia only"},"answer":"C","answerText":"Myocardial depression and arrhythmias","explanation":"2499. Halothane: Can cause myocardial depression and arrhythmias."},{"id":233,"sourceNo":2500,"subject":"Anesthesia","topic":"Inhalational Anesthetics","question":"Which can trigger malignant hyperthermia in susceptible individuals?","options":{"A":"Fentanyl","B":"Propofol","C":"Midazolam","D":"Volatile anesthetic agents"},"answer":"D","answerText":"Volatile anesthetic agents","explanation":"2500. Volatile anesthetic agents: Can trigger malignant hyperthermia in susceptible individuals."},{"id":234,"sourceNo":2501,"subject":"Anesthesia","topic":"Inhalational Anesthetics","question":"Malignant hyperthermia involves abnormal calcium release through:","options":{"A":"Skeletal muscle ryanodine receptor","B":"Cardiac sodium channel","C":"GABA-A receptor","D":"Nicotinic receptor"},"answer":"A","answerText":"Skeletal muscle ryanodine receptor","explanation":"2501. Malignant hyperthermia: Associated with abnormal calcium release through the skeletal muscle ryanodine receptor."},{"id":235,"sourceNo":2502,"subject":"Anesthesia","topic":"Inhalational Anesthetics","question":"The specific treatment for malignant hyperthermia is:","options":{"A":"Neostigmine","B":"Flumazenil","C":"Naloxone","D":"Dantrolene"},"answer":"D","answerText":"Dantrolene","explanation":"2502. Dantrolene: The specific treatment for malignant hyperthermia."},{"id":236,"sourceNo":2503,"subject":"Anesthesia","topic":"Inhalational Anesthetics","question":"Malignant hyperthermia may present with:","options":{"A":"Falling end-tidal CO2 and flaccidity","B":"Bronchospasm only","C":"Rising end-tidal CO2, rigidity, tachycardia and hyperthermia","D":"Bradycardia and hypothermia"},"answer":"C","answerText":"Rising end-tidal CO2, rigidity, tachycardia and hyperthermia","explanation":"2503. Malignant hyperthermia: May present with rapidly rising end-tidal CO₂, muscle rigidity, tachycardia and hyperthermia."},{"id":237,"sourceNo":2504,"subject":"Anesthesia","topic":"Inhalational Anesthetics","question":"Another important trigger of malignant hyperthermia is:","options":{"A":"Propofol","B":"Rocuronium","C":"Succinylcholine","D":"Ketamine"},"answer":"C","answerText":"Succinylcholine","explanation":"2504. Succinylcholine: Another important trigger of malignant hyperthermia."},{"id":238,"sourceNo":2505,"subject":"Anesthesia","topic":"Muscle Relaxants","question":"Neuromuscular blocking drugs are used to:","options":{"A":"Reverse opioids","B":"Provide analgesia","C":"Facilitate endotracheal intubation and surgical muscle relaxation","D":"Cause amnesia"},"answer":"C","answerText":"Facilitate endotracheal intubation and surgical muscle relaxation","explanation":"2505. Neuromuscular blocking drugs: Used to facilitate endotracheal intubation and surgical muscle relaxation."},{"id":239,"sourceNo":2506,"subject":"Anesthesia","topic":"Muscle Relaxants","question":"Succinylcholine is a:","options":{"A":"Non-depolarizing blocker","B":"Depolarizing neuromuscular blocker","C":"Anticholinesterase","D":"Benzodiazepine"},"answer":"B","answerText":"Depolarizing neuromuscular blocker","explanation":"2506. Succinylcholine: A depolarizing neuromuscular blocker."},{"id":240,"sourceNo":2507,"subject":"Anesthesia","topic":"Muscle Relaxants","question":"Succinylcholine has:","options":{"A":"Slow onset and short duration","B":"Rapid onset and short duration","C":"Rapid onset and long duration","D":"Slow onset and long duration"},"answer":"B","answerText":"Rapid onset and short duration","explanation":"2507. Succinylcholine: Has a rapid onset and short duration of action."},{"id":241,"sourceNo":2508,"subject":"Anesthesia","topic":"Muscle Relaxants","question":"Succinylcholine can cause:","options":{"A":"Hyponatremia","B":"Hypokalemia","C":"Hypercalcemia","D":"Hyperkalemia"},"answer":"D","answerText":"Hyperkalemia","explanation":"2508. Succinylcholine: Can cause hyperkalemia."},{"id":242,"sourceNo":2509,"subject":"Anesthesia","topic":"Muscle Relaxants","question":"Succinylcholine should be avoided in:","options":{"A":"Pregnancy","B":"Rapid sequence induction in full stomach","C":"Major burns after the initial period and denervation injuries","D":"Asthma"},"answer":"C","answerText":"Major burns after the initial period and denervation injuries","explanation":"2509. Succinylcholine: Should be avoided in patients at risk of dangerous hyperkalemia, including major burns after the initial period, denervation injuries and certain neuromuscular disorders."},{"id":243,"sourceNo":2510,"subject":"Anesthesia","topic":"Muscle Relaxants","question":"Prolonged apnea after succinylcholine occurs in:","options":{"A":"Hypokalemia","B":"Malignant hyperthermia","C":"G6PD deficiency","D":"Pseudocholinesterase deficiency"},"answer":"D","answerText":"Pseudocholinesterase deficiency","explanat
