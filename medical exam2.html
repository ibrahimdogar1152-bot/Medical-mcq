ion":"2510. Succinylcholine: Can cause prolonged apnea in patients with pseudocholinesterase deficiency."},{"id":244,"sourceNo":2511,"subject":"Anesthesia","topic":"Muscle Relaxants","question":"Succinylcholine can cause:","options":{"A":"Hypertension only","B":"Postoperative myalgia and bradycardia","C":"Nephrotoxicity","D":"Hepatotoxicity"},"answer":"B","answerText":"Postoperative myalgia and bradycardia","explanation":"2511. Succinylcholine: Can cause postoperative myalgia and bradycardia."},{"id":245,"sourceNo":2512,"subject":"Anesthesia","topic":"Muscle Relaxants","question":"Rocuronium is a:","options":{"A":"Benzodiazepine","B":"Anticholinesterase","C":"Depolarizing blocker","D":"Non-depolarizing neuromuscular blocker"},"answer":"D","answerText":"Non-depolarizing neuromuscular blocker","explanation":"2512. Rocuronium: A non-depolarizing neuromuscular blocker."},{"id":246,"sourceNo":2513,"subject":"Anesthesia","topic":"Muscle Relaxants","question":"Which non-depolarizing blocker is commonly used for rapid sequence induction?","options":{"A":"Pancuronium","B":"Rocuronium","C":"Atracurium","D":"Cisatracurium"},"answer":"B","answerText":"Rocuronium","explanation":"2513. Rocuronium: Commonly used for rapid sequence induction."},{"id":247,"sourceNo":2514,"subject":"Anesthesia","topic":"Muscle Relaxants","question":"Sugammadex reverses:","options":{"A":"Rocuronium and vecuronium","B":"Midazolam","C":"Cisatracurium","D":"Succinylcholine"},"answer":"A","answerText":"Rocuronium and vecuronium","explanation":"2514. Sugammadex: Reverses the neuromuscular blockade caused by rocuronium and vecuronium."},{"id":248,"sourceNo":2515,"subject":"Anesthesia","topic":"Muscle Relaxants","question":"Neostigmine reverses non-depolarizing blockade by:","options":{"A":"Antagonizing GABA","B":"Inhibiting acetylcholinesterase","C":"Encapsulating the blocker","D":"Blocking nicotinic receptors"},"answer":"B","answerText":"Inhibiting acetylcholinesterase","explanation":"2515. Neostigmine: Reverses non-depolarizing neuromuscular blockade by inhibiting acetylcholinesterase."},{"id":249,"sourceNo":2516,"subject":"Anesthesia","topic":"Muscle Relaxants","question":"Atropine or glycopyrrolate is given with neostigmine to:","options":{"A":"Prevent hyperkalemia","B":"Reduce muscarinic adverse effects","C":"Prolong blockade","D":"Increase reversal"},"answer":"B","answerText":"Reduce muscarinic adverse effects","explanation":"2516. Atropine or glycopyrrolate: Administered with neostigmine to reduce muscarinic adverse effects."},{"id":250,"sourceNo":2517,"subject":"Anesthesia","topic":"Muscle Relaxants","question":"Vecuronium is a:","options":{"A":"Opioid","B":"Depolarizing blocker","C":"Local anesthetic","D":"Non-depolarizing neuromuscular blocker"},"answer":"D","answerText":"Non-depolarizing neuromuscular blocker","explanation":"2517. Vecuronium: A non-depolarizing neuromuscular blocker."},{"id":251,"sourceNo":2518,"subject":"Anesthesia","topic":"Muscle Relaxants","question":"Atracurium undergoes:","options":{"A":"Unchanged renal excretion","B":"Hofmann elimination and ester hydrolysis","C":"Pseudocholinesterase metabolism","D":"Hepatic CYP metabolism"},"answer":"B","answerText":"Hofmann elimination and ester hydrolysis","explanation":"2518. Atracurium: Undergoes Hofmann elimination and ester hydrolysis."},{"id":252,"sourceNo":2519,"subject":"Anesthesia","topic":"Muscle Relaxants","question":"Atracurium can cause:","options":{"A":"Adrenal suppression","B":"Histamine release","C":"Malignant hyperthermia","D":"Hyperkalemia"},"answer":"B","answerText":"Histamine release","explanation":"2519. Atracurium: Can cause histamine release."},{"id":253,"sourceNo":2520,"subject":"Anesthesia","topic":"Muscle Relaxants","question":"Which agent produces less histamine release than atracurium?","options":{"A":"Succinylcholine","B":"Cisatracurium","C":"Mivacurium","D":"Tubocurarine"},"answer":"B","answerText":"Cisatracurium","explanation":"2520. Cisatracurium: Produces less histamine release than atracurium."},{"id":254,"sourceNo":2521,"subject":"Anesthesia","topic":"Local and Regional Anesthesia","question":"Local anesthetics block:","options":{"A":"Voltage-gated sodium channels","B":"Calcium channels","C":"NMDA receptors","D":"Potassium channels"},"answer":"A","answerText":"Voltage-gated sodium channels","explanation":"2521. Local anesthetics: Block voltage-gated sodium channels."},{"id":255,"sourceNo":2522,"subject":"Anesthesia","topic":"Local and Regional Anesthesia","question":"Lidocaine is:","options":{"A":"An amide-type local anesthetic","B":"An opioid","C":"An ester-type local anesthetic","D":"A benzodiazepine"},"answer":"A","answerText":"An amide-type local anesthetic","explanation":"2522. Lidocaine: An amide-type local anesthetic."},{"id":256,"sourceNo":2523,"subject":"Anesthesia","topic":"Local and Regional Anesthesia","question":"Bupivacaine is:","options":{"A":"A barbiturate","B":"A short-acting ester","C":"A long-acting amide local anesthetic","D":"An opioid"},"answer":"C","answerText":"A long-acting amide local anesthetic","explanation":"2523. Bupivacaine: A long-acting amide local anesthetic."},{"id":257,"sourceNo":2524,"subject":"Anesthesia","topic":"Local and Regional Anesthesia","question":"Bupivacaine toxicity can cause:","options":{"A":"Nephrotoxicity","B":"Severe cardiotoxicity","C":"Hyperkalemia","D":"Hepatitis"},"answer":"B","answerText":"Severe cardiotoxicity","explanation":"2524. Bupivacaine: Can cause severe cardiotoxicity following systemic toxicity."},{"id":258,"sourceNo":2525,"subject":"Anesthesia","topic":"Local and Regional Anesthesia","question":"Ropivacaine compared with bupivacaine has:","options":{"A":"Less cardiotoxicity","B":"Same cardiotoxicity","C":"More cardiotoxicity","D":"Shorter onset only"},"answer":"A","answerText":"Less cardiotoxicity","explanation":"2525. Ropivacaine: An amide local anesthetic with less cardiotoxicity than bupivacaine."},{"id":259,"sourceNo":2526,"subject":"Anesthesia","topic":"Local and Regional Anesthesia","question":"Adding adrenaline to local anesthetics:","options":{"A":"Prolongs duration and reduces systemic absorption in selected sites","B":"Shortens duration","C":"Increases systemic toxicity","D":"Is safe in end-arterial areas"},"answer":"A","answerText":"Prolongs duration and reduces systemic absorption in selected sites","explanation":"2526. Adding adrenaline to local anesthetics: Can prolong their duration and reduce systemic absorption in selected sites."},{"id":260,"sourceNo":2527,"subject":"Anesthesia","topic":"Local and Regional Anesthesia","question":"Local anesthetic systemic toxicity can cause:","options":{"A":"Hyperthermia and rigidity","B":"Circumoral numbness, tinnitus, seizures and cardiovascular collapse","C":"Hypoglycemia","D":"Bradycardia and hypertension"},"answer":"B","answerText":"Circumoral numbness, tinnitus, seizures and cardiovascular collapse","explanation":"2527. Local anesthetic systemic toxicity: Can cause circumoral numbness, tinnitus, seizures and cardiovascular collapse."},{"id":261,"sourceNo":2528,"subject":"Anesthesia","topic":"Local and Regional Anesthesia","question":"Severe local anesthetic systemic toxicity is treated with:","options":{"A":"Naloxone","B":"Flumazenil","C":"Dantrolene","D":"Lipid emulsion therapy"},"answer":"D","answerText":"Lipid emulsion therapy","explanation":"2528. Lipid emulsion therapy: Used in severe local anesthetic systemic toxicity."},{"id":262,"sourceNo":2529,"subject":"Anesthesia","topic":"Local and Regional Anesthesia","question":"Spinal anesthesia involves injection into the:","options":{"A":"Subarachnoid space","B":"Paravertebral space","C":"Epidural space","D":"Subdural space"},"answer":"A","answerText":"Subarachnoid space","explanation":"2529. Spinal anesthesia: Injection of local anesthetic into the subarachnoid space."},{"id":263,"sourceNo":2530,"subject":"Anesthesia","topic":"Local and Regional Anesthesia","question":"Epidural anesthesia involves injection into the:","options":{"A":"Intrapleural space","B":"Epidural space","C":"Subarachnoid space","D":"Subdural space"},"answer":"B","answerText":"Epidural space","explanation":"2530. Epidural anesthesia: Injection of medication into the epidural space."},{"id":264,"sourceNo":2531,"subject":"Anesthesia","topic":"Local and Regional Anesthesia","question":"Compared with epidural, spinal anesthesia generally produces:","options":{"A":"A slower block","B":"A less dense block","C":"No difference","D":"A faster and denser block"},"answer":"D","answerText":"A faster and denser block","explanation":"2531. Spinal anesthesia: Generally produces a faster and denser block than epidural anesthesia."},{"id":265,"sourceNo":2532,"subject":"Anesthesia","topic":"Local and Regional Anesthesia","question":"Post-dural puncture headache is a complication of:","options":{"A":"Spinal anesthesia","B":"Brachial plexus block","C":"General anesthesia","D":"Nitrous oxide"},"answer":"A","answerText":"Spinal anesthesia","explanation":"2532. Post-dural puncture headache: A recognized complication of spinal anesthesia."},{"id":266,"sourceNo":2533,"subject":"Anesthesia","topic":"Local and Regional Anesthesia","question":"Post-dural puncture headache typically:","options":{"A":"Occurs only in children","B":"Worsens on lying down","C":"Worsens on standing and improves on lying down","D":"Is unaffected by posture"},"answer":"C","answerText":"Worsens on standing and improves on lying down","explanation":"2533. Post-dural puncture headache: Typically worsens on standing and improves on lying down."},{"id":267,"sourceNo":2534,"subject":"Anesthesia","topic":"Local and Regional Anesthesia","question":"A common complication of spinal anesthesia due to sympathetic blockade is:","options":{"A":"Malignant hyperthermia","B":"Hypertension","C":"Hypotension","D":"Seizure"},"answer":"C","answerText":"Hypotension","explanation":"2534. Hypotension: A common complication of spinal anesthesia due to sympathetic blockade."},{"id":268,"sourceNo":2535,"subject":"Anesthesia","topic":"Local and Regional Anesthesia","question":"High spinal anesthesia can cause:","options":{"A":"Bronchospasm only","B":"Respiratory compromise and severe hypotension","C":"Hypertension","D":"Tachycardia"},"answer":"B","answerText":"Respiratory compromise and severe hypotension","explanation":"2535. High spinal anesthesia: Can cause respiratory compromise and severe hypotension."},{"id":269,"sourceNo":2536,"subject":"Anesthesia","topic":"Local and Regional Anesthesia","question":"Persistent severe post-dural puncture headache is effectively treated with:","options":{"A":"Lipid emulsion","B":"Epidural blood patch","C":"Dantrolene","D":"Flumazenil"},"answer":"B","answerText":"Epidural blood patch","explanation":"2536. An epidural blood patch: An effective treatment for persistent severe post-dural puncture headache."},{"id":270,"sourceNo":2537,"subject":"Anesthesia","topic":"Local and Regional Anesthesia","question":"Combined spinal-epidural anesthesia provides:","options":{"A":"Slow onset only","B":"No analgesia","C":"Rapid onset with option of prolonged analgesia","D":"Single-shot analgesia only"},"answer":"C","answerText":"Rapid onset with option of prolonged analgesia","explanation":"2537. Combined spinal-epidural anesthesia: Provides rapid onset with the option of prolonged analgesia."},{"id":271,"sourceNo":2538,"subject":"Anesthesia","topic":"Airway Management","question":"Mallampati classification is used to predict:","options":{"A":"Cardiac risk","B":"Difficulty with laryngoscopy","C":"Fasting status","D":"Aspiration risk"},"answer":"B","answerText":"Difficulty with laryngoscopy","explanation":"2538. Mallampati classification: Used to predict difficulty with laryngoscopy."},{"id":272,"sourceNo":2539,"subject":"Anesthesia","topic":"Airway Management","question":"Mallampati class IV indicates:","options":{"A":"No view needed","B":"A normal airway","C":"The best view","D":"The poorest oropharyngeal view"},"answer":"D","answerText":"The poorest oropharyngeal view","explanation":"2539. Mallampati class IV: Indicates the poorest oropharyngeal view among the four classes."},{"id":273,"sourceNo":2540,"subject":"Anesthesia","topic":"Airway Management","question":"The sniffing position aligns:","options":{"A":"Cervical spine and thoracic spine","B":"Only the oral axis","C":"Oral, pharyngeal and laryngeal axes","D":"Larynx and trachea only"},"answer":"C","answerText":"Oral, pharyngeal and laryngeal axes","explanation":"2540. The sniffing position: Aligns the oral, pharyngeal and laryngeal axes for conventional laryngoscopy."},{"id":274,"sourceNo":2541,"subject":"Anesthesia","topic":"Airway Management","question":"The Cormack-Lehane system describes:","options":{"A":"Laryngeal view during direct laryngoscopy","B":"Operative risk","C":"Oropharyngeal view while seated","D":"Fasting status"},"answer":"A","answerText":"Laryngeal view during direct laryngoscopy","explanation":"2541. The Cormack-Lehane grading system: Describes the laryngeal view during direct laryngoscopy."},{"id":275,"sourceNo":2542,"subject":"Anesthesia","topic":"Airway Management","question":"Endotracheal intubation is used to:","options":{"A":"Provide analgesia","B":"Induce amnesia","C":"Reverse paralysis","D":"Secure and protect the airway"},"answer":"D","answerText":"Secure and protect the airway","explanation":"2542. Endotracheal intubation: Used to secure and protect the airway."},{"id":276,"sourceNo":2543,"subject":"Anesthesia","topic":"Airway Management","question":"The preferred method to confirm endotracheal tube placement is:","options":{"A":"Chest auscultation","B":"Pulse oximetry","C":"Chest rise","D":"Continuous waveform capnography"},"answer":"D","answerText":"Continuous waveform capnography","explanation":"2543. The preferred method to confirm endotracheal tube placement: Continuous waveform capnography."},{"id":277,"sourceNo":2544,"subject":"Anesthesia","topic":"Airway Management","question":"An endotracheal tube in the right main bronchus can cause:","options":{"A":"Reduced left-sided ventilation","B":"Equal ventilation","C":"No change","D":"Reduced right-sided ventilation"},"answer":"A","answerText":"Reduced left-sided ventilation","explanation":"2544. An endotracheal tube placed in the right main bronchus: Can cause reduced left-sided ventilation."},{"id":278,"sourceNo":2545,"subject":"Anesthesia","topic":"Airway Management","question":"The laryngeal mask airway is a:","options":{"A":"Subglottic device","B":"Supraglottic airway device","C":"Infraglottic device","D":"Tracheostomy tube"},"answer":"B","answerText":"Supraglottic airway device","explanation":"2545. Laryngeal mask airway: A supraglottic airway device."},{"id":279,"sourceNo":2546,"subject":"Anesthesia","topic":"Airway Management","question":"Rapid sequence induction is used in patients at risk of:","options":{"A":"Hypothermia","B":"Hyperkalemia","C":"Aspiration","D":"Hypotension"},"answer":"C","answerText":"Aspiration","explanation":"2546. Rapid sequence induction: Used in patients at increased risk of aspiration."},{"id":280,"sourceNo":2547,"subject":"Anesthesia","topic":"Airway Management","question":"Cricoid pressure during rapid sequence induction:","options":{"A":"Is debated and should not impede airway management","B":"Is proven to prevent all aspiration","C":"Is mandatory always","D":"Should be applied after intubation"},"answer":"A","answerText":"Is debated and should not impede airway management","explanation":"2547. Cricoid pressure: May be applied during rapid sequence induction, although its effectiveness is debated and it should not impede airway management."},{"id":281,"sourceNo":2548,"subject":"Anesthesia","topic":"Airway Management","question":"Difficult airway management requires:","options":{"A":"Preparation for alternative oxygenation and intubation techniques","B":"Sedation only","C":"Delay of surgery always","D":"Only a single laryngoscope"},"answer":"A","answerText":"Preparation for alternative oxygenation and intubation techniques","explanation":"2548. Difficult airway management: Requires preparation for alternative oxygenation and intubation techniques."},{"id":282,"sourceNo":2549,"subject":"Anesthesia","topic":"Airway Management","question":"Cannot-intubate, cannot-oxygenate situations may require:","options":{"A":"Waking and sedating again","B":"Repeated laryngoscopy","C":"Emergency front-of-neck airway access","D":"Observation only"},"answer":"C","answerText":"Emergency front-of-neck airway access","explanation":"2549. Cannot-intubate, cannot-oxygenate situations: May require emergency front-of-neck airway access."},{"id":283,"sourceNo":2550,"subject":"Anesthesia","topic":"Monitoring and Perioperative Care","question":"Pulse oximetry measures:","options":{"A":"Peripheral arterial oxygen saturation","B":"End-tidal CO2","C":"Cardiac output","D":"Blood pressure"},"answer":"A","answerText":"Peripheral arterial oxygen saturation","explanation":"2550. Pulse oximetry: Measures peripheral arterial oxygen saturation."},{"id":284,"sourceNo":2551,"subject":"Anesthesia","topic":"Monitoring and Perioperative Care","question":"Capnography measures:","options":{"A":"Blood pressure","B":"End-tidal carbon dioxide","C":"Temperature","D":"Oxygen saturation"},"answer":"B","answerText":"End-tidal carbon dioxide","explanation":"2551. Capnography: Measures end-tidal carbon dioxide."},{"id":285,"sourceNo":2552,"subject":"Anesthesia","topic":"Monitoring and Perioperative Care","question":"A sudden decrease in end-tidal CO2 can indicate:","options":{"A":"Hypoventilation","B":"Reduced cardiac output or pulmonary blood flow","C":"Malignant hyperthermia","D":"Rebreathing"},"answer":"B","answerText":"Reduced cardiac output or pulmonary blood flow","explanation":"2552. A sudden decrease in end-tidal CO₂: Can indicate reduced cardiac output or pulmonary blood flow."},{"id":286,"sourceNo":2553,"subject":"Anesthesia","topic":"Monitoring and Perioperative Care","question":"ECG monitoring during general anesthesia is:","options":{"A":"Essential","B":"Unnecessary","C":"Optional","D":"Only for cardiac surgery"},"answer":"A","answerText":"Essential","explanation":"2553. ECG monitoring: Essential during general anesthesia."},{"id":287,"sourceNo":2554,"subject":"Anesthesia","topic":"Monitoring and Perioperative Care","question":"Which blood pressure monitoring is routinely used during anesthesia?","options":{"A":"Pulmonary artery catheter always","B":"Non-invasive blood pressure monitoring","C":"Intra-arterial always","D":"Central venous pressure always"},"answer":"B","answerText":"Non-invasive blood pressure monitoring","explanation":"2554. Non-invasive blood pressure monitoring: Routinely used during anesthesia."},{"id":288,"sourceNo":2555,"subject":"Anesthesia","topic":"Monitoring and Perioperative Care","question":"Minimum standard monitoring during general anesthesia includes:","options":{"A":"Only blood pressure","B":"Oxygenation, ventilation, circulation and temperature","C":"Only pulse oximetry","D":"Only ECG"},"answer":"B","answerText":"Oxygenation, ventilation, circulation and temperature","explanation":"2555. Minimum standard monitoring during general anesthesia: Includes oxygenation, ventilation, circulation and temperature assessment."},{"id":289,"sourceNo":2556,"subject":"Anesthesia","topic":"Monitoring and Perioperative Care","question":"Preoperative fasting aims to reduce:","options":{"A":"Hypotension","B":"Risk of pulmonary aspiration","C":"Postoperative pain","D":"Infection"},"answer":"B","answerText":"Risk of pulmonary aspiration","explanation":"2556. Preoperative fasting: Aims to reduce the risk of pulmonary aspiration."},{"id":290,"sourceNo":2557,"subject":"Anesthesia","topic":"Monitoring and Perioperative Care","question":"Aspiration of gastric contents can cause:","options":{"A":"Pneumothorax","B":"Pulmonary embolism","C":"Pleural effusion","D":"Chemical pneumonitis"},"answer":"D","answerText":"Chemical pneumonitis","explanation":"2557. Aspiration of gastric contents: Can cause chemical pneumonitis."},{"id":291,"sourceNo":2558,"subject":"Anesthesia","topic":"Monitoring and Perioperative Care","question":"Ondansetron is a:","options":{"A":"5-HT3 receptor antagonist","B":"Opioid","C":"Dopamine agonist","D":"Benzodiazepine"},"answer":"A","answerText":"5-HT3 receptor antagonist","explanation":"2558. Ondansetron: A 5-HT3 receptor antagonist used to prevent and treat postoperative nausea and vomiting."},{"id":292,"sourceNo":2559,"subject":"Anesthesia","topic":"Monitoring and Perioperative Care","question":"Which drug is commonly used as an antiemetic in perioperative care?","options":{"A":"Succinylcholine","B":"Dantrolene","C":"Neostigmine","D":"Dexamethasone"},"answer":"D","answerText":"Dexamethasone","explanation":"2559. Dexamethasone: Commonly used as an antiemetic in perioperative care."},{"id":293,"sourceNo":2560,"subject":"Anesthesia","topic":"Monitoring and Perioperative Care","question":"Postoperative shivering:","options":{"A":"Increases oxygen consumption","B":"Improves coagulation","C":"Decreases oxygen consumption","D":"Reduces CO2 production"},"answer":"A","answerText":"Increases oxygen consumption","explanation":"2560. Postoperative shivering: Increases oxygen consumption."},{"id":294,"sourceNo":2561,"subject":"Anesthesia","topic":"Monitoring and Perioperative Care","question":"Hypothermia can:","options":{"A":"Reduce complications","B":"Impair coagulation and increase postoperative complications","C":"Shift MAC upward","D":"Improve coagulation"},"answer":"B","answerText":"Impair coagulation and increase postoperative complications","explanation":"2561. Hypothermia: Can impair coagulation and increase postoperative complications."},{"id":295,"sourceNo":2562,"subject":"Anesthesia","topic":"Perioperative and Anesthetic Principles","question":"Preoperative assessment includes evaluation of:","options":{"A":"Only airway","B":"Only blood group","C":"Airway, cardiopulmonary status and comorbidities","D":"Only fasting status"},"answer":"C","answerText":"Airway, cardiopulmonary status and comorbidities","explanation":"2562. Preoperative assessment: Includes evaluation of airway, cardiopulmonary status and comorbidities."},{"id":296,"sourceNo":2563,"subject":"Anesthesia","topic":"Perioperative and Anesthetic Principles","question":"The ASA physical status classification describes:","options":{"A":"Fasting status","B":"Preoperative systemic health","C":"Surgical urgency only","D":"Airway difficulty"},"answer":"B","answerText":"Preoperative systemic health","explanation":"2563. ASA physical status classification: Describes the patient's preoperative systemic health."},{"id":297,"sourceNo":2564,"subject":"Anesthesia","topic":"Perioperative and Anesthetic Principles","question":"Which classification helps predict difficult laryngoscopy?","options":{"A":"Apgar","B":"Glasgow Coma Scale","C":"ASA","D":"Mallampati"},"answer":"D","answerText":"Mallampati","explanation":"2564. Mallampati classification: Helps predict difficulty with laryngoscopy."},{"id":298,"sourceNo":2565,"subject":"Anesthesia","topic":"Perioperative and Anesthetic Principles","question":"Difficult airway planning should include:","options":{"A":"Sedation only","B":"A single plan","C":"No equipment","D":"Backup airway strategies"},"answer":"D","answerText":"Backup airway strategies","explanation":"2565. Difficult airway planning: Should include backup airway strategies."},{"id":299,"sourceNo":2566,"subject":"Anesthesia","topic":"Perioperative and Anesthetic Principles","question":"Aspiration risk is increased in patients with:","options":{"A":"Prolonged fasting","B":"Empty stomach","C":"Normal gastric emptying","D":"A full stomach and delayed gastric emptying"},"answer":"D","answerText":"A full stomach and delayed gastric emptying","explanation":"2566. Aspiration risk: Increased in patients with a full stomach and delayed gastric emptying."},{"id":300,"sourceNo":2567,"subject":"Anesthesia","topic":"Perioperative and Anesthetic Principles","question":"Which induction agent commonly causes hypotension and respiratory depression?","options":{"A":"Etomidate","B":"Propofol","C":"Neostigmine","D":"Ketamine"},"answer":"B","answerText":"Propofol","explanation":"2567. Propofol: Commonly causes hypotension and respiratory depression."},{"id":301,"sourceNo":2568,"subject":"Anesthesia","topic":"Perioperative and Anesthetic Principles","question":"Compared with propofol, ketamine:","options":{"A":"Better preserves spontaneous respiratory drive","B":"Abolishes respiration","C":"Worse preserves respiratory drive","D":"Causes more hypotension"},"answer":"A","answerText":"Better preserves spontaneous respiratory drive","explanation":"2568. Ketamine: Produces dissociative anesthesia and generally preserves spontaneous respiratory drive better than propofol."},{"id":302,"sourceNo":2569,"subject":"Anesthesia","topic":"Perioperative and Anesthetic Principles","question":"Which neuromuscular blocker can cause hyperkalemia?","options":{"A":"Vecuronium","B":"Cisatracurium","C":"Succinylcholine","D":"Rocuronium"},"answer":"C","answerText":"Succinylcholine","explanation":"2569. Succinylcholine (adverse effect): Can cause hyperkalemia."},{"id":303,"sourceNo":2570,"subject":"Anesthesia","topic":"Perioperative and Anesthetic Principles","question":"Succinylcholine is contraindicated in conditions with increased:","options":{"A":"Extrajunctional acetylcholine receptors","B":"Serum calcium","C":"Pseudocholinesterase","D":"Hepatic enzymes"},"answer":"A","answerText":"Extrajunctional acetylcholine receptors","explanation":"2570. Succinylcholine (contraindications): Contraindicated in several conditions associated with increased extrajunctional acetylcholine receptors, such as major burns after the acute phase."},{"id":304,"sourceNo":2571,"subject":"Anesthesia","topic":"Perioperative and Anesthetic Principles","question":"Malignant hyperthermia is associated with:","options":{"A":"Propofol and fentanyl","B":"Midazolam and morphine","C":"Volatile anesthetic agents and succinylcholine","D":"Rocuronium and ketamine"},"answer":"C","answerText":"Volatile anesthetic agents and succinylcholine","explanation":"2571. Malignant hyperthermia: Associated with volatile anesthetic agents and succinylcholine."},{"id":305,"sourceNo":2572,"subject":"Anesthesia","topic":"Perioperative and Anesthetic Principles","question":"Seizures and arrhythmias after a regional block suggest:","options":{"A":"Malignant hyperthermia","B":"Local anesthetic systemic toxicity","C":"Post-dural puncture headache","D":"High spinal"},"answer":"B","answerText":"Local anesthetic systemic toxicity","explanation":"2572. Local anesthetic systemic toxicity: Can cause seizures and cardiac arrhythmias."},{"id":306,"sourceNo":2573,"subject":"Anesthesia","topic":"Perioperative and Anesthetic Principles","question":"The mechanism of hypotension after spinal anesthesia is:","options":{"A":"CSF loss","B":"Histamine release","C":"Sympathetic blockade","D":"Direct myocardial depression"},"answer":"C","answerText":"Sympathetic blockade","explanation":"2573. Spinal anesthesia: Can cause hypotension due to sympathetic blockade."},{"id":307,"sourceNo":2574,"subject":"Anesthesia","topic":"Anesthetic Emergencies","question":"Anaphylaxis during anesthesia commonly presents with:","options":{"A":"Hyperthermia","B":"Bradycardia only","C":"Hypotension, bronchospasm and cardiovascular collapse","D":"Hypertension and tachycardia"},"answer":"C","answerText":"Hypotension, bronchospasm and cardiovascular collapse","explanation":"2574. Anaphylaxis during anesthesia: Commonly presents with hypotension, bronchospasm and cardiovascular collapse."},{"id":308,"sourceNo":2575,"subject":"Anesthesia","topic":"Anesthetic Emergencies","question":"The first-line treatment for perioperative anaphylaxis is:","options":{"A":"Adrenaline","B":"Chlorpheniramine","C":"Salbutamol","D":"Hydrocortisone"},"answer":"A","answerText":"Adrenaline","explanation":"2575. Adrenaline: The first-linefirst-line treatment for perioperative anaphylaxis."},{"id":309,"sourceNo":2576,"subject":"Anesthesia","topic":"Anesthetic Emergencies","question":"Opioid-induced respiratory depression is reversed by:","options":{"A":"Naloxone","B":"Dantrolene","C":"Neostigmine","D":"Flumazenil"},"answer":"A","answerText":"Naloxone","explanation":"2576. Opioid-induced respiratory depression: Can be reversed with naloxone."},{"id":310,"sourceNo":2577,"subject":"Anesthesia","topic":"Anesthetic Emergencies","question":"Cardiac arrest during anesthesia requires:","options":{"A":"Observation","B":"Only drugs","C":"Delayed resuscitation","D":"Immediate CPR and treatment of reversible causes"},"answer":"D","answerText":"Immediate CPR and treatment of reversible causes","explanation":"2577. Cardiac arrest during anesthesia: Requires immediate cardiopulmonary resuscitation and treatment of reversible causes."}]},{"id":"toxicology","scheme":"colon","name":"Toxicology and Poisoning","subject":"Toxicology","questions":[{"id":1,"source_oneliner":2578,"topic":"General Principles of Poisoning","question":"A drowsy patient is brought to the emergency department after an unknown overdose. What is the first priority?","options":{"A":"Gastric lavage","B":"Administration of a specific antidote","C":"Stabilization of airway, breathing and circulation","D":"Whole-bowel irrigation"},"answer":"C","explanation":"Resuscitation (ABC) always comes before decontamination, antidotes or investigations."},{"id":2,"source_oneliner":2579,"topic":"General Principles of Poisoning","question":"A 24-year-old is found unresponsive with a respiratory rate of 5/min and pinpoint pupils. Which drug reverses the respiratory depression?","options":{"A":"Naloxone","B":"Physostigmine","C":"Flumazenil","D":"Atropine"},"answer":"A","explanation":"Naloxone is a competitive opioid antagonist that reverses opioid-induced respiratory depression."},{"id":3,"source_oneliner":2580,"topic":"General Principles of Poisoning","question":"A patient presents with a large paracetamol overdose. Which is the specific antidote?","options":{"A":"Deferoxamine","B":"Fomepizole","C":"Protamine sulfate","D":"N-acetylcysteine"},"answer":"D","explanation":"N-acetylcysteine is the antidote for paracetamol poisoning."},{"id":4,"source_oneliner":2581,"topic":"General Principles of Poisoning","question":"Which antidote combination is used in organophosphate poisoning?","options":{"A":"Fomepizole and ethanol","B":"Atropine and pralidoxime","C":"Physostigmine and neostigmine","D":"Naloxone and flumazenil"},"answer":"B","explanation":"Atropine blocks muscarinic effects; pralidoxime reactivates acetylcholinesterase."},{"id":5,"source_oneliner":2582,"topic":"General Principles of Poisoning","question":"Which single antidote is used for both methanol and ethylene glycol poisoning?","options":{"A":"Methylene blue","B":"Fomepizole","C":"Dimercaprol","D":"Hydroxocobalamin"},"answer":"B","explanation":"Fomepizole blocks alcohol dehydrogenase, preventing formation of toxic metabolites of both alcohols."},{"id":6,"source_oneliner":2583,"topic":"General Principles of Poisoning","question":"A smoke-inhalation victim from an enclosed fire has shock and severe lactic acidosis, and cyanide toxicity is suspected. Which antidote is used?","options":{"A":"Hydroxocobalamin","B":"Atropine","C":"Methylene blue","D":"N-acetylcysteine"},"answer":"A","explanation":"Hydroxocobalamin binds cyanide to form cyanocobalamin (vitamin B12)."},{"id":7,"source_oneliner":2584,"topic":"General Principles of Poisoning","question":"Which antidote is used in significant iron poisoning?","options":{"A":"Pralidoxime","B":"Deferoxamine","C":"Dimercaprol","D":"Succimer"},"answer":"B","explanation":"Deferoxamine is the iron chelator used in significant iron poisoning."},{"id":8,"source_oneliner":2585,"topic":"General Principles of Poisoning","question":"Which statement about activated charcoal is correct?","options":{"A":"It is indicated routinely in all poisonings irrespective of time","B":"It is the treatment of choice in corrosive ingestion","C":"It removes the need for airway protection in drowsy patients","D":"It may be useful after selected recent oral poisonings"},"answer":"D","explanation":"Charcoal is selective: recent ingestion of an adsorbable toxin, with a protected airway."},{"id":9,"source_oneliner":2586,"topic":"General Principles of Poisoning","question":"Activated charcoal is generally ineffective in poisoning with which group of substances?","options":{"A":"Opioids, benzodiazepines and digoxin","B":"Lithium, iron and alcohol","C":"Paracetamol, aspirin and tricyclic antidepressants","D":"Carbamazepine, phenobarbital and theophylline"},"answer":"B","explanation":"Lithium, iron and alcohols are poorly adsorbed by charcoal."},{"id":10,"source_oneliner":2587,"topic":"General Principles of Poisoning","question":"A patient from a closed room with a charcoal heater has headache and confusion. Pulse oximetry shows SpO2 of 99%. What is the correct interpretation?","options":{"A":"Pulse oximetry accurately measures carboxyhemoglobin","B":"Conventional pulse oximetry can be falsely reassuring in carbon monoxide poisoning","C":"A normal SpO2 excludes carbon monoxide poisoning","D":"Pulse oximetry reads falsely low in carbon monoxide poisoning"},"answer":"B","explanation":"Conventional oximeters cannot distinguish carboxyhemoglobin from oxyhemoglobin; co-oximetry is needed."},{"id":11,"source_oneliner":2588,"topic":"General Principles of Poisoning","question":"Which therapy should be assessed in severe carbon monoxide poisoning?","options":{"A":"Sodium nitrite","B":"Hydroxocobalamin","C":"Hyperbaric oxygen","D":"Methylene blue"},"answer":"C","explanation":"Severe CO poisoning (e.g. neurological deficits, loss of consciousness) may need hyperbaric oxygen assessment."},{"id":12,"source_oneliner":2589,"topic":"General Principles of Poisoning","question":"Which approach correctly describes initial management of a poisoned patient?","options":{"A":"Wait for toxicology levels before any intervention","B":"Identify the toxin and give the antidote before anything else","C":"Induce emesis in all alert patients","D":"Airway, breathing, circulation and stabilization first, then decontamination, antidote or elimination as indicated"},"answer":"D","explanation":"Stabilization takes priority over specific toxin-directed therapy."},{"id":13,"source_oneliner":2590,"topic":"General Principles of Poisoning","question":"Activated charcoal is most useful when given:","options":{"A":"For lithium overdose","B":"Several hours after ingestion in a patient with unprotected airway","C":"After a strong acid ingestion","D":"Within about one hour of ingestion of an adsorbable toxin with a protected airway"},"answer":"D","explanation":"Benefit falls with time and aspiration risk makes airway protection mandatory."},{"id":14,"source_oneliner":2591,"topic":"General Principles of Poisoning","question":"Which of the following is NOT adsorbed by activated charcoal?","options":{"A":"Strong alkali (caustic substances)","B":"Phenobarbital","C":"Paracetamol","D":"Carbamazepine"},"answer":"A","explanation":"Alcohols, iron, lithium and strong acids or alkalis are not adsorbed."},{"id":15,"source_oneliner":2592,"topic":"General Principles of Poisoning","question":"What is the current position on gastric lavage in poisoning?","options":{"A":"Routine first step for all oral ingestions","B":"Preferred over charcoal in hydrocarbon ingestion","C":"Not routinely recommended; reserved for exceptional circumstances after expert assessment","D":"Indicated in all corrosive ingestions"},"answer":"C","explanation":"Lavage has limited benefit and risks such as aspiration and perforation."},{"id":16,"source_oneliner":2593,"topic":"Organophosphate Poisoning","question":"What is the mechanism of toxicity of organophosphates?","options":{"A":"Inhibition of cytochrome c oxidase","B":"Muscarinic receptor blockade","C":"Acetylcholinesterase inhibition causing cholinergic excess","D":"Sodium channel blockade"},"answer":"C","explanation":"Accumulated acetylcholine overstimulates muscarinic and nicotinic receptors."},{"id":17,"source_oneliner":2594,"topic":"Organophosphate Poisoning","question":"Which set of features is characteristic of organophosphate poisoning?","options":{"A":"Salivation, lacrimation, urination, diarrhea, bronchorrhea and bronchospasm","B":"Dry mouth, mydriasis, urinary retention and hot dry skin","C":"Hypothermia, miosis, bradypnea and constipation","D":"Hypertension, hyperthermia, mydriasis and agitation"},"answer":"A","explanation":"This is the cholinergic toxidrome; option A describes anticholinergic and C sympathomimetic/opioid pictures."},{"id":18,"source_oneliner":2595,"topic":"Organophosphate Poisoning","question":"A farmer after spraying pesticide has pinpoint pupils, copious bronchial secretions and muscle fasciculations. What is the most likely poisoning?","options":{"A":"Organophosphate","B":"Alcohol withdrawal","C":"Amphetamine","D":"Datura (anticholinergic)"},"answer":"A","explanation":"Miosis, bronchorrhea and fasciculations are classic for organophosphate toxicity."},{"id":19,"source_oneliner":2596,"topic":"Organophosphate Poisoning","question":"In organophosphate poisoning, atropine reverses which manifestations?","options":{"A":"Fasciculations","B":"Muscarinic manifestations","C":"Respiratory muscle paralysis","D":"Nicotinic muscle weakness"},"answer":"B","explanation":"Atropine does not treat nicotinic effects; pralidoxime helps these."},{"id":20,"source_oneliner":2597,"topic":"Organophosphate Poisoning","question":"Pralidoxime is most effective when given:","options":{"A":"As a substitute for atropine for bronchorrhea","B":"Only for muscarinic symptoms","C":"Only after aging has occurred","D":"Before aging of the inhibited acetylcholinesterase"},"answer":"D","explanation":"Once the enzyme has aged, it cannot be reactivated."},{"id":21,"source_oneliner":2598,"topic":"Opioid and Benzodiazepine Overdose","question":"What is the classic triad of opioid overdose?","options":{"A":"Respiratory depression, reduced consciousness and pinpoint pupils","B":"Hypertension, hyperthermia and agitation","C":"Tachycardia, mydriasis and dry skin","D":"Salivation, bradycardia and mydriasis"},"answer":"A","explanation":"CNS depression, respiratory depression and miosis define the opioid toxidrome."},{"id":22,"source_oneliner":2599,"topic":"Opioid and Benzodiazepine Overdose","question":"A postoperative patient on morphine develops respiratory depression. Which agent reverses it?","options":{"A":"Neostigmine","B":"Atropine","C":"Flumazenil","D":"Naloxone"},"answer":"D","explanation":"Naloxone antagonizes opioid receptors."},{"id":23,"source_oneliner":2600,"topic":"Opioid and Benzodiazepine Overdose","question":"What may be required in overdose of long-acting opioids?","options":{"A":"Flumazenil infusion","B":"A single naloxone dose is always sufficient","C":"Repeated naloxone doses or an infusion","D":"Physostigmine"},"answer":"C","explanation":"Naloxone may wear off before the opioid, risking recurrent respiratory depression."},{"id":24,"source_oneliner":2601,"topic":"Opioid and Benzodiazepine Overdose","question":"Why is flumazenil avoided in many mixed overdoses?","options":{"A":"It causes methemoglobinemia","B":"It causes hepatic necrosis","C":"It precipitates hypoglycemia","D":"Risk of precipitating seizures"},"answer":"D","explanation":"Flumazenil can unmask seizures, e.g. with co-ingested tricyclics or in benzodiazepine-dependent patients."},{"id":25,"source_oneliner":2602,"topic":"Paracetamol Poisoning","question":"Severe hepatic necrosis is the major toxic effect of overdose of which drug?","options":{"A":"Atropine","B":"Digoxin","C":"Lithium","D":"Paracetamol"},"answer":"D","explanation":"Toxic metabolite NAPQI depletes glutathione and injures hepatocytes."},{"id":26,"source_oneliner":2603,"topic":"Paracetamol Poisoning","question":"N-acetylcysteine acts in paracetamol poisoning by:","options":{"A":"Replenishing glutathione","B":"Reactivating acetylcholinesterase","C":"Inhibiting alcohol dehydrogenase","D":"Chelating the drug"},"answer":"A","explanation":"Glutathione restoration detoxifies the toxic metabolite."},{"id":27,"source_oneliner":2604,"topic":"Paracetamol Poisoning","question":"The Rumack-Matthew nomogram is used for:","options":{"A":"Assessing severity of iron poisoning","B":"Predicting lithium toxicity","C":"Chronic repeated supratherapeutic paracetamol ingestion with unknown timing","D":"Risk assessment after a single acute paracetamol ingestion with a known time"},"answer":"D","explanation":"It requires a single acute ingestion and a known time since ingestion."},{"id":28,"source_oneliner":2605,"topic":"Toxic Alcohols","question":"Metabolic acidosis with visual disturbances after drinking adulterated liquor suggests poisoning with:","options":{"A":"Lithium","B":"Paracetamol","C":"Ethylene glycol","D":"Methanol"},"answer":"D","explanation":"Methanol is metabolized to formic acid, which affects the optic nerve."},{"id":29,"source_oneliner":2606,"topic":"Toxic Alcohols","question":"Metabolic acidosis, renal injury and calcium oxalate crystalluria suggest poisoning with:","options":{"A":"Methanol","B":"Ethylene glycol","C":"Paracetamol","D":"Iron"},"answer":"B","explanation":"Ethylene glycol metabolites cause acidosis and oxalate deposition in kidneys."},{"id":30,"source_oneliner":2607,"topic":"Toxic Alcohols","question":"Fomepizole acts by:","options":{"A":"Reactivating acetylcholinesterase","B":"Inhibiting alcohol dehydrogenase","C":"Chelating metals","D":"Inhibiting aldehyde dehydrogenase"},"answer":"B","explanation":"This blocks conversion to toxic metabolites."},{"id":31,"source_oneliner":2608,"topic":"Toxic Alcohols","question":"Which urine crystals are seen in ethylene glycol poisoning?","options":{"A":"Rhomboid uric acid crystals","B":"Hexagonal cystine crystals","C":"Envelope- or needle-shaped calcium oxalate crystals","D":"Coffin-lid struvite crystals"},"answer":"C","explanation":"Calcium oxalate monohydrate and dihydrate crystals are typical."},{"id":32,"source_oneliner":2609,"topic":"Gases and Chemical Asphyxiants","question":"How does carbon monoxide cause tissue hypoxia?","options":{"A":"By inhibiting acetylcholinesterase","B":"By oxidizing hemoglobin to methemoglobin","C":"By inhibiting cytochrome c oxidase","D":"By forming carboxyhemoglobin"},"answer":"D","explanation":"CO binds hemoglobin with high affinity, reducing oxygen-carrying capacity."},{"id":33,"source_oneliner":2610,"topic":"Gases and Chemical Asphyxiants","question":"Cherry-red skin in carbon monoxide poisoning is:","options":{"A":"Pathognomonic","B":"An unreliable and uncommon sign","C":"A sensitive early sign","D":"Present in all patients with elevated carboxyhemoglobin"},"answer":"B","explanation":"Do not rely on skin colour to diagnose or exclude CO poisoning."},{"id":34,"source_oneliner":2611,"topic":"Gases and Chemical Asphyxiants","question":"What is the initial treatment of carbon monoxide poisoning?","options":{"A":"Methylene blue","B":"High-concentration oxygen","C":"Room air observation","D":"Sodium thiosulfate"},"answer":"B","explanation":"Oxygen shortens the carboxyhemoglobin half-life."},{"id":35,"source_oneliner":2612,"topic":"Gases and Chemical Asphyxiants","question":"Cyanide poisoning inhibits which enzyme?","options":{"A":"Cytochrome c oxidase","B":"Glutathione synthetase","C":"Alcohol dehydrogenase","D":"Acetylcholinesterase"},"answer":"A","explanation":"Blocking the terminal electron transport chain causes severe cellular hypoxia."},{"id":36,"source_oneliner":2613,"topic":"Gases and Chemical Asphyxiants","question":"A cyanotic patient with chocolate-brown blood unresponsive to oxygen is most appropriately treated with:","options":{"A":"Fomepizole","B":"Methylene blue","C":"Hydroxocobalamin","D":"N-acetylcysteine"},"answer":"B","explanation":"This is methemoglobinemia; methylene blue is commonly used when clinically indicated."},{"id":37,"source_oneliner":2614,"topic":"Drug Toxicities","question":"QRS widening, seizures, hypotension and ventricular arrhythmias occur in overdose of which drug class?","options":{"A":"Benzodiazepines","B":"Tricyclic antidepressants","C":"Opioids","D":"SSRIs"},"answer":"B","explanation":"Sodium channel blockade underlies the cardiac toxicity."},{"id":38,"source_oneliner":2615,"topic":"Drug Toxicities","question":"Which drug is used in tricyclic antidepressant overdose with QRS widening or cardiovascular instability?","options":{"A":"Class IA antiarrhythmics","B":"Sodium bicarbonate","C":"Physostigmine","D":"Flumazenil"},"answer":"B","explanation":"Bicarbonate overcomes sodium channel blockade."},{"id":39,"source_oneliner":2616,"topic":"Drug Toxicities","question":"Bradycardia, hypotension and hypoglycemia are features of overdose with:","options":{"A":"Calcium channel blockers","B":"Beta-blockers","C":"Anticholinergics","D":"Sympathomimetics"},"answer":"B","explanation":"Calcium channel blocker overdose tends to cause hyperglycemia instead."},{"id":40,"source_oneliner":2617,"topic":"Drug Toxicities","question":"Which treatments are used in severe beta-blocker toxicity?","options":{"A":"Flumazenil and naloxone","B":"Digoxin antibody fragments","C":"Sodium bicarbonate and physostigmine","D":"Glucagon and high-dose insulin euglycemia therapy"},"answer":"D","explanation":"Glucagon bypasses the blocked receptor; insulin supports myocardial function."},{"id":41,"source_oneliner":2618,"topic":"Drug Toxicities","question":"Profound hypotension, bradycardia and hyperglycemia suggest overdose of:","options":{"A":"Beta-blockers","B":"Calcium channel blockers","C":"Tricyclic antidepressants","D":"Opioids"},"answer":"B","explanation":"Insulin release is blocked, causing hyperglycemia."},{"id":42,"source_oneliner":2619,"topic":"Drug Toxicities","question":"Which treatments are used in severe calcium channel blocker toxicity?","options":{"A":"Calcium salts and high-dose insulin euglycemia therapy","B":"Digoxin-specific antibody fragments","C":"Flumazenil","D":"Sodium bicarbonate alone"},"answer":"A","explanation":"Calcium overcomes channel blockade; insulin improves contractility."},{"id":43,"source_oneliner":2620,"topic":"Drug Toxicities","question":"Nausea, visual disturbances, bradyarrhythmias and ventricular arrhythmias are features of toxicity with:","options":{"A":"Salicylates","B":"Lithium","C":"Digoxin","D":"Iron"},"answer":"C","explanation":"Digoxin inhibits Na+/K+-ATPase."},{"id":44,"source_oneliner":2621,"topic":"Drug Toxicities","question":"What is used in life-threatening digoxin toxicity?","options":{"A":"Sodium bicarbonate","B":"Digoxin-specific antibody fragments","C":"Flumazenil","D":"Deferoxamine"},"answer":"B","explanation":"Fab fragments bind and neutralize digoxin."},{"id":45,"source_oneliner":2622,"topic":"Drug Toxicities","question":"Coarse tremor, ataxia, confusion and seizures are features of toxicity with:","options":{"A":"Opioids","B":"Lithium","C":"Digoxin","D":"Paracetamol"},"answer":"B","explanation":"A coarse tremor distinguishes lithium toxicity from the fine tremor of therapeutic use."},{"id":46,"source_oneliner":2623,"topic":"Drug Toxicities","question":"Which intervention is indicated in selected severe lithium poisoning cases?","options":{"A":"Forced diuresis with furosemide","B":"Activated charcoal","C":"Flumazenil","D":"Hemodialysis"},"answer":"D","explanation":"Lithium is dialyzable and not adsorbed by charcoal."},{"id":47,"source_oneliner":2624,"topic":"Drug Toxicities","question":"Tinnitus, respiratory alkalosis and anion-gap metabolic acidosis suggest poisoning with:","options":{"A":"Methanol only","B":"Paracetamol","C":"Digoxin","D":"Salicylates"},"answer":"D","explanation":"Salicylates stimulate the respiratory centre and uncouple oxidative phosphorylation."},{"id":48,"source_oneliner":2625,"topic":"Drug Toxicities","question":"Which treatment is used in significant salicylate poisoning?","options":{"A":"Urinary acidification","B":"Flumazenil","C":"Fomepizole","D":"Urinary alkalinization with sodium bicarbonate"},"answer":"D","explanation":"Alkaline urine traps salicylate and enhances elimination."},{"id":49,"source_oneliner":2626,"topic":"Drug Toxicities","question":"Gastrointestinal hemorrhage, shock, metabolic acidosis and hepatic injury suggest poisoning with:","options":{"A":"Iron","B":"Opioids","C":"Lithium","D":"Digoxin"},"answer":"A","explanation":"Iron is corrosive to the gut and causes cellular toxicity."},{"id":50,"source_oneliner":2627,"topic":"Drug Toxicities","question":"A child with severe acute iron poisoning, shock and acidosis needs which chelator?","options":{"A":"Succimer","B":"Dimercaprol","C":"Deferoxamine","D":"Calcium disodium EDTA"},"answer":"C","explanation":"Deferoxamine chelates ferric iron."},{"id":51,"source_oneliner":2628,"topic":"Envenomation","question":"What is the appropriate initial management of snakebite?","options":{"A":"Tourniquet application","B":"Immobilization of the affected limb and urgent medical assessment","C":"Ice application","D":"Incision and suction of the wound"},"answer":"B","explanation":"Immobilization slows venom spread; urgent transfer for assessment is essential."},{"id":52,"source_oneliner":2629,"topic":"Envenomation","question":"Which first-aid measure for snakebite is NOT recommended?","options":{"A":"Tourniquets, wound cutting and suction","B":"Immobilizing the limb","C":"Reassurance and rapid transport","D":"Removing rings and tight items"},"answer":"A","explanation":"These measures are ineffective and can cause harm."},{"id":53,"source_oneliner":2630,"topic":"Envenomation","question":"Antivenom is indicated in:","options":{"A":"Dry bites only","B":"Systemic envenomation or significant progressive local envenomation, per species and protocol","C":"Only after 24 hours of symptoms","D":"Every snakebite regardless of signs"},"answer":"B","explanation":"Indications depend on clinical envenomation and local protocol."},{"id":54,"source_oneliner":2631,"topic":"Envenomation","question":"Ptosis, ophthalmoplegia, bulbar weakness and respiratory paralysis suggest which type of snake venom effect?","options":{"A":"Hypoglycemic","B":"Neurotoxic","C":"Hemotoxic","D":"Dermonecrotic"},"answer":"B","explanation":"These features reflect neuromuscular blockade."},{"id":55,"source_oneliner":2632,"topic":"Envenomation","question":"Coagulopathy, bleeding and acute kidney injury suggest which venom effect?","options":{"A":"Cholinergic","B":"Hemotoxic","C":"Anticholinergic","D":"Neurotoxic"},"answer":"B","explanation":"Hemotoxic venoms disturb coagulation and damage kidneys."},{"id":56,"source_oneliner":2633,"topic":"Envenomation","question":"Which complications characterize Russell's viper envenomation?","options":{"A":"Isolated neuromuscular paralysis without coagulopathy","B":"Coagulopathy and renal injury","C":"Only local swelling","D":"Autonomic storm"},"answer":"B","explanation":"Russell's viper venom is hemotoxic."},{"id":57,"source_oneliner":2634,"topic":"Envenomation","question":"Which is the characteristic systemic feature of severe scorpion envenomation?","options":{"A":"Flaccid paralysis","B":"Autonomic storm with sweating, salivation, hypertension and cardiac dysfunction","C":"Consumptive coagulopathy","D":"Hemolysis with renal failure"},"answer":"B","explanation":"Massive catecholamine and autonomic release underlies the picture."},{"id":58,"source_oneliner":2635,"topic":"Envenomation","question":"How is severe scorpion envenomation managed?","options":{"A":"Antivenom is never used","B":"Supportive care and specific antivenom where available and indicated","C":"Corticosteroids alone","D":"Tourniquet and incision"},"answer":"B","explanation":"Support cardiac and respiratory function; add antivenom when indicated."},{"id":59,"source_oneliner":2636,"topic":"Antidotes","question":"Which poison-antidote pairing is correct?","options":{"A":"Heparin - Vitamin K","B":"Opioid - Flumazenil","C":"Paracetamol - N-acetylcysteine","D":"Cyanide - Deferoxamine"},"answer":"C","explanation":"Paracetamol poisoning is treated with N-acetylcysteine."},{"id":60,"source_oneliner":2637,"topic":"Antidotes","question":"Which is the antidote for opioid poisoning?","options":{"A":"Naloxone","B":"N-acetylcysteine","C":"Protamine sulfate","D":"Fomepizole"},"answer":"A","explanation":"Naloxone reverses opioid effects."},{"id":61,"source_oneliner":2638,"topic":"Antidotes","question":"Which antidote is used only in carefully selected cases of benzodiazepine poisoning?","options":{"A":"Atropine","B":"Flumazenil","C":"Naloxone","D":"Physostigmine"},"answer":"B","explanation":"Seizure risk limits its use."},{"id":62,"source_oneliner":2639,"topic":"Antidotes","question":"A patient with organophosphate poisoning needs muscarinic blockade and enzyme reactivation. Which antidotes?","options":{"A":"Deferoxamine and protamine","B":"Atropine and pralidoxime","C":"Naloxone and flumazenil","D":"Methylene blue and hydroxocobalamin"},"answer":"B","explanation":"Atropine treats muscarinic effects; pralidoxime reactivates the enzyme."},{"id":63,"source_oneliner":2640,"topic":"Antidotes","question":"Which are the antidote options for methanol poisoning?","options":{"A":"Naloxone or flumazenil","B":"Methylene blue or N-acetylcysteine","C":"Fomepizole or ethanol under specialist guidance","D":"Deferoxamine or protamine"},"answer":"C","explanation":"Both compete for or inhibit alcohol dehydrogenase."},{"id":64,"source_oneliner":2641,"topic":"Antidotes","question":"Which antidote is used in iron poisoning?","options":{"A":"Hydroxocobalamin","B":"Deferoxamine","C":"Naloxone","D":"Atropine"},"answer":"B","explanation":"Deferoxamine chelates iron."},{"id":65,"source_oneliner":2642,"topic":"Antidotes","question":"Which antidote is used in cyanide poisoning?","options":{"A":"Hydroxocobalamin","B":"Protamine sulfate","C":"N-acetylcysteine","D":"Deferoxamine"},"answer":"A","explanation":"It binds cyanide forming vitamin B12."},{"id":66,"source_oneliner":2643,"topic":"Antidotes","question":"Which agent neutralizes heparin toxicity?","options":{"A":"Idarucizumab","B":"Flumazenil","C":"Protamine sulfate","D":"Vitamin K"},"answer":"C","explanation":"Protamine binds heparin."},{"id":67,"source_oneliner":2644,"topic":"Antidotes","question":"What is the treatment of warfarin-associated major bleeding?","options":{"A":"Tranexamic acid alone","B":"Oral vitamin K alone","C":"Protamine sulfate","D":"Four-factor prothrombin complex concentrate plus vitamin K"},"answer":"D","explanation":"PCC gives immediate reversal; vitamin K gives sustained effect."},{"id":68,"source_oneliner":2645,"topic":"Antidotes","question":"What is used in life-threatening digoxin toxicity?","options":{"A":"Digoxin-specific antibody fragments","B":"Flumazenil","C":"Atropine alone","D":"Sodium bicarbonate"},"answer":"A","explanation":"Fab fragments neutralize digoxin."}]},{"id":"pediatrics_sba","scheme":"colon","name":"pediatrics sba","questions":[{"id":1,"sourceNo":2064,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"By what age does a healthy infant's birth weight usually double?","options":{"A":"3 months","B":"5 months","C":"12 months","D":"8 months"},"answer":"B","explanation":"Birth weight doubles at ~5 months, triples at 12 months and quadruples at 2 years."},{"id":2,"sourceNo":2065,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"Birth weight is usually tripled by which age?","options":{"A":"6 months","B":"18 months","C":"12 months","D":"9 months"},"answer":"C","explanation":"Triples at 12 months."},{"id":3,"sourceNo":2066,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"A child's birth weight is usually four times the birth weight at:","options":{"A":"3 years","B":"5 years","C":"1 year","D":"2 years"},"answer":"D","explanation":"Quadruples at 2 years."},{"id":4,"sourceNo":2067,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"The average birth length of a term neonate is approximately:","options":{"A":"40 cm","B":"60 cm","C":"45 cm","D":"50 cm"},"answer":"D","explanation":"Average birth length is ~50 cm."},{"id":5,"sourceNo":2068,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"Length increases during the first year of life by approximately:","options":{"A":"40 cm","B":"15 cm","C":"10 cm","D":"25 cm"},"answer":"D","explanation":"Birth ~50 cm to ~75 cm at 1 year."},{"id":6,"sourceNo":2069,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"Average head circumference at birth is approximately:","options":{"A":"35 cm","B":"30 cm","C":"45 cm","D":"40 cm"},"answer":"A","explanation":"Term neonatal OFC is ~35 cm."},{"id":7,"sourceNo":2070,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"Head circumference increases during the first year by approximately:","options":{"A":"5 cm","B":"8 cm","C":"12 cm","D":"20 cm"},"answer":"C","explanation":"From ~35 cm to ~47 cm at 1 year."},{"id":8,"sourceNo":2071,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"The posterior fontanelle usually closes by:","options":{"A":"6 months","B":"12 months","C":"18 months","D":"2 months"},"answer":"D","explanation":"Posterior fontanelle closes by ~2 months; anterior at 12-18 months."},{"id":9,"sourceNo":2072,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"The anterior fontanelle usually closes between:","options":{"A":"24 and 30 months","B":"3 and 6 months","C":"12 and 18 months","D":"6 and 9 months"},"answer":"C","explanation":"Anterior fontanelle closure is at 12-18 months."},{"id":10,"sourceNo":2073,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"The social smile usually appears at:","options":{"A":"6 months","B":"6-8 weeks","C":"3-4 months","D":"2 weeks"},"answer":"B","explanation":"Social smile develops at ~6-8 weeks."},{"id":11,"sourceNo":2074,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"Head control is usually achieved at:","options":{"A":"1 month","B":"9 months","C":"3-4 months","D":"6 months"},"answer":"C","explanation":"Head control develops at ~3-4 months."},{"id":12,"sourceNo":2075,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"Rolling over typically develops at about:","options":{"A":"4-6 months","B":"10 months","C":"2 months","D":"8 months"},"answer":"A","explanation":"Rolling over is at ~4-6 months."},{"id":13,"sourceNo":2076,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"Sitting without support typically develops at about:","options":{"A":"12 months","B":"8-9 months","C":"4 months","D":"2-3 months"},"answer":"B","explanation":"Sits without support at ~8-9 months."},{"id":14,"sourceNo":2077,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"Independent walking is usually achieved at:","options":{"A":"24 months","B":"12-15 months","C":"6 months","D":"8 months"},"answer":"B","explanation":"Walks independently at 12-15 months."},{"id":15,"sourceNo":2078,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"A pincer grasp is usually developed by:","options":{"A":"3-4 months","B":"5-6 months","C":"15-18 months","D":"9-12 months"},"answer":"D","explanation":"Pincer grasp develops at ~9-12 months."},{"id":16,"sourceNo":2079,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"Most children say their first meaningful word at around:","options":{"A":"6 months","B":"9 months","C":"12 months","D":"18 months"},"answer":"C","explanation":"First meaningful word at ~12 months."},{"id":17,"sourceNo":2080,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"Two-word phrases are commonly present by:","options":{"A":"4 years","B":"3 years","C":"1 year","D":"2 years"},"answer":"D","explanation":"Two-word phrases by ~2 years."},{"id":18,"sourceNo":2081,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"Loss of previously acquired developmental milestones (regression) is a red flag for:","options":{"A":"Normal variation","B":"Isolated speech delay","C":"Neurological or developmental disease","D":"Transient delay from prematurity"},"answer":"C","explanation":"Regression suggests underlying neurodegenerative/neurological disease."},{"id":19,"sourceNo":2082,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"Delay in multiple developmental domains suggests:","options":{"A":"Normal variant","B":"Isolated language delay","C":"Specific learning disorder","D":"Global developmental delay"},"answer":"D","explanation":"Multi-domain delay defines global developmental delay."},{"id":20,"sourceNo":2083,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"Which set of domains is assessed by the Denver II?","options":{"A":"Cognitive, emotional, language, gross motor","B":"Visual, auditory, motor, cognitive","C":"Social, intellectual, behavioral, language","D":"Personal-social, fine motor-adaptive, language, gross motor"},"answer":"D","explanation":"Denver II: personal-social, fine motor-adaptive, language, gross motor."},{"id":21,"sourceNo":2084,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"Exclusive breastfeeding is recommended for approximately the first:","options":{"A":"6 months","B":"4 months","C":"2 months","D":"12 months"},"answer":"A","explanation":"Exclusive breastfeeding for ~6 months."},{"id":22,"sourceNo":2085,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"Complementary feeding should begin at around:","options":{"A":"2 months","B":"4 months","C":"9 months","D":"6 months"},"answer":"D","explanation":"Start complementary foods at ~6 months."},{"id":23,"sourceNo":2086,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"Which component of breast milk provides mucosal protection?","options":{"A":"IgG","B":"Secretory IgA","C":"IgE","D":"IgM"},"answer":"B","explanation":"Secretory IgA coats mucosal surfaces."},{"id":24,"sourceNo":2087,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"Colostrum is particularly rich in:","options":{"A":"Iron and vitamin K","B":"Casein and calcium","C":"Immunoglobulins and immune cells","D":"Lactose and fat"},"answer":"C","explanation":"Colostrum is rich in immunoglobulins and leukocytes."},{"id":25,"sourceNo":2088,"subject":"Pediatrics and Neonatology","topic":"Growth, Development and Infant Feeding","question":"Vitamin D supplementation per local guidance is recommended particularly for:","options":{"A":"Formula-fed infants only","B":"Breastfed infants","C":"Children older than 5 years only","D":"Infants with no sun exposure restriction only"},"answer":"B","explanation":"Breast milk is low in vitamin D, so breastfed infants are supplemented."},{"id":26,"sourceNo":2089,"subject":"Pediatrics and Neonatology","topic":"Pediatric Respiratory Infections and Airway Emergencies","question":"The most common cause of bronchiolitis is:","options":{"A":"Parainfluenza virus","B":"Influenza B virus","C":"Respiratory syncytial virus","D":"Adenovirus"},"answer":"C","explanation":"RSV is the commonest cause."},{"id":27,"sourceNo":2090,"subject":"Pediatrics and Neonatology","topic":"Pediatric Respiratory Infections and Airway Emergencies","question":"Bronchiolitis typically affects children younger than:","options":{"A":"2 years","B":"12 years","C":"8 years","D":"5 years"},"answer":"A","explanation":"Usually affects infants and children under 2 years."},{"id":28,"sourceNo":2091,"subject":"Pediatrics and Neonatology","topic":"Pediatric Respiratory Infections and Airway Emergencies","question":"Which presentation is typical of bronchiolitis?","options":{"A":"Paroxysmal cough with inspiratory whoop","B":"Wheezing, crackles and respiratory distress","C":"Barking cough with inspiratory stridor","D":"Drooling with tripod positioning"},"answer":"B","explanation":"Wheeze and crackles with distress characterize bronchiolitis."},{"id":29,"sourceNo":2092,"subject":"Pediatrics and Neonatology","topic":"Pediatric Respiratory Infections and Airway Emergencies","question":"The mainstay of treatment of bronchiolitis is:","options":{"A":"Systemic corticosteroids","B":"Supportive care with oxygen if needed and hydration","C":"Routine nebulized salbutamol","D":"Empirical antibiotics"},"answer":"B","explanation":"Management is supportive."},{"id":30,"sourceNo":2093,"subject":"Pediatrics and Neonatology","topic":"Pediatric Respiratory Infections and Airway Emergencies","question":"Regarding antibiotics in uncomplicated viral bronchiolitis:","options":{"A":"They are not routinely indicated","B":"Amoxicillin is indicated in all","C":"Azithromycin is indicated in all","D":"IV ceftriaxone is indicated in all admitted infants"},"answer":"A","explanation":"Viral illness; routine antibiotics are not indicated."},{"id":31,"sourceNo":2094,"subject":"Pediatrics and Neonatology","topic":"Pediatric Respiratory Infections and Airway Emergencies","question":"Croup is most commonly caused by:","options":{"A":"Haemophilus influenzae type b","B":"Streptococcus pyogenes","C":"Respiratory syncytial virus","D":"Parainfluenza virus"},"answer":"D","explanation":"Parainfluenza virus is the commonest cause."},{"id":32,"sourceNo":2095,"subject":"Pediatrics and Neonatology","topic":"Pediatric Respiratory Infections and Airway Emergencies","question":"Which triad is characteristic of croup?","options":{"A":"Fever, toxicity, purulent tracheal secretions","B":"Barking cough, hoarseness, inspiratory stridor","C":"Wheeze, crackles, tachypnea","D":"Drooling, dysphagia, tripod posture"},"answer":"B","explanation":"Barking cough, hoarseness and inspiratory stridor."},{"id":33,"sourceNo":2096,"subject":"Pediatrics and Neonatology","topic":"Pediatric Respiratory Infections and Airway Emergencies","question":"Dexamethasone in croup is recommended for:","options":{"A":"Hospitalized cases only","B":"Severe cases only","C":"No cases","D":"All severities"},"answer":"D","explanation":"Steroids are recommended in croup of all severities."},{"id":34,"sourceNo":2097,"subject":"Pediatrics and Neonatology","topic":"Pediatric Respiratory Infections and Airway Emergencies","question":"Nebulized epinephrine in croup is used for:","options":{"A":"Relieving obstruction in epiglottitis","B":"Mild croup with a barking cough only","C":"Routine treatment of bronchiolitis","D":"Moderate-to-severe croup with significant stridor or distress"},"answer":"D","explanation":"Reserved for moderate-severe croup."},{"id":35,"sourceNo":2098,"subject":"Pediatrics and Neonatology","topic":"Pediatric Respiratory Infections and Airway Emergencies","question":"Which presentation is classic for epiglottitis?","options":{"A":"Wheeze and crackles in an infant","B":"Drooling, dysphagia and tripod positioning","C":"Sudden choking with unilateral wheeze","D":"Barking cough and hoarseness"},"answer":"B","explanation":"Classic: drooling, dysphagia, tripod positioning."},{"id":36,"sourceNo":2099,"subject":"Pediatrics and Neonatology","topic":"Pediatric Respiratory Infections and Airway Emergencies","question":"Hib vaccination has greatly reduced the incidence of:","options":{"A":"Croup","B":"Epiglottitis","C":"Bronchiolitis","D":"Pertussis"},"answer":"B","explanation":"Hib is the classic cause of epiglottitis."},{"id":37,"sourceNo":2100,"subject":"Pediatrics and Neonatology","topic":"Pediatric Respiratory Infections and Airway Emergencies","question":"The best approach to suspected epiglottitis is:","options":{"A":"Nebulized epinephrine and discharge","B":"Controlled airway management, avoiding unnecessary throat examination","C":"Examining the throat with a tongue depressor","D":"Sending for a lateral neck X-ray in all, even if unstable"},"answer":"B","explanation":"Avoid provoking complete airway obstruction."},{"id":38,"sourceNo":2101,"subject":"Pediatrics and Neonatology","topic":"Pediatric Respiratory Infections and Airway Emergencies","question":"Which presentation suggests foreign-body aspiration?","options":{"A":"Gradual fever with bilateral crackles","B":"Sudden-onset cough with unilateral wheeze","C":"Recurrent bilateral wheeze with atopy","D":"Barking cough with fever"},"answer":"B","explanation":"Sudden cough and unilateral wheeze point to aspiration."},{"id":39,"sourceNo":2102,"subject":"Pediatrics and Neonatology","topic":"Pediatric Respiratory Infections and Airway Emergencies","question":"In suspected inhaled foreign-body aspiration, a normal chest X-ray:","options":{"A":"Excludes the diagnosis","B":"Does not exclude the diagnosis","C":"Makes bronchoscopy unnecessary","D":"Excludes it if taken in inspiration"},"answer":"B","explanation":"Many foreign bodies are radiolucent."},{"id":40,"sourceNo":2103,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"Projectile non-bilious vomiting is classically caused by:","options":{"A":"Intussusception","B":"Duodenal atresia","C":"Malrotation with volvulus","D":"Hypertrophic pyloric stenosis"},"answer":"D","explanation":"Classic for pyloric stenosis."},{"id":41,"sourceNo":2104,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"The classic biochemical finding in pyloric stenosis is:","options":{"A":"Hypochloremic respiratory alkalosis","B":"Hypochloremic, hypokalemic metabolic alkalosis","C":"Hyperkalemic metabolic acidosis","D":"Hyperchloremic metabolic acidosis"},"answer":"B","explanation":"Loss of gastric HCl gives hypochloremic hypokalemic metabolic alkalosis."},{"id":42,"sourceNo":2105,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"The preferred investigation for suspected pyloric stenosis is:","options":{"A":"Ultrasound","B":"MRI abdomen","C":"CT abdomen","D":"Barium meal"},"answer":"A","explanation":"Ultrasound is the investigation of choice."},{"id":43,"sourceNo":2106,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"Which presentation is typical of intussusception?","options":{"A":"Bilious vomiting from birth","B":"Intermittent colicky abdominal pain","C":"Delayed passage of meconium","D":"Painless fresh rectal bleeding"},"answer":"B","explanation":"Intermittent colicky pain is characteristic."},{"id":44,"sourceNo":2107,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"Currant jelly stool is a late classic feature of:","options":{"A":"Meckel diverticulum","B":"Necrotizing enterocolitis","C":"Hirschsprung disease","D":"Intussusception"},"answer":"D","explanation":"Classic late feature of intussusception."},{"id":45,"sourceNo":2108,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"Which ultrasound finding is seen in intussusception?","options":{"A":"Pneumatosis intestinalis","B":"Double bubble sign","C":"Target (doughnut) sign","D":"Whirlpool sign"},"answer":"C","explanation":"Target/doughnut sign."},{"id":46,"sourceNo":2109,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"A stable child with uncomplicated intussusception and no peritonitis is first treated with:","options":{"A":"Pneumatic or hydrostatic enema reduction","B":"Immediate laparotomy","C":"Oral laxatives","D":"Barium swallow"},"answer":"A","explanation":"Enema reduction is first-line in suitable cases."},{"id":47,"sourceNo":2110,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"Meckel diverticulum is a remnant of the:","options":{"A":"Mullerian duct","B":"Urachus","C":"Mesonephric duct","D":"Vitelline duct"},"answer":"D","explanation":"Persistent vitelline (omphalomesenteric) duct."},{"id":48,"sourceNo":2111,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"Meckel diverticulum may present with:","options":{"A":"Painless lower gastrointestinal bleeding","B":"Bilious vomiting in a premature infant","C":"Projectile non-bilious vomiting","D":"Constipation since birth"},"answer":"A","explanation":"Ectopic gastric mucosa causes painless bleeding."},{"id":49,"sourceNo":2112,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"Hirschsprung disease results from:","options":{"A":"Ischemic necrosis of premature bowel","B":"Persistent vitelline duct","C":"Hypertrophy of the pyloric muscle","D":"Absence of ganglion cells in the distal bowel"},"answer":"D","explanation":"Aganglionosis of distal bowel."},{"id":50,"sourceNo":2113,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"Delayed passage of meconium is a clue to:","options":{"A":"Meckel diverticulum","B":"Intussusception","C":"Pyloric stenosis","D":"Hirschsprung disease"},"answer":"D","explanation":"Classic clue to Hirschsprung disease."},{"id":51,"sourceNo":2114,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"The definitive diagnostic test for Hirschsprung disease is:","options":{"A":"Anorectal manometry","B":"Plain abdominal X-ray","C":"Rectal biopsy","D":"Contrast enema"},"answer":"C","explanation":"Biopsy shows absent ganglion cells."},{"id":52,"sourceNo":2115,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"Necrotizing enterocolitis is an important gastrointestinal emergency of:","options":{"A":"Premature infants","B":"Post-term infants","C":"Term exclusively breastfed infants","D":"Toddlers aged 2-3 years"},"answer":"A","explanation":"NEC is mainly a disease of prematurity."},{"id":53,"sourceNo":2116,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"The characteristic radiological finding in necrotizing enterocolitis is:","options":{"A":"Absent gastric bubble","B":"Pneumatosis intestinalis","C":"Target sign","D":"Double bubble sign"},"answer":"B","explanation":"Intramural gas."},{"id":54,"sourceNo":2117,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"Hypertrophic pyloric stenosis commonly presents at which age?","options":{"A":"2-8 weeks","B":"3-4 months","C":"1-2 years","D":"Birth to 3 days"},"answer":"A","explanation":"Typical onset at 2-8 weeks."},{"id":55,"sourceNo":2118,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"A 5-week-old boy has projectile non-bilious vomiting after each feed and remains hungry. Expected biochemistry?","options":{"A":"Hyperkalemia with metabolic acidosis","B":"Hypochloremic, hypokalemic metabolic alkalosis","C":"Hyperchloremic metabolic acidosis","D":"Respiratory acidosis with hypercalcemia"},"answer":"B","explanation":"Vignette of pyloric stenosis."},{"id":56,"sourceNo":2119,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"A 5-week-old infant with projectile non-bilious vomiting is suspected of pyloric stenosis. Preferred investigation?","options":{"A":"CT abdomen","B":"Ultrasound","C":"Upper GI endoscopy","D":"Barium swallow"},"answer":"B","explanation":"Ultrasound is preferred."},{"id":57,"sourceNo":2120,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"A 7-month-old with colicky pain has a target sign on ultrasound. Diagnosis?","options":{"A":"Pyloric stenosis","B":"Malrotation","C":"Intussusception","D":"Meckel diverticulitis"},"answer":"C","explanation":"Target sign means intussusception."},{"id":58,"sourceNo":2121,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"Which structure is a persistent remnant of the vitelline duct?","options":{"A":"Urachal cyst","B":"Duplication cyst","C":"Meckel diverticulum","D":"Appendix"},"answer":"C","explanation":"Meckel diverticulum."},{"id":59,"sourceNo":2122,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"A 2-year-old has massive painless rectal bleeding. Most likely diagnosis?","options":{"A":"Hirschsprung disease","B":"Meckel diverticulum","C":"Intussusception","D":"Anal fissure"},"answer":"B","explanation":"Painless bleeding fits Meckel."},{"id":60,"sourceNo":2123,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"A preterm neonate with feeding intolerance, abdominal distension and bloody stools has pneumatosis intestinalis on X-ray. Diagnosis?","options":{"A":"Duodenal atresia","B":"Hirschsprung disease","C":"Necrotizing enterocolitis","D":"Pyloric stenosis"},"answer":"C","explanation":"Pneumatosis is characteristic of NEC."},{"id":61,"sourceNo":2124,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"Which combination is characteristic of pyloric stenosis?","options":{"A":"Bilious vomiting with metabolic acidosis","B":"Non-projectile vomiting with respiratory acidosis","C":"Bilious vomiting with hyperchloremic metabolic acidosis","D":"Projectile non-bilious vomiting with hypochloremic metabolic alkalosis"},"answer":"D","explanation":"Classic clinical and biochemical combination."},{"id":62,"sourceNo":2125,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"A sausage-shaped abdominal mass in a child suggests:","options":{"A":"Pyloric stenosis","B":"Intussusception","C":"Meckel diverticulum","D":"Hirschsprung disease"},"answer":"B","explanation":"Classic palpable mass of intussusception."},{"id":63,"sourceNo":2126,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"Which statement about red currant jelly stool in intussusception is correct?","options":{"A":"It is pathognomonic of Meckel diverticulum","B":"It occurs only after reduction","C":"It is classical but a late feature","D":"It is early and present in all cases"},"answer":"C","explanation":"Classical but late."},{"id":64,"sourceNo":2127,"subject":"Pediatrics and Neonatology","topic":"Pediatric Gastrointestinal Disorders","question":"A 7-month-old has episodic pain with drawing up of legs, pallor between episodes, then blood- and mucus-stained stool. Diagnosis?","options":{"A":"Meckel diverticulum","B":"Infantile colic","C":"Pyloric stenosis","D":"Intussusception"},"answer":"D","explanation":"Episodic pain plus red currant jelly stool."},{"id":65,"sourceNo":2128,"subject":"Pediatrics and Neonatology","topic":"Pediatric Neurology and Infections","question":"Febrile seizures commonly occur between the ages of:","options":{"A":"5 and 10 years","B":"Birth and 3 months","C":"10 and 15 years","D":"6 months and 5 years"},"answer":"D","explanation":"Typical age 6 months-5 years."},{"id":66,"sourceNo":2129,"subject":"Pediatrics and Neonatology","topic":"Pediatric Neurology and Infections","question":"A simple febrile seizure is:","options":{"A":"Generalized, lasting less than 15 m
