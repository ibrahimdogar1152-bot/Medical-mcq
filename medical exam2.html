inutes, once in 24 hours","B":"Generalized, lasting 20 minutes","C":"Generalized, recurring within 24 hours","D":"Focal, lasting less than 15 minutes"},"answer":"A","explanation":"Definition of simple febrile seizure."},{"id":67,"sourceNo":2130,"subject":"Pediatrics and Neonatology","topic":"Pediatric Neurology and Infections","question":"Which feature makes a febrile seizure complex?","options":{"A":"Occurrence at age 2 years","B":"Recurrence within 24 hours","C":"Duration of 5 minutes","D":"Generalized tonic-clonic activity"},"answer":"B","explanation":"Focal features, 15 minutes or longer, or recurrence in 24 hours."},{"id":68,"sourceNo":2131,"subject":"Pediatrics and Neonatology","topic":"Pediatric Neurology and Infections","question":"Common causes of neonatal meningitis include:","options":{"A":"Group B Streptococcus, E. coli and Listeria","B":"S. pneumoniae, N. meningitidis and Hib","C":"Staph aureus, Pseudomonas and Klebsiella only","D":"M. tuberculosis, Cryptococcus and Candida"},"answer":"A","explanation":"GBS, E. coli and Listeria."},{"id":69,"sourceNo":2132,"subject":"Pediatrics and Neonatology","topic":"Pediatric Neurology and Infections","question":"Empirical therapy for neonatal meningitis should:","options":{"A":"Wait for CSF culture","B":"Be oral amoxicillin","C":"Cover likely neonatal pathogens per local protocol","D":"Cover only Gram-positive cocci"},"answer":"C","explanation":"Start promptly covering GBS, E. coli and Listeria."},{"id":70,"sourceNo":2133,"subject":"Pediatrics and Neonatology","topic":"Pediatric Neurology and Infections","question":"Poliovirus classically causes:","options":{"A":"Proximal weakness with Gowers sign","B":"Spastic paraparesis","C":"Ascending symmetrical paralysis with sensory loss","D":"Acute asymmetric flaccid paralysis"},"answer":"D","explanation":"Polio causes asymmetric flaccid paralysis."},{"id":71,"sourceNo":2134,"subject":"Pediatrics and Neonatology","topic":"Pediatric Neurology and Infections","question":"Guillain-Barre syndrome typically causes:","options":{"A":"Ascending symmetrical weakness with reduced reflexes","B":"Proximal weakness with Gowers sign","C":"Asymmetric flaccid paralysis with fever","D":"Spastic weakness with hyperreflexia"},"answer":"A","explanation":"Ascending areflexic weakness."},{"id":72,"sourceNo":2135,"subject":"Pediatrics and Neonatology","topic":"Pediatric Neurology and Infections","question":"Duchenne muscular dystrophy is caused by deficiency of:","options":{"A":"Dysferlin","B":"Acid maltase","C":"Calpain-3","D":"Dystrophin"},"answer":"D","explanation":"Dystrophin deficiency."},{"id":73,"sourceNo":2136,"subject":"Pediatrics and Neonatology","topic":"Pediatric Neurology and Infections","question":"Gowers sign indicates:","options":{"A":"Cerebellar ataxia","B":"Sensory neuropathy","C":"Proximal muscle weakness, e.g. in Duchenne muscular dystrophy","D":"Distal muscle weakness"},"answer":"C","explanation":"Climbing up the legs due to proximal weakness."},{"id":74,"sourceNo":2137,"subject":"Pediatrics and Neonatology","topic":"Pediatric Neurology and Infections","question":"Duchenne muscular dystrophy is usually inherited as:","options":{"A":"X-linked recessive","B":"Mitochondrial","C":"Autosomal recessive","D":"Autosomal dominant"},"answer":"A","explanation":"X-linked recessive."},{"id":75,"sourceNo":2138,"subject":"Pediatrics and Neonatology","topic":"Pediatric Neurology and Infections","question":"Cerebral palsy is best defined as:","options":{"A":"A permanent disorder of movement and posture due to a non-progressive disturbance of the developing brain","B":"A peripheral neuropathy of neonatal onset","C":"A progressive neurodegenerative disorder","D":"A transient motor delay resolving by 2 years"},"answer":"A","explanation":"Non-progressive insult to the developing brain."},{"id":76,"sourceNo":2139,"subject":"Pediatrics and Neonatology","topic":"Neonatology and Congenital Disorders","question":"Respiratory distress syndrome in premature infants results from:","options":{"A":"Pulmonary hypoplasia","B":"Surfactant deficiency","C":"Meconium aspiration","D":"Delayed clearance of fetal lung fluid"},"answer":"B","explanation":"Surfactant deficiency."},{"id":77,"sourceNo":2140,"subject":"Pediatrics and Neonatology","topic":"Neonatology and Congenital Disorders","question":"Antenatal corticosteroids when preterm delivery is anticipated primarily reduce the risk of:","options":{"A":"Neonatal respiratory distress syndrome","B":"Congenital infection","C":"Neonatal hyperbilirubinemia","D":"Retinopathy of prematurity"},"answer":"A","explanation":"Steroids accelerate lung maturity."},{"id":78,"sourceNo":2141,"subject":"Pediatrics and Neonatology","topic":"Neonatology and Congenital Disorders","question":"Transient tachypnea of the newborn results from:","options":{"A":"Surfactant deficiency","B":"Delayed clearance of fetal lung fluid","C":"Right-to-left shunting","D":"Meconium aspiration"},"answer":"B","explanation":"Retained lung fluid."},{"id":79,"sourceNo":2142,"subject":"Pediatrics and Neonatology","topic":"Neonatology and Congenital Disorders","question":"Persistent pulmonary hypertension of the newborn causes hypoxemia due to:","options":{"A":"Delayed clearance of lung fluid","B":"Surfactant deficiency","C":"Right-to-left shunting","D":"Left-to-right shunting"},"answer":"C","explanation":"High PVR causes right-to-left shunt."},{"id":80,"sourceNo":2143,"subject":"Pediatrics and Neonatology","topic":"Neonatology and Congenital Disorders","question":"Hypoxic-ischemic encephalopathy results from:","options":{"A":"Neonatal hypoglycemia","B":"Bilirubin deposition in the basal ganglia","C":"Impaired oxygen delivery and blood flow to the brain","D":"Traumatic intracranial hemorrhage"},"answer":"C","explanation":"Perinatal asphyxia."},{"id":81,"sourceNo":2144,"subject":"Pediatrics and Neonatology","topic":"Neonatology and Congenital Disorders","question":"Therapeutic hypothermia may be offered to eligible newborns with:","options":{"A":"Respiratory distress syndrome","B":"Moderate-to-severe hypoxic-ischemic encephalopathy","C":"Neonatal sepsis","D":"Neonatal hypoglycemia"},"answer":"B","explanation":"Neuroprotective in HIE."},{"id":82,"sourceNo":2145,"subject":"Pediatrics and Neonatology","topic":"Neonatology and Congenital Disorders","question":"Physiological neonatal jaundice usually appears:","options":{"A":"Within the first 24 hours","B":"After the first 24 hours","C":"Only after 2 weeks","D":"At birth"},"answer":"B","explanation":"Appears after 24 hours."},{"id":83,"sourceNo":2146,"subject":"Pediatrics and Neonatology","topic":"Neonatology and Congenital Disorders","question":"Jaundice appearing within the first 24 hours of life should be regarded as:","options":{"A":"Pathological until proven otherwise","B":"Breast milk jaundice","C":"Benign and needing no evaluation","D":"Physiological"},"answer":"A","explanation":"Early jaundice is pathological."},{"id":84,"sourceNo":2147,"subject":"Pediatrics and Neonatology","topic":"Neonatology and Congenital Disorders","question":"Unconjugated hyperbilirubinemia in a neonate can cause:","options":{"A":"Kernicterus","B":"Choledochal cyst","C":"Pale stools and dark urine","D":"Biliary cirrhosis"},"answer":"A","explanation":"Unconjugated bilirubin crosses the blood-brain barrier."},{"id":85,"sourceNo":2148,"subject":"Pediatrics and Neonatology","topic":"Neonatology and Congenital Disorders","question":"The direct antiglobulin test helps identify:","options":{"A":"G6PD deficiency","B":"Immune-mediated neonatal hemolysis","C":"Biliary atresia","D":"Hereditary spherocytosis"},"answer":"B","explanation":"DAT is positive in immune hemolysis."},{"id":86,"sourceNo":2149,"subject":"Pediatrics and Neonatology","topic":"Neonatology and Congenital Disorders","question":"Physiological weight loss in term newborns is commonly up to approximately:","options":{"A":"15-20%","B":"25-30%","C":"Less than 1%","D":"7-10% of birth weight"},"answer":"D","explana and Congenital Disorders","question":"A preterm infant on increasing enteral feeds develops feeding intolerance and abdominal distension. Most concerning diagnosis?","options":{"A":"Pyloric stenosis","B":"Hirschsprung disease","C":"Physiological reflux","D":"Necrotizing enterocolitis"},"answer":"D","explanation":"Prematurity plus feeds suggests NEC."},{"id":93,"sourceNo":2156,"subject":"Pediatrics and Neonatology","topic":"Neonatology and Congenital Disorders","question":"A term neonate is jaundiced at 12 hours of age. The best interpretation is:","options":{"A":"Breast milk jaundice, continue feeds only","B":"Physiological jaundice, reassure","C":"Pathological jaundice needing urgent evaluation","D":"Benign, recheck in 1 week"},"answer":"C","explanation":"Jaundice in first 24 hours is pathological."},{"id":94,"sourceNo":2157,"subject":"Pediatrics and Neonatology","topic":"Neonatology and Congenital Disorders","question":"Kernicterus refers to:","options":{"A":"Bilirubin deposition in the brain","B":"Hypoxic neuronal necrosis","C":"Bilirubin deposition in the liver","D":"Cerebral hemorrhage"},"answer":"A","explanation":"Bilirubin deposition in the basal ganglia."},{"id":95,"sourceNo":2158,"subject":"Pediatrics and Neonatology","topic":"Pediatric Emergencies and Fluid Management","question":"Severe dehydration in a child requires:","options":{"A":"Prompt assessment and appropriate fluid resuscitation","B":"Antidiarrheals","C":"Oral sips only","D":"Observation only"},"answer":"A","explanation":"Prompt resuscitation."},{"id":96,"sourceNo":2159,"subject":"Pediatrics and Neonatology","topic":"Pediatric Emergencies and Fluid Management","question":"Oral rehydration solution works through:","options":{"A":"Na-K ATPase in the colon","B":"Sodium-glucose cotransport in the small intestine","C":"Passive paracellular diffusion only","D":"Chloride secretion"},"answer":"B","explanation":"SGLT1 cotransport."},{"id":97,"sourceNo":2160,"subject":"Pediatrics and Neonatology","topic":"Pediatric Emergencies and Fluid Management","question":"Reduced-osmolarity ORS is recommended for:","options":{"A":"Most children with acute diarrhea","B":"Only severe malnutrition","C":"Only cholera","D":"Only adults"},"answer":"A","explanation":"WHO standard."},{"id":98,"sourceNo":2161,"subject":"Pediatrics and Neonatology","topic":"Pediatric Emergencies and Fluid Management","question":"WHO guidance on zinc in childhood acute diarrhea is that it is:","options":{"A":"Only for adults","B":"Contraindicated","C":"Only for chronic diarrhea","D":"Recommended"},"answer":"D","explanation":"Zinc reduces duration and severity."},{"id":99,"sourceNo":2162,"subject":"Pediatrics and Neonatology","topic":"Pediatric Emergencies and Fluid Management","question":"Initial fluid in pediatric hypovolemic shock is commonly:","options":{"A":"Isotonic crystalloid","B":"Routine albumin","C":"Hypotonic dextrose solution","D":"Oral rehydration solution"},"answer":"A","explanation":"Isotonic crystalloid bolus."},{"id":100,"sourceNo":2163,"subject":"Pediatrics and Neonatology","topic":"Pediatric Emergencies and Fluid Management","question":"After each fluid bolus in pediatric shock you should:","options":{"A":"Reassess pulse, perfusion, respiratory status and mental state","B":"Wait 24 hours","C":"Give the next bolus without reassessment","D":"Check urine output only"},"answer":"A","explanation":"Reassess to detect overload."},{"id":101,"sourceNo":2164,"subject":"Pediatrics and Neonatology","topic":"Pediatric Emergencies and Fluid Management","question":"Children with severe malnutrition need specialized fluid management because of the risk of:","options":{"A":"Hypernatremia from ORS","B":"Fluid overload","C":"Hypercalcemia","D":"Hyperglycemia"},"answer":"B","explanation":"Heart failure with rapid fluids."},{"id":102,"sourceNo":2165,"subject":"Pediatrics and Neonatology","topic":"Pediatric Emergencies and Fluid Management","question":"Diabetic ketoacidosis in children commonly presents with:","options":{"A":"Dehydration, vomiting, abdominal pain and Kussmaul breathing","B":"Hypoventilation and hypothermia","C":"Cough and wheeze","D":"Bradycardia, hypertension and constipation"},"answer":"A","explanation":"Classic DKA picture."},{"id":103,"sourceNo":2166,"subject":"Pediatrics and Neonatology","topic":"Pediatric Emergencies and Fluid Management","question":"A serious complication of pediatric diabetic ketoacidosis is:","options":{"A":"Renal cortical necrosis","B":"Cerebral injury","C":"Pulmonary fibrosis","D":"Hypercalcemia"},"answer":"B","explanation":"Cerebral edema/injury."},{"id":104,"sourceNo":2167,"subject":"Pediatrics and Neonatology","topic":"Pediatric Emergencies and Fluid Management","question":"In pediatric DKA, insulin is generally:","options":{"A":"Given only subcutaneously","B":"Started before potassium is known","C":"Given as an immediate IV bolus before fluids","D":"Started after initial fluids and checking serum potassium, without a routine bolus"},"answer":"D","explanation":"Fluids first, check K, then infusion."}]},{"id":"ophthalmology","scheme":"dash","name":"Ophthalmology SBA MCQs","subject":"Ophthalmology","questions":[{"id":1,"number":2168,"topic":"Basic Ophthalmology and Anatomy","question":"On the Snellen chart, normal visual acuity is conventionally recorded as:","options":{"A":"6/60","B":"6/6","C":"6/18","D":"6/12","E":"6/36"},"answer":"B","explanation":"Normal acuity is 6/6: the patient reads at 6 m what a normal eye reads at 6 m."},{"id":2,"number":2169,"topic":"Basic Ophthalmology and Anatomy","question":"The normal range of intraocular pressure measured by tonometry is approximately:","options":{"A":"25–35 mmHg","B":"10–21 mmHg","C":"2–8 mmHg","D":"22–30 mmHg","E":"30–40 mmHg"},"answer":"B","explanation":"Normal IOP is about 10–21 mmHg; sustained values above this raise glaucoma risk."},{"id":3,"number":2170,"topic":"Basic Ophthalmology and Anatomy","question":"The optic nerve is formed by the axons of which retinal cells?","options":{"A":"Horizontal cells","B":"Bipolar cells","C":"Amacrine cells","D":"Photoreceptors","E":"Ganglion cells"},"answer":"E","explanation":"Retinal ganglion cell axons converge at the optic disc to form the optic nerve."},{"id":4,"number":2171,"topic":"Basic Ophthalmology and Anatomy","question":"The central retinal artery is a direct branch of which vessel?","options":{"A":"External carotid artery","B":"Internal carotid artery","C":"Facial artery","D":"Ophthalmic artery","E":"Maxillary artery"},"answer":"D","explanation":"Central retinal artery arises from the ophthalmic artery and is an end artery."},{"id":5,"number":2172,"topic":"Basic Ophthalmology and Anatomy","question":"The ophthalmic artery arises from which vessel?","options":{"A":"Maxillary artery","B":"Internal carotid artery","C":"Basilar artery","D":"External carotid artery","E":"Vertebral artery"},"answer":"B","explanation":"Ophthalmic artery is a branch of the internal carotid as it exits the cavernous sinus."},{"id":6,"number":2173,"topic":"Basic Ophthalmology and Anatomy","question":"Which part of the retina is responsible for central vision?","options":{"A":"Ora serrata","B":"Macula","C":"Pars plana","D":"Peripheral retina","E":"Optic disc"},"answer":"B","explanation":"The macula subserves central, detailed vision."},{"id":7,"number":2174,"topic":"Basic Ophthalmology and Anatomy","question":"Which retinal structure provides the highest visual acuity?","options":{"A":"Fovea centralis","B":"Parafovea","C":"Equator of the retina","D":"Ora serrata","E":"Optic disc"},"answer":"A","explanation":"The fovea has the highest cone density and gives maximal acuity."},{"id":8,"number":2175,"topic":"Basic Ophthalmology and Anatomy","question":"Which photoreceptors are responsible for scotopic (dim-light) vision?","options":{"A":"Retinal pigment epithelium","B":"Rods","C":"Cones","D":"Müller cells","E":"Bipolar cells"},"answer":"B","explanation":"Rods are highly light-sensitive and mediate night vision."},{"id":9,"number":2176,"topic":"Basic Ophthalmology and Anatomy","question":"Which photoreceptors are responsible for colour vision and high acuity?","options":{"A":"Rods","B":"Horizontal cells","C":"Ganglion cells","D":"Amacrine cells","E":"Cones"},"answer":"E","explanation":"Cones are concentrated at the fovea and mediate colour and detail."},{"id":10,"number":2177,"topic":"Basic Ophthalmology and Anatomy","question":"The physiological blind spot corresponds to which structure, as it lacks photoreceptors?","options":{"A":"Macula lutea","B":"Choroid","C":"Optic disc","D":"Fovea","E":"Ora serrata"},"answer":"C","explanation":"Optic disc has no rods or cones, hence the blind spot."},{"id":11,"number":2178,"topic":"Glaucoma","question":"Glaucoma is best characterised as:","options":{"A":"Occlusion of the central retinal vein","B":"Progressive corneal thinning and ectasia","C":"Inflammation of the uveal tract","D":"Progressive optic neuropathy with characteristic optic nerve damage","E":"Opacification of the crystalline lens"},"answer":"D","explanation":"Glaucoma = progressive optic neuropathy; IOP is a major risk factor, not the definition."},{"id":12,"number":2179,"topic":"Glaucoma","question":"A 58-year-old presents with gradual, painless peripheral field loss and a normal-looking eye. The most likely diagnosis is:","options":{"A":"Central retinal artery occlusion","B":"Primary open-angle glaucoma","C":"Acute angle-closure glaucoma","D":"Acute anterior uveitis","E":"Optic neuritis"},"answer":"B","explanation":"POAG is usually chronic and painless."},{"id":13,"number":2180,"topic":"Glaucoma","question":"Which of the following is an important risk factor for glaucoma?","options":{"A":"Increased intraocular pressure","B":"Hypotony","C":"Pterygium","D":"Cataract","E":"Dry eye"},"answer":"A","explanation":"Raised IOP is the major modifiable risk factor."},{"id":14,"number":2181,"topic":"Glaucoma","question":"The mechanism of primary open-angle glaucoma is:","options":{"A":"Overproduction of aqueous by the ciliary body","B":"Paralysis of the ciliary muscle","C":"Increased resistance to aqueous outflow through the trabecular meshwork","D":"Pupillary block by the lens","E":"Closure of the angle by peripheral anterior synechiae"},"answer":"C","explanation":"Open angle but increased trabecular outflow resistance."},{"id":15,"number":2182,"topic":"Glaucoma","question":"Which type of glaucoma is an ophthalmic emergency?","options":{"A":"Pigmentary glaucoma","B":"Normal-tension glaucoma","C":"Pseudoexfoliative glaucoma","D":"Primary open-angle glaucoma","E":"Acute angle-closure glaucoma"},"answer":"E","explanation":"Acute angle closure needs urgent IOP lowering to save vision."},{"id":16,"number":2183,"topic":"Glaucoma","question":"A 60-year-old hypermetropic woman presents in the evening with severe eye pain, headache, blurred vision and halos around lights. The diagnosis is:","options":{"A":"Acute anterior uveitis","B":"Central retinal artery occlusion","C":"Optic neuritis","D":"Primary open-angle glaucoma","E":"Acute angle-closure glaucoma"},"answer":"E","explanation":"Pain, headache, blurring and halos are classic for acute angle closure."},{"id":17,"number":2184,"topic":"Glaucoma","question":"A painful red eye with a mid-dilated, fixed pupil is characteristic of:","options":{"A":"Episcleritis","B":"Acute anterior uveitis","C":"Acute angle-closure glaucoma","D":"Acute bacterial conjunctivitis","E":"Corneal abrasion"},"answer":"C","explanation":"Iris ischaemia/high IOP gives a mid-dilated, non-reactive pupil. Uveitis gives a small pupil."},{"id":18,"number":2185,"topic":"Glaucoma","question":"A patient with severe headache, vomiting and a red eye is initially misdiagnosed with an acute abdomen/migraine. Which condition causes nausea and vomiting as part of its presentation?","options":{"A":"Chalazion","B":"Acute angle-closure glaucoma","C":"Primary open-angle glaucoma","D":"Pterygium","E":"Senile cataract"},"answer":"B","explanation":"Acute angle closure may present with nausea and vomiting and mimic systemic illness."},{"id":19,"number":2186,"topic":"Glaucoma","question":"Gonioscopy is used to assess:","options":{"A":"Corneal endothelium","B":"Macular thickness","C":"The anterior chamber angle","D":"The optic disc","E":"The visual field"},"answer":"C","explanation":"Gonioscopy distinguishes open from closed angle."},{"id":20,"number":2187,"topic":"Glaucoma","question":"Which optic disc finding is characteristic of glaucomatous optic neuropathy?","options":{"A":"Cherry-red appearance","B":"Waxy pallor with attenuated vessels","C":"Blurred margins with hyperaemia","D":"Pigmented chorioretinal scars","E":"Increased cupping (large cup-disc ratio)"},"answer":"E","explanation":"Progressive cupping is the hallmark."},{"id":21,"number":2188,"topic":"Glaucoma","question":"Latanoprost lowers intraocular pressure by:","options":{"A":"Inhibiting carbonic anhydrase","B":"Increasing uveoscleral outflow","C":"Osmotic dehydration of vitreous","D":"Decreasing aqueous production","E":"Increasing trabecular outflow via miosis"},"answer":"B","explanation":"Prostaglandin analogues increase uveoscleral outflow."},{"id":22,"number":2189,"topic":"Glaucoma","question":"Timolol lowers intraocular pressure by:","options":{"A":"Increasing uveoscleral outflow","B":"Increasing trabecular outflow","C":"Reducing aqueous humour production","D":"Osmotic dehydration of vitreous","E":"Causing miosis"},"answer":"C","explanation":"Beta-blocker that reduces aqueous production by ciliary epithelium."},{"id":23,"number":2190,"topic":"Glaucoma","question":"Acetazolamide decreases aqueous humour production by:","options":{"A":"Cholinergic stimulation of ciliary muscle","B":"Blocking beta-adrenergic receptors","C":"Inhibiting carbonic anhydrase","D":"Increasing uveoscleral outflow","E":"Stimulating alpha-2 receptors"},"answer":"C","explanation":"Carbonic anhydrase inhibition reduces bicarbonate and aqueous formation."},{"id":24,"number":2191,"topic":"Glaucoma","question":"Laser peripheral iridotomy is an important treatment for:","options":{"A":"Retinal tear","B":"Primary open-angle glaucoma","C":"Posterior capsule opacification","D":"Proliferative diabetic retinopathy","E":"Pupillary-block angle-closure glaucoma"},"answer":"E","explanation":"It creates an alternate aqueous pathway bypassing pupillary block."},{"id":25,"number":2192,"topic":"Glaucoma","question":"An infant presents with epiphora, photophobia and blepharospasm. The most likely diagnosis is:","options":{"A":"Congenital nasolacrimal duct obstruction","B":"Congenital glaucoma","C":"Neonatal conjunctivitis","D":"Retinopathy of prematurity","E":"Retinoblastoma"},"answer":"B","explanation":"The triad is classic for congenital glaucoma; NLDO has no photophobia."},{"id":26,"number":2193,"topic":"Glaucoma","question":"What is the term for enlargement of the eyeball in childhood glaucoma?","options":{"A":"Phthisis bulbi","B":"Microphthalmos","C":"Enophthalmos","D":"Buphthalmos","E":"Anophthalmos"},"answer":"D","explanation":"Elastic infantile eye enlarges under raised IOP: buphthalmos (ox-eye)."},{"id":27,"number":2194,"topic":"Cataract","question":"Cataract is defined as:","options":{"A":"Swelling of the optic disc","B":"Inflammation of the uvea","C":"Opacification of the cornea","D":"Detachment of the neurosensory retina","E":"Opacification of the crystalline lens"},"answer":"E","explanation":"Any lens opacity is a cataract."},{"id":28,"number":2195,"topic":"Cataract","question":"Which is the most common type of cataract?","options":{"A":"Congenital cataract","B":"Complicated cataract","C":"Steroid-induced cataract","D":"Age-related (senile) cataract","E":"Traumatic cataract"},"answer":"D","explanation":"Senile cataract is by far the commonest."},{"id":29,"number":2196,"topic":"Cataract","question":"Which systemic disease increases the risk of cataract formation?","options":{"A":"Acromegaly","B":"Hyperparathyroidism","C":"Phaeochromocytoma","D":"Diabetes mellitus","E":"Hypothyroidism"},"answer":"D","explanation":"Diabetes causes earlier and more rapid cataract formation."},{"id":30,"number":2197,"topic":"Cataract","question":"Which type of cataract commonly causes difficulty with near vision and glare?","options":{"A":"Nuclear sclerosis","B":"Cortical cataract","C":"Anterior polar cataract","D":"Posterior subcapsular cataract","E":"Sutural cataract"},"answer":"D","explanation":"Axial PSC opacity worsens in bright light and with miosis on near work."},{"id":31,"number":2198,"topic":"Cataract","question":"Nuclear sclerosis typically causes:","options":{"A":"Progressive myopic shift","B":"Nyctalopia","C":"Central scotoma","D":"Hypermetropic shift","E":"Progressive astigmatism"},"answer":"A","explanation":"Increased lens refractive index produces myopic shift ('second sight')."},{"id":32,"number":2199,"topic":"Cataract","question":"Long-term corticosteroid use is classically associated with which cataract type?","options":{"A":"Nuclear sclerosis","B":"Cortical cataract","C":"Sutural cataract","D":"Anterior polar cataract","E":"Posterior subcapsular cataract"},"answer":"E","explanation":"Steroids produce PSC."},{"id":33,"number":2200,"topic":"Cataract","question":"A dense untreated congenital cataract in infancy can result in:","options":{"A":"Anisometropic amblyopia","B":"Strabismic amblyopia","C":"Toxic amblyopia","D":"Meridional amblyopia","E":"Deprivation amblyopia"},"answer":"E","explanation":"Visual axis blockage during critical period causes deprivation amblyopia."},{"id":34,"number":2201,"topic":"Cataract","question":"In a patient with a significant cataract, the red reflex is:","options":{"A":"Pulsatile","B":"Normal","C":"Absent or reduced","D":"Cherry-red","E":"Exaggerated"},"answer":"C","explanation":"Lens opacity blocks the fundal glow."},{"id":35,"number":2202,"topic":"Cataract","question":"Which technique is most commonly used for cataract extraction today?","options":{"A":"Phacoemulsification","B":"Lensectomy via pars plana","C":"Couching","D":"Intracapsular cataract extraction","E":"Cryo-extraction"},"answer":"A","explanation":"Phaco with foldable IOL via a small incision is standard."},{"id":36,"number":2203,"topic":"Cataract","question":"An intraocular lens is usually implanted after which procedure?","options":{"A":"Dacryocystorhinostomy","B":"Trabeculectomy","C":"Corneal transplantation","D":"Cataract extraction","E":"Vitrectomy"},"answer":"D","explanation":"IOL replaces the removed lens' power."},{"id":37,"number":2204,"topic":"Retinal Diseases","question":"Which condition is a major cause of preventable blindness in working-age adults?","options":{"A":"Age-related macular degeneration","B":"Trachoma","C":"Senile cataract","D":"Retinitis pigmentosa","E":"Diabetic retinopathy"},"answer":"E","explanation":"Diabetic retinopathy leads among working-age adults."},{"id":38,"number":2205,"topic":"Retinal Diseases","question":"What is the earliest clinically visible feature of diabetic retinopathy?","options":{"A":"Microaneurysms","B":"Intraretinal microvascular abnormalities","C":"Cotton-wool spots","D":"Neovascularisation","E":"Hard exudates"},"answer":"A","explanation":"Microaneurysms appear first."},{"id":39,"number":2206,"topic":"Retinal Diseases","question":"Hard exudates in diabetic retinopathy represent:","options":{"A":"New vessel formation","B":"Microinfarcts of the nerve fibre layer","C":"Drusen","D":"Lipid deposits in the retina","E":"Intraretinal haemorrhage"},"answer":"D","explanation":"Lipoprotein leakage forms yellow, sharply defined deposits."},{"id":40,"number":2207,"topic":"Retinal Diseases","question":"Cotton-wool spots represent:","options":{"A":"Nerve fibre layer microinfarcts","B":"Neovascular tufts","C":"Intraretinal haemorrhage","D":"Choroidal scars","E":"Lipid deposits"},"answer":"A","explanation":"Ischaemic RNFL infarcts with axoplasmic stasis."},{"id":41,"number":2208,"topic":"Retinal Diseases","question":"Proliferative diabetic retinopathy is characterised by:","options":{"A":"Microaneurysms only","B":"Macular oedema only","C":"Retinal neovascularisation","D":"Dot-blot haemorrhages only","E":"Hard exudates only"},"answer":"C","explanation":"Neovascularisation on disc or elsewhere defines PDR."},{"id":42,"number":2209,"topic":"Retinal Diseases","question":"Retinal neovascularisation in diabetes increases the risk of:","options":{"A":"Lens subluxation","B":"Corneal ulceration","C":"Vitreous haemorrhage and tractional retinal detachment","D":"Keratomalacia","E":"Optic neuritis"},"answer":"C","explanation":"Fragile new vessels bleed and fibrous tissue contracts."},{"id":43,"number":2210,"topic":"Retinal Diseases","question":"Panretinal photocoagulation is used in selected patients with:","options":{"A":"Mild non-proliferative diabetic retinopathy","B":"Central retinal artery occlusion","C":"Retinitis pigmentosa","D":"Proliferative diabetic retinopathy","E":"Dry age-related macular degeneration"},"answer":"D","explanation":"PRP ablates ischaemic retina to reduce VEGF drive."},{"id":44,"number":2211,"topic":"Retinal Diseases","question":"Diabetic macular oedema can occur:","options":{"A":"Only after panretinal photocoagulation","B":"At any stage of diabetic retinopathy","C":"Only in proliferative disease","D":"Only in mild non-proliferative disease","E":"Only in type 1 diabetes"},"answer":"B","explanation":"DME is the commonest cause of visual loss in DR and can occur at any stage."},{"id":45,"number":2212,"topic":"Retinal Diseases","question":"Age-related macular degeneration causes:","options":{"A":"Homonymous hemianopia","B":"Progressive loss of central vision","C":"Loss of peripheral vision","D":"Night blindness","E":"Tunnel vision"},"answer":"B","explanation":"Macular involvement leads to central scotoma."},{"id":46,"number":2213,"topic":"Retinal Diseases","question":"Drusen are characteristic deposits of:","options":{"A":"Hypertensive retinopathy","B":"Central retinal vein occlusion","C":"Diabetic retinopathy","D":"Retinitis pigmentosa","E":"Age-related macular degeneration"},"answer":"E","explanation":"Yellow subretinal deposits are hallmark of AMD."},{"id":47,"number":2214,"topic":"Retinal Diseases","question":"Wet (neovascular) age-related macular degeneration involves:","options":{"A":"Retinal neovascularisation from the disc","B":"Choroidal neovascularisation","C":"Optic atrophy","D":"Geographic atrophy","E":"Drusen only"},"answer":"B","explanation":"CNV leaks and bleeds under the retina."},{"id":48,"number":2215,"topic":"Retinal Diseases","question":"Intravitreal anti-VEGF injections are commonly used for:","options":{"A":"Neovascular age-related macular degeneration","B":"Dry age-related macular degeneration","C":"Central retinal artery occlusion","D":"Rhegmatogenous retinal detachment","E":"Retinitis pigmentosa"},"answer":"A","explanation":"Anti-VEGF is first-line for wet AMD."},{"id":49,"number":2216,"topic":"Retinal Diseases","question":"A myopic patient reports flashes, floaters and a curtain-like shadow over vision. The most likely diagnosis is:","options":{"A":"Anterior uveitis","B":"Central retinal artery occlusion","C":"Optic neuritis","D":"Acute angle-closure glaucoma","E":"Retinal detachment"},"answer":"E","explanation":"Classic symptoms of retinal detachment."},{"id":50,"number":2217,"topic":"Retinal Diseases","question":"Rhegmatogenous retinal detachment occurs due to:","options":{"A":"Vitreoretinal traction by fibrovascular membranes","B":"A retinal break","C":"Raised intracranial pressure","D":"Choroidal effusion","E":"Exudation from a choroidal tumour"},"answer":"B","explanation":"Rhegma = break; fluid passes through it into the subretinal space."},{"id":51,"number":2218,"topic":"Retinal Diseases","question":"A 65-year-old hypertensive man reports sudden, painless loss of vision in one eye. The most likely diagnosis is:","options":{"A":"Corneal ulcer","B":"Central retinal artery occlusion","C":"Acute angle-closure glaucoma","D":"Optic neuritis","E":"Acute anterior uveitis"},"answer":"B","explanation":"Sudden painless monocular loss suggests CRAO; optic neuritis is painful."},{"id":52,"number":2219,"topic":"Retinal Diseases","question":"Which fundoscopic finding is classic for central retinal artery occlusion?","options":{"A":"Cherry-red spot","B":"Hard exudates in a circinate ring","C":"Blood-and-thunder appearance","D":"Bone-spicule pigmentation","E":"Salt-and-pepper pigmentation"},"answer":"A","explanation":"Ischaemic whitening with a preserved choroidal-red fovea."},{"id":53,"number":2220,"topic":"Retinal Diseases","question":"Which fundoscopic appearance characterises central retinal vein occlusion?","options":{"A":"Cherry-red spot","B":"Pale disc with waxy vessels","C":"Salt-and-pepper retinopathy","D":"Blood and thunder","E":"Bone-spicule pigmentation"},"answer":"D","explanation":"Widespread haemorrhages, tortuous veins and disc oedema."},{"id":54,"number":2221,"topic":"Retinal Diseases","question":"Which fundus findings are seen in hypertensive retinopathy?","options":{"A":"Drusen","B":"Neovascularisation of the disc","C":"Cherry-red spot","D":"Bone-spicule pigmentation","E":"Arteriolar narrowing and arteriovenous nicking"},"answer":"E","explanation":"AV nicking and arteriolar narrowing are the typical findings."},{"id":55,"number":2222,"topic":"Retinal Diseases","question":"Papilloedema is:","options":{"A":"Optic disc cupping due to raised IOP","B":"Optic disc hypoplasia","C":"Optic disc swelling due to optic neuritis only","D":"Optic disc pallor due to atrophy","E":"Optic disc swelling due to raised intracranial pressure"},"answer":"E","explanation":"By definition, disc swelling from raised ICP."},{"id":56,"number":2223,"topic":"Cornea and Conjunctiva","question":"A patient with a fingernail scratch to the eye has pain, watering and photophobia. The diagnosis is:","options":{"A":"Central retinal artery occlusion","B":"Acute angle-closure glaucoma","C":"Corneal abrasion","D":"Reti <script>
(()=>{'use strict';
/* =====================================================================

const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L='ABCDEF',DAY=864e5,IV_LEITNER=[1,2,4,8,16,32],GAP=[0,1,3,7,14,30];

const pc=(a,b)=>b?Math.round(a/b*100):0;

const hash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36)};
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- question normalisation (both source formats -> one model) ---------- */
function normQ(q){
 let o=q.options,ans=q.answer,opts=[];
 if(Array.isArray(o)){opts=o.map(x=>String(x??''))}
 else if(o&&typeof o==='object'){const ks=Object.keys(o).sort();opts=ks.map(k=>String(o[k]??''));
  if(typeof ans==='string'&&!/^\d+$/.test(ans.trim())){const i=ks.indexOf(ans.trim().toUpperCase());ans=i}}
 if(typeof ans==='string')ans=/^\d+$/.test(ans.trim())?+ans:L.indexOf(ans.trim().toUpperCase());
 if(typeof ans!=='number'||isNaN(ans))ans=-1;
 return {...q,options:opts,answer:ans,answerLetter:ans>=0?L[ans]:''};
}
const SEED_A=JSON.parse($('#seedA').textContent),SEED_B=JSON.parse($('#seedB').textContent),SEED_BANKS=JSON.parse($('#seedBanks').textContent);
const slugify=s=>String(s||'bank').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

/* later banks keep the uid scheme of the app they came from: MedBCQ.html + Master.html => "<bank>:<id>" (colon), Master.html ophthalmology => "<subject-slug>-<id>" (dash) */
const BASE=[...SEED_A.map(q=>({...normQ(q),uid:'pp-'+q.id,_s:1})),...SEED_B.map(q=>({...normQ(q),uid:String(q.id),_s:1})),
 ...SEED_BANKS.flatMap(b=>b.questions.map(q=>({...normQ({subject:b.subject,...q}),uid:b.scheme==='dash'?slugify(b.subject||b.id)+'-'+q.id:b.id+':'+q.id,bank:b.id,_s:1})))];
const BASEU=new Set(BASE.map(q=>q.uid));

const KEY='medbcq-master';
const DS={theme:'blue',goal:30,exam:'',accent:'#1d5fd6',examName:'',srs:'sm2'};

let S=mk(),_all=null,_by=null,MDB=null;
const ST0=()=>({a:0,c:0,t:0,l:null,ts:0,bm:0,ef:2.5,iv:0,due:0,bx:0,h:[]});
function normStat(v){v=v||{};let o;
 if('seen' in v&&v.a===undefined){/* MedBCQ.html record {seen,right,wrong,ms,ease,ivl,due,last,lastOk} */
  o=Object.assign(ST0(),{a:v.seen,c:v.right,t:v.ms,ts:v.last,l:v.lastOk===undefined?null:v.lastOk,ef:v.ease,iv:v.ivl,due:v.due,bm:v.bm?1:0})}
 else if('d' in v&&Array.isArray(v.h)){/* Master.html record {a,c,t,l(ts),h,b,d,ease,int} */
  const h=v.h.slice(-10);o=Object.assign(ST0(),{a:v.a,c:v.c,t:v.t,ts:v.l,l:h.length?h[h.length-1]===1:null,h,bx:v.b,due:v.d,ef:v.ease,iv:v.int,bm:v.bm?1:0})}
 else{o=Object.assign(ST0(),v);
  if(v.lastOk!==undefined&&v.l===undefined)o.l=v.lastOk;
  if(v.last&&!v.ts)o.ts=v.last;
  if(v.box!=null&&v.iv===undefined)o.iv=IV_LEITNER[v.box]||0;
  delete o.box;delete o.last;delete o.lastOk}
 for(const k of['ef','iv','due','ts','bx'])o[k]=+o[k]||(k==='ef'?2.5:0);
 o.h=Array.isArray(o.h)?o.h.slice(-10):[];
 o.a=+o.a||0;o.c=+o.c||0;o.t=+o.t||0;
 if(o.tn==null)o.tn=o.t>0?o.a:0;
 return o}
const sg=u=>S.stats[u]||ST0();
const sm=u=>S.stats[u]=Object.assign(ST0(),S.stats[u]);

/* ---------- persistence: IndexedDB + localStorage mirror (newest wins) ---------- */
function idbOpen(name){return new Promise(res=>{try{let fresh=false;const o=indexedDB.open(name,1);
 o.onupgradeneeded=()=>{fresh=true;o.result.createObjectStore('kv')};o.onerror=()=>res(null);o.onblocked=()=>res(null);o.onsuccess=()=>res({db:o.result,fresh})}catch(e){res(null)}})}
const idbGetOne=(db,k)=>new Promise(r=>{try{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}});
function idbPut(k,v){try{MDB&&MDB.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}
async function legacyIdb(name,keys){const o=await idbOpen(name);if(!o)return{};
 if(o.fresh){o.db.close();try{indexedDB.deleteDatabase(name)}catch(e){}return{}}
 const out={};for(const k of keys)out[k]=await idbGetOne(o.db,k);o.db.close();return out}
function save(){_all=null;S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}idbPut('state',S)}
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};

function mergeSt(u,v){v=normStat(v);const c=S.stats[u];
 if(!c||v.a>c.a||(v.a===c.a&&v.ts>c.ts))S.stats[u]={...v,bm:(c&&c.bm)||v.bm};else if(v.bm)c.bm=1}
function mergeDays(d){for(const[k,v]of Object.entries(d||{})){const x=typeof v==='number'?{a:v,c:0}:{a:+(v&&(v.a??v.n))||0,c:+(v&&v.c)||0},c=S.days[k]||{a:0,c:0};S.days[k]={a:Math.max(c.a,x.a),c:Math.max(c.c,x.c)}}}
/* one-time import of data saved by the two original apps (same browser/origin) */
async function migrate(){
 const PRO=['custom','stats','marks','settings','log','sessions'];
 const idb1=(await legacyIdb('mcqpro',PRO)),pro={};
 for(const k of PRO){let v=idb1[k];if(v==null)v=lsGet('mcq_'+k);if(v!=null)pro[k]=v}
 if(Object.keys(pro).length){
  for(const[u,v]of Object.entries(pro.stats||{}))mergeSt(u,v);
  for(const[u,on]of Object.entries(pro.marks||{}))if(on)sm(u).bm=1;
  for(const[id,q]of Object.entries(pro.custom||{})){const n=normQ(q);if(n.options.length<2||n.answer<0||n.answer>=n.options.length)continue;
   if(BASEU.has(id))S.edits[id]=n;else if(!S.custom.some(x=>x.uid===id))S.custom.push({...n,uid:id,id:n.id??id})}
  mergeDays(pro.log);S.sessions=S.sessions.concat(Array.isArray(pro.sessions)?pro.sessions:[]);
  if(pro.settings&&typeof pro.settings==='object')S.set={...S.set,...pro.settings}}
 const ia=lsGet('medbcq'),ib=(await legacyIdb('medbcq',['state'])).state;
 const idx=[ia,ib].filter(x=>x&&typeof x==='object'&&x.stats).sort((x,y)=>(y.ts||0)-(x.ts||0))[0];
 if(idx){
  for(const[u,v]of Object.entries(idx.stats||{}))mergeSt(u,v);
  (idx.custom||[]).forEach(q=>{if(!S.custom.some(x=>x.uid===q.uid))S.custom.push(normQ(q))});
  for(const[k,v]of Object.entries(idx.edits||{}))if(!S.edits[k])S.edits[k]=v;
  S.deleted=[...new Set(S.deleted.concat(idx.deleted||[]))];
  mergeDays(idx.days);if(idx.set)S.set={...S.set,...idx.set}}
}
async function legacyIdbAll(name){const o=await idbOpen(name);if(!o)return{};
 if(o.fresh){o.db.close();try{indexedDB.deleteDatabase(name)}catch(e){}return{}}
 const out=await new Promise(r=>{const res={};try{const c=o.db.transaction('kv').objectStore('kv').openCursor();c.onsuccess=()=>{const x=c.result;if(x){res[x.key]=x.value;x.continue()}else r(res)};c.onerror=()=>r(res)}catch(e){r(res)}});
 o.db.close();return out}
/* second one-time, non-destructive import: progress kept by MedBCQ.html (IDB "medbcq" kv: stats,bm,custom,edits,settings,daily) and Master.html (same DB + localStorage bcq_*: stats,marks,custom,edits,daily,cfg) */
async function migrate2(){
 const kv=await legacyIdbAll('medbcq'),g=k=>{let v=kv[k];if(v==null)v=lsGet('bcq_'+k);return v};
 const stats=g('stats'),bm=g('bm'),marks=g('marks'),custom=g('custom'),edits=g('edits'),daily=g('daily'),cfg=g('cfg'),settings=kv.settings!=null?kv.settings:lsGet('medbcq.settings');

 <div class=row><button data-a=expq>Export questions (JSON)</button><button data-a=expb>Full backup (with stats)</button></div>
 <label style="margin-top:12px">Import questions JSON or restore a full backup</label><input type=file accept=".json,application/json" data-imp=1>
 <div class=row>${S.deleted.length?`<button class=s data-a=restore>Restore ${S.deleted.length} deleted question${S.deleted.length>1?'s':''}</button>`:''}<button class=r data-a=rsall>Reset all progress</button></div></div>
 <div class=card><h2>Install & offline</h2><p class=mu>This is one self-contained file: it works fully offline. iPhone/iPad: Safari → Share → Add to Home Screen. Android/desktop: browser menu → Install app. Progress is stored on this device (IndexedDB + localStorage) — use Full backup to move it between devices.</p><div class=row><button class=s data-a=install>Install app</button></div></div>`}
};
function bankList(){const t=norm(B.q),Q=all().filter(q=>{const s=S.stats[q.uid];
  if(B.sub&&q.subject!==B.sub||B.top&&q.topic!==B.top)return false;
  if(B.st&&!(B.st==='bm'?s&&s.bm:B.st==='custom'?!q._s:B.st==='wrong'?isWrong(s):B.st==='new'?!s||!s.a:B.st==='due'?isDue(s):isWeak(s)))return false;
  return!t||norm([q.question,q.vignette,...q.options,q.explanation,q.topic,q.subject,q.uid,q.id,srcNo(q)].join(' ')).includes(t)});
 return`<p class=mu>${Q.length} questions${Q.length>B.lim?' (showing '+B.lim+')':''}</p>`+Q.slice(0,B.lim).map(q=>{const s=S.stats[q.uid];
 return`<div class=card><div class=tg>${esc(q.subject)} · ${esc(q.topic)}</div><p style="font-weight:600">${esc(q.question)}</p><div class=mu><span class=tag>${esc(ref(q))}</span>${srcNo(q)!=null?`<span class=tag>Src ${esc(srcNo(q))}</span>`:''}${s&&s.a?s.c+'/'+s.a+' correct · '+pc(s.c,s.a)+'%':'Unattempted'}</div>
 <details><summary>Answer</summary>${q.vignette?`<div class=vg>${esc(q.vignette)}</div>`:''}${q.image?`<img class=qi src="${esc(q.image)}" alt="">`:''}${q.options.map((o,i)=>`<div style="${i===q.answer?'color:var(--ok);font-weight:700':''}">${L[i]}. ${esc(o)}</div>`).join('')}<div class=exp>${esc(q.explanation||'')}${q.explanation_image?`<img class=qi src="${esc(q.explanation_image)}" alt="">`:''}</div></details>
 <div class=row><button class=s data-a=bmb data-v="${esc(q.uid)}">${s&&s.bm?'★ Bookmarked':'☆ Bookmark'}</button><button class=s data-a=ed data-v="${esc(q.uid)}">Edit</button><button class=s data-a=rs data-v="${esc(q.uid)}">Reset stats</button></div></div>`}).join('')+(Q.length>B.lim?'<button data-a=more style="width:100%">Show more</button>':'')}

function render(){const s=S.set,h=document.documentElement;h.dataset.theme=s.theme==='custom'?'blue':s.theme;
 if(s.theme==='custom'){const a=s.accent||'#1d5fd6';h.style.cssText=`--ac:${a};--ac2:${shade(a)};--acs:${a}1a;--bg:#f4f5f8;--sh:${a}14`}else h.style.cssText='';
 {const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=getComputedStyle(h).getPropertyValue('--ac2').trim()||'#0b3d91'}
 const live=ses&&route==='quiz'?(ses.mock?'mock':'practice'):route==='res'?(ses.mock?'mock':'practice'):route;
 $('#nav').innerHTML=NAV.map(([r,i,t])=>`<button data-a=go data-v=${r} class="${r===live?'on':''}" aria-label="${t}"><span class=ni>${i}</span><span class=nl>${r==='mock'?'Mock':r==='bank'?'Bank':t}</span></button>`).join('');
 const on=$('#nav .on');if(on)$('#nav').scrollLeft=on.offsetLeft-$('#nav').clientWidth/2+on.offsetWidth/2;
 $('#cnt').textContent=all().length+' questions';
 const rb=ses&&!ses.done&&route!=='quiz'&&route!=='res'?`<div class="card resume"><span>▶ Session in progress · ${Object.keys(ses.ans).length}/${ses.qs.length} answered</span><button data-a=resume>Resume</button></div>`:'';
 $('#v').innerHTML=rb+views[route]();
 if(route==='stats')drawCharts();if(route==='home')drawHome();
 updTimer()}
function shade(hex){const n=parseInt(hex.slice(1),16),f=.55,r=(n>>16&255)*f|0,g=(n>>8&255)*f|0,b=(n&255)*f|0;return'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('')}
/* hash routing: the browser / iPhone swipe-back gesture moves between screens instead of leaving the app */
let hashing=false;
const go=(r,nh)=>{route=r;if(r!=='edit')editId=null;if(!nh&&location.hash!=='#'+r){try{hashing=true;location.hash=r}catch(e){hashing=false}}render();scrollTo(0,0)};
addEventListener('hashchange',()=>{if(hashing){hashing=false;return}let r=location.hash.slice(1);if(r==='edit')r='bank';if(!views[r])return;if((r==='quiz'||r==='res')&&!ses)r='home';route=r;render();scrollTo(0,0)});
function refresh(){const b=$('#bl');route==='bank'&&b?b.innerHTML=bankList():render()}

/* ---------- charts (canvas) ---------- */
function chart(id,data,max,line){const c=$('#'+id);if(!c)return;const r=window.devicePixelRatio||1,w=c.clientWidth||300,h=220;c.width=w*r;c.height=h*r;const x=c.getContext('2d');x.scale(r,r);
 const cs=getComputedStyle(document.documentElement),ac=cs.getPropertyValue('--ac').trim()||'#1d5fd6',mu=cs.getPropertyValue('--mu').trim()||'#667';
 x.font='11px -apple-system,Segoe UI,Roboto,sans-serif';const bw=(w-30)/Math.max(1,data.length);
 x.strokeStyle=mu+'55';x.lineWidth=1;x.beginPath();x.moveTo(30,h-25.5);x.lineTo(w,h-25.5);x.stroke();
 x.strokeStyle=ac;x.fillStyle=ac;x.lineWidth=2;x.beginPath();
 data.forEach(([l,v],i)=>{const bh=(h-50)*v/max,px=30+i*bw;if(line){const py=h-25-bh;i?x.lineTo(px+bw/2,py):x.moveTo(px+bw/2,py)}else x.fillRect(px+6,h-25-bh,bw-12,bh)});
 if(line)x.stroke();
 data.forEach(([l,v],i)=>{const px=30+i*bw+bw/2;if(line){x.beginPath();x.arc(px,h-25-(h-50)*v/max,3,0,7);x.fill()}
  x.fillStyle=mu;x.textAlign='center';if(!line||i%2==0||data.length<8)x.fillText(String(l).slice(0,line?5:12),px,h-8);x.fillText(v,px,h-30-(h-50)*v/max);x.fillStyle=ac});
 x.textAlign='left'}
function drawCharts(){const A=all(),by={};A.forEach(q=>{const s=S.stats[q.uid];if(!s)return;const b=by[q.subject||'Other']=by[q.subject||'Other']||{a:0,c:0};b.a+=s.a;b.c+=s.c});
 const days=[...Array(14)].map((_,i)=>{const d=ymd(new Date(Date.now()-(13-i)*DAY));return[d.slice(5),(S.days[d]||{a:0}).a]});
 chart('c1',Object.entries(by).map(([k,v])=>[k.split(' ')[0],pc(v.c,v.a)]),100);chart('c2',days,Math.max(5,...days.map(d=>d[1])),true)}
function drawHome(){const days=[...Array(14)].map((_,i)=>{const d=ymd(new Date(Date.now()-(13-i)*DAY));return[d.slice(5),(S.days[d]||{a:0}).a]});chart('c3',days,Math.max(5,...days.map(d=>d[1])),true)}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(route==='stats')drawCharts();if(route==='home')drawHome()},150)});

/* ---------- sessions ---------- */
function begin(qs,mock,min){if(!qs.length)return alert('No questions match these filters.');
 if(ses&&!ses.done&&ses.mock&&Object.keys(ses.ans).length&&!confirm('A mock exam is in progress. Discard it and start a new session?'))return;
 clearInterval(timer);timer=null;
 ses={qs,i:0,ans:{},flag:{},mock:!!mock,done:0,t0:Date.now(),qt:Date.now(),end:mock?Date.now()+min*6e4:0,mo:0};
 timer=setInterval(tick,1000);go('quiz')}
function updTimer(){const e=$('#tm');if(!ses||ses.done){e.hidden=true;return}
 const r=ses.mock?Math.max(0,ses.end-Date.now()):Date.now()-ses.t0,m=r/1000|0;e.hidden=false;e.textContent='⏱ '+(m/60|0)+':'+String(m%60).padStart(2,'0')}
function tick(){if(!ses||ses.done){clearInterval(timer);timer=null;return updTimer()}
 if(ses.mock&&ses.end-Date.now()<=0){updTimer();toast("Time's up!");return act.finish()}updTimer()}
let deferredPrompt=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
const act={
 go:v=>go(v),
 smart:()=>{const g=Math.max(1,+S.set.goal||20),D=pool({mode:'due'}).sort((x,y)=>sg(x.uid).due-sg(y.uid).due),W=shuf(pool({mode:'wrong'})),N=shuf(pool({mode:'new'})),seen=new Set();
  begin([...D,...W,...N].filter(q=>!seen.has(q.uid)&&seen.add(q.uid)).slice(0,g),0)},
 subj:v=>{B.sub=v;B.top='';B.st='';B.q='';B.lim=40;go('bank')},
 install:()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null}else toast('Use your browser menu: Add to Home Screen / Install app')},resume:()=>{if(ses&&!ses.done)go('quiz')},
 start:()=>begin((F.shuf?shuf:x=>x)(pool(F)).slice(0,F.n),0),
 startmock:()=>begin((M.shuf?shuf:x=>x)(pool(M)).slice(0,Math.max(1,M.n||50)),1,Math.max(1,M.min||60)),
 qs:v=>{begin(shuf(pool({sub:'',top:'',mode:v})).slice(0,20),0)},
 rv:v=>{begin(shuf(pool({sub:'',top:'',mode:v})),0)},
 pick:v=>{const q=ses.qs[ses.i];if(ses.done)return;
  if(ses.mock){ses.ans[q.uid]=+v}else{if(ses.ans[q.uid]!=null)return;ses.ans[q.uid]=+v;rec(q,+v===q.answer,Date.now()-ses.qt);save()}render()},
 next:()=>{ses.i=Math.min(ses.qs.length-1,ses.i+1);ses.qt=Date.now();render();scrollTo(0,0)},
 prev:()=>{ses.i=Math.max(0,ses.i-1);ses.qt=Date.now();render();scrollTo(0,0)},
 jump:v=>{ses.i=+v;ses.qt=Date.now();render();scrollTo(0,0)},
 flag:()=>{const u=ses.qs[ses.i].uid;ses.flag[u]=!ses.flag[u];render()},
 finish:()=>{if(!ses)return;if(!ses.done){clearInterval(timer);timer=null;
   if(ses.mock){const n=Object.keys(ses.ans).length,ms=(Date.now()-ses.t0)/(n||1);ses.qs.forEach(q=>{if(ses.ans[q.uid]!=null)rec(q,ses.ans[q.uid]===q.answer,ms)})}
   ses.done=1;ses.tEnd=Date.now();
   const att=Object.keys(ses.ans).length;
   if(att)S.sessions.push({d:today(),mode:ses.mock?'mock':'practice',n:ses.qs.length,c:ses.qs.filter(q=>ses.ans[q.uid]===q.answer).length,att,ms:ses.tEnd-ses.t0});
   save()}go('res')},
 review:v=>{if(v==='wrong')ses.qs=ses.qs.filter(q=>ses.ans[q.uid]!==q.answer);if(!ses.qs.length)return alert('Nothing to review!');ses.i=0;go('quiz')},
 retry:()=>{const w=ses.qs.filter(q=>ses.ans[q.uid]!==q.answer);if(!w.length)return alert('Nothing to retry – every question was correct!');begin(shuf(w),0)},
 bmq:()=>{const s=sm(ses.qs[ses.i].uid);s.bm=s.bm?0:1;save();render()},
 bmb:v=>{const s=sm(v);s.bm=s.bm?0:1;save();refresh()},
 rs:v=>{if(confirm('Reset statistics for this question?')){const bm=sg(v).bm;S.stats[v]=Object.assign(ST0(),{bm});save();refresh()}},
 more:()=>{B.lim+=40;refresh()},
 ed:v=>{editId=v||null;go('edit')},
 saveq:()=>saveQ(),
 revert:()=>{if(confirm('Discard your edits and restore the original question?')){delete S.edits[editId];save();toast('Original restored');go('bank')}},
 delq:()=>{if(!confirm('Delete this question? You can restore deleted questions from Settings.'))return;
  if(BASEU.has(editId))S.deleted.push(editId);else S.custom=S.custom.filter(x=>x.uid!==editId);save();toast('Question deleted');go('bank')},
 restore:()=>{if(confirm('Restore all deleted questions?')){S.deleted=[];save();render()}},
 theme:v=>{S.set.theme=v;save();render()},
 expq:()=>dl('medbcq-questions-'+today()+'.json',all().map(({_s,...q})=>q)),
 expb:()=>dl('medbcq-backup-'+today()+'.json',{app:'medbcq-master',version:3,exported:new Date().toISOString(),questions:all().map(({_s,...q})=>q),stats:S.stats,custom:S.custom,edits:S.edits,deleted:S.deleted,days:S.days,sessions:S.sessions,settings:S.set}),
 rsall:()=>{if(confirm('Reset ALL statistics, history and bookmarks? Questions are kept. Export a backup first.')){S.stats={};S.days={};S.sessions=[];save();render();toast('Progress reset')}}};
function dl(n,d){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

/* ---------- add / edit ---------- */
function saveQ(){const g=id=>$('#'+id).value.trim(),sel=+$('#e_a').value;
 const kept=[],texts=[];for(let i=0;i<6;i++){const v=g('e_o'+i);if(v){kept.push(i);texts.push(v)}}
 const a=kept.indexOf(sel);
 if(!g('e_q')||texts.length<2||a<0)return alert('Need a question, at least 2 options and a correct answer that points to a filled option.');
 const n={subject:g('e_s')||'General',topic:g('e_t')||'General',vignette:g('e_v'),question:g('e_q'),options:texts,answer:a,answerLetter:L[a],explanation:g('e_x'),image:$('#e_img').value,explanation_image:$('#e_eimg').value};
 if(editId){const cur=byU(editId);
  if(BASEU.has(editId))S.edits[editId]=n;else S.custom=S.custom.map(x=>x.uid===editId?{...x,...n,uid:editId}:x)}
 else{if(all().some(x=>sig(x)===sig(n))&&!confirm('A very similar question already exists. Add anyway?'))return;
  n.uid='c-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);n.id=n.uid;S.custom.push(n)}
 save();toast('Saved');go('bank')}
function readImg(file,hid){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
 c.getContext('2d').drawImage(im,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.8);$('#'+hid).value=u;$('#p_'+hid).innerHTML=`<img class=qi style="max-height:140px" src="${u}" alt=""><button class="s r" data-a=noimg data-v=${hid}>Remove image</button>`};im.onerror=()=>alert('Could not read that image.');im.src=r.result};r.readAsDataURL(file)}
act.noimg=v=>{$('#'+v).value='';$('#p_'+v).innerHTML=''};

/* ---------- import (dedupe + stat-preserving merge; reads MedBCQ, MCQ Pro and Master files) ---------- */
function imp(txt){const d=JSON.parse(txt),qs=[...(Array.isArray(d)?d:d.questions||[]),...(!Array.isArray(d)&&Array.isArray(d.custom)?d.custom:[])],
  A=all(),bySig=new Map(A.map(q=>[sig(q),q.uid])),uids=new Set([...BASEU,...A.map(q=>q.uid)]),alias={};let add=0,dup=0,ed=0,st=0;
 for(const raw of qs){if(!raw||!raw.question||!raw.options)continue;const n=normQ(raw);delete n._s;delete n.stats;
  if(n.options.length<2||n.options.length>6||n.answer<0||n.answer>=n.options.length)continue;
  const cand=raw.uid!=null?String(raw.uid):raw.id!=null?String(raw.id):null,sg2=sig(n);
  if(cand&&uids.has(cand)){dup++;
   if(d.app==='mcqpro'&&BASEU.has(cand)&&!S.edits[cand]&&byU(cand)&&sig(byU(cand))!==sg2){S.edits[cand]=n;ed++}continue}
  if(bySig.has(sg2)){dup++;if(cand)alias[cand]=bySig.get(sg2);continue}
  n.uid=cand&&!uids.has(cand)?cand:'i-'+sg2;if(uids.has(n.uid)){dup++;continue}
  n.subject=n.subject||'General';n.topic=n.topic||'General';
  uids.add(n.uid);bySig.set(sg2,n.uid);S.custom.push(n);add++;
  if(raw.stats){d.stats=d.stats||{};d.stats[n.uid]=raw.stats}}
 for(const[k,v]of Object.entries(d.stats||{})){mergeSt(alias[k]||k,v);st++}
 for(const m of[d.marks,d.bm])for(const[k,on]of Object.entries(m||{}))if(on)sm(alias[k]||k).bm=1;
 if(d.edits)for(const[k,v]of Object.entries(d.edits))if(!S.edits[k])S.edits[k]=v;
 if(Array.isArray(d.deleted))S.deleted=[...new Set(S.deleted.concat(d.deleted))];
 mergeDays(d.days||d.log||d.daily);
 if(Array.isArray(d.sessions)){const have=new Set(S.sessions.map(x=>JSON.stringify(x)));d.sessions.forEach(x=>{if(!have.has(JSON.stringify(x)))S.sessions.push(x)})}
 for(const s of[d.settings,d.cfg,d.set])if(s&&typeof s==='object')S.set={...S.set,...s};
 save();alert(`Imported ${add} new questions, skipped ${dup} duplicates${ed?', applied '+ed+' edits':''}, merged stats for ${st} questions.`);render()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&act[b.dataset.a]){act[b.dataset.a](b.dataset.v,b)}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(d.imp){const f=t.files[0];if(f)f.text().then(imp).catch(x=>alert('Invalid or unsupported JSON file: '+x.message));t.value='';return}
 if(d.img){const f=t.files[0];if(f)readImg(f,d.img);return}
 if(!d.o)return;const o=d.o==='set'?S.set:O[d.o];let v=t.type==='checkbox'?t.checked:t.value;if(d.num)v=+v;o[d.k]=v;
 if(d.k==='sub')o.top='';if(d.o==='set'){if(d.k==='accent')o.theme='custom';save()}
 if(d.o==='B')B.lim=40;if(d.r)render()});
document.addEventListener('input',e=>{if(e.target.dataset.s){B.q=e.target.value;B.lim=40;$('#bl').innerHTML=bankList()}});
document.addEventListener('toggle',e=>{if(e.target.dataset&&e.target.dataset.map&&ses)ses.mo=e.target.open},true);
document.addEventListener('keydown',e=>{if(route!=='quiz'||!ses||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 const k=e.key.toUpperCase(),q=ses.qs[ses.i];
 if(L.includes(k)&&L.indexOf(k)<q.options.length)act.pick(L.indexOf(k));
 else if(/^[1-6]$/.test(k)&&+k<=q.options.length)act.pick(k-1);
 else if(k==='M')act.bmq();else if(k==='G'&&ses.mock&&!ses.done)act.flag();
 else if((e.key==='Enter'||e.key==='ArrowRight')&&ses.i<ses.qs.length-1)act.next();
 else if(e.key==='ArrowLeft'&&ses.i>0)act.prev()});
document.addEventListener('keydown',e=>{const b=e.target.closest&&e.target.closest('[role=button][data-a]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();act[b.dataset.a]&&act[b.dataset.a](b.dataset.v,b)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updTimer()});

/* ---------- boot ---------- */
window.MedBCQ={get state(){return S},all,act,go,pool,BASE,imp,save,normQ,sig};
load().then(()=>{const h0=location.hash.slice(1);if(views[h0]&&!['quiz','res','edit'].includes(h0))route=h0;render();
 if('serviceWorker'in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})});
})();
