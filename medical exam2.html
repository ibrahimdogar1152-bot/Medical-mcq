<script id="seedB" type="application/json">[{"id":2994,"source_point":2994,"subject":"Biochemistry and Molecular Biology","topic":"Proteins and Enzymes","question":"The basic structural unit of proteins is:","options":{"A":"Nucleotide","B":"Fatty acid","C":"Amino acid","D":"Monosaccharide"},"answer":"C","explanation":"Proteins are polymers of amino acids."},{"id":2995,"source_point":2995,"subject":"Biochemistry and Molecular Biology","topic":"Proteins and Enzymes","question":"Amino acids in a protein are linked together by which type of bond?","options":{"A":"Phosphodiester bond","B":"Ester bond","C":"Glycosidic bond","D":"Peptide bond"},"answer":"D","explanation":"Peptide (amide) bonds join the carboxyl group of one amino acid to the amino group of the next."},{"id":2996,"source_point":2996,"subject":"Biochemistry and Molecular Biology","topic":"Proteins and Enzymes","question":"The linear amino acid sequence of a polypeptide defines which level of protein structure?","options":{"A":"Tertiary","B":"Primary","C":"Secondary","D":"Quaternary"},"answer":"B","explanation":"Primary structure = amino acid sequence."},{"id":2997,"source_point":2997,"subject":"Biochemistry and Molecular Biology","topic":"Proteins and Enzymes","question":"Alpha helices and beta-pleated sheets are examples of which level of protein structure?","options":{"A":"Tertiary","B":"Primary","C":"Quaternary","D":"Secondary"},"answer":"D","explanation":"Secondary structure = local folding stabilized by hydrogen bonds."},{"id":2998,"source_point":2998,"subject":"Biochemistry and Molecular Biology","topic":"Proteins and Enzymes","question":"The three-dimensional folding of a single polypeptide chain is called:","options":{"A":"Secondary structure","B":"Primary structure","C":"Quaternary structure","D":"Tertiary structure"},"answer":"D","explanation":"Tertiary structure is the overall 3D conformation of one chain."},{"id":2999,"source_point":2999,"subject":"Biochemistry and Molecular Biology","topic":"Proteins and Enzymes","question":"Association of multiple polypeptide subunits, as in hemoglobin, represents which level of protein structure?","options":{"A":"Quaternary","B":"Tertiary","C":"Secondary","D":"Primary"},"answer":"A","explanation":"Quaternary structure involves more than one polypeptide subunit."},{"id":3000,"source_point":3000,"subject":"Biochemistry and Molecular Biology","topic":"Proteins and Enzymes","question":"Enzymes increase the rate of a reaction by:","options":{"A":"Increasing the free energy of the products","B":"Raising the activation energy","C":"Shifting the equilibrium constant","D":"Lowering the activation energy"},"answer":"D","explanation":"Catalysts lower activation energy without altering equilibrium."},{"id":3001,"source_point":3001,"subject":"Biochemistry and Molecular Biology","topic":"Proteins and Enzymes","question":"Which of the following is a non-protein biological catalyst?","options":{"A":"Ribozyme","B":"Isoenzyme","C":"Zymogen","D":"Apoenzyme"},"answer":"A","explanation":"Ribozymes are catalytic RNA molecules."},{"id":3002,"source_point":3002,"subject":"Biochemistry and Molecular Biology","topic":"Proteins and Enzymes","question":"The region of an enzyme where the substrate binds is called the:","options":{"A":"Regulatory subunit","B":"Active site","C":"Allosteric site","D":"Prosthetic group"},"answer":"B","explanation":"The active site binds substrate and catalyzes the reaction."},{"id":3003,"source_point":3003,"subject":"Biochemistry and Molecular Biology","topic":"Proteins and Enzymes","question":"The protein portion of an enzyme lacking its cofactor is termed:","options":{"A":"Apoenzyme","B":"Isoenzyme","C":"Holoenzyme","D":"Coenzyme"},"answer":"A","explanation":"Apoenzyme is inactive without its cofactor."},{"id":3004,"source_point":3004,"subject":"Biochemistry and Molecular Biology","topic":"Proteins and Enzymes","question":"An apoenzyme combined with its cofactor is called a:","options":{"A":"Holoenzyme","B":"Isoenzyme","C":"Zymogen","D":"Proenzyme"},"answer":"A","explanation":"Holoenzyme = apoenzyme + cofactor (active form)."},{"id":3005,"source_point":3005,"subject":"Biochemistry and Molecular Biology","topic":"Proteins and Enzymes","question":"Which kinetic change is characteristic of competitive inhibition?","options":{"A":"Decreased Vmax, unchanged Km","B":"Increased Vmax, unchanged Km","C":"Decreased Km and decreased Vmax","D":"Increased apparent Km, unchanged Vmax"},"answer":"D","explanation":"Competitive inhibitors raise Km; Vmax is overcome by excess substrate."},{"id":3006,"source_point":3006,"subject":"Biochemistry and Molecular Biology","topic":"Proteins and Enzymes","question":"Which kinetic change is characteristic of pure noncompetitive inhibition?","options":{"A":"Decreased Vmax, unchanged Km","B":"Increased Km and increased Vmax","C":"Increased Km, unchanged Vmax","D":"Decreased Km and decreased Vmax"},"answer":"A","explanation":"Noncompetitive inhibitors lower Vmax without changing Km."},{"id":3007,"source_point":3007,"subject":"Biochemistry and Molecular Biology","topic":"Proteins and Enzymes","question":"Km is defined as the substrate concentration at which the reaction velocity is:","options":{"A":"One-fourth of Vmax","B":"Double Vmax","C":"Half of Vmax","D":"Equal to Vmax"},"answer":"C","explanation":"Km = [S] at 1/2 Vmax."},{"id":3008,"source_point":3008,"subject":"Biochemistry and Molecular Biology","topic":"Proteins and Enzymes","question":"Vmax is reached when:","options":{"A":"Substrate concentration equals Km","B":"A competitive inhibitor is present","C":"The enzyme is saturated with substrate","D":"Enzyme concentration is zero"},"answer":"C","explanation":"Vmax occurs at saturating substrate concentration."},{"id":3009,"source_point":3009,"subject":"Biochemistry and Molecular Biology","topic":"Proteins and Enzymes","question":"Allosteric enzymes are regulated by molecules that bind:","options":{"A":"Only to the cofactor","B":"At a site other than the active site","C":"Only at the active site","D":"Only to the substrate"},"answer":"B","explanation":"Allosteric modulators bind a distinct regulatory site."},{"id":3010,"source_point":3010,"subject":"Biochemistry and Molecular Biology","topic":"Proteins and Enzymes","question":"Isoenzymes are enzymes that:","options":{"A":"Catalyze the same reaction but differ in structure and properties","B":"Differ only in their cofactor","C":"Are inactive precursors of enzymes","D":"Catalyze different reactions on the same substrate"},"answer":"A","explanation":"Isoenzymes share function but differ structurally and kinetically."},{"id":3011,"source_point":3011,"subject":"Biochemistry and Molecular Biology","topic":"Proteins and Enzymes","question":"Lactate dehydrogenase (LDH) exists in how many major isoenzyme forms?","options":{"A":"Three","B":"Seven","C":"Five","D":"Two"},"answer":"C","explanation":"LDH-1 to LDH-5."},{"id":3012,"source_point":3012,"subject":"Biochemistry and Molecular Biology","topic":"Proteins and Enzymes","question":"Which cardiac marker is more specific for myocardial injury than CK-MB?","options":{"A":"AST","B":"Myoglobin","C":"LDH","D":"Cardiac troponin"},"answer":"D","explanation":"Troponin has replaced CK-MB as the preferred marker."},{"id":3013,"source_point":3013,"subject":"Biochemistry and Molecular Biology","topic":"Proteins and Enzymes","question":"Raised ALT and AST are markers mainly of:","options":{"A":"Cholestasis","B":"Hemolysis","C":"Hepatocellular injury","D":"Increased osteoblastic activity"},"answer":"C","explanation":"Transaminases leak from damaged hepatocytes."},{"id":3014,"source_point":3014,"subject":"Biochemistry and Molecular Biology","topic":"Carbohydrate Metabolism","question":"Glycolysis occurs in the:","options":{"A":"Cytoplasm","B":"Nucleus","C":"Inner mitochondrial membrane","D":"Mitochondrial matrix"},"answer":"A","explanation":"All glycolytic enzymes are cytosolic."},{"id":3015,"source_point":3015,"subject":"Biochemistry and Molecular Biology","topic":"Carbohydrate Metabolism","question":"Glycolysis converts glucose into:","options":{"A":"Oxaloacetate","B":"Acetyl-CoA","C":"Citrate","D":"Pyruvate"},"answer":"D","explanation":"Glucose (6C) yields two pyruvate (3C)."},{"id":3016,"source_point":3016,"subject":"Biochemistry and Molecular Biology","topic":"Carbohydrate Metabolism","question":"The net ATP gain from glycolysis of one glucose molecule (substrate-level phosphorylation) is:","options":{"A":"2","B":"4","C":"6","D":"36"},"answer":"A","explanation":"Two ATP are used and four produced = net 2."},{"id":3017,"source_point":3017,"subject":"Biochemistry and Molecular Biology","topic":"Carbohydrate Metabolism","question":"Hexokinase converts glucose into:","options":{"A":"Fructose-6-phosphate","B":"Glucose-1-phosphate","C":"Fructose-1,6-bisphosphate","D":"Glucose-6-phosphate"},"answer":"D","explanation":"Hexokinase phosphorylates glucose at C6."},{"id":3018,"source_point":3018,"subject":"Biochemistry and Molecular Biology","topic":"Carbohydrate Metabolism","question":"Glucokinase is predominantly found in:","options":{"A":"Adipose tissue and lung","B":"Skeletal muscle and brain","C":"Liver and pancreatic beta cells","D":"Red blood cells and heart"},"answer":"C","explanation":"Glucokinase has high Km and acts as a glucose sensor."},{"id":3019,"source_point":3019,"subject":"Biochemistry and Molecular Biology","topic":"Carbohydrate Metabolism","question":"The rate-limiting enzyme of glycolysis is:","options":{"A":"Pyruvate kinase","B":"Phosphofructokinase-1","C":"Aldolase","D":"Hexokinase"},"answer":"B","explanation":"PFK-1 is the main control point."},{"id":3020,"source_point":3020,"subject":"Biochemistry and Molecular Biology","topic":"Carbohydrate Metabolism","question":"Pyruvate dehydrogenase converts pyruvate into:","options":{"A":"Oxaloacetate","B":"Alanine","C":"Lactate","D":"Acetyl-CoA"},"answer":"D","explanation":"PDH links glycolysis to the TCA cycle."},{"id":3021,"source_point":3021,"subject":"Biochemistry and Molecular Biology","topic":"Carbohydrate Metabolism","question":"Which set of cofactors is required by the pyruvate dehydrogenase complex?","options":{"A":"Biotin, ATP and CO2","B":"Pyridoxal phosphate and folate","C":"Vitamin B12 and S-adenosylmethionine","D":"Thiamine, lipoic acid, CoA, FAD and NAD+"},"answer":"D","explanation":"PDH needs five cofactors (TPP, lipoate, CoA, FAD, NAD+)."},{"id":3022,"source_point":3022,"subject":"Biochemistry and Molecular Biology","topic":"Carbohydrate Metabolism","question":"The citric acid cycle occurs in the:","options":{"A":"Peroxisome","B":"Endoplasmic reticulum","C":"Mitochondrial matrix","D":"Cytosol"},"answer":"C","explanation":"TCA enzymes are matrix-located."},{"id":3023,"source_point":3023,"subject":"Biochemistry and Molecular Biology","topic":"Carbohydrate Metabolism","question":"Acetyl-CoA enters the citric acid cycle by combining with:","options":{"A":"Oxaloacetate","B":"Succinate","C":"Fumarate","D":"Alpha-ketoglutarate"},"answer":"A","explanation":"Citrate synthase joins acetyl-CoA and oxaloacetate."},{"id":3024,"source_point":3024,"subject":"Biochemistry and Molecular Biology","topic":"Carbohydrate Metabolism","question":"A major rate-limiting enzyme of the citric acid cycle is:","options":{"A":"Malate dehydrogenase","B":"Fumarase","C":"Aconitase","D":"Isocitrate dehydrogenase"},"answer":"D","explanation":"Isocitrate dehydrogenase is the key regulated step."},{"id":3025,"source_point":3025,"subject":"Biochemistry and Molecular Biology","topic":"Carbohydrate Metabolism","question":"Which energy-yielding products are generated by the citric acid cycle?","options":{"A":"NADH, FADH2 and GTP","B":"Lactate and NADPH","C":"Pyruvate and FADH2","D":"NADPH, FADH2 and CTP"},"answer":"A","explanation":"TCA produces NADH, FADH2 and GTP."},{"id":3026,"source_point":3026,"subject":"Biochemistry and Molecular Biology","topic":"Carbohydrate Metabolism","question":"The electron transport chain is located in the:","options":{"A":"Mitochondrial matrix","B":"Outer mitochondrial membrane","C":"Inner mitochondrial membrane","D":"Cytosol"},"answer":"C","explanation":"ETC complexes are embedded in the inner membrane."},{"id":3027,"source_point":3027,"subject":"Biochemistry and Molecular Biology","topic":"Carbohydrate Metabolism","question":"The final electron acceptor in the electron transport chain is:","options":{"A":"NAD+","B":"Cytochrome c","C":"Oxygen","D":"Coenzyme Q"},"answer":"C","explanation":"Oxygen is reduced to water."},{"id":3028,"source_point":3028,"subject":"Biochemistry and Molecular Biology","topic":"Carbohydrate Metabolism","question":"Most ATP during aerobic metabolism is produced by:","options":{"A":"Substrate-level phosphorylation in the TCA cycle","B":"Glycolysis","C":"Gluconeogenesis","D":"Oxidative phosphorylation"},"answer":"D","explanation":"Oxidative phosphorylation yields the bulk of ATP."},{"id":3029,"source_point":3029,"subject":"Biochemistry and Molecular Biology","topic":"Carbohydrate Metabolism","question":"Gluconeogenesis occurs mainly in the liver and, in prolonged fasting, also in the:","options":{"A":"Skeletal muscle","B":"Brain","C":"Kidney","D":"Red blood cells"},"answer":"C","explanation":"Kidney cortex contributes during prolonged fasting."},{"id":3030,"source_point":3030,"subject":"Biochemistry and Molecular Biology","topic":"Carbohydrate Metabolism","question":"Pyruvate carboxylase converts pyruvate into:","options":{"A":"Oxaloacetate","B":"Malate","C":"Phosphoenolpyruvate","D":"Acetyl-CoA"},"answer":"A","explanation":"First step of gluconeogenesis; needs biotin."},{"id":3031,"source_point":3031,"subject":"Biochemistry and Molecular Biology","topic":"Carbohydrate Metabolism","question":"A key regulatory enzyme of gluconeogenesis is:","options":{"A":"Fructose-1,6-bisphosphatase","B":"Phosphofructokinase-1","C":"Hexokinase","D":"Pyruvate kinase"},"answer":"A","explanation":"It bypasses the PFK-1 step."},{"id":3032,"source_point":3032,"subject":"Biochemistry and Molecular Biology","topic":"Carbohydrate Metabolism","question":"Glycogenolysis yields mainly:","options":{"A":"UDP-glucose","B":"Fructose-6-phosphate","C":"Glucose-6-phosphate","D":"Glucose-1-phosphate"},"answer":"D","explanation":"Glycogen phosphorylase releases glucose-1-phosphate."},{"id":3033,"source_point":3033,"subject":"Biochemistry and Molecular Biology","topic":"Carbohydrate Metabolism","question":"The rate-limiting enzyme of glycogenesis is:","options":{"A":"Debranching enzyme","B":"Branching enzyme","C":"Glycogen synthase","D":"Glycogen phosphorylase"},"answer":"C","explanation":"Glycogen synthase controls glycogen synthesis."},{"id":3034,"source_point":3034,"subject":"Biochemistry and Molecular Biology","topic":"Lipid Metabolism","question":"Beta-oxidation of fatty acids occurs mainly in the:","options":{"A":"Nucleus","B":"Cytosol","C":"Endoplasmic reticulum","D":"Mitochondria"},"answer":"D","explanation":"Mitochondrial matrix is the main site."},{"id":3035,"source_point":3035,"subject":"Biochemistry and Molecular Biology","topic":"Lipid Metabolism","question":"Long-chain fatty acids enter mitochondria via:","options":{"A":"Carnitine","B":"The citrate shuttle","C":"The malate-aspartate shuttle","D":"Creatine"},"answer":"A","explanation":"The carnitine shuttle transports acyl groups."},{"id":3036,"source_point":3036,"subject":"Biochemistry and Molecular Biology","topic":"Lipid Metabolism","question":"Carnitine palmitoyltransferase-I is inhibited by:","options":{"A":"Malonyl-CoA","B":"Acetyl-CoA","C":"Glucagon","D":"Epinephrine"},"answer":"A","explanation":"Malonyl-CoA prevents futile cycling of fatty acid synthesis and oxidation."},{"id":3037,"source_point":3037,"subject":"Biochemistry and Molecular Biology","topic":"Lipid Metabolism","question":"Fatty acid synthesis occurs mainly in the:","options":{"A":"Cytoplasm","B":"Mitochondrial matrix","C":"Nucleus","D":"Lysosome"},"answer":"A","explanation":"Fatty acid synthase is cytosolic."},{"id":3038,"source_point":3038,"subject":"Biochemistry and Molecular Biology","topic":"Lipid Metabolism","question":"The rate-limiting enzyme of fatty acid synthesis is:","options":{"A":"Acetyl-CoA carboxylase","B":"HMG-CoA reductase","C":"Fatty acid synthase","D":"CPT-I"},"answer":"A","explanation":"ACC makes malonyl-CoA; needs biotin."},{"id":3039,"source_point":3039,"subject":"Biochemistry and Molecular Biology","topic":"Lipid Metabolism","question":"Which enzyme catalyzes the formation of long-chain fatty acids (palmitate)?","options":{"A":"Thiolase","B":"Acetyl-CoA carboxylase","C":"Fatty acid synthase","D":"Hormone-sensitive lipase"},"answer":"C","explanation":"FAS builds palmitate from acetyl-CoA and malonyl-CoA."},{"id":3040,"source_point":3040,"subject":"Biochemistry and Molecular Biology","topic":"Lipid Metabolism","question":"Ketone bodies are produced mainly in the:","options":{"A":"Brain","B":"Red blood cells","C":"Skeletal muscle","D":"Liver mitochondria"},"answer":"D","explanation":"Hepatic mitochondria perform ketogenesis."},{"id":3041,"source_point":3041,"subject":"Biochemistry and Molecular Biology","topic":"Lipid Metabolism","question":"The three ketone bodies are:","options":{"A":"Acetyl-CoA, acetoacetate and beta-hydroxybutyrate","B":"Acetoacetate, pyruvate and acetone","C":"Lactate, beta-hydroxybutyrate and acetone","D":"Acetoacetate, beta-hydroxybutyrate and acetone"},"answer":"D","explanation":"Pyruvate, lactate and acetyl-CoA are not ketone bodies."},{"id":3042,"source_point":3042,"subject":"Biochemistry and Molecular Biology","topic":"Lipid Metabolism","question":"Ketogenesis is increased in:","options":{"A":"High carbohydrate intake","B":"The well-fed state","C":"Prolonged fasting and uncontrolled diabetes","D":"Insulin excess"},"answer":"C","explanation":"Low insulin/high glucagon drives ketogenesis."},{"id":3043,"source_point":3043,"subject":"Biochemistry and Molecular Biology","topic":"Lipid Metabolism","question":"The liver cannot utilize ketone bodies because it lacks:","options":{"A":"HMG-CoA lyase","B":"HMG-CoA synthase","C":"Mitochondria","D":"Thiophorase (succinyl-CoA acetoacetate transferase)"},"answer":"D","explanation":"Absence of thiophorase prevents ketolysis in liver."},{"id":3044,"source_point":3044,"subject":"Biochemistry and Molecular Biology","topic":"Lipid Metabolism","question":"Cholesterol synthesis occurs mainly in the:","options":{"A":"Nucleus","B":"Cytoplasm and endoplasmic reticulum","C":"Lysosomes","D":"Mitochondria only"},"answer":"B","explanation":"Cytosolic and smooth ER enzymes."},{"id":3045,"source_point":3045,"subject":"Biochemistry and Molecular Biology","topic":"Lipid Metabolism","question":"The rate-limiting enzyme of cholesterol synthesis is:","options":{"A":"HMG-CoA reductase","B":"HMG-CoA lyase","C":"Squalene synthase","D":"HMG-CoA synthase"},"answer":"A","explanation":"Target of statins."},{"id":3046,"source_point":3046,"subject":"Biochemistry and Molecular Biology","topic":"Lipid Metabolism","question":"Which lipoprotein mainly transports cholesterol to peripheral tissues?","options":{"A":"Chylomicron remnant","B":"Chylomicron","C":"LDL","D":"HDL"},"answer":"C","explanation":"LDL delivers cholesterol to peripheral cells."},{"id":3047,"source_point":3047,"subject":"Biochemistry and Molecular Biology","topic":"Lipid Metabolism","question":"Reverse cholesterol transport is mediated by:","options":{"A":"VLDL","B":"LDL","C":"Chylomicrons","D":"HDL"},"answer":"D","explanation":"HDL returns cholesterol to the liver."},{"id":3048,"source_point":3048,"subject":"Biochemistry and Molecular Biology","topic":"Lipid Metabolism","question":"Lipoprotein lipase hydrolyzes triglycerides in circulating:","options":{"A":"HDL only","B":"Chylomicrons and VLDL","C":"LDL and HDL","D":"LDL only"},"answer":"B","explanation":"LPL acts on TG-rich lipoproteins."},{"id":3049,"source_point":3049,"subject":"Biochemistry and Molecular Biology","topic":"Lipid Metabolism","question":"Which apolipoprotein activates lipoprotein lipase?","options":{"A":"Apo C-II","B":"Apo B-48","C":"Apo A-I","D":"Apo B-100"},"answer":"A","explanation":"Apo C-II is the LPL cofactor; A-I activates LCAT."},{"id":3050,"source_point":3050,"subject":"Biochemistry and Molecular Biology","topic":"Lipid Metabolism","question":"Which apolipoprotein is essential for chylomicron formation?","options":{"A":"Apo B-100","B":"Apo A-I","C":"Apo B-48","D":"Apo C-II"},"answer":"C","explanation":"B-48 is intestinal and required for chylomicron assembly."},{"id":3051,"source_point":3051,"subject":"Biochemistry and Molecular Biology","topic":"Lipid Metabolism","question":"Which apolipoprotein of LDL binds the LDL receptor?","options":{"A":"Apo B-100","B":"Apo C-II","C":"Apo A-I","D":"Apo B-48"},"answer":"A","explanation":"B-100 is the ligand for LDL receptor."},{"id":3052,"source_point":3052,"subject":"Biochemistry and Molecular Biology","topic":"Lipid Metabolism","question":"Familial hypercholesterolemia is commonly associated with a defect in:","options":{"A":"The LDL receptor pathway","B":"LCAT","C":"Lipoprotein lipase","D":"Apo C-II"},"answer":"A","explanation":"LDL receptor defect raises plasma LDL."},{"id":3053,"source_point":3053,"subject":"Biochemistry and Molecular Biology","topic":"Amino Acid and Protein Metabolism","question":"Transamination involves transfer of:","options":{"A":"An amino group between amino acids and keto acids","B":"A methyl group","C":"A phosphate group","D":"A carboxyl group"},"answer":"A","explanation":"Aminotransferases move amino groups."},{"id":3054,"source_point":3054,"subject":"Biochemistry and Molecular Biology","topic":"Amino Acid and Protein Metabolism","question":"ALT and AST require which cofactor?","options":{"A":"FAD","B":"Pyridoxal phosphate","C":"Thiamine pyrophosphate","D":"Biotin"},"answer":"B","explanation":"PLP is the cofactor for transaminases."},{"id":3055,"source_point":3055,"subject":"Biochemistry and Molecular Biology","topic":"Amino Acid and Protein Metabolism","question":"Pyridoxal phosphate is the active form of vitamin:","options":{"A":"B2","B":"B1","C":"B12","D":"B6"},"answer":"D","explanation":"B6 = pyridoxine."},{"id":3056,"source_point":3056,"subject":"Biochemistry and Molecular Biology","topic":"Amino Acid and Protein Metabolism","question":"Oxidative deamination of glutamate is catalyzed by:","options":{"A":"Alanine aminotransferase","B":"Glutaminase","C":"Glutamate dehydrogenase","D":"Glutamine synthetase"},"answer":"C","explanation":"GDH releases free ammonia."},{"id":3057,"source_point":3057,"subject":"Biochemistry and Molecular Biology","topic":"Amino Acid and Protein Metabolism","question":"Ammonia is converted into urea primarily in the:","options":{"A":"Skeletal muscle","B":"Liver","C":"Brain","D":"Kidney"},"answer":"B","explanation":"The urea cycle is hepatic."},{"id":3058,"source_point":3058,"subject":"Biochemistry and Molecular Biology","topic":"Amino Acid and Protein Metabolism","question":"The urea cycle occurs:","options":{"A":"Entirely in the cytoplasm","B":"In the endoplasmic reticulum and Golgi","C":"Partly in mitochondria and partly in cytoplasm","D":"Entirely in mitochondria"},"answer":"C","explanation":"CPS I and OTC are mitochondrial; remaining steps are cytosolic."},{"id":3059,"source_point":3059,"subject":"Biochemistry and Molecular Biology","topic":"Amino Acid and Protein Metabolism","question":"The rate-limiting enzyme of the urea cycle is:","options":{"A":"Ornithine transcarbamylase","B":"Argininosuccinate synthetase","C":"Carbamoyl phosphate synthetase I","D":"Arginase"},"answer":"C","explanation":"CPS I is the regulated step."},{"id":3060,"source_point":3060,"subject":"Biochemistry and Molecular Biology","topic":"Amino Acid and Protein Metabolism","question":"Carbamoyl phosphate synthetase I is allosterically activated by:","options":{"A":"Urea","B":"Ornithine","C":"Citrulline","D":"N-acetylglutamate"},"answer":"D","explanation":"NAG is the obligatory activator."},{"id":3061,"source_point":3061,"subject":"Biochemistry and Molecular Biology","topic":"Amino Acid and Protein Metabolism","question":"Which finding is characteristic of ornithine transcarbamylase deficiency?","options":{"A":"Hyperammonemia with normal orotic acid","B":"Hypoglycemia with ketonuria","C":"Hyperammonemia with increased urinary orotic acid","D":"Elevated plasma phenylalanine"},"answer":"C","explanation":"Carbamoyl phosphate spills into pyrimidine pathway, raising orotic acid."},{"id":3062,"source_point":3062,"subject":"Biochemistry and Molecular Biology","topic":"Amino Acid and Protein Metabolism","question":"Classic phenylketonuria commonly results from deficiency of:","options":{"A":"Phenylalanine hydroxylase","B":"Cystathionine beta-synthase","C":"Homogentisate oxidase","D":"Tyrosinase"},"answer":"A","explanation":"PAH converts phenylalanine to tyrosine."},{"id":3063,"source_point":3063,"subject":"Biochemistry and Molecular Biology","topic":"Amino Acid and Protein Metabolism","question":"Phenylalanine hydroxylase requires which cofactor?","options":{"A":"Thiamine pyrophosphate","B":"Biotin","C":"Pyridoxal phosphate","D":"Tetrahydrobiopterin"},"answer":"D","explanation":"BH4 is essential for PAH."},{"id":3064,"source_point":3064,"subject":"Biochemistry and Molecular Biology","topic":"Amino Acid and Protein Metabolism","question":"Alkaptonuria results from deficiency of:","options":{"A":"Phenylalanine hydroxylase","B":"Branched-chain ketoacid dehydrogenase","C":"Tyrosinase","D":"Homogentisate oxidase"},"answer":"D","explanation":"Homogentisic acid accumulates."},{"id":3065,"source_point":3065,"subject":"Biochemistry and Molecular Biology","topic":"Amino Acid and Protein Metabolism","question":"Which features are characteristic of alkaptonuria?","options":{"A":"Mousy odor of sweat","B":"Maple syrup odor of urine","C":"Urine darkening on standing and ochronosis","D":"Downward lens dislocation"},"answer":"C","explanation":"Homogentisic acid oxidizes to dark pigment."},{"id":3066,"source_point":3066,"subject":"Biochemistry and Molecular Biology","topic":"Amino Acid and Protein Metabolism","question":"Maple syrup urine disease results from deficiency of:","options":{"A":"Phenylalanine hydroxylase","B":"Homogentisate oxidase","C":"Cystathionine beta-synthase","D":"Branched-chain alpha-ketoacid dehydrogenase"},"answer":"D","explanation":"Leucine, isoleucine and valine accumulate."},{"id":3067,"source_point":3067,"subject":"Biochemistry and Molecular Biology","topic":"Vitamins and Minerals","question":"Vitamin A is essential for:","options":{"A":"Collagen hydroxylation","B":"Gamma-carboxylation of clotting factors","C":"Calcium absorption","D":"Vision and epithelial differentiation"},"answer":"D","explanation":"Retinal is a component of rhodopsin."},{"id":3068,"source_point":3068,"subject":"Biochemistry and Molecular Biology","topic":"Vitamins and Minerals","question":"Vitamin A deficiency causes:","options":{"A":"Rickets","B":"Pellagra","C":"Scurvy","D":"Night blindness and xerophthalmia"},"answer":"D","explanation":"Nyctalopia is the earliest feature."},{"id":3069,"source_point":3069,"subject":"Biochemistry and Molecular Biology","topic":"Vitamins and Minerals","question":"Vitamin D acts mainly to:","options":{"A":"Decrease intestinal calcium absorption","B":"Increase renal calcium excretion","C":"Increase intestinal absorption of calcium and phosphate","D":"Inhibit osteoblasts"},"answer":"C","explanation":"Active vitamin D raises serum calcium and phosphate."},{"id":3070,"source_point":3070,"subject":"Biochemistry and Molecular Biology","topic":"Vitamins and Minerals","question":"Vitamin D deficiency causes:","options":{"A":"Beriberi","B":"Xerophthalmia","C":"Rickets in children and osteomalacia in adults","D":"Scurvy and bleeding gums"},"answer":"C","explanation":"Defective bone mineralization."},{"id":3071,"source_point":3071,"subject":"Biochemistry and Molecular Biology","topic":"Vitamins and Minerals"," uses and in RT-PCR."},{"id":3100,"source_point":3100,"subject":"Biochemistry and Molecular Biology","topic":"Molecular Biology","question":"Southern blotting is used to detect:","options":{"A":"DNA","B":"Carbohydrate","C":"RNA","D":"Protein"},"answer":"A","explanation":"Southern = DNA."},{"id":3101,"source_point":3101,"subject":"Biochemistry and Molecular Biology","topic":"Molecular Biology","question":"Northern blotting is used to detect:","options":{"A":"Protein","B":"DNA","C":"RNA","D":"Lipid"},"answer":"C","explanation":"Northern = RNA."},{"id":3102,"source_point":3102,"subject":"Biochemistry and Molecular Biology","topic":"Molecular Biology","question":"Western blotting is used to detect:","options":{"A":"DNA","B":"RNA","C":"Carbohydrate","D":"Protein"},"answer":"D","explanation":"Western = protein."},{"id":3103,"source_point":3103,"subject":"Biochemistry and Molecular Biology","topic":"Molecular Biology","question":"ELISA commonly uses which principle?","options":{"A":"Radiolabeled DNA probes","B":"Enzyme-linked antibodies to detect antigens or antibodies","C":"Primer extension with polymerase","D":"Restriction enzyme digestion"},"answer":"B","explanation":"Enzyme-substrate color change signals binding."},{"id":3104,"source_point":3104,"subject":"Biochemistry and Molecular Biology","topic":"Molecular Biology","question":"Restriction endonucleases cut DNA at:","options":{"A":"Random sites","B":"RNA-DNA hybrids only","C":"Specific recognition sequences","D":"Promoter regions only"},"answer":"C","explanation":"Often palindromic sequences."},{"id":3105,"source_point":3105,"subject":"Biochemistry and Molecular Biology","topic":"Molecular Biology","question":"CRISPR-Cas9 is used for:","options":{"A":"RNA blotting","B":"DNA amplification","C":"Protein detection","D":"Targeted genome editing"},"answer":"D","explanation":"Cas9 creates site-specific DNA breaks."},{"id":3106,"source_point":3106,"subject":"Biochemistry and Molecular Biology","topic":"Molecular Biology","q r methionine","B":"A stop codon","C":"The codon for glycine","D":"The codon for tryptophan"},"answer":"A","explanation":"Start codon."},{"id":3125,"source_point":3125,"subject":"Medical Genetics and Molecular Medicine","topic":"Basic Genetics","question":"The stop codons are:","options":{"A":"UGG, UAG and UGA","B":"UAC, UAG and UGA","C":"UAA, UAG and UGA","D":"AUG, UAA and UGG"},"answer":"C","explanation":"UGG codes for tryptophan."},{"id":3126,"source_point":3126,"subject":"Medical Genetics and Molecular Medicine","topic":"Basic Genetics","question":"A mutation is best defined as:","options":{"A":"A reversible epigenetic change","B":"A permanent change in the DNA sequence","C":"A change in chromosome number only","D":"A temporary change in gene expression"},"answer":"B","explanation":"Heritable alteration of nucleotide sequence."},{"id":3127,"source_point":3127,"subject":"Medical Genetics and Molecular Medicine","topic":"Basic Genetics","question":"A mutation that changes one amino acid into another is:","options":{"A":"Nonsense","B":"Frameshift","C":"Silent","D":"Missense"},"answer":"D","explanation":"Missense alters the codon's amino acid."},{"id":3128,"source_point":3128,"subject":"Medical Genetics and Molecular Medicine","topic":"Basic Genetics","question":"A mutation that creates a premature stop codon is:","options":{"A":"Nonsense","B":"Silent","C":"Splice-site","D":"Missense"},"answer":"A","explanation":"Nonsense terminates translation early."},{"id":3129,"source_point":3129,"subject":"Medical Genetics and Molecular Medicine","topic":"Basic Genetics","question":"A mutation that does not change the encoded amino acid is:","options":{"A":"Nonsense","B":"Silent","C":"Frameshift","D":"Missense"},"answer":"B","explanation":"Due to degeneracy of the genetic code."},{"id":3130,"source_point":3130,"subject":"Medical Genetics and Molecular Medicine","topic":"Basic Genetics","question":"Insertion or deletion of nucleotides not divisible by three results in:","options":{"A":"Missense mutation","B":"In-frame deletion","C":"Silent mutation","D":"Frameshift mutation"},"answer":"D","explanation":"Reading frame is shifted."},{"id":3131,"source_point":3131,"subject":"Medical Genetics and Molecular Medicine","topic":"Basic Genetics","question":"A mutation that can be transmitted to offspring is:","options":{"A":"Somatic mutation","B":"Germline mutation","C":"Mutation in differentiated cells only","D":"Acquired tumor mutation"},"answer":"B","explanation":"Germ cell mutations are heritable."},{"id":3132,"source_point":3132,"subject":"Medical Genetics and Molecular Medicine","topic":"Mendelian Inheritance","question":"A pedigree with both sexes affected in successive generations and male-to-male transmission suggests:","options":{"A":"Autosomal dominant inheritance","B":"X-linked recessive inheritance","C":"Mitochondrial inheritance","D":"Autosomal recessive inheritance"},"answer":"A","explanation":"Male-to-male transmission excludes X-linked and mitochondrial."},{"id":3133,"source_point":3133,"subject":"Medical Genetics and Molecular Medicine","topic":"Mendelian Inheritance","question":"Which pedigree pattern is commonly seen in autosomal dominant inheritance?","options":{"A":"Only maternal transmission","B":"Skipped generations with only males affected","C":"Horizontal pattern (siblings only)","D":"Vertical transmission"},"answer":"D","explanation":"AD disease appears in each generation."},{"id":3134,"source_point":3134,"subject":"Medical Genetics and Molecular Medicine","topic":"Mendelian Inheritance","question":"The risk that a child inherits an autosomal dominant variant from a heterozygous parent is:","options":{"A":"50%","B":"75%","C":"25%","D":"100%"},"answer":"A","explanation":"One of two alleles is passed."},{"id":3135,"source_point":3135,"subject":"Medical Genetics and Molecular Medicine","topic":"Mendelian Inheritance","question":"Affected siblings born to unaffected parents suggest:","options":{"A":"Autosomal recessive inheritance","B":"Mitochondrial inheritance","C":"Autosomal dominant inheritance","D":"X-linked dominant inheritance"},"answer":"A","explanation":"Carrier parents."},{"id":3136,"source_point":3136,"subject":"Medical Genetics and Molecular Medicine","topic":"Mendelian Inheritance","question":"The risk of an affected child in each pregnancy of two carrier parents is:","options":{"A":"50%","B":"25%","C":"75%","D":"100%"},"answer":"B","explanation":"Aa x Aa gives 1/4 aa."},{"id":3137,"source_point":3137,"subject":"Medical Genetics and Molecular Medicine","topic":"Mendelian Inheritance","question":"Consanguinity increases the likelihood of:","options":{"A":"Mitochondrial disorders","B":"Y-linked disorders","C":"Autosomal recessive disorders","D":"Autosomal dominant disorders"},"answer":"C","explanation":"Shared ancestors increase homozygosity."},{"id":3138,"source_point":3138,"subject":"Medical Genetics and Molecular Medicine","topic":"Mendelian Inheritance","question":"X-linked recessive disorders predominantly affect:","options":{"A":"Both equally","B":"Males","C":"Females","D":"Only heterozygous females"},"answer":"B","explanation":"Males are hemizygous."},{"id":3139,"source_point":3139,"subject":"Medical Genetics and Molecular Medicine","topic":"Mendelian Inheritance","question":"An affected father with an X-linked disorder cannot transmit it to his:","options":{"A":"Sons","B":"Both sons and daughters","C":"Daughters","D":"Grandsons via daughters"},"answer":"A","explanation":"Sons receive the Y from father."},{"id":3140,"source_point":3140,"subject":"Medical Genetics and Molecular Medicine","topic":"Mendelian Inheritance","question":"In an X-linked dominant disorder, an affected male transmits the condition to:","options":{"A":"50% of his daughters","B":"All his sons","C":"None of his children","D":"All his daughters"},"answer":"D","explanation":"Daughters inherit his X."},{"id":3141,"source_point":3141,"subject":"Medical Genetics and Molecular Medicine","topic":"Mendelian lanation":"Often phenotypically normal."},{"id":3159,"source_point":3159,"subject":"Medical Genetics and Molecular Medicine","topic":"Chromosomal Disorders","question":"XYY syndrome is classically:","options":{"A":"47,XXX","B":"47,XYY","C":"47,XXY","D":"45,X"},"answer":"B","explanation":"Tall stature, normal fertility."},{"id":3160,"source_point":3160,"subject":"Medical Genetics and Molecular Medicine","topic":"Chromosomal Disorders","question":"Cri-du-chat syndrome results from:","options":{"A":"Deletion of the short arm of chromosome 4","B":"Deletion at 7q11.23","C":"Deletion of the short arm of chromosome 5","D":"Deletion at 22q11.2"},"answer":"C","explanation":"5p deletion."},{"id":3161,"source_point":3161,"subject":"Medical Genetics and Molecular Medicine","topic":"Chromosomal Disorders","question":"Williams syndrome is commonly caused by deletion at:","options":{"A":"15q11-q13","B":"5p","C":"22q11.2","D":"7q11.23"},"answer":"D","explanation":"Elastin gene; supravalvular aortic stenosis."},{"id":3162,"source_point":3162,"subject":"Medical Genetics and Molecular Medicine","topic":"Chromosomal Disorders","question":"DiGeorge syndrome is associated with deletion of:","options":{"A":"22q11.2","B":"5p","C":"15q11-q13","D":"7q11.23"},"answer":"A","explanation":"Thymic aplasia, hypocalcemia, cardiac defects."},{"id":3163,"source_point":3163,"subject":"Medical Genetics and Molecular Medicine","topic":"Chromosomal Disorders","question":"Prader-Willi syndrome usually results from:","options":{"A":"CGG repeat expansion in FMR1","B":"Loss of paternal expression in 15q11-q13","C":"Deletion of 22q11.2","D":"Loss of maternal UBE3A expression"},"answer":"B","explanation":"Paternal deletion; hyperphagia and hypotonia."},{"id":3164,"source_point":3164,"subject":"Medical Genetics and Molecular Medicine","topic":"Chromosomal Disorders","question":"Angelman syndrome usually results from:","options":{"A":"Loss of paternal 15q11-q13 expression","B":"Trisomy 21","C":"Loss of maternal anation":"Exponential amplification."},{"id":3203,"source_point":3203,"subject":"Medical Genetics and Molecular Medicine","topic":"Molecular Diagnostics and Genetic Testing","question":"Reverse-transcription PCR first converts:","options":{"A":"Protein into RNA","B":"RNA into complementary DNA","C":"DNA into RNA","D":"DNA into protein"},"answer":"B","explanation":"cDNA is then amplified."},{"id":3204,"source_point":3204,"subject":"Medical Genetics and Molecular Medicine","topic":"Molecular Diagnostics and Genetic Testing","question":"Real-time PCR allows:","options":{"A":"Direct amplification of RNA without cDNA","B":"Whole genome sequencing","C":"Monitoring of DNA amplification during the reaction","D":"Detection only after gel electrophoresis"},"answer":"C","explanation":"Fluorescence is measured each cycle."},{"id":3205,"source_point":3205,"subject":"Medical Genetics and Molecular Medicine","topic":"Molecular Diagnostics and Genetic Testing","question":"Sanger sequencing is commonly used for:","options":{"A":"Detection of large chromosomal aneuploidy","B":"Targeted DNA sequence analysis","C":"Protein detection","D":"Genome-wide copy-number detection"},"answer":"B","explanation":"Chain-termination method."},{"id":3206,"source_point":3206,"subject":"Medical Genetics and Molecular Medicine","topic":"Molecular Diagnostics and Genetic Testing","question":"Next-generation sequencing allows:","options":{"A":"Analysis of only one gene at a time","B":"Simultaneous analysis of many DNA regions","C":"Karyotype visualization","D":"Detection of proteins"},"answer":"B","explanation":"Massively parallel sequencing."},{"id":3207,"source_point":3207,"subject":"Medical Genetics and Molecular Medicine","topic":"Molecular Diagnostics and Genetic Testing","question":"Karyotyping identifies:","options":{"A":"Small copy-number variations","B":"Trinucleotide repeat expansions","C":"Single-base mutations","D":"Large chromosomal abnormalities"},"answer":"D","explanation":"Resolution about 5-10 Mb."},{"id":3208,"source_point":3208,"subject":"Medical Genetics and Molecular Medicine","topic":"Molecular Diagnostics and Genetic Testing","question":"Fluorescence in situ hybridization detects:","options":{"A":"RNA by size","B":"Proteins using antibodies","C":"Specific DNA sequences using fluorescent probes","D":"Gene expression levels only"},"answer":"C","explanation":"Useful for microdeletions such as 22q11.2."},{"id":3209,"source_point":3209,"subject":"Medical Genetics and Molecular Medicine","topic":"Molecular Diagnostics and Genetic Testing","question":"Chromosomal microarray detects:","options":{"A":"Copy-number variations","B":"Trinucleotide repeat expansions","C":"Balanced translocations","D":"Point mutations"},"answer":"A","explanation":"Cannot detect balanced rearrangements."},{"id":3210,"source_point":3210,"subject":"Medical Genetics and Molecular Medicine","topic":"Molecular Diagnostics and Genetic Testing","question":"Prenatal cell-free DNA screening analyzes:","options":{"A":"Placental DNA fragments circulating in maternal blood","B":"Chorionic villus tissue","C":"Fetal cells from amniotic fluid","D":"Fetal cord blood"},"answer":"A","explanation":"Non-invasive test."},{"id":3211,"source_point":3211,"subject":"Medical Genetics and Molecular Medicine","topic":"Molecular Diagnostics and Genetic Testing","question":"Cell-free DNA testing for aneuploidy is best classified as a:","options":{"A":"Therapeutic test","B":"Screening test","C":"Confirmatory invasive test","D":"Definitive diagnostic test"},"answer":"B","explanation":"Positive results need confirmation by CVS or amniocentesis."},{"id":3212,"source_point":3212,"subject":"Medical Genetics and Molecular Medicine","topic":"Molecular Diagnostics and Genetic Testing","question":"Chorionic villus sampling is usually performed in the:","options":{"A":"Peripartum period","B":"Second trimester","C":"Third trimester","D":"First trimester"},"answer":"D","explanation":"Typically at 10-13 weeks."},{"id":3213,"source_point":3213,"subject":"Medical Genetics and Molecular Medicine","topic":"Molecular Diagnostics and Genetic Testing","question":"Amniocentesis is generally performed from:","options":{"A":"10 weeks","B":"8 weeks","C":"15 weeks of gestation onward","D":"6 weeks"},"answer":"C","explanation":"Usually 15-20 weeks."},{"id":3214,"source_point":3214,"subject":"Medical Genetics and Molecular Medicine","topic":"Molecular Diagnostics and Genetic Testing","question":"Genetic counseling primarily helps families to:","options":{"A":"Obtain drug prescriptions for inherited disease","B":"Understand inherited disease risks and testing options","C":"Undergo prenatal sex selection","D":"Receive gene therapy"},"answer":"B","explanation":"Non-directive communication process."},{"id":3215,"source_point":3215,"subject":"Medical Genetics and Molecular Medicine","topic":"Molecular Diagnostics and Genetic Testing","question":"Carrier screening identifies individuals who:","options":{"A":"Have fetal aneuploidy","B":"Have active disease","C":"Carry somatic tumor mutations","D":"May transmit autosomal recessive or X-linked conditions"},"answer":"D","explanation":"Detects heterozygous status."},{"id":3216,"source_point":3216,"subject":"Medical Genetics and Molecular Medicine","topic":"Molecular Diagnostics and Genetic Testing","question":"Pharmacogenomics studies:","options":{"A":"Drug effects on chromosome number","B":"How genetic variation affects drug response","C":"Drug synthesis from genes","D":"Gene therapy delivery"},"answer":"B","explanation":"Example: CYP2D6, TPMT variants."},{"id":3217,"source_point":3217,"subject":"Medical Genetics and Molecular Medicine","topic":"Cancer Genetics and Molecular Medicine","question":"Which tumor suppressor gene is associated with retinoblastoma?","options":{"A":"MEN1","B":"RB1","C":"APC","D":"WT1"},"answer":"B","explanation":"Chromosome 13q14."},{"id":3218,"source_point":3218,"subject":"Medical Genetics and Molecular Medicine","topic":"Cancer Genetics and Molecular Medicine","question":"Knudson's two-hit hypothesis was proposed to explain:","options":{"A":"Chronic myeloid leukemia","B":"Hodgkin lymphoma","C":"Burkitt lymphoma","D":"Retinoblastoma"},"answer":"D","explanation":"Both alleles of RB1 must be inactivated."},{"id":3219,"source_point":3219,"subject":"Medical Genetics and Molecular Medicine","topic":"Cancer Genetics and Molecular Medicine","question":"Which gene is known as the guardian of the genome?","options":{"A":"BRCA1","B":"RB1","C":"MYC","D":"TP53"},"answer":"D","explanation":"p53 induces cell-cycle arrest or apoptosis."},{"id":3220,"source_point":3220,"subject":"Medical Genetics and Molecular Medicine","topic":"Cancer Genetics and Molecular Medicine","question":"BRCA1 and BRCA2 are best classified as:","options":{"A":"Mismatch repair genes","B":"Tumor suppressor genes involved in DNA repair","C":"Proto-oncogenes","D":"Anti-apoptotic genes"},"answer":"B","explanation":"Homologous recombination repair."},{"id":3221,"source_point":3221,"subject":"Medical Genetics and Molecular Medicine","topic":"Cancer Genetics and Molecular Medicine","question":"BRCA1 and BRCA2 pathogenic variants increase the risk of:","options":{"A":"Lung cancer and mesothelioma","B":"Breast and ovarian cancer","C":"Thyroid and adrenal cancer","D":"Colon and endometrial cancer"},"answer":"B","explanation":"Colon/endometrial = Lynch syndrome."},{"id":3222,"source_point":3222,"subject":"Medical Genetics and Molecular Medicine","topic":"Cancer Genetics and Molecular Medicine","question":"APC gene mutations are associated with:","options":{"A":"Lynch syndrome","B":"Familial adenomatous polyposis","C":"Cowden syndrome","D":"Peutz-Jeghers syndrome"},"answer":"B","explanation":"Hundreds to thousands of colorectal polyps."},{"id":3223,"source_point":3223,"subject":"Medical Genetics and Molecular Medicine","topic":"Cancer Genetics and Molecular Medicine","question":"Lynch syndrome is associated with defects in:","options":{"A":"TP53","B":"BRCA genes","C":"DNA mismatch repair genes","D":"The APC gene"},"answer":"C","explanation":"MLH1, MSH2, MSH6, PMS2."},{"id":3224,"source_point":3224,"subject":"Medical Genetics and Molecular Medicine","topic":"Cancer Genetics and Molecular Medicine","question":"The BCR-ABL1 fusion is produced by:","options":{"A":"t(15;17)","B":"t(14;18)","C":"The Philadelphia chromosome, t(9;22)","D":"t(8;14)"},"answer":"C","explanation":"Constitutive tyrosine kinase activity."},{"id":3225,"source_point":3225,"subject":"Medical Genetics and Molecular Medicine","topic":"Cancer Genetics and Molecular Medicine","question":"The Philadelphia chromosome is classically associated with:","options":{"A":"Chronic myeloid leukemia","B":"Burkitt lymphoma","C":"Acute promyelocytic leukemia","D":"Follicular lymphoma"},"answer":"A","explanation":"Treated with imatinib."},{"id":3226,"source_point":3226,"subject":"Medical Genetics and Molecular Medicine","topic":"Cancer Genetics and Molecular Medicine","question":"HER2 amplification is a therapeutic target in selected:","options":{"A":"Breast cancers","B":"Prostate cancers","C":"Thyroid cancers","D":"Colorectal cancers"},"answer":"A","explanation":"Trastuzumab."},{"id":3227,"source_point":3227,"subject":"Medical Genetics and Molecular Medicine","topic":"Cancer Genetics and Molecular Medicine","question":"EGFR mutations can predict response to targeted therapy in:","options":{"A":"Small cell lung cancer","B":"Squamous cell carcinoma of skin","C":"Mesothelioma","D":"Lung adenocarcinoma"},"answer":"D","explanation":"Treated with EGFR tyrosine kinase inhibitors."},{"id":3228,"source_point":3228,"subject":"Medical Genetics and Molecular Medicine","topic":"Cancer Genetics and Molecular Medicine","question":"KRAS mutations in colorectal cancer predict:","options":{"A":"Sensitivity to PARP inhibitors","B":"Response to HER2 inhibitors","C":"Resistance to anti-EGFR therapy","D":"Excellent response to anti-EGFR therapy"},"answer":"C","explanation":"Downstream activation bypasses EGFR blockade."},{"id":3229,"source_point":3229,"subject":"Medical Genetics and Molecular Medicine","topic":"Cancer Genetics and Molecular Medicine","question":"Microsatellite instability results from defective:","options":{"A":"Nucleotide excision repair","B":"Base excision repair","C":"DNA mismatch repair","D":"Homologous recombination"},"answer":"C","explanation":"Characteristic of Lynch syndrome tumors."},{"id":3230,"source_point":3230,"subject":"Medical Genetics and Molecular Medicine","topic":"Cancer Genetics and Molecular Medicine","question":"A liquid biopsy can detect:","options":{"A":"Intracellular tissue proteins","B":"Circulating tumor DNA","C":"Histologic tumor grade","D":"Whole tumor tissue architecture"},"answer":"B","explanation":"Minimally invasive blood test."},{"id":3231,"source_point":3231,"subject":"Medical Genetics and Molecular Medicine","topic":"Cancer Genetics and Molecular Medicine","question":"CRISPR-Cas9 uses which molecule to direct DNA cleavage?","options":{"A":"tRNA","B":"Guide RNA","C":"Restriction enzyme recognition site","D":"Primer"},"answer":"B","explanation":"gRNA matches the target DNA sequence."}]</script>
<script id="seedBanks" type="application/json">[{"id":"ent-em-anes","scheme":"colon","name":"High-Yield ENT, Emergency Medicine & Anesthesia SBA MCQs","questions":[{"id":1,"sourceNo":2268,"subject":"Ear, Nose and Throat (ENT)","topic":"Ear Anatomy and Hearing","question":"The approximate length of the external auditory canal in an adult is:","options":{"A":"4.0 cm","B":"2.5 cm","C":"5.5 cm","D":"1.0 cm"},"answer":"B","answerText":"2.5 cm","explanation":"2268. The external auditory canal: Approximately 2.5 cm long in adults."},{"id":2,"sourceNo":2269,"subject":"Ear, Nose and Throat (ENT)","topic":"Ear Anatomy and Hearing","question":"Which structure separates the external ear from the middle ear?","options":{"A":"Oval window","B":"Round window","C":"Tympanic membrane","D":"Eustachian tube"},"answer":"C","answerText":"Tympanic membrane","explanation":"2269. The tympanic membrane: Separates the external ear from the middle ear."},{"id":3,"sourceNo":2270,"subject":"Ear, Nose and Throat (ENT)","topic":"Ear Anatomy and Hearing","question":"Which group correctly lists the three auditory ossicles?","options":{"A":"Malleus, incus and cochlea","B":"Malleus, incus and stapes","C":"Incus, stapes and utricle","D":"Malleus, stapes and saccule"},"answer":"B","answerText":"Malleus, incus and stapes","explanation":"2270. The three auditory ossicles: Malleus, incus and stapes."},{"id":4,"sourceNo":2271,"subject":"Ear, Nose and Throat (ENT)","topic":"Ear Anatomy and Hearing","question":"The footplate of the stapes is attached to the:","options":{"A":"Round window","B":"Oval window","C":"Tympanic annulus","D":"Promontory"},"answer":"B","answerText":"Oval window","explanation":"2271. The stapes footplate: Attached to the oval window."},{"id":5,"sourceNo":2272,"subject":"Ear, Nose and Throat (ENT)","topic":"Ear Anatomy and Hearing","question":"The round window mainly functions to:","options":{"A":"Equalise middle-ear pressure","B":"Drain endolymph","C":"Transmit ossicular vibrations into the vestibule","D":"Dissipate pressure waves within the cochlea"},"answer":"D","answerText":"Dissipate pressure waves within the cochlea","explanation":"2272. The round window: Helps dissipate pressure waves within the cochlea."},{"id":6,"sourceNo":2273,"subject":"Ear, Nose and Throat (ENT)","topic":"Ear Anatomy and Hearing","question":"The sensory organ of hearing is the:","options":{"A":"Macula of the utricle","B":"Organ of Corti","C":"Stria vascularis","D":"Crista ampullaris"},"answer":"B","answerText":"Organ of Corti","explanation":"2273. The organ of Corti: The sensory organ of hearing."},{"id":7,"sourceNo":2274,"subject":"Ear, Nose and Throat (ENT)","topic":"Ear Anatomy and Hearing","question":"Angular acceleration is detected by the:","options":{"A":"Semicircular canals","B":"Cochlea","C":"Utricle","D":"Saccule"},"answer":"A","answerText":"Semicircular canals","explanation":"2274. The cochlea: Responsible for hearing, while the semicircular canals are responsible for angular acceleration."},{"id":8,"sourceNo":2275,"subject":"Ear, Nose and Throat (ENT)","topic":"Ear Anatomy and Hearing","question":"Linear acceleration and gravity are detected by the:","options":{"A":"Organ of Corti","B":"Round window","C":"Semicircular canals","D":"Utricle and saccule"},"answer":"D","answerText":"Utricle and saccule","explanation":"2275. The vestibule: Contains the utricle and saccule, which detect linear acceleration and gravity."},{"id":9,"sourceNo":2276,"subject":"Ear, Nose and Throat (ENT)","topic":"Ear Anatomy and Hearing","question":"The Eustachian tube connects the middle ear with the:","options":{"A":"Nasopharynx","B":"Laryngopharynx","C":"Oropharynx","D":"Nasal cavity"},"answer":"A","answerText":"Nasopharynx","explanation":"2276. The Eustachian tube: Connects the middle ear with the nasopharynx."},{"id":10,"sourceNo":2277,"subject":"Ear, Nose and Throat (ENT)","topic":"Ear Anatomy and Hearing","question":"The tensor tympani muscle is supplied by the:","options":{"A":"Maxillary division of the trigeminal nerve","B":"Facial nerve","C":"Mandibular division of the trigeminal nerve","D":"Glossopharyngeal nerve"},"answer":"C","answerText":"Mandibular division of the trigeminal nerve","explanation":"2277. The tensor tympani: Supplied by the mandibular division of the trigeminal nerve (CN V3)."},{"id":11,"sourceNo":2278,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"Acute otitis media in children most commonly follows:","options":{"A":"Swimming in chlorinated water","B":"Cotton-bud trauma","C":"Mumps infection","D":"An upper respiratory tract infection"},"answer":"D","answerText":"An upper respiratory tract infection","explanation":"2278. Acute otitis media: Commonly occurs in children following an upper respiratory tract infection."},{"id":12,"sourceNo":2279,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"Which group lists the important bacterial causes of acute otitis media?","options":{"A":"Neisseria, Klebsiella, E. coli","B":"Mycoplasma, Chlamydia, Legionella","C":"S. aureus, Pseudomonas, Proteus","D":"S. pneumoniae, H. influenzae, M. catarrhalis"},"answer":"D","answerText":"S. pneumoniae, H. influenzae, M. catarrhalis","explanation":"2279. Streptococcus pneumoniae, Haemophilus influenzae and Moraxella catarrhalis: Important causes of acute otitis media."},{"id":13,"sourceNo":2280,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"A bulging, erythematous tympanic membrane is characteristic of:","options":{"A":"Acute otitis media","B":"Otitis media with effusion","C":"Otosclerosis","D":"Tympanosclerosis"},"answer":"A","answerText":"Acute otitis media","explanation":"2280. A bulging, erythematous tympanic membrane: Characteristic of acute otitis media."},{"id":14,"sourceNo":2281,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"Fluid in the middle ear without signs of acute infection defines:","options":{"A":"Mastoiditis","B":"Acute otitis media","C":"Chronic suppurative otitis media","D":"Otitis media with effusion"},"answer":"D","answerText":"Otitis media with effusion","explanation":"2281. Otitis media with effusion: Fluid in the middle ear without signs of acute infection."},{"id":15,"sourceNo":2282,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"Another name for otitis media with effusion is:","options":{"A":"Glue ear","B":"Swimmer's ear","C":"Malignant otitis","D":"Quinsy"},"answer":"A","answerText":"Glue ear","explanation":"2282. Glue ear: Another name for otitis media with effusion."},{"id":16,"sourceNo":2283,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"Persistent or recurrent ear discharge through a tympanic membrane perforation is typical of:","options":{"A":"Otosclerosis","B":"Chronic suppurative otitis media","C":"Acute otitis externa","D":"Ménière disease"},"answer":"B","answerText":"Chronic suppurative otitis media","explanation":"2283. Chronic suppurative otitis media: Presents with persistent or recurrent ear discharge through a tympanic membrane perforation."},{"id":17,"sourceNo":2284,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"A central tympanic membrane perforation is classically associated with:","options":{"A":"Safe-type chronic otitis media","B":"Attic cholesteatoma","C":"Unsafe-type chronic otitis media","D":"Malignant otitis externa"},"answer":"A","answerText":"Safe-type chronic otitis media","explanation":"2284. Safe-type chronic otitis media: Classically associated with a central tympanic membrane perforation."},{"id":18,"sourceNo":2285,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"An attic or marginal perforation with possible cholesteatoma indicates:","options":{"A":"Ramsay Hunt syndrome","B":"Safe-type chronic otitis media","C":"Otitis media with effusion","D":"Unsafe-type chronic otitis media"},"answer":"D","answerText":"Unsafe-type chronic otitis media","explanation":"2285. Unsafe-type chronic otitis media: Associated with an attic or marginal perforation and possible cholesteatoma."},{"id":19,"sourceNo":2286,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"Cholesteatoma is best defined as:","options":{"A":"Fibrous replacement of the tympanic membrane","B":"A benign tumour of cholesterol-laden macrophages","C":"An abnormal collection of keratinizing squamous epithelium in the middle ear or mastoid","D":"A malignant squamous neoplasm of the middle ear"},"answer":"C","answerText":"An abnormal collection of keratinizing squamous epithelium in the middle ear or mastoid","explanation":"2286. Cholesteatoma: An abnormal collection of keratinizing squamous epithelium in the middle ear or mastoid."},{"id":20,"sourceNo":2287,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"Which is a recognised effect of cholesteatoma?","options":{"A":"Stapes fixation by new bone","B":"Ossicular erosion causing conductive hearing loss","C":"Endolymphatic hydrops","D":"Thickening of the tympanic membrane with hyperacusis"},"answer":"B","answerText":"Ossicular erosion causing conductive hearing loss","explanation":"2287. Cholesteatoma: Can cause ossicular erosion and conductive hearing loss."},{"id":21,"sourceNo":2288,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"Foul-smelling ear discharge is classically associated with:","options":{"A":"Otitis media with effusion","B":"Cholesteatoma","C":"Otosclerosis","D":"Presbycusis"},"answer":"B","answerText":"Cholesteatoma","explanation":"2288. Foul-smelling ear discharge: Classically associated with cholesteatoma."},{"id":22,"sourceNo":2289,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"Mastoiditis is a complication of:","options":{"A":"Otitis externa","B":"Acute otitis media","C":"Otosclerosis","D":"Ménière disease"},"answer":"B","answerText":"Acute otitis media","explanation":"2289. Mastoiditis: A complication of acute otitis media."},{"id":23,"sourceNo":2290,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"Postauricular swelling, tenderness and displacement of the pinna suggest:","options":{"A":"Ramsay Hunt syndrome","B":"Mastoiditis","C":"Otosclerosis","D":"Otitis externa"},"answer":"B","answerText":"Mastoiditis","explanation":"2290. Mastoiditis: Presents with postauricular swelling, tenderness and displacement of the pinna."},{"id":24,"sourceNo":2291,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"Ear pain aggravated by pulling the pinna or pressing the tragus is characteristic of:","options":{"A":"Eustachian tube dysfunction","B":"Otitis externa","C":"Acute otitis media","D":"Otosclerosis"},"answer":"B","answerText":"Otitis externa","explanation":"2291. Otitis externa: Commonly presents with ear pain aggravated by pulling the pinna or pressing the tragus."},{"id":25,"sourceNo":2292,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"Which organism is an important cause of otitis externa?","options":{"A":"Streptococcus pneumoniae","B":"Moraxella catarrhalis","C":"Haemophilus influenzae","D":"Pseudomonas aeruginosa"},"answer":"D","answerText":"Pseudomonas aeruginosa","explanation":"2292. Pseudomonas aeruginosa: An important cause of otitis externa."},{"id":26,"sourceNo":2293,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"Malignant otitis externa most commonly occurs in:","options":{"A":"Pregnant women","B":"Children with grommets","C":"Young swimmers","D":"Elderly diabetic or immunocompromised patients"},"answer":"D","answerText":"Elderly diabetic or immunocompromised patients","explanation":"2293. Malignant otitis externa: Commonly occurs in elderly diabetic or immunocompromised patients."},{"id":27,"sourceNo":2294,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"Skull-base osteomyelitis is a feared complication of:","options":{"A":"Otitis media with effusion","B":"Malignant otitis externa","C":"Vestibular neuritis","D":"Otosclerosis"},"answer":"B","answerText":"Malignant otitis externa","explanation":"2294. Malignant otitis externa: An invasive infection that can cause skull-base osteomyelitis."},{"id":28,"sourceNo":2295,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"Ramsay Hunt syndrome is caused by:","options":{"A":"Cytomegalovirus","B":"Varicella-zoster virus","C":"Herpes simplex virus type 1","D":"Epstein-Barr virus"},"answer":"B","answerText":"Varicella-zoster virus","explanation":"2295. Ramsay Hunt syndrome: Caused by varicella-zoster virus involving the facial nerve."},{"id":29,"sourceNo":2296,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"Facial paralysis with vesicles around the ear indicates:","options":{"A":"Ramsay Hunt syndrome","B":"Bell palsy","C":"Ménière disease","D":"Malignant otitis externa"},"answer":"A","answerText":"Ramsay Hunt syndrome","explanation":"2296. Ramsay Hunt syndrome: Presents with facial paralysis and vesicles around the ear."},{"id":30,"sourceNo":2297,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"Abnormal bone remodeling around the stapes footplate is the pathology of:","options":{"A":"Tympanosclerosis","B":"Presbycusis","C":"Cholesteatoma","D":"Otosclerosis"},"answer":"D","answerText":"Otosclerosis","explanation":"2297. Otosclerosis: Involves abnormal bone remodeling around the stapes footplate."},{"id":31,"sourceNo":2298,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"Otosclerosis commonly causes which type of hearing loss?","options":{"A":"Progressive conductive hearing loss","B":"Sudden sensorineural hearing loss","C":"Fluctuating sensorineural hearing loss","D":"Central hearing loss"},"answer":"A","answerText":"Progressive conductive hearing loss","explanation":"2298. Otosclerosis: Commonly causes progressive conductive hearing loss."},{"id":32,"sourceNo":2299,"subject":"Ear, Nose and Throat (ENT)","topic":"Otitis and Middle-Ear Diseases","question":"A Carhart notch at 2 kHz is classically seen in:","options":{"A":"Noise-induced hearing loss","B":"Ménière disease","C":"Otosclerosis","D":"Presbycusis"},"answer":"C","answerText":"Otosclerosis","explanation":"2299. Carhart notch: Classically seen at 2 kHz in otosclerosis."},{"id":33,"sourceNo":2300,"subject":"Ear, Nose and Throat (ENT)","topic":"Hearing Loss and Vestibular Disorders","question":"Conductive hearing loss results from:","options":{"A":"Lesions of the auditory cortex","B":"Impaired transmission of sound through the external or middle ear","C":"Damage to the auditory nerve","D":"Damage to the cochlea"},"answer":"B","answerText":"Impaired transmission of sound through the external or middle ear","explanation":"2300. Conductive hearing loss: Results from impaired transmission of sound through the external or middle ear."},{"id":34,"sourceNo":2301,"subject":"Ear, Nose and Throat (ENT)","topic":"Hearing Loss and Vestibular Disorders","question":"Sensorineural hearing loss results from damage to the:","options":{"A":"External auditory canal","B":"Ossicular chain","C":"Tympanic membrane","D":"Cochlea or auditory nerve pathways"},"answer":"D","answerText":"Cochlea or auditory nerve pathways","explanation":"2301. Sensorineural hearing loss: Results from damage to the cochlea or auditory nerve pathways."},{"id":35,"sourceNo":2302,"subject":"Ear, Nose and Throat (ENT)","topic":"Hearing Loss and Vestibular Disorders","question":"The Rinne test is positive when:","options":{"A":"Bone conduction is greater than air conduction","B":"Both are absent","C":"Sound lateralises to one ear","D":"Air conduction is greater than bone conduction"},"answer":"D","answerText":"Air conduction is greater than bone conduction","explanation":"2302. Rinne test: Positive when air conduction is greater than bone conduction."},{"id":36,"sourceNo":2303,"subject":"Ear, Nose and Throat (ENT)","topic":"Hearing Loss and Vestibular Disorders","question":"A negative Rinne test is found in:","options":{"A":"Conductive hearing loss","B":"Presbycusis","C":"Normal hearing","D":"Sensorineural hearing loss"},"answer":"A","answerText":"Conductive hearing loss","explanation":"2303. Rinne test: Negative in conductive hearing loss when bone conduction exceeds air conduction."},{"id":37,"sourceNo":2304,"subject":"Ear, Nose and Throat (ENT)","topic":"Hearing Loss and Vestibular Disorders","question":"In unilateral conductive hearing loss, the Weber test lateralizes to the:","options":{"A":"Midline","B":"Better ear","C":"Both ears equally","D":"Affected ear"},"answer":"D","answerText":"Affected ear","explanation":"2304. Weber test: Lateralizes to the affected ear in unilateral conductive hearing loss."},{"id":38,"sourceNo":2305,"subject":"Ear, Nose and Throat (ENT)","topic":"Hearing Loss and Vestibular Disorders","question":"In unilateral sensorineural hearing loss, the Weber test lateralizes to the:","options":{"A":"Midline","B":"Better ear","C":"Affected ear","D":"Vertex only"},"answer":"B","answerText":"Better ear","explanation":"2305. Weber test: Lateralizes to the better ear in unilateral sensorineural hearing loss."},{"id":39,"sourceNo":2306,"subject":"Ear, Nose and Throat (ENT)","topic":"Hearing Loss and Vestibular Disorders","question":"Age-related bilateral sensorineural hearing loss is called:","options":{"A":"Presbycusis","B":"Tympanosclerosis","C":"Otosclerosis","D":"Ménière disease"},"answer":"A","answerText":"Presbycusis","explanation":"2306. Presbycusis: Age-related bilateral sensorineural hearing loss."},{"id":40,"sourceNo":2307,"subject":"Ear, Nose and Throat (ENT)","topic":"Hearing Loss and Vestibular Disorders","question":"Noise-induced hearing loss typically affects which frequency first?","options":{"A":"1 kHz","B":"250 Hz","C":"500 Hz","D":"4 kHz"},"answer":"D","answerText":"4 kHz","explanation":"2307. Noise-induced hearing loss: Typically affects high frequencies, particularly around 4 kHz."},{"id":41,"sourceNo":2308,"subject":"Ear, Nose and Throat (ENT)","topic":"Hearing Loss and Vestibular Disorders","question":"Which hearing condition is an otological emergency?","options":{"A":"Sudden sensorineural hearing loss","B":"Presbycusis","C":"Wax impaction","D":"Otitis media with effusion"},"answer":"A","answerText":"Sudden sensorineural hearing loss","explanation":"2308. Sudden sensorineural hearing loss: An otological emergency."},{"id":42,"sourceNo":2309,"subject":"Ear, Nose and Throat (ENT)","topic":"Hearing Loss and Vestibular Disorders","question":"Episodic vertigo, fluctuating sensorineural hearing loss, tinnitus and aural fullness characterise:","options":{"A":"BPPV","B":"Otosclerosis","C":"Vestibular neuritis","D":"Ménière disease"},"answer":"D","answerText":"Ménière disease","explanation":"2309. Ménière disease: Characterized by episodic vertigo, fluctuating sensorineural hearing loss, tinnitus and aural fullness."},{"id":43,"sourceNo":2310,"subject":"Ear, Nose and Throat (ENT)","topic":"Hearing Loss and Vestibular Disorders","question":"Endolymphatic hydrops is associated with:","options":{"A":"Vestibular neuritis","B":"BPPV","C":"Otosclerosis","D":"Ménière disease"},"answer":"D","answerText":"Ménière disease","explanation":"2310. Endolymphatic hydrops: Associated with Ménière disease."},{"id":44,"sourceNo":2311,"subject":"Ear, Nose and Throat (ENT)","topic":"Hearing Loss and Vestibular Disorders","question":"Benign paroxysmal positional vertigo is caused by:","options":{"A":"Perilymph fistula","B":"Displaced otoconia within a semicircular canal","C":"Viral infection of the vestibular nerve","D":"Endolymphatic hydrops"},"answer":"B","answerText":"Displaced otoconia within a semicircular canal","explanation":"2311. Benign paroxysmal positional vertigo: Caused by displaced otoconia within a semicircular canal."},{"id":45,"sourceNo":2312,"subject":"Ear, Nose and Throat (ENT)","topic":"Hearing Loss and Vestibular Disorders","question":"The Dix-Hallpike test is used to diagnose:","options":{"A":"Acoustic neuroma","B":"Posterior-canal BPPV","C":"Ménière disease","D":"Vestibular neuritis"},"answer":"B","answerText":"Posterior-canal BPPV","explanation":"2312. Dix-Hallpike test: Used to diagnose posterior-canal BPPV."},{"id":46,"sourceNo":2313,"subject":"Ear, Nose and Throat (ENT)","topic":"Hearing Loss and Vestibular Disorders","question":"The Epley maneuver is used to treat:","options":{"A":"Posterior-canal BPPV","B":"Otosclerosis","C":"Ménière disease","D":"Labyrinthitis"},"answer":"A","answerText":"Posterior-canal BPPV","explanation":"2313. Epley maneuver: Used to treat posterior-canal BPPV."},{"id":47,"sourceNo":2314,"subject":"Ear, Nose and Throat (ENT)","topic":"Hearing Loss and Vestibular Disorders","question":"Acute prolonged vertigo without hearing loss suggests:","options":{"A":"Presbycusis","B":"Vestibular neuritis","C":"Ménière disease","D":"Labyrinthitis"},"answer":"B","answerText":"Vestibular neuritis","explanation":"2314. Vestibular neuritis: Causes acute prolonged vertigo without hearing loss."},{"id":48,"sourceNo":2315,"subject":"Ear, Nose and Throat (ENT)","topic":"Hearing Loss and Vestibular Disorders","question":"Vertigo associated with hearing loss suggests:","options":{"A":"Labyrinthitis","B":"BPPV","C":"Vestibular neuritis","D":"Cervical vertigo"},"answer":"A","answerText":"Labyrinthitis","explanation":"2315. Labyrinthitis: Causes vertigo associated with hearing loss."},{"id":49,"sourceNo":2316,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"The commonest site of anterior epistaxis is:","options":{"A":"Inferior turbinate","B":"Sphenopalatine foramen","C":"Kiesselbach plexus","D":"Woodruff plexus"},"answer":"C","answerText":"Kiesselbach plexus","explanation":"2316. Kiesselbach plexus: The commonest site of anterior epistaxis."},{"id":50,"sourceNo":2317,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"Little's area is located on the:","options":{"A":"Lateral wall at the middle meatus","B":"Posterior end of the inferior turbinate","C":"Anterior nasal septum","D":"Roof of the nasopharynx"},"answer":"C","answerText":"Anterior nasal septum","explanation":"2317. Little's area: Located on the anterior nasal septum."},{"id":51,"sourceNo":2318,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"An important source of posterior epistaxis is the:","options":{"A":"Lingual artery","B":"Superficial temporal artery","C":"Angular artery","D":"Sphenopalatine artery"},"answer":"D","answerText":"Sphenopalatine artery","explanation":"2318. Sphenopalatine artery: An important source of posterior epistaxis."},{"id":52,"sourceNo":2319,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"Posterior epistaxis is characteristically:","options":{"A":"Common in children with minor bleeding","B":"Always self-limiting","C":"More common in older adults with significant blood loss","D":"Seen mainly in Little's area"},"answer":"C","answerText":"More common in older adults with significant blood loss","explanation":"2319. Posterior epistaxis: More common in older adults and may cause significant blood loss."},{"id":53,"sourceNo":2320,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"Initial management of anterior epistaxis is:","options":{"A":"Tilt the head back","B":"Immediate posterior nasal packing","C":"Sit forward and apply continuous pressure to the soft part of the nose","D":"Lie supine and pinch the nasal bridge"},"answer":"C","answerText":"Sit forward and apply continuous pressure to the soft part of the nose","explanation":"2320. Initial management of anterior epistaxis: Sitting forward and applying continuous pressure to the soft part of the nose."},{"id":54,"sourceNo":2321,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"Nasal polyps are commonly associated with:","options":{"A":"Acute viral rhinitis","B":"Atrophic rhinitis","C":"Deviated septum only","D":"Chronic rhinosinusitis and asthma"},"answer":"D","answerText":"Chronic rhinosinusitis and asthma","explanation":"2321. Nasal polyps: Commonly associated with chronic rhinosinusitis and asthma."},{"id":55,"sourceNo":2322,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"Which nasal polyp is usually unilateral?","options":{"A":"Polyps of allergic fungal sinusitis","B":"Polyps of aspirin-exacerbated respiratory disease","C":"Ethmoidal polyp","D":"Antrochoanal polyp"},"answer":"D","answerText":"Antrochoanal polyp","explanation":"2322. Ethmoidal polyps: More common in children, while antrochoanal polyps are usually unilateral."},{"id":56,"sourceNo":2323,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"Antrochoanal polyps arise from the:","options":{"A":"Ethmoid sinus and extend into the middle meatus","B":"Sphenoid sinus","C":"Maxillary sinus and extend into the choana","D":"Frontal sinus"},"answer":"C","answerText":"Maxillary sinus and extend into the choana","explanation":"2323. Antrochoanal polyps: Arise from the maxillary sinus and extend into the choana."},{"id":57,"sourceNo":2324,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"Nasal polyps are typically:","options":{"A":"Dark and crusted","B":"Pulsatile and bleeding on touch","C":"Red, friable and tender","D":"Pale, smooth and insensitive to touch"},"answer":"D","answerText":"Pale, smooth and insensitive to touch","explanation":"2324. Nasal polyps: Usually pale, smooth and insensitive to touch."},{"id":58,"sourceNo":2325,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"Chronic rhinosinusitis is defined by sinonasal inflammation for at least:","options":{"A":"4 weeks","B":"12 weeks","C":"8 weeks","D":"2 weeks"},"answer":"B","answerText":"12 weeks","explanation":"2325. Chronic rhinosinusitis: Persistent sinonasal inflammation for at least 12 weeks."},{"id":59,"sourceNo":2326,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"Facial pain or pressure over the cheeks suggests:","options":{"A":"Maxillary sinusitis","B":"Sphenoid sinusitis","C":"Frontal sinusitis","D":"Ethmoid sinusitis"},"answer":"A","answerText":"Maxillary sinusitis","explanation":"2326. Maxillary sinusitis: Commonly causes facial pain or pressure over the cheeks."},{"id":60,"sourceNo":2327,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"Pain around the medial orbit suggests:","options":{"A":"Maxillary sinusitis","B":"Sphenoid sinusitis","C":"Frontal sinusitis","D":"Ethmoid sinusitis"},"answer":"D","answerText":"Ethmoid sinusitis","explanation":"2327. Ethmoid sinusitis: May cause pain around the medial orbit."},{"id":61,"sourceNo":2328,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"Frontal headache is the common presentation of:","options":{"A":"Frontal sinusitis","B":"Sphenoid sinusitis","C":"Maxillary sinusitis","D":"Ethmoid sinusitis"},"answer":"A","answerText":"Frontal sinusitis","explanation":"2328. Frontal sinusitis: Commonly causes frontal headache."},{"id":62,"sourceNo":2329,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"Deep or vertex headache may be caused by:","options":{"A":"Sphenoid sinusitis","B":"Ethmoid sinusitis","C":"Frontal sinusitis","D":"Maxillary sinusitis"},"answer":"A","answerText":"Sphenoid sinusitis","explanation":"2329. Sphenoid sinusitis: May cause deep or vertex headache."},{"id":63,"sourceNo":2330,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"Functional endoscopic sinus surgery is commonly used for selected patients with:","options":{"A":"Allergic rhinitis in remission","B":"Epistaxis from Little's area","C":"Acute viral rhinitis","D":"Chronic rhinosinusitis"},"answer":"D","answerText":"Chronic rhinosinusitis","explanation":"2330. Functional endoscopic sinus surgery: Commonly used for selected patients with chronic rhinosinusitis."},{"id":64,"sourceNo":2331,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"Which is the classic symptom set of allergic rhinitis?","options":{"A":"Unilateral purulent discharge and facial pain","B":"Recurrent epistaxis and nasal obstruction in adolescent males","C":"Sneezing, nasal itching, watery discharge and congestion","D":"Foul-smelling crusts and anosmia"},"answer":"C","answerText":"Sneezing, nasal itching, watery discharge and congestion","explanation":"2331. Allergic rhinitis: Commonly presents with sneezing, nasal itching, watery discharge and nasal congestion."},{"id":65,"sourceNo":2332,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"Allergic rhinitis is commonly mediated by:","options":{"A":"IgM","B":"Cytotoxic T cells only","C":"IgG","D":"IgE"},"answer":"D","answerText":"IgE","explanation":"2332. Allergic rhinitis: Commonly mediated by IgE."},{"id":66,"sourceNo":2333,"subject":"Ear, Nose and Throat (ENT)","topic":"Nose and Paranasal Sinuses","question":"Nasopharyngeal carcinoma is associated with:","options":{"A":"Epstein-Barr virus","B":"Herpes simplex virus","C":"Human papillomavirus type 16","D":"Cytomegalovirus"},"answer":"A","answerText":"Epstein-Barr virus","explanation":"2333. Nasopharyngeal carcinoma: Associated with Epstein-Barr virus."},{"id":67,
